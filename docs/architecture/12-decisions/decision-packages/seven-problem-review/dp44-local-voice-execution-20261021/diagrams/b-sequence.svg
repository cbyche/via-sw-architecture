<text x="35" y="40" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="28" text-anchor="start">
<tspan x="35" dy="0">DP44 B | 같은 사용자 개입의 호출 흐름</tspan>
</text>
<text x="35" y="74" fill="#5b6576" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="17" text-anchor="start">
<tspan x="35" dy="0">사건 번호는 본문 1~12. 세로 간격은 실측 시간이 아님. 입력용 S2S 호출은 공통 입력 확대도 참조.</tspan>
</text>
<text x="980" y="350" fill="#087d5b" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="18" text-anchor="middle">
<tspan x="980" dy="0">S2S 호출 없음: 아직 현재 발화로 선택되지 않음</tspan>
</text>
<text x="35" y="1445" fill="#5b6576" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="18" text-anchor="start">
<tspan x="35" dy="0">12 새 결과, R0 재개는 본문 표 참조. 생성 취소의 완료, usage 회수는 재생 차단과 별도로 진행.</tspan>
</text>
<text x="742.5" y="234" fill="#087d5b" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="742.5" dy="0">1 Q1, R1-v1 텍스트 대기</tspan>
</text>
<text x="497.5" y="509" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="497.5" dy="0">3 사용자 발화 시작 → 출력 차단</tspan>
</text>
<text x="1477.5" y="554" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="1477.5" dy="0">4 halt, 출력 버전 변경</tspan>
</text>
<text x="2212.5" y="599" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="2212.5" dy="0">5 실제 정지 위치, 중첩 출력 기록</tspan>
</text>
<text x="1355.0" y="649" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="1355.0" dy="0">5 입력 시점 UI/audio 제시 근거</tspan>
</text>
<text x="252.5" y="699" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="252.5" dy="0">6 사용자 발화 종료, 입력 확정</tspan>
</text>
<text x="497.5" y="754" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="497.5" dy="0">7 보고서 정정 / Q1 유지, 우선 / R0 보존</tspan>
</text>
<text x="742.5" y="809" fill="#087d5b" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="742.5" dy="0">8 R1-v1 무효화, Q1 유지</tspan>
</text>
<text x="742.5" y="864" fill="#087d5b" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="742.5" dy="0">9 Q1 선택, 생성 시작 허가</tspan>
</text>
<text x="1110.0" y="909" fill="#087d5b" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="1110.0" dy="0">generate_audio(Q1)</tspan>
</text>
<text x="1477.5" y="954" fill="#087d5b" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="1477.5" dy="0">S2S 호출</tspan>
</text>
<text x="1477.5" y="999" fill="#087d5b" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">

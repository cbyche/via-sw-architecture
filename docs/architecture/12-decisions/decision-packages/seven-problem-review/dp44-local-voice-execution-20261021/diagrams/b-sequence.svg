</text>
<text x="987.5" y="1089" fill="#087d5b" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="987.5" dy="0">유효 chunk 보관</tspan>
</text>
<text x="1477.5" y="1139" fill="#087d5b" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="1477.5" dy="0">9 buffer 참조, 첫 유효 범위 play</tspan>
</text>
<text x="2212.5" y="1199" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="2212.5" dy="0">10 Q1 실제 출력 범위 갱신</tspan>
</text>
<text x="252.5" y="1259" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="252.5" dy="0">11 다음 사용자 입력 ‘응’</tspan>
</text>
<text x="1355.0" y="1319" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="1355.0" dy="0">11 입력 당시 제시 근거, 질문 판본</tspan>
</text>

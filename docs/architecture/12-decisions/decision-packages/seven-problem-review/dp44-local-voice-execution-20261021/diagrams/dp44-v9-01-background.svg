<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="context-stroke"/></marker></defs><rect width="1920" height="1080" fill="white"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="44" font-weight="700" text-anchor="start"><tspan x="65" y="77.96000000000001">DP44. 음성 준비와 재생 실행 방안 (배경)</tspan></text><path d="M58 108H1860" stroke="#A7A7A7" stroke-width="3"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="65" y="161.68">이미 완성된 질문과 결과가 겹칠 때, 언제 음성을 준비하고 누가 재생을 제어할 것인가?</tspan></text><polygon points="1210,33 1333,33 1353,55 1333,77 1210,77 1230,55" fill="#98999B" stroke="white"/><text fill="#FFFFFF" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1281.5" y="61.46">과제 소개</tspan></text><polygon points="1344,33 1467,33 1487,55 1467,77 1344,77 1364,55" fill="#98999B" stroke="white"/><text fill="#FFFFFF" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1415.5" y="61.46">요구사항 분석</tspan></text><polygon points="1478,33 1601,33 1621,55 1601,77 1478,77 1498,55" fill="#35A8CD" stroke="white"/><text fill="#FFFFFF" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1549.5" y="61.46">설계</tspan></text><polygon points="1612,33 1735,33 1755,55 1735,77 1612,77 1632,55" fill="#98999B" stroke="white"/><text fill="#FFFFFF" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1683.5" y="61.46">구현 및 검증</tspan></text><polygon points="1746,33 1869,33 1889,55 1869,77 1746,77 1766,55" fill="#98999B" stroke="white"/><text fill="#FFFFFF" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1817.5" y="61.46">결론</tspan></text><g id="undefined"><rect x="60" y="209" width="650" height="48" rx="0" fill="#C9E1B3" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle"><tspan x="385" y="242.18">겹친 사건이 같은 대화로 들어온다</tspan></text></g><g id="user"><polygon points="85,323 295,323 315,373 295,423 85,423 65,373" fill="#F1F6FC" stroke="#111111" stroke-width="1.7"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle"><tspan x="190" y="382.52">사용자</tspan></text></g><g id="mail"><polygon points="85,493 295,493 315,543 295,593 85,593 65,543" fill="#F1F6FC" stroke="#111111" stroke-width="1.7"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="700" text-anchor="middle"><tspan x="190" y="537.42666674">Downstream Agent</tspan><tspan x="190" y="565.7999997">메일</tspan></text></g><g id="report"><polygon points="85,663 295,663 315,713 295,763 85,763 65,713" fill="#F1F6FC" stroke="#111111" stroke-width="1.7"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="700" text-anchor="middle"><tspan x="190" y="707.42666674">Downstream Agent</tspan><tspan x="190" y="735.7999997">보고서</tspan></text></g><g id="registry"><rect x="805" y="355" width="510" height="365" rx="0" fill="#FFF6DD" stroke="#111111" stroke-width="1.7" /><path d="M805 393H1315" stroke="#111111"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle"><tspan x="1060" y="382.52">Response Registry</tspan></text></g><g id="admit"><rect x="845" y="430" width="430" height="65" rx="7" fill="#FFFFFF" stroke="#111111" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="26.666667" font-weight="400" text-anchor="middle"><tspan x="1060" y="471.56666678">Revision Admission</tspan></text></g><g id="pending"><path d="M845,558a215,8 0 0 1 430,0v99a215,8 0 0 1 -430,0Z" fill="#FFFFFF" stroke="#111111" stroke-width="1.7"/><ellipse cx="1060" cy="558" rx="215" ry="8" fill="#FFFFFF" stroke="#111111" stroke-width="1.7"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="1060" y="609.92666674">응답 원문과 판본</tspan><tspan x="1060" y="638.2999997">Task 연결 / 내구 기록</tspan></text></g><g id="dp2"><polygon points="825,210 1295,210 1315,257.5 1295,305 825,305 805,257.5" fill="#F1F6FC" stroke="#111111" stroke-width="1.7"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="26.666667" font-weight="700" text-anchor="middle"><tspan x="1060" y="251.63333326">Request Interpretation</tspan><tspan x="1060" y="281.5000003">Service (DP2)</tspan></text></g><g id="voice"><polygon points="1545,386 1825,386 1845,433.5 1825,481 1545,481 1525,433.5" fill="#F1F6FC" stroke="#111111" stroke-width="1.7"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="26.666667" font-weight="700" text-anchor="middle"><tspan x="1685" y="427.63333326000003">S2S Runtime</tspan><tspan x="1685" y="457.5000003">음성 생성</tspan></text></g><g id="device"><polygon points="1545,620 1825,620 1845,667.5 1825,715 1545,715 1525,667.5" fill="#F1F6FC" stroke="#111111" stroke-width="1.7"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="26.666667" font-weight="700" text-anchor="middle"><tspan x="1685" y="661.63333326">Audio Playout</tspan><tspan x="1685" y="691.5000003">실제 장치 출력</tspan></text></g><polyline id="user-dp2" points="315,350 650,350 650,257 805,257" fill="none" stroke="#111111" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline id="dp2-reg" points="1060,305 1060,325 780,325 780,445 845,445" fill="none" stroke="#111111" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline id="q1" points="315,540 720,540 720,450 845,450" fill="none" stroke="#111111" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline id="r1" points="315,710 740,710 740,480 845,480" fill="none" stroke="#111111" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline id="register" points="1060,495 1060,550" fill="none" stroke="#111111" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline id="prepare" points="1275,585 1420,585 1420,430 1525,430" fill="none" stroke="#111111" stroke-width="1.8"  marker-end="url(#arrow)"/><polyline id="play" points="1685,481 1685,620" fill="none" stroke="#111111" stroke-width="1.8"  marker-end="url(#arrow)"/><g id="undefined"><rect x="60" y="865" width="900" height="42" rx="0" fill="#C9E1B3" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="510" y="894.16">공통으로 지키는 것</tspan></text></g><g id="undefined"><rect x="960" y="865" width="900" height="42" rx="0" fill="#C9E1B3" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle"><tspan x="1410" y="894.16">선택에 따라 달라지는 것</tspan></text></g><g id="undefined"><rect x="60" y="907" width="900" height="80" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="510" y="941.72">질문과 결과의 업무 내용은 Downstream Agent가 작성</tspan><tspan x="510" y="968.6">화면 표시, 로컬 발화 감지와 DP2 의미 채택은 동일</tspan></text></g><g id="undefined"><rect x="960" y="907" width="900" height="80" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1410" y="941.72">A: 응답별 생성 실행과 보관을 재생과 분리</tspan><tspan x="1410" y="968.6">B: 현재 발화 실행이 생성과 버퍼를 함께 관리</tspan></text></g><g id="undefined"><rect x="60" y="987" width="900" height="52" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="510" y="1021.16">구판 재생 차단, 유효 음성 재사용, 실제 출력 이력</tspan></text></g><g id="undefined"><rect x="960" y="987" width="900" height="52" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1410" y="1021.16">A의 준비 적중 이익 ↔ 미전달 음성의 생성 비용</tspan></text></g><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="26.666667" font-weight="700" text-anchor="start"><tspan x="65" y="829.06666678">배경: R0를 말하는 중에 Q1과 R1이 도착한다. 사용자는 R0를 끊고 보고서 정정과 읽기 순서를 요청한다.</tspan></text><rect x="345" y="259" width="430" height="82" fill="white"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="21.333333" font-weight="400" text-anchor="middle"><tspan x="560" y="295.30666673999997">1 “6월 기준으로 고쳐줘.</tspan><tspan x="560" y="319.1999997">메일 질문부터 읽어줘.”</tspan></text><rect x="1075" y="315" width="395" height="38" fill="white"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="21.333333" font-weight="400" text-anchor="middle"><tspan x="1272.5" y="341.25333322">2 정정 범위와 순서 채택</tspan></text><rect x="340" y="484" width="430" height="50" fill="white"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="21.333333" font-weight="400" text-anchor="middle"><tspan x="555" y="516.2533332200001">Q1: “수신자는 김 대리인가요?”</tspan></text><rect x="340" y="650" width="430" height="50" fill="white"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="21.333333" font-weight="400" text-anchor="middle"><tspan x="555" y="682.2533332200001">R1-v1: 보고서 결과 텍스트</tspan></text><rect x="1080" y="503" width="270" height="35" fill="white"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="21.333333" font-weight="400" text-anchor="middle"><tspan x="1215" y="527.7533332200001">3 현재 판본 저장</tspan></text><rect x="1332" y="490" width="225" height="60" fill="white"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="21.333333" font-weight="400" text-anchor="middle"><tspan x="1444.5" y="527.2533332200001">음성 준비 시점?</tspan></text><rect x="1525" y="520" width="320" height="65" fill="white"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="21.333333" font-weight="400" text-anchor="middle"><tspan x="1685" y="547.8066667400001">생성과 재생의</tspan><tspan x="1685" y="571.6999997">수명 분리?</tspan></text><text fill="#50555B" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="1845" y="1067.78">24 / 36</tspan></text></svg>
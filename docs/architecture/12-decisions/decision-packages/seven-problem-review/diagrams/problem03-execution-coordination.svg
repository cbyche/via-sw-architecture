<text x="108" y="501" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">Dispatcher: 짧은 상태 전이와 후속 job 시작</text>
<text x="108" y="536" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">긴 모델 호출 완료를 기다리지 않고 다음 사건 수신</text>

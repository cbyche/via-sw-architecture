<text x="55" y="89" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">DP-44: 비동기 작업의 다음 단계를 누가 시작하는가</text>
<text x="55" y="139" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="400" fill="#516275">설명 준비 중 사용자 수정과 Agent 질문이 들어온다. 의미 판단 기능과 총 실행 예산은 두 안이 같다.</text>
<text x="55" y="192" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="22" font-weight="400" fill="#176EAD">기본 구조의 선택   |   파랑: 처리 경로   |   주황: 유지 상태   |   하단: 선택 후 보완 기법</text>
<text x="55" y="1146" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="21" font-weight="400" fill="#516275">설계 분석 그림. 성능 수치와 측정 결과가 아니며 실패 및 복구 계약은 연결된 본문에 수록.</text>
<text x="70" y="1039" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="24" font-weight="400" fill="#176EAD">B가 줄이는 것은 중앙 완료 회수와 활성화 비용. 같은 의미 계산과 외부 Agent 대기는 남는다.</text>
<text x="70" y="1084" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="24" font-weight="400" fill="#A45A18">선택 A 이후 A1 단순 진행 통지 준비 합치기 / A2 변경된 근거에 의존하는 작업 인덱스</text>
</svg>

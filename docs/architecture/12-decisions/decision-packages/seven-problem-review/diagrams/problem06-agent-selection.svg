<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
<title>problem06-agent-selection</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516275"/></marker></defs>
<rect width="1800" height="1180" fill="white"/>
<rect x="55" y="235" width="820" height="760" rx="10" fill="#F8FAFC" stroke="#C6D1DE" stroke-width="2"/>
<text x="73" y="279" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="28" font-weight="700" fill="#182B40">A  요청 해석과 선택 결합</text>
<rect x="90" y="315" width="750" height="90" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="108" y="356" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">사용자 입력과 허용 근거</text>
<text x="108" y="391" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">같은 후보 정보 및 독립 성과 근거</text>
<rect x="90" y="760" width="750" height="100" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="108" y="801" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">유지 상태</text>
<text x="108" y="836" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">요청 문맥과 후보 판본</text>
<rect x="90" y="890" width="750" height="75" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="108" y="931" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 요청 및 적격성 확인 → 업무 인계</text>
<rect x="925" y="235" width="820" height="760" rx="10" fill="#F8FAFC" stroke="#C6D1DE" stroke-width="2"/>
<text x="943" y="279" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="28" font-weight="700" fill="#182B40">B  요청 계약 뒤 별도 선택</text>
<rect x="960" y="315" width="750" height="90" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="978" y="356" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">사용자 입력과 허용 근거</text>
<text x="978" y="391" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">요청의 의미를 해석할 원본과 최근 문맥</text>
<rect x="960" y="760" width="750" height="100" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="978" y="801" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">유지 상태</text>
<text x="978" y="836" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">요청 계약과 별도 선택 문맥 / 후보 판본</text>
<rect x="960" y="890" width="750" height="75" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="978" y="931" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 요청 및 적격성 확인 → 업무 인계</text>
<rect x="90" y="460" width="750" height="170" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="108" y="501" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">Request Interpreter</text>
<text x="108" y="536" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">요청의 목적과 대상을 해석하면서 Agent도 제안</text>
<text x="108" y="571" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">후보 변경 시 결합 판단 재실행</text>
<rect x="960" y="440" width="750" height="95" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="978" y="481" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">Request Interpreter</text>
<text x="978" y="516" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">목적 / 대상 / 조건과 원본 참조를 계약으로 생산</text>
<rect x="960" y="600" width="750" height="105" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="978" y="641" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">선택 전용 판단: 같은 후보 및 성과 근거 공급</text>
<text x="978" y="676" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">계약과 후보를 비교. 후보만 바뀌면 선택만 반복</text>
<polyline points="465,405 465,460" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="465,630 465,760" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="465,860 465,890" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1335,405 1335,440" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1335,535 1335,600" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1335,705 1335,760" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1335,860 1335,890" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1710,650 1730,650 1730,490 1710,490" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<text x="55" y="89" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">Agent 선택: 요청 판단에 결합할 것인가, 선택 실행을 분리할 것인가</text>
<text x="55" y="139" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="400" fill="#516275">같은 업무: 수정한 비교 결과로 편집 가능한 발표자료를 만들고, 이번에는 다른 Agent에게 맡긴다.</text>
<text x="55" y="192" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="22" font-weight="400" fill="#176EAD">기본 구조의 선택   |   파랑: 처리 경로   |   주황: 유지 상태   |   하단: 선택 후 보완 기법</text>
<text x="55" y="1146" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="21" font-weight="400" fill="#516275">설계 분석 그림. 성능 수치와 측정 결과가 아니며 실패 및 복구 계약은 연결된 본문에 수록.</text>
<text x="75" y="1049" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="24" font-weight="400" fill="#A45A18">A1 후보 설명 조회 / A2 선택만 갱신</text>
<text x="945" y="1049" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="24" font-weight="400" fill="#A45A18">B1 선택 결과 재사용 / B2 부족한 계약만 보완</text>
</svg>

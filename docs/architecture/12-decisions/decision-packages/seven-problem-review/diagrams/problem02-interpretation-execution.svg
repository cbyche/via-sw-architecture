<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
<title>problem02-interpretation-execution</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516275"/></marker></defs>
<rect width="1800" height="1180" fill="white"/>
<rect x="55" y="235" width="820" height="745" rx="10" fill="#F8FAFC" stroke="#C6D1DE" stroke-width="2"/>
<text x="73" y="279" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="28" font-weight="700" fill="#182B40">A  한 대화 해석 실행</text>
<rect x="90" y="315" width="750" height="90" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="108" y="356" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">새 입력 / 확인된 Agent 통지 수신</text>
<text x="108" y="391" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 보존과 로컬 음성 중단은 계속</text>
<rect x="90" y="865" width="750" height="85" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="108" y="906" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 관계 / revision 확인 → 필요한 재결합 → 표시</text>
<rect x="925" y="235" width="820" height="745" rx="10" fill="#F8FAFC" stroke="#C6D1DE" stroke-width="2"/>
<text x="943" y="279" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="28" font-weight="700" fill="#182B40">B  공통 대화와 요청별 해석 실행</text>
<rect x="960" y="315" width="750" height="90" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="978" y="356" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">새 입력 / 확인된 Agent 통지 수신</text>
<text x="978" y="391" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 보존과 로컬 음성 중단은 계속</text>
<rect x="960" y="865" width="750" height="85" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="978" y="906" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 관계 / revision 확인 → 필요한 재결합 → 표시</text>
<rect x="90" y="470" width="750" height="135" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="108" y="511" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 VIA 판단 step → 다음 판단 경계</text>
<text x="108" y="546" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">새 입력의 관계와 내용 판단</text>
<text x="108" y="581" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">앞선 목표 전체의 완료를 기다리는 구조는 아님</text>
<rect x="90" y="680" width="750" height="125" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="108" y="721" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">하나의 작업 문맥 + 요청별 잠정 상태</text>
<text x="108" y="756" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">읽은 근거와 미해결 목표를 함께 보존</text>
<text x="108" y="791" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">외부 Agent 대기에는 모델 호출 자원을 놓음</text>
<rect x="960" y="445" width="750" height="95" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="978" y="486" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">공통 대화 해석: 입력 관계 판단 / 짧은 답</text>
<text x="978" y="521" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">긴 읽기와 판단을 요청별 실행에 연결</text>
<rect x="960" y="610" width="355" height="180" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="978" y="651" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">R1 실행: D1 판단</text>
<text x="978" y="686" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">요청별 문맥 / revision</text>
<text x="978" y="721" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">사용 근거 / 잠정 결과</text>
<text x="978" y="756" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 종료까지 slot 점유</text>
<rect x="1355" y="610" width="355" height="180" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="1373" y="651" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">R2 실행: D2 판단</text>
<text x="1373" y="686" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">별도 문맥 / revision</text>
<text x="1373" y="721" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">같은 전체 호출 예산</text>
<text x="1373" y="756" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">여유가 있어야 동시 진행</text>
<polyline points="465,405 465,470" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="465,605 465,680" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="465,805 465,865" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1335,405 1335,445" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1140,540 1140,610" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1530,540 1530,610" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1140,790 1140,865" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1530,790 1530,865" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1710,490 1730,490 1730,905 1710,905" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="55" y="89" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">후속 입력의 의미 판단: 한 대화 실행과 요청별 실행</text>
<text x="55" y="139" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="400" fill="#516275">D1을 읽고 긴 판단을 하는 도중 “그건 계속하고 D2 결론도 알려줘.”라는 별도 요청이 들어온다.</text>
<text x="55" y="192" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="22" font-weight="400" fill="#176EAD">기본 구조의 선택   |   파랑: 처리 경로   |   주황: 유지 상태   |   하단: 선택 후 보완 기법</text>
<text x="55" y="1146" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="21" font-weight="400" fill="#516275">설계 분석 그림. 성능 수치와 측정 결과가 아니며 실패 및 복구 계약은 연결된 본문에 수록.</text>
<text x="70" y="1039" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="24" font-weight="400" fill="#176EAD">B: 앞선 step 대기 감소 가능 ↔ 실행별 문맥 / 재결합 / 동시 상태 비용. 외부 업무 대기는 공통.</text>
<text x="70" y="1084" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="24" font-weight="400" fill="#A45A18">선택 B 이후 B1 불변 근거 참조 공유 / B2 같은 호출 한도 안에서 새 입력용 여유 예약</text>
</svg>

<polyline points="1430,1085 1510,1085" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="700,525 780,525" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="780,750 700,750" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1430,510 1510,510" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1510,570 1430,570" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="1510,715 1430,715" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="1835,1160 1835,1195" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1510,1245 1430,1245" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1430,1310 1510,1310" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<text x="55" y="89" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">업무 인계 C: 필수 명세를 보내고 수신 Agent가 세부 자료를 읽는다</text>
<text x="55" y="139" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="400" fill="#516275">같은 목표와 필수 조건. 실제 읽기 capability를 가진 Agent에서만 적용하며, 수신자 비용을 VIA 절약과 혼동하지 않는다.</text>
<text x="55" y="192" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="22" font-weight="400" fill="#176EAD">기본 구조의 선택   |   파랑: 처리 경로   |   주황: 유지 상태   |   하단: 선택 후 보완 기법</text>
<text x="55" y="1666" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="21" font-weight="400" fill="#516275">설계 분석 그림. 성능 수치와 측정 결과가 아니며 실패 및 복구 계약은 연결된 본문에 수록.</text>
<text x="70" y="247" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="700" fill="#176EAD">원본과 상태: 각 owner가 보존</text>
<text x="780" y="247" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="700" fill="#176EAD">VIA 기본 처리: 번호 순서</text>

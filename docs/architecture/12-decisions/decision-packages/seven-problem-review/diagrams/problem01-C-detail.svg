<polyline points="780,940 700,940" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="780,1120 700,1120" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1430,880 1510,880" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1510,940 1430,940" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="1510,1085 1430,1085" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="1510,1270 1430,1270" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<text x="55" y="89" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">근거 공급 C: 과거 관계를 게시하고 현재 요청의 빈 곳은 원본으로 보완한다</text>
<text x="55" y="139" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="400" fill="#516275">같은 입력과 과거 원본. 미래 요청의 정답 Task를 미리 생산하지 않는다. 게시 생산과 현재 조회는 별도 수명이다.</text>
<text x="55" y="192" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="22" font-weight="400" fill="#176EAD">기본 구조의 선택   |   파랑: 처리 경로   |   주황: 유지 상태   |   하단: 선택 후 보완 기법</text>
<text x="55" y="1666" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="21" font-weight="400" fill="#516275">설계 분석 그림. 성능 수치와 측정 결과가 아니며 실패 및 복구 계약은 연결된 본문에 수록.</text>
<text x="70" y="247" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="700" fill="#176EAD">원본과 상태: 각 owner가 보존</text>
<text x="780" y="247" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="700" fill="#176EAD">VIA 기본 처리: 번호 순서</text>
<text x="1510" y="247" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="700" fill="#176EAD">Cloud 호출과 변경 / 실패</text>
<text x="70" y="1395" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#176EAD">기본의 이익과 비용: 교차 대화의 반복 관계 조합 감소 ↔ 선생산, 미사용 기록, 갱신과 원본 보완 비용.</text>
<text x="70" y="1435" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#A45A18">선택 후 보완: 두 기법은 독립 적용. 기본 동작과 추가 비용을 구별하고 결합은 별도로 비교한다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
<title>problem01-C-detail</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516275"/></marker></defs>
<rect width="2200" height="1700" fill="white"/>
<rect x="70" y="270" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">원본의 권위는 각 owner에 있음</text>
<text x="88" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 / 정정: Request Controller</text>
<text x="88" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 전달: Response Manager</text>
<text x="88" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">결과 / 현재 업무: Task Manager</text>
<rect x="780" y="270" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">1 Interaction Manager가 입력 수신</text>
<text x="798" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller: 입력 revision</text>
<text x="798" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">최근 대화 / 관측 참조 / 허용 범위</text>
<text x="798" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">정답 Task 연결은 아직 주어지지 않음</text>
<rect x="1510" y="270" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">기본 C의 고유 선택</text>
<text x="1528" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Context Manager: 생산과 조회 책임 분리</text>
<text x="1528" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">요청은 B와 같은 최소 문맥에서 시작</text>
<text x="1528" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">A+C도 가능하나 별도 구조 조합임</text>
<rect x="70" y="455" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="496" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">독립 생산: Context Manager</text>
<text x="88" y="531" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">확정 변경 → 원본 읽기 → 관계 생산</text>
<text x="88" y="566" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">명시 관계는 코드, 자유문 관계만 모델</text>
<text x="88" y="601" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">job / source vector / 생산자 판본</text>
<rect x="780" y="455" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="496" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">2 게시된 관계와 coverage 조회</text>
<text x="798" y="531" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Context Manager: 목적별 EvidenceQuery</text>
<text x="798" y="566" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">PRESENTS / HAS_RESULT / REVISES 등</text>
<text x="798" y="601" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 권한 / source 판본 확인은 유지</text>
<rect x="1510" y="455" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="496" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">생산 중 의미 추출 필요 때만 호출</text>
<text x="1528" y="531" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Model Access → cloud 의미 모델</text>
<text x="1528" y="566" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">예: 실제 설명의 항목 / 예외 추출</text>
<text x="1528" y="601" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 요청 채택이나 domain 계획은 안 함</text>
<rect x="70" y="640" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="681" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">게시 상태: record / coverage / cursor</text>
<text x="88" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">job 결과 / 알림 outbox와 일관 확정</text>
<text x="88" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">검증 전 candidate는 일반 조회에 안 보임</text>
<text x="88" y="786" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">게시 성공이 의미의 완전함은 아님</text>
<rect x="780" y="640" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="681" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">3 누락 / 오류 / 미지원은 원본 보완</text>
<text x="798" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">owner bounded read로 필요한 부분 구성</text>
<text x="798" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">지원 범위만 생산 대기 / 재조회 가능</text>
<text x="798" y="786" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원본 보완과 게시 대기 비용을 모두 기록</text>
<rect x="1510" y="640" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="681" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">EvidenceDispute / source 변경</text>
<text x="1528" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">정확한 게시 revision을 즉시 차단</text>
<text x="1528" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원본 재검증 / 재생산 또는 직접 보완</text>
<text x="1528" y="786" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">미지원 관계를 무한 backfill하지 않음</text>
<rect x="70" y="825" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="866" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">요청 수명: 묶음 / 영수증 / waiter</text>
<text x="88" y="901" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 읽은 범위 / gaps / source vector</text>
<text x="88" y="936" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">대기 등록 뒤 게시 revision 재조회</text>
<text x="88" y="971" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">deadline / 중복 알림 / 취소를 구분</text>
<rect x="780" y="825" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="866" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">4 충분한 근거로 현재 의미 제안</text>
<text x="798" y="901" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Interpreter</text>
<text x="798" y="936" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">게시 관계가 이번 Task를 정하지 않음</text>
<text x="798" y="971" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">정확한 인용은 원문 locator로 확인</text>
<rect x="1510" y="825" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="866" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">4 자연어 해석이 필요할 때 호출</text>
<text x="1528" y="901" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Model Access → cloud 의미 모델</text>
<text x="1528" y="936" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">지칭 / 조건 / Task 관계를 제안</text>
<text x="1528" y="971" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">최종 채택 권위는 VIA에 남음</text>
<rect x="70" y="1010" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="1051" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">확정 상태: 현재 의미 / 사용 근거</text>
<text x="88" y="1086" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원본 source와 게시 revision 함께 기록</text>
<text x="88" y="1121" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">수신한 원본들은 전역 snapshot이 아님</text>
<text x="88" y="1156" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">이미 가진 공통 ID index도 사용 가능</text>
<rect x="780" y="1010" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="1051" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">5 현재성 검사 뒤 의미 채택</text>
<text x="798" y="1086" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller / Policy Manager</text>
<text x="798" y="1121" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 / source / 권한 epoch 재확인</text>
<text x="798" y="1156" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">UseCheck와 사용 등록을 철회와 직렬화</text>
<rect x="1510" y="1010" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="1051" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">정정 / 삭제 / 권한 철회 사건</text>
<text x="1528" y="1086" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 revision / epoch를 먼저 변경</text>
<text x="1528" y="1121" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">의존 자료와 미전송 효과 즉시 차단</text>
<text x="1528" y="1156" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">늦은 완료로 이전 조건을 되살리지 않음</text>
<rect x="70" y="1195" width="630" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="88" y="1236" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">재시작: 삭제 원장과 게시 commit 확인</text>
<text x="88" y="1271" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">마지막 게시 cursor에서 gap을 복구</text>
<text x="88" y="1306" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">알림 outbox 재전송 / 조회 재확인</text>
<text x="88" y="1341" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">늦은 생산으로 삭제 자료 재게시 금지</text>
<rect x="780" y="1195" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="1236" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">6 채택 근거를 보존하고 요청은 종료</text>
<text x="798" y="1271" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">게시 기록은 허용 목적에서 계속 유지</text>
<text x="798" y="1306" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">생산은 유효 목적 / 예산에서만 지속</text>
<text x="798" y="1341" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">미소비 생산 / 폐기 / 재시도까지 계상</text>
<rect x="1510" y="1195" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="1236" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">실패: 저장소 / 생산 / read 오류</text>
<text x="1528" y="1271" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원본 보완 또는 명시적 제한으로 반환</text>
<text x="1528" y="1306" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필수 근거 없으면 보류 / 확인</text>
<text x="1528" y="1341" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">중요 입력과 다른 요청을 함께 막지 않음</text>
<rect x="70" y="1450" width="1010" height="155" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="1491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">C1 선택적 기억 생산</text>
<text x="88" y="1526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">재사용 목적이 있는 허용 범위부터 생산</text>
<text x="88" y="1561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">추가: 선별 / 미생산 fallback / 오분류 비용</text>
<text x="88" y="1596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">업무 인계와 공유한 생산 비용은 한 번만 계상</text>
<rect x="1150" y="1450" width="1010" height="155" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="1168" y="1491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">C2 변경 묶음 갱신</text>
<text x="1168" y="1526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">여러 허용 변경을 묶어 관계를 재생산</text>
<text x="1168" y="1561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">추가: 게시 대기 / stale 범위의 원본 보완</text>
<text x="1168" y="1596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">삭제와 권한 철회의 사용 차단은 즉시 유지</text>
<polyline points="1105,420 1105,455" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1105,605 1105,640" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1105,790 1105,825" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>

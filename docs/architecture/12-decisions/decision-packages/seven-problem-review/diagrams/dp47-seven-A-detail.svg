<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800">
<title>dp47-seven-A-detail</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516275"/></marker></defs>
<rect width="2400" height="1800" fill="white"/>
<rect x="55" y="235" width="550" height="245" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="73" y="276" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">1 Interaction Manager: 실제 관측</text>
<text x="73" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">발화 중 원음 + 전사 revision</text>
<text x="73" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">frame + source 시각 / 수신 시각</text>
<text x="73" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">유효한 발화 전 selection / pre-roll</text>
<text x="73" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">pointer path / 버튼 / page / 창</text>
<text x="73" y="451" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">circle / page 이동을 함께 기록</text>
<rect x="1795" y="235" width="550" height="245" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1813" y="276" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">정정과 권한의 공통 제어</text>
<text x="1813" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">r2 등록 즉시 r1 후속 사용 hold</text>
<text x="1813" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">BeginRevision: expected 값 교체</text>
<text x="1813" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">TryApply / TryPublish와 같은 Gate</text>
<text x="1813" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">취소와 채택 차단은 별도 처리</text>
<text x="1813" y="451" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">의미 worker 완료를 기다리지 않음</text>
<rect x="55" y="555" width="550" height="420" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="73" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">Raw Evidence Window + Reader</text>
<text x="73" y="631" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원음 / encoded frame / native</text>
<text x="73" y="666" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">source ID / 판본 / locator / 시각 오차</text>
<text x="73" y="701" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">순서 / gap / 권한 / 만료를 보존</text>
<text x="73" y="736" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">시간 대응은 의도 판단의 근거</text>
<text x="73" y="771" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">timestamp만으로 의도 확정 안 함</text>
<text x="73" y="806" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">worker가 범위 read lease로 읽음</text>
<text x="73" y="841" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">callback을 막지 않는 유한 Queue</text>
<text x="73" y="876" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">포화: payload 누락과 gap 기록</text>
<text x="73" y="911" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">없던 원본은 생성하지 않음</text>
<text x="73" y="946" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 화면으로 과거 원본 대체 금지</text>
<rect x="55" y="1040" width="550" height="430" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="73" y="1081" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">원본과 임시 상태의 수명</text>
<text x="73" y="1116" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">bytes 안전 복사 후 OS frame 반납</text>
<text x="73" y="1151" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">raw: 시간 / byte / lease 한도 적용</text>
<text x="73" y="1186" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필요 정정 구간 보존, 철회 우선</text>
<text x="73" y="1221" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">후보가 생겨도 raw 삭제 안 함</text>
<text x="73" y="1256" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">decoded / staging: reader 종료 후</text>
<text x="73" y="1291" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">SDK 참조 종료도 확인 후 회수</text>
<text x="73" y="1326" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">임시 상태는 채택 / 종료 후 정리</text>
<text x="73" y="1361" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">채택된 허용 artifact만 지속 저장</text>
<text x="73" y="1396" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">raw 해제 뒤 불가능한 재판단 명시</text>
<text x="73" y="1431" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">영속 파일 크기와 local RAM 구별</text>
<rect x="1795" y="1040" width="550" height="430" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1813" y="1081" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">정정 / 오류 / unknown 경로</text>
<text x="1813" y="1116" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">r2: 현재 요청 binding을 재판단</text>
<text x="1813" y="1151" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">늦은 r1: writer가 stale 게시 거절</text>
<text x="1813" y="1186" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">권한 철회: raw / 파생 사용 차단</text>
<text x="1813" y="1221" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">source: 역사 / 현재 selector 구별</text>
<text x="1813" y="1256" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">관측 gap: 한도 대기 또는 확인</text>
<text x="1813" y="1291" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">모델 실패: 예산 내 재시도 / 보류</text>
<text x="1813" y="1326" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">coverage 불명은 정답이 아님</text>
<text x="1813" y="1361" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">불완전 binding으로 업무 위임 금지</text>
<text x="1813" y="1396" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">제어 / 완료 inbox와 job Queue 분리</text>
<text x="1813" y="1431" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">state lock 안에서 I/O await 금지</text>
<rect x="665" y="1315" width="1070" height="155" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="683" y="1356" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">6 공통 Currentness + Adoption Gate → Request Controller / State Store</text>
<text x="683" y="1391" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">input / source / policy / base 및 A 원본 의존 / B 후보 read-set의 현재성 검사</text>
<text x="683" y="1426" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">통과한 binding만 요청 해석 / 응답 / 업무에 사용. 불일치는 거절, 모호함은 확인</text>
<text x="683" y="1461" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">QA02 최초 채택 오류 보존. 후속 수정으로 최초 실패를 지우지 않음</text>
<rect x="665" y="235" width="1070" height="245" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="683" y="276" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">2 Request Controller → Grounding Attempt Control</text>
<text x="683" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">완성 입력 revision 등록 후 의미 판단 시작. 발화 중 원본 수집은 계속</text>
<text x="683" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">GroundingInput: rawRefs / 전사 / prior / 권한 / revision / deadline</text>
<text x="683" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">bounded Joint Work Queue에는 참조 job. worker가 Reader를 직접 읽음</text>
<text x="683" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">정정 시 현재 요청의 전체 binding 집합 재검토. 전체 대화 재실행은 아님</text>
<text x="683" y="451" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">제어 / 완료 inbox 분리. 현재 시도 안의 유효 binding은 재사용</text>
<rect x="665" y="555" width="1070" height="270" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="683" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">3 Joint Grounding Interpreter: extent와 binding의 의미 writer</text>
<text x="683" y="631" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">native 선택과 표현이 명백하면 code. 의미 판단이 필요하면 M 공통 모델</text>
<text x="683" y="666" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원음 / 전사 + frame / path / native를 함께 읽어 지칭 집합과 관계를 생산</text>
<text x="683" y="701" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">한 call에서 두 graph와 제목 등 다수 지칭 가능. 표현 수만큼 call 강제 없음</text>
<text x="683" y="736" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">같은 판단에서 읽은 원본과 binding으로 충분한 검사에는 재입력을 강제 안 함</text>
<text x="683" y="771" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">부족한 발화 / 화면 범위는 5에서 원본 재조회. 별도 후보 게시 관문 없음</text>
<text x="683" y="806" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">기본에는 semantic crop/cache, 부분 binding patch, 증분 의미 판단 미포함</text>
<rect x="665" y="880" width="1070" height="155" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="683" y="921" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">4 Joint Grounding State: 현재 시도의 불변 결과와 근거 의존</text>
<text x="683" y="956" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">bindings / source read-set / input revision / base version / 불확실성</text>
<text x="683" y="991" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">TryApply 현재성 통과 시 게시. 같은 판단 안의 후속 검사에 재사용</text>
<text x="683" y="1026" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">요청 채택 / 종료 뒤 필요한 binding과 source만 남기고 임시 상태 회수</text>
<rect x="665" y="1085" width="1070" height="190" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="683" y="1126" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">5 Ready / NeedEvidence / Ambiguous</text>
<text x="683" y="1161" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">NeedEvidence → 같은 Joint Grounding Interpreter가 bounded 원본 재조회</text>
<text x="683" y="1196" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">관측이 충분해지면 3 재판단. 원본이 없으면 unknown / 질문 / 보류</text>
<text x="683" y="1231" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">source 오류나 r2 정정은 새 근거 판본으로 현재 요청 binding을 재검토</text>
<text x="683" y="1266" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Ready도 직접 사용하지 않음. 6 공통 gate에서 최초 채택 확정</text>
<rect x="1795" y="555" width="550" height="420" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1813" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">M 조건부 cloud 의미 의존</text>
<text x="1813" y="631" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Model Access / 같은 capability</text>
<text x="1813" y="666" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">native 충분 → 모델 생략 가능</text>
<text x="1813" y="701" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">3: 원본 의미 판단에만 요청</text>
<text x="1813" y="736" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">발화 + 관련 media + prior 입력</text>
<text x="1813" y="771" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">다수 지칭도 한 번에 처리 가능</text>
<text x="1813" y="806" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">worker가 결과 / usage를 회수</text>
<text x="1813" y="841" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 / 출력 / 재시도 청구 포함</text>
<text x="1813" y="876" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">취소 뒤 청구와 staging도 포함</text>
<text x="1813" y="911" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">cloud weights / KV는 RAM 제외</text>
<text x="1813" y="946" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">기본 A에 별도 screen parser 없음</text>
<rect x="55" y="1510" width="2290" height="190" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="73" y="1551" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">선택 후 보완: 각각 기본 A + 개별 기법. 함께 쓰면 조합을 명시</text>
<text x="73" y="1586" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">A1 crop/cache: 실제 read와 청구 감소 확인.  A2 부분 binding patch: 의미 영향 범위 판단과 전체 재검토 fallback 필요</text>
<text x="73" y="1621" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">A3 발화 중 증분 의미 판단: 양쪽에 가능한 보완.  A4 동일 parser를 advisory 입력으로 사용: 최종 의미 writer는 Joint</text>
<text x="73" y="1656" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 기본 추천 A. A1/A2는 필요 시 선택. 큰 원본 입력과 재판단 비용은 남으며, 정확도 우위나 비용 승자는 미측정</text>
<polyline points="330,480 330,555" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="605,355 665,355" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1795,355 1735,355" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="330,975 330,1040" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1200,1035 1200,1085" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1200,1275 1200,1315" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1795,1390 1735,1390" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="1200,480 1200,555" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="605,700 665,700" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>

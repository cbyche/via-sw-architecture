<text x="55" y="139" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="400" fill="#516275">같은 장면: D1의 두 대상을 가리키고 페이지를 바꾼 뒤 “이 둘과 방금 그래프를 비교해줘.” 이후 일부 정정.</text>
<text x="55" y="195" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#176EAD">파랑: 역할과 처리  |  주황: 보존 상태  |  실선: 입력/결과  |  점선: 조건부 호출/제어/재조회  |  하단: 선택 후 보완</text>
<text x="55" y="1766" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="21" font-weight="400" fill="#516275">설계 분석 그림. 성능 수치와 측정 결과가 아니며 실패 및 복구 계약은 연결된 본문에 수록.</text>

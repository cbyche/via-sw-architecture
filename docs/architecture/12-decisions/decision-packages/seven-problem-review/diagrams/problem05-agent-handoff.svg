<text x="678" y="926" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 보낸 내용과 수신 상태 기록</text>
<rect x="1215" y="235" width="530" height="745" rx="10" fill="#F8FAFC" stroke="#C6D1DE" stroke-width="2"/>
<text x="1233" y="279" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="28" font-weight="700" fill="#182B40">C  필수 명세와 수신자 읽기</text>
<rect x="1240" y="325" width="480" height="100" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1258" y="366" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">채택한 조건 / 공개 결과 / 실제 전달</text>
<text x="1258" y="401" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">같은 원본과 현재 접근 권한</text>
<rect x="1240" y="850" width="480" height="90" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1258" y="891" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">계약 revision과 수행 범위 확정</text>
<text x="1258" y="926" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 보낸 내용과 수신 상태 기록</text>
<rect x="80" y="485" width="480" height="135" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="98" y="526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 위임 목적에 맞춰 자료 선택</text>
<text x="98" y="561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">설명 / 발췌 / 결과 참조 구성</text>
<text x="98" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">이전에 확보한 유효 근거도 사용</text>
<rect x="80" y="685" width="480" height="110" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="98" y="726" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">준비 중 묶음 / 확정 송신 계약</text>
<text x="98" y="761" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">새 위임 때 목적별로 다시 구성</text>
<rect x="660" y="485" width="480" height="135" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="678" y="526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">업무 변경마다 기록 갱신</text>
<text x="678" y="561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 조건 / 적용된 결과 관계</text>
<text x="678" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">source / coverage / 생산 상태</text>
<rect x="660" y="685" width="480" height="110" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="678" y="726" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">위임 목적에 맞춰 기록 추출</text>
<text x="678" y="761" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">부족한 원본 보완과 현재성 확인</text>
<rect x="1240" y="485" width="480" height="135" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="1258" y="526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">VIA: 필수 목표 / 조건 / 자료 명세</text>
<text x="1258" y="561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">판본 / 범위 / 권한 lease / 만료</text>
<text x="1258" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필수 조건은 수신자 발견에 맡기지 않음</text>
<rect x="1240" y="685" width="480" height="110" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1258" y="726" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">수신 Agent: 필요한 상세 자료 선택</text>
<text x="1258" y="761" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">허용 범위 안에서 읽고 업무 수행</text>

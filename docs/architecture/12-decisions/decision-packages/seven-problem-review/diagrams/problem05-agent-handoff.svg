<polyline points="1480,850 1480,795" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="55" y="89" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">Agent가 바뀌는 업무: 인계 자료를 언제, 누가 구성하는가</text>
<text x="55" y="139" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="400" fill="#516275">Agent X의 비교를 사용자가 수정하고, Y에게 발표자료를 맡긴 뒤 Z에게 관련 메일을 맡긴다.</text>
<text x="55" y="192" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="22" font-weight="400" fill="#176EAD">기본 구조의 선택   |   파랑: 처리 경로   |   주황: 유지 상태   |   하단: 선택 후 보완 기법</text>
<text x="55" y="1146" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="21" font-weight="400" fill="#516275">설계 분석 그림. 성능 수치와 측정 결과가 아니며 실패 및 복구 계약은 연결된 본문에 수록.</text>
<text x="65" y="1034" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="24" font-weight="400" fill="#176EAD">A↔B: 필요할 때 준비 대 반복 인계 재사용. C: 상세 자료 선택을 지원 가능한 수신자에게 맡김.</text>
<text x="65" y="1078" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="23" font-weight="400" fill="#A45A18">선택 A 이후 A1 인계 묶음 cache / A2 같은 Agent의 native session 재사용. 공통 생산은 한 번만 계상.</text>

<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
<title>problem01-B-detail</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516275"/></marker></defs>
<rect width="2200" height="1700" fill="white"/>
<rect x="70" y="270" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">원본의 권위는 각 owner에 있음</text>
<text x="88" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 / 정정: Request Controller</text>
<text x="88" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 전달: Response Manager</text>
<text x="88" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">결과 / 현재 업무: Task Manager</text>
<rect x="780" y="270" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">1 Interaction Manager가 입력 수신</text>
<text x="798" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller: 입력 revision</text>
<text x="798" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">최근 대화 / 관측 참조 / 허용 범위</text>
<text x="798" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">정답 Task 연결은 아직 주어지지 않음</text>
<rect x="1510" y="270" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">기본 B의 고유 선택</text>
<text x="1528" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">요청마다 필요한 근거를 원본에서 구성</text>
<text x="1528" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">확장한 해석 문맥은 요청 종료 때 종료</text>
<text x="1528" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">공통 원본 / 채택 상태 / 최근 대화 보존</text>
<rect x="70" y="455" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="496" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">공통 시작 상태와 source 탐색 정보</text>
<text x="88" y="531" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">최근 대화 / 채택 조건 / 관측 참조</text>
<text x="88" y="566" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">metadata / 명시 ID / 정정 링크</text>
<text x="88" y="601" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">추가 조회 결과의 요청 간 cache는 없음</text>
<rect x="780" y="455" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="496" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">2 현재 목적의 읽기 범위 정하기</text>
<text x="798" y="531" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Interpreter가 읽기 범위 제안</text>
<text x="798" y="566" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">후보 source를 발견하고 범위를 좁힘</text>
<text x="798" y="601" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">매 요청마다 전체 transcript를 읽지 않음</text>
<rect x="1510" y="455" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="496" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">2 탐색 의미가 모호할 때만 호출</text>
<text x="1528" y="531" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Model Access → cloud 의미 모델</text>
<text x="1528" y="566" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">명시 ID 연결은 코드로 처리</text>
<text x="1528" y="601" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">모든 read에 추가 모델 호출을 강제 안 함</text>
<rect x="70" y="640" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="681" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">요청 수명: EvidenceBundle / Receipt</text>
<text x="88" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 필요한 발췌 / 참조 / 관계 후보</text>
<text x="88" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">읽은 source 판본 / 범위 / 누락</text>
<text x="88" y="786" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">다음 요청의 확장 view로 자동 유지 안 함</text>
<rect x="780" y="640" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="681" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">3 owner의 허용 원본을 조합</text>
<text x="798" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Context Manager → bounded read</text>
<text x="798" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필수 원문과 실제 전달 구간 확인</text>
<text x="798" y="786" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">부족하면 같은 예산 안에서 추가 조회</text>
<rect x="1510" y="640" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="681" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">파생 오류 / source 변경</text>
<text x="1528" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">문제된 묶음 revision을 무효화</text>
<text x="1528" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원본 재조회 후 현재 관계를 다시 판단</text>
<text x="1528" y="786" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">이전 완료는 새 read ID에 합치지 않음</text>
<rect x="70" y="825" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="866" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">원본 / 실제 전달의 구별</text>
<text x="88" y="901" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">생성 원문과 실제 제시 구간 별도</text>
<text x="88" y="936" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">지연 수신 사실을 과거에 안 것으로 안 함</text>
<text x="88" y="971" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">source vector는 별도 관측 판본의 목록</text>
<rect x="780" y="825" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="866" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">4 요청 근거에서 현재 의미 제안</text>
<text x="798" y="901" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Interpreter</text>
<text x="798" y="936" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">지칭 / 조건 / Task 관계의 후보를 제출</text>
<text x="798" y="971" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 해석의 최종 채택은 5에서 수행</text>
<rect x="1510" y="825" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="866" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">4 자연어 해석이 필요할 때 호출</text>
<text x="1528" y="901" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Model Access → cloud 의미 모델</text>
<text x="1528" y="936" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">지칭 / 조건 / Task 관계를 제안</text>
<text x="1528" y="971" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">최종 채택 권위는 VIA에 남음</text>
<rect x="70" y="1010" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="1051" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">확정 상태: 채택 의미와 사용 근거</text>
<text x="88" y="1086" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller: 현재 요청 판본</text>
<text x="88" y="1121" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">사용 source spans / 결과 / 실제 전달</text>
<text x="88" y="1156" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">확장 해석 문맥 종료와 원본 삭제는 다름</text>
<rect x="780" y="1010" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="1051" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">5 현재성 검사 뒤 의미 채택</text>
<text x="798" y="1086" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller / Policy Manager</text>
<text x="798" y="1121" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 / source / 권한 epoch 재확인</text>
<text x="798" y="1156" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">UseCheck와 사용 등록을 철회와 직렬화</text>
<rect x="1510" y="1010" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="1051" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">정정 / 삭제 / 권한 철회 사건</text>
<text x="1528" y="1086" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 revision / epoch를 먼저 변경</text>
<text x="1528" y="1121" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">의존 자료와 미전송 효과 즉시 차단</text>
<text x="1528" y="1156" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">늦은 완료로 이전 조건을 되살리지 않음</text>
<rect x="70" y="1195" width="630" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="88" y="1236" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">재시작: 삭제 / 권한 원장 먼저 확인</text>
<text x="88" y="1271" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">새 read ID로 현재 원본을 다시 구성</text>
<text x="88" y="1306" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">명시 원본과 사용 참조는 그대로 보존</text>
<text x="88" y="1341" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">외부 Action을 자동 재실행하지 않음</text>
<rect x="780" y="1195" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="1236" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">6 채택 근거를 보존하고 요청 묶음 종료</text>
<text x="798" y="1271" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 응답 준비 또는 업무 인계로 전달</text>
<text x="798" y="1306" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">다음 요청은 공통 최소 문맥에서 시작</text>
<text x="798" y="1341" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">같은 근거 필요 시 원본을 다시 구성</text>
<rect x="1510" y="1195" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="1236" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">실패: DENIED / UNAVAILABLE / PARTIAL</text>
<text x="1528" y="1271" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">NO_MATCH는 실제 확인한 범위의 부재</text>
<text x="1528" y="1306" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필수 근거 없으면 보류 / 확인</text>
<text x="1528" y="1341" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">반환 유실 / 재시도 비용을 숨기지 않음</text>
<rect x="70" y="1450" width="1010" height="155" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="1491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">B1 조회 결과 cache</text>
<text x="88" y="1526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">같은 목적 / source 판본의 읽기 결과 재사용</text>
<text x="88" y="1561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">추가: 저장 / 무효화 / 현재 권한 확인</text>
<text x="88" y="1596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">cache miss에서도 기본 원본 구성이 가능</text>
<rect x="1150" y="1450" width="1010" height="155" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="1168" y="1491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">B2 독립 근거 병렬 읽기</text>
<text x="1168" y="1526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 독립 source를 같은 총 예산 안에서 조회</text>
<text x="1168" y="1561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">추가: 동시 buffer / 실패 결합 처리</text>
<text x="1168" y="1596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 초기 추천은 A. B 선택 시의 보완 후보</text>
<polyline points="1105,420 1105,455" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1105,605 1105,640" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1105,790 1105,825" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1105,975 1105,1010" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1105,1160 1105,1195" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="700,525 780,525" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="700,345 740,345 740,705 780,705" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="780,750 700,750" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="780,1120 700,1120" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1430,510 1510,510" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1510,570 1430,570" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="1430,880 1510,880" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1510,940 1430,940" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="1510,715 1430,715" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="1510,1085 1430,1085" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="1510,1270 1430,1270" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<text x="55" y="89" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">근거 공급 B: 현재 요청에 필요한 원본으로 요청별 근거를 만든다</text>
<text x="55" y="139" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="400" fill="#516275">같은 입력: “아까 실제로 설명한 기준과 비교 결과를 이번 요청에 써줘.” 최근 대화와 채택 상태를 없애지 않는다.</text>
<text x="55" y="192" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="22" font-weight="400" fill="#176EAD">기본 구조의 선택   |   파랑: 처리 경로   |   주황: 유지 상태   |   하단: 선택 후 보완 기법</text>
<text x="55" y="1666" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="21" font-weight="400" fill="#516275">설계 분석 그림. 성능 수치와 측정 결과가 아니며 실패 및 복구 계약은 연결된 본문에 수록.</text>
<text x="70" y="247" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="700" fill="#176EAD">원본과 상태: 각 owner가 보존</text>
<text x="780" y="247" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="700" fill="#176EAD">VIA 기본 처리: 번호 순서</text>
<text x="1510" y="247" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="700" fill="#176EAD">Cloud 호출과 변경 / 실패</text>
<text x="70" y="1395" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#176EAD">기본의 이익과 비용: 새 목적의 좁은 입력 / 유지 비용 감소 ↔ 같은 근거의 반복 발견과 원본 구성.</text>
<text x="70" y="1435" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#A45A18">선택 후 보완: 두 기법은 독립 적용. 기본 동작과 추가 비용을 구별하고 결합은 별도로 비교한다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
<title>problem01-A-detail</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516275"/></marker></defs>
<rect width="2200" height="1700" fill="white"/>
<rect x="70" y="270" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">원본의 권위는 각 owner에 있음</text>
<text x="88" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 / 정정: Request Controller</text>
<text x="88" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 전달: Response Manager</text>
<text x="88" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">결과 / 현재 업무: Task Manager</text>
<rect x="780" y="270" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">1 Interaction Manager가 입력 수신</text>
<text x="798" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller: 입력 revision</text>
<text x="798" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">최근 대화 / 관측 참조 / 허용 범위</text>
<text x="798" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">정답 Task 연결은 아직 주어지지 않음</text>
<rect x="1510" y="270" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">기본 A의 고유 선택</text>
<text x="1528" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">대화 수명의 source-backed 작업 문맥</text>
<text x="1528" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">다음 발화가 앞서 읽은 근거를 재사용</text>
<text x="1528" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원본 소유권 / 현재 의미 권위는 공통</text>
<rect x="70" y="455" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="496" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">지속 상태: Context Manager의 view</text>
<text x="88" y="531" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">근거 발췌 / 조건 / 미해결 사항</text>
<text x="88" y="566" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">source ID / revision / 적용 범위</text>
<text x="88" y="601" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">6에서 갱신하고 다음 요청의 2에서 읽음</text>
<rect x="780" y="455" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="496" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">2 유효 작업 문맥을 읽어 준비</text>
<text x="798" y="531" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Context Manager: 대화별 view revision</text>
<text x="798" y="566" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 source / 권한을 확인</text>
<text x="798" y="601" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">예산 초과 / 영향 변경이면 재구성</text>
<rect x="1510" y="455" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="496" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">2 압축 / 재구성 필요 때만 호출</text>
<text x="1528" y="531" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Model Access → cloud 의미 모델</text>
<text x="1528" y="566" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">출처와 실제 전달 범위를 함께 보존</text>
<text x="1528" y="601" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">기본 재사용은 prefix cache와 다름</text>
<rect x="70" y="640" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="681" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">요청 수명: EvidenceBundle / Receipt</text>
<text x="88" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">발췌 / 참조 / 별도 source vector</text>
<text x="88" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 읽은 범위와 누락 / 실패 상태</text>
<text x="88" y="786" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">전역 atomic snapshot을 주장하지 않음</text>
<rect x="780" y="640" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="681" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">3 부족 / 변경된 근거만 원본 보완</text>
<text x="798" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Context Manager: owner 범위 읽기</text>
<text x="798" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">충분하면 유지 근거를 그대로 통과</text>
<text x="798" y="786" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필수 원문 / 정확한 인용은 원문 확인</text>
<rect x="1510" y="640" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="681" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">원본이 같은 파생 오류도 신고 가능</text>
<text x="1528" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller: 오류와 view 판본</text>
<text x="1528" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Context Manager가 EvidenceDispute 수신</text>
<text x="1528" y="786" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">해당 판본 차단 후 원본으로 재검증</text>
<rect x="70" y="825" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="866" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">원본 / 실제 전달의 구별</text>
<text x="88" y="901" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">준비한 설명과 표시 / 재생 구간 별도</text>
<text x="88" y="936" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">참조 보관이 원본 전체 보관은 아님</text>
<text x="88" y="971" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">과거 동의가 현재 권한을 대신하지 않음</text>
<rect x="780" y="825" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="866" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">4 근거를 사용해 현재 의미 제안</text>
<text x="798" y="901" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Interpreter</text>
<text x="798" y="936" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">부족 범위는 보존하고 필요하면 재조회</text>
<text x="798" y="971" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">같은 충분 근거이면 정확도 우위 미정</text>
<rect x="1510" y="825" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="866" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">4 자연어 해석이 필요할 때 호출</text>
<text x="1528" y="901" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Model Access → cloud 의미 모델</text>
<text x="1528" y="936" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">지칭 / 조건 / Task 관계를 제안</text>
<text x="1528" y="971" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">최종 채택 권위는 VIA에 남음</text>
<rect x="70" y="1010" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="1051" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">확정 상태: 채택 의미와 사용 근거</text>
<text x="88" y="1086" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller: 입력 / 요청 판본</text>
<text x="88" y="1121" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원본 source spans와 실제 사용 참조</text>
<text x="88" y="1156" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">잠정 제안은 확정 조건과 분리</text>
<rect x="780" y="1010" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="1051" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">5 현재성 검사 뒤 의미 채택</text>
<text x="798" y="1086" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller / Policy Manager</text>
<text x="798" y="1121" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 / source / 권한 epoch 재확인</text>
<text x="798" y="1156" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">UseCheck와 사용 등록을 철회와 직렬화</text>
<rect x="1510" y="1010" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="1051" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">정정 / 삭제 / 권한 철회 사건</text>
<text x="1528" y="1086" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 revision / epoch를 먼저 변경</text>
<text x="1528" y="1121" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">의존 자료와 미전송 효과 즉시 차단</text>
<text x="1528" y="1156" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">늦은 완료로 이전 조건을 되살리지 않음</text>
<rect x="70" y="1195" width="630" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="88" y="1236" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">재시작: 삭제 원장을 먼저 확인</text>
<text x="88" y="1271" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">유효 view 복원 또는 원본 재구성</text>
<text x="88" y="1306" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">재사용 불명 자료는 최신으로 표시 안 함</text>
<text x="88" y="1341" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">외부 Action을 자동 재실행하지 않음</text>
<rect x="780" y="1195" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="1236" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">6 근거 참조와 view revision을 보존</text>
<text x="798" y="1271" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 응답 준비 또는 업무 인계로 전달</text>
<text x="798" y="1306" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Response Manager의 실제 전달은 별도</text>
<text x="798" y="1341" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">다음 발화가 유효 작업 문맥을 재사용</text>
<rect x="1510" y="1195" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="1236" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">실패: read 거절 / hard 압축 실패</text>
<text x="1528" y="1271" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">bounded 원본 재구성 또는 PARTIAL</text>
<text x="1528" y="1306" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필수 근거 없으면 보류 / 확인</text>
<text x="1528" y="1341" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">취소 / 재시도 / 늦은 cloud 청구 보존</text>
<rect x="70" y="1450" width="1010" height="155" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="1491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">A1 입력 prefix cache</text>
<text x="88" y="1526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">같은 유효 prefix를 provider 지원 아래 재사용</text>
<text x="88" y="1561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">추가: cache 수명 / 권한 재확인 / 요금</text>
<text x="88" y="1596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">A1+A2는 patch 뒤 prefix 적중 변화도 확인</text>
<rect x="1150" y="1450" width="1010" height="155" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="1168" y="1491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">A2 변경 조각 갱신</text>
<text x="1168" y="1526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">확인된 dependency의 부분만 재구성</text>
<text x="1168" y="1561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">추가: index / patch 정합성 검사 비용</text>
<text x="1168" y="1596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">영향 범위가 불명이면 기본 전체 재구성</text>
<polyline points="1105,420 1105,455" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>

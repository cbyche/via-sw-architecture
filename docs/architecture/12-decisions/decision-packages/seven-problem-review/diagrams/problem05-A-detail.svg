<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
<title>problem05-A-detail</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516275"/></marker></defs>
<rect width="2200" height="1700" fill="white"/>
<rect x="70" y="455" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="496" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">공통 상태만 지속 보존</text>
<text x="88" y="531" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 Task 조건 / 공개 결과 / 전달 구간</text>
<text x="88" y="566" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">이미 확보한 01의 유효 근거도 사용</text>
<text x="88" y="601" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">미래 인계용 의미 record 생산은 없음</text>
<rect x="780" y="455" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="496" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">2 현재 위임 목적의 자료를 선택</text>
<text x="798" y="531" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Context Manager가 유효 원본을 구성</text>
<text x="798" y="566" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">명시 ID / 조건 / 상태는 코드로 읽음</text>
<text x="798" y="601" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필요한 발췌 / 설명 / 결과 참조 선택</text>
<rect x="1510" y="455" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="496" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">2 자유문 선택 / 요약 필요 때만 호출</text>
<text x="1528" y="531" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Model Access → cloud 의미 모델</text>
<text x="1528" y="566" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">공개 원본과 현재 조건만 사용</text>
<text x="1528" y="601" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">조건 / source 판본 검사 자체는 코드</text>
<rect x="70" y="640" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="681" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">요청 수명: 준비 중 capsule</text>
<text x="88" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">목표 / 필수 조건 / 실제 전달 근거</text>
<text x="88" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">source identity / revision / 범위</text>
<text x="88" y="786" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">유효 artifact 참조도 기본에서 허용</text>
<rect x="780" y="640" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="681" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">3 목적별 인계 묶음 후보 준비</text>
<text x="798" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">큰 자료는 선택한 유효 참조로 전달</text>
<text x="798" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">부족한 원본은 bounded read로 보완</text>
<text x="798" y="786" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필수 항목이 없으면 4로 진행하지 않음</text>
<rect x="1510" y="640" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="681" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">read 실패 / 만료 / source 변경</text>
<text x="1528" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">동일 판본 보완 또는 명시적 보류</text>
<text x="1528" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">capsule source와 목적을 다시 확인</text>
<text x="1528" y="786" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">준비 실패를 외부 성공으로 표시 안 함</text>
<rect x="70" y="1010" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="1051" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">보존 원장: 조건 / 삭제 / 수행 범위</text>
<text x="88" y="1086" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">재시작 시 현재 권한과 source 재확인</text>
<text x="88" y="1121" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">같은 불명 Action은 다시 보내지 않음</text>
<text x="88" y="1156" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">별도로 허용된 업무는 계속 가능</text>
<rect x="780" y="1195" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="1236" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">6 공개 결과 / 질문 / 실패를 수신</text>
<text x="798" y="1271" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Task Manager가 외부 사실을 확인</text>
<text x="798" y="1306" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller가 같은 업무에 연결</text>
<text x="798" y="1341" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">새 목적이면 1에서 새 묶음을 구성</text>
<rect x="1510" y="1195" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="1236" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">외부 실패 / native session 유실</text>
<text x="1528" y="1271" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">공개 원본에서 portable 묶음 재구성</text>
<text x="1528" y="1306" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">fresh 성공이 이전 session 복원은 아님</text>
<text x="1528" y="1341" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">외부 비용 / 취소 후 청구는 따로 기록</text>
<rect x="70" y="270" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">원본의 권위는 각 owner에 있음</text>
<text x="88" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 / 정정: Request Controller</text>
<text x="88" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 전달: Response Manager</text>
<text x="88" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">결과 / 현재 업무: Task Manager</text>
<rect x="780" y="270" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">1 현재 인계 요청과 채택 상태</text>
<text x="798" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller / Task Manager</text>
<text x="798" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">목표 / 조건 / 제외 / 허용 Action</text>
<text x="798" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Agent 선택은 공통으로 고정한 별도 결정</text>
<rect x="1510" y="270" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">공통 실제 근거 / 권한 계약</text>
<text x="1528" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원본 + 공개 결과 + 실제 전달만 사용</text>
<text x="1528" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필수 조건은 수신자 추측에 맡기지 않음</text>
<text x="1528" y="416" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">공통 생산은 01과 한 번만 비용 계상</text>
<rect x="780" y="825" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="866" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">4 외부 실행 허가 계약 확정</text>
<text x="798" y="901" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">요청 / attempt / delegation 판본</text>
<text x="798" y="936" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">source / 권한 / 필수 조건 재확인</text>
<text x="798" y="971" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">불명인 동일 Action의 중복 실행 금지</text>
<rect x="70" y="825" width="630" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="866" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">내구 원장: 계약 / 송신 / 수신 사실</text>
<text x="88" y="901" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">4 계약 확정, 5 실제 송신 등록</text>
<text x="88" y="936" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Agent Gateway: 수신 확인은 별도 기록</text>
<text x="88" y="971" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Task Manager: 공개 수행 사실만 기록</text>
<rect x="1510" y="825" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="866" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">정정 / 철회 / 실행 상태 불명</text>
<text x="1528" y="901" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원본 revision / 권한 epoch를 먼저 변경</text>
<text x="1528" y="936" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">미전송 계약과 늦은 이전 완료 차단</text>
<text x="1528" y="971" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">이미 보낸 외부 자료의 회수는 별도</text>
<rect x="780" y="1010" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="798" y="1051" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">5 Agent Gateway가 확정 계약 전송</text>
<text x="798" y="1086" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">adapter의 입력 형식 / 예산을 준수</text>
<text x="798" y="1121" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 전송 등록과 철회 경쟁을 차단</text>
<text x="798" y="1156" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">정정 적용 완료는 외부 확인과 구별</text>
<rect x="1510" y="1010" width="650" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1528" y="1051" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">외부 Downstream Agent 경계</text>
<text x="1528" y="1086" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">받은 계약 안에서 domain 판단 / 실행</text>
<text x="1528" y="1121" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">비공개 추론 / memory 이전 가정 없음</text>
<text x="1528" y="1156" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">수신 확인과 실제 수행은 다른 사실</text>
<rect x="70" y="1450" width="1010" height="155" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="88" y="1491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">A1 인계 묶음 cache</text>
<text x="88" y="1526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">같은 목적 / 조건 / source 판본의 묶음 재사용</text>
<text x="88" y="1561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">추가: 저장 / 무효화 / 권한 재확인</text>
<text x="88" y="1596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">유효 artifact 참조는 원래 기본 기능</text>
<rect x="1150" y="1450" width="1010" height="155" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="1168" y="1491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">A2 같은 Agent의 native session 재사용</text>
<text x="1168" y="1526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">재개와 유효성을 확인한 본문만 생략</text>
<text x="1168" y="1561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">추가: capability / 재개 실패 처리</text>
<text x="1168" y="1596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필수 조건은 명시. fresh / 새 Agent는 기본 A</text>

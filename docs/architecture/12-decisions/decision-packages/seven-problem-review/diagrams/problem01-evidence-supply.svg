<text x="98" y="891" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 source / 권한 / 입력 판본 확인</text>
<text x="98" y="926" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">근거와 부족 범위를 반환</text>
<rect x="635" y="235" width="530" height="745" rx="10" fill="#F8FAFC" stroke="#C6D1DE" stroke-width="2"/>
<text x="653" y="279" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="28" font-weight="700" fill="#182B40">B  요청마다 원본 근거 구성</text>
<rect x="660" y="325" width="480" height="120" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="678" y="366" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 요청과 최소 대화 상태</text>
<text x="678" y="401" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필요 범위와 원본을 선택</text>
<rect x="660" y="500" width="480" height="120" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="678" y="541" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">원본을 읽고 이번 묶음을 구성</text>
<text x="678" y="576" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원본별 실제 전달 / 수정 관계 결합</text>
<rect x="660" y="675" width="480" height="120" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="678" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">요청별 근거 묶음</text>
<text x="678" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">조회 ID / source 판본 / 누락 범위</text>
<rect x="660" y="850" width="480" height="90" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="678" y="891" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 source / 권한 / 입력 판본 확인</text>
<text x="678" y="926" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">근거와 부족 범위를 반환</text>
<rect x="1215" y="235" width="530" height="745" rx="10" fill="#F8FAFC" stroke="#C6D1DE" stroke-width="2"/>
<text x="1233" y="279" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="28" font-weight="700" fill="#182B40">C  게시된 관계 근거를 조회</text>
<rect x="1240" y="325" width="480" height="120" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1258" y="366" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">원본 변경 → 독립 생산과 게시</text>
<text x="1258" y="401" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">source를 가진 관계 근거 유지</text>
<rect x="1240" y="500" width="480" height="120" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="1258" y="541" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">게시 근거 / coverage / 생산 job</text>
<text x="1258" y="576" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">요청별 근거 묶음</text>
<rect x="1240" y="675" width="480" height="120" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1258" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 요청에 맞는 게시 범위 읽기</text>
<text x="1258" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">미지원 / stale 범위는 원본 보완</text>
<rect x="1240" y="850" width="480" height="90" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1258" y="891" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 source / 권한 / 입력 판본 확인</text>
<text x="1258" y="926" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">근거와 부족 범위를 반환</text>

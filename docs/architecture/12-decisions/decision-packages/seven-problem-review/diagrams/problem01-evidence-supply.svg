<rect width="1800" height="1180" fill="white"/>
<rect x="55" y="235" width="530" height="745" rx="10" fill="#F8FAFC" stroke="#C6D1DE" stroke-width="2"/>
<text x="73" y="279" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="28" font-weight="700" fill="#182B40">A  대화 작업 문맥 유지</text>
<rect x="80" y="325" width="480" height="120" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="98" y="366" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">이전 입력 / 실제 전달 / 관련 근거</text>
<text x="98" y="401" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">작업 문맥을 계속 갱신</text>
<rect x="80" y="500" width="480" height="120" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="98" y="541" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">대화 작업 문맥</text>
<text x="98" y="576" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">source 참조 / 판본 / 사용 범위</text>
<rect x="80" y="675" width="480" height="120" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="98" y="716" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 요청을 유지 문맥에서 판단</text>
<text x="98" y="751" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">부족하거나 불일치하면 원본 읽기</text>

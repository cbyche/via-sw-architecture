<polyline points="1480,620 1480,675" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1480,795 1480,850" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="55" y="89" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">현재 요청을 판단할 근거: 유지 문맥과 요청별 구성</text>
<text x="55" y="139" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="400" fill="#516275">같은 요청: “아까 실제로 설명한 결론 중 비용 비교만 다시 알려줘.” 원본과 실제 전달 기록은 모두 보존한다.</text>
<text x="55" y="192" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="22" font-weight="400" fill="#176EAD">기본 구조의 선택   |   파랑: 처리 경로   |   주황: 유지 상태   |   하단: 선택 후 보완 기법</text>
<text x="55" y="1146" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="21" font-weight="400" fill="#516275">설계 분석 그림. 성능 수치와 측정 결과가 아니며 실패 및 복구 계약은 연결된 본문에 수록.</text>
<text x="65" y="1035" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#176EAD">주 비교 A↔B: 문맥 수명. B↔C: 사전 관계 생산. A+C도 가능하며 별도 구조 조합으로 기록한다.</text>
<text x="65" y="1078" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="23" font-weight="400" fill="#A45A18">선택 A 이후 A1 입력 prefix cache / A2 변경 조각 갱신. 다른 안의 보완과 결합 비용은 본문 참조.</text>
</svg>

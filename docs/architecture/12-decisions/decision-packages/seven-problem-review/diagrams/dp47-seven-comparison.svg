<polyline points="1140,420 1140,470" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1530,420 1530,470" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1140,620 1140,685" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1530,620 1530,685" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="960,745 943,745 943,550 960,550" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="1335,815 1335,875" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="55" y="89" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">DP-47 통합: 발화 구간과 화면 원본을 어떻게 해석하는가</text>
<text x="55" y="139" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="400" fill="#516275">사용자가 D1의 두 문단을 가리키고 페이지를 바꾼 뒤 “이것들과 방금 그래프를 비교해줘.”라고 말한다.</text>
<text x="55" y="192" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="22" font-weight="400" fill="#176EAD">기본 구조의 선택   |   파랑: 처리 경로   |   주황: 유지 상태   |   하단: 선택 후 보완 기법</text>
<text x="55" y="1146" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="21" font-weight="400" fill="#516275">설계 분석 그림. 성능 수치와 측정 결과가 아니며 실패 및 복구 계약은 연결된 본문에 수록.</text>
<text x="70" y="1039" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="24" font-weight="400" fill="#176EAD">B: 밀집 화면의 대상을 명시적으로 구분할 가능성 ↔ 별도 생산과 후보 누락 / 추가 모델 비용.</text>
<text x="70" y="1084" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="24" font-weight="400" fill="#A45A18">기본 추천 A. A1 원본 범위 / crop 재사용. B의 세부 helper 비용과 정확도 근거 한계는 본문 참조.</text>

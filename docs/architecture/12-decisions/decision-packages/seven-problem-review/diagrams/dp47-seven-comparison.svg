<rect width="1800" height="1180" fill="white"/>
<rect x="55" y="235" width="820" height="745" rx="10" fill="#F8FAFC" stroke="#C6D1DE" stroke-width="2"/>
<text x="73" y="279" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="28" font-weight="700" fill="#182B40">A  원본을 함께 읽는 결합 판단</text>
<rect x="90" y="315" width="750" height="105" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="108" y="356" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">같은 음성 / 전사 revision + 화면 / 선택 / 포인터 관측</text>
<text x="108" y="391" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">source 시각 / 수신 시각 / locator / 원본 모두 보존</text>
<rect x="90" y="875" width="750" height="75" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="108" y="916" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">지칭 대상 집합과 source 근거 채택 / 모호하면 확인</text>
<rect x="925" y="235" width="820" height="745" rx="10" fill="#F8FAFC" stroke="#C6D1DE" stroke-width="2"/>
<text x="943" y="279" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="28" font-weight="700" fill="#182B40">B  독립 후보 생산과 결합</text>
<rect x="960" y="315" width="750" height="105" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="978" y="356" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">같은 음성 / 전사 revision + 화면 / 선택 / 포인터 관측</text>
<text x="978" y="391" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">source 시각 / 수신 시각 / locator / 원본 모두 보존</text>
<rect x="960" y="875" width="750" height="75" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="978" y="916" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">지칭 대상 집합과 source 근거 채택 / 모호하면 확인</text>
<rect x="90" y="485" width="750" height="150" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="108" y="526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">Request Interpreter: 결합 의미 판단</text>
<text x="108" y="561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">관련 화면 구간과 발화를 함께 읽음</text>
<text x="108" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">명확한 native 선택 범위는 양안 모두 코드 처리</text>
<text x="108" y="631" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">이미 읽은 원본과 잠정 결과를 같은 판단에서 재사용</text>
<rect x="90" y="695" width="750" height="125" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="108" y="736" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">현재 판단 문맥과 근거 의존</text>
<text x="108" y="771" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">각 대상의 원본 참조 / 불확실성 / revision</text>
<text x="108" y="806" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">변경된 근거에 맞춰 영향받은 판단 재수행</text>
<rect x="960" y="470" width="355" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="978" y="511" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">화면 후보 생산</text>
<text x="978" y="546" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">parser / local semantics</text>
<text x="978" y="581" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">영역 / 관계 / 원본 근거</text>
<text x="978" y="616" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">누락 / 경쟁 후보와 revision</text>
<rect x="1355" y="470" width="355" height="150" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="1373" y="511" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">발화 후보 생산</text>
<text x="1373" y="546" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">지칭 표현 / 구간 / 조건</text>
<text x="1373" y="581" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">전사 근거와 수정 범위</text>
<text x="1373" y="616" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">불명 / 경쟁 후보와 revision</text>
<rect x="960" y="685" width="750" height="130" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="978" y="726" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">후보 결합: 일의적 typed 대응은 코드로 결합</text>
<text x="978" y="761" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">자유 의미가 필요하면 모델로 결합 / 재질의</text>
<text x="978" y="796" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">부족한 후보는 생산자가 원본에서 확장</text>

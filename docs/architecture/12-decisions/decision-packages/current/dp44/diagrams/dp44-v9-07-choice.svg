<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0L10,5L0,10Z" fill="context-stroke"/></marker></defs><rect width="1920" height="1080" fill="white"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="44" font-weight="700" text-anchor="start"><tspan x="65" y="77.96000000000001">DP44. 선택과 보완</tspan></text><path d="M58 108H1860" stroke="#A7A7A7" stroke-width="3"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="start"><tspan x="65" y="161.68">화면 첫 응답은 동점이다. 현 합성 조건에서는 QA03의 이익을 우선하여 A를 권고한다</tspan></text><polygon points="1210,33 1333,33 1353,55 1333,77 1210,77 1230,55" fill="#98999B" stroke="white"/><text fill="#FFFFFF" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1281.5" y="61.46">과제 소개</tspan></text><polygon points="1344,33 1467,33 1487,55 1467,77 1344,77 1364,55" fill="#98999B" stroke="white"/><text fill="#FFFFFF" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1415.5" y="61.46">요구사항 분석</tspan></text><polygon points="1478,33 1601,33 1621,55 1601,77 1478,77 1498,55" fill="#35A8CD" stroke="white"/><text fill="#FFFFFF" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1549.5" y="61.46">설계</tspan></text><polygon points="1612,33 1735,33 1755,55 1735,77 1612,77 1632,55" fill="#98999B" stroke="white"/><text fill="#FFFFFF" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1683.5" y="61.46">구현 및 검증</tspan></text><polygon points="1746,33 1869,33 1889,55 1869,77 1746,77 1766,55" fill="#98999B" stroke="white"/><text fill="#FFFFFF" font-family="Calibri,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle"><tspan x="1817.5" y="61.46">결론</tspan></text><g id="undefined"><rect x="60" y="214" width="360" height="48" rx="0" fill="#C9E1B3" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="700" text-anchor="middle"><tspan x="240" y="246.61333322">선택 판단</tspan></text></g><g id="undefined"><rect x="420" y="214" width="720" height="48" rx="0" fill="#C9E1B3" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="700" text-anchor="middle"><tspan x="780" y="246.61333322">A. 응답별 준비 실행</tspan></text></g><g id="undefined"><rect x="1140" y="214" width="720" height="48" rx="0" fill="#C9E1B3" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="700" text-anchor="middle"><tspan x="1500" y="246.61333322">B. 현재 발화 실행</tspan></text></g><g id="undefined"><rect x="60" y="262" width="360" height="92" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="240" y="316.61333322">얻는 이익</tspan></text></g><g id="undefined"><rect x="420" y="262" width="720" height="92" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="780" y="302.42666674">QA03 평균 0.745초 감소</tspan><tspan x="780" y="330.7999997">별도 첫 음성 평균 0.207초 감소</tspan></text></g><g id="undefined"><rect x="1140" y="262" width="720" height="92" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="1500" y="302.42666674">미선택 구판의 생성 비용 회피</tspan><tspan x="1500" y="330.7999997">예상 변경 범위가 작음</tspan></text></g><g id="undefined"><rect x="60" y="354" width="360" height="92" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="240" y="408.61333322">감수하는 비용</tspan></text></g><g id="undefined"><rect x="420" y="354" width="720" height="92" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="780" y="394.42666674">전체 VIA 모델 비용 11.47% 증가</tspan><tspan x="780" y="422.7999997">준비 job, 구간과 판본의 관리 부담</tspan></text></g><g id="undefined"><rect x="1140" y="354" width="720" height="92" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="1500" y="394.42666674">발화 선택 뒤 생성 대기</tspan><tspan x="1500" y="422.7999997">긴 응답 재개 시 후반 문맥 재입력</tspan></text></g><g id="undefined"><rect x="60" y="446" width="360" height="92" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="240" y="500.61333322">유리한 사용 조건</tspan></text></g><g id="undefined"><rect x="420" y="446" width="720" height="92" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="780" y="486.42666674">유효한 질문과 결과가 자주 대기</tspan><tspan x="780" y="514.7999997">정정 뒤에도 준비 내용이 유지</tspan></text></g><g id="undefined"><rect x="1140" y="446" width="720" height="92" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="1500" y="486.42666674">전달 전 철회와 대체가 잦음</tspan><tspan x="1500" y="514.7999997">선행 준비할 시간 여유가 적음</tspan></text></g><g id="undefined"><rect x="60" y="538" width="360" height="96" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="240" y="594.61333322">조건부 판단</tspan></text></g><g id="undefined"><rect x="420" y="538" width="720" height="96" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="780" y="580.42666674">A 권고: QA01 UI, QA02 동점 다음 QA03</tspan><tspan x="780" y="608.7999997">QA07을 임의 우선순위에 넣지 않음</tspan></text></g><g id="undefined"><rect x="1140" y="538" width="720" height="96" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="1500" y="580.42666674">B 보존: 비용 제약 또는 준비 적중 저하</tspan><tspan x="1500" y="608.7999997">무과금 모델이면 QA05 차이 재검토</tspan></text></g><polyline id="" points="420,214 1140,214 1140,634 420,634 420,214" fill="none" stroke="#4676CB" stroke-width="4"  /><g id="undefined"><rect x="60" y="673" width="1800" height="45" rx="0" fill="#C9E1B3" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="27" font-weight="700" text-anchor="middle"><tspan x="960" y="704.68">보완 후보 A1: 다음 응답 하나만 준비 / 미적용, 미평가</tspan></text></g><g id="limit"><rect x="60" y="750" width="900" height="175" rx="0" fill="#FFF6DD" stroke="#4676CB" stroke-width="1.7" /><path d="M60 788H960" stroke="#4676CB"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="26.666667" font-weight="700" text-anchor="middle"><tspan x="510" y="777.06666678">Speech Preparation Coordinator</tspan></text></g><g id="admission"><rect x="90" y="810" width="380" height="65" rx="7" fill="#FFFFFF" stroke="#4676CB" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="280" y="851.11333322">Next Response Admission</tspan></text></g><g id="jobs"><rect x="570" y="810" width="350" height="65" rx="7" fill="#FFFFFF" stroke="#4676CB" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="middle"><tspan x="745" y="851.11333322">Preparation Jobs</tspan></text></g><polyline id="onejob" points="470,842 570,842" fill="none" stroke="#4676CB" stroke-width="1.8"  marker-end="url(#arrow)"/><text fill="#C00000" font-family="Calibri,Arial,sans-serif" font-size="38.666667" font-weight="700" text-anchor="middle"><tspan x="1107.5" y="259.14666678000003">✓</tspan></text><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="400" text-anchor="start"><tspan x="1015" y="824.42666674">버려질 준비를 줄이는 대신, 순서가 바뀌면 준비되지 않은 항목을 기다린다.</tspan><tspan x="1015" y="852.7999997">기본 A의 값에 A1의 효과를 섞지 않는다. 같은 80개 입력으로 별도 평가한다.</tspan></text><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="22.666667" font-weight="400" text-anchor="start"><tspan x="65" y="980.70666678">반대 사례: S01/S06 동점 / S03/S04 폐기 / S05 유효분 재사용과 후반 재개 / S08 준비 여유 50ms</tspan></text><text fill="#50555B" font-family="Calibri,Arial,sans-serif" font-size="21.333333" font-weight="400" text-anchor="middle"><tspan x="1605" y="1030.25333322">가정 기반 합성 수치 / 실측 아님</tspan></text><rect x="470" y="810" width="100" height="30" fill="white"/><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="21.333333" font-weight="400" text-anchor="middle"><tspan x="520" y="832.2533332200001">최대 1개</tspan></text><text fill="#50555B" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="1845" y="1067.78">30 / 36</tspan></text></svg>
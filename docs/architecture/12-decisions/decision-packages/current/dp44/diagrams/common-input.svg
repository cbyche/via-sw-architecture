</text>
<polygon points="1038,440 1372,440 1390,482.5 1372,525 1038,525 1020,482.5" fill="#f9fafc" stroke="#253044" stroke-width="2"/>
<text x="1205.0" y="476.5" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="19" text-anchor="middle">
<tspan x="1205.0" dy="0">Request Interpretation Service</tspan>
<tspan x="1205.0" dy="24">(DP2)</tspan>
</text>
<text x="35" y="40" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="28" text-anchor="start">
<tspan x="35" dy="0">DP44 공통 입력 경로 | 발화 감지와 S2S 입력은 재생 중에도 계속</tspan>
</text>
<text x="35" y="74" fill="#5b6576" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="17" text-anchor="start">
<tspan x="35" dy="0">입력 생산, 발화 종료 판단은 A/B 동일. 중단의 빠른 경로는 모델 응답, DP2 완료를 기다리지 않음.</tspan>
</text>
<text x="35" y="760" fill="#5b6576" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="18" text-anchor="start">
<tspan x="35" dy="0">외부 detector를 쓰는 경우도 감지 경로를 양안 동일하게 비교. 원문, 전사, 불확실성은 입력 계약에 따라 보존.</tspan>
</text>
<text x="280" y="170" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="280" dy="0">음성</tspan>
</text>
<text x="690" y="155" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="690" dy="0">append / commit</tspan>
</text>
<text x="1110" y="155" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="1110" dy="0">입력 세션</tspan>
</text>
<text x="1110" y="240" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="1110" dy="0">입력 결과</tspan>
</text>
<text x="690" y="240" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="690" dy="0">전사, 입력 판본</tspan>
</text>
<text x="260" y="315" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="260" dy="0">3 로컬 발화 시작 감지</tspan>
</text>
<text x="135" y="595" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="135" dy="0">4 halt</tspan>
</text>
<text x="310" y="570" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="310" dy="0">정지 위치</tspan>
</text>
<text x="385" y="662" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="385" dy="0">5 출력 기록</tspan>
</text>
<text x="925" y="558" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="925" dy="0">5 제시 근거 snapshot</tspan>
</text>
<text x="925" y="367" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="925" dy="0">6 발화 종료 + 입력 확정</tspan>
</text>
<text x="185" y="257" fill="#253044" font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif" font-size="15" text-anchor="middle">
<tspan x="185" dy="0">재생 참조 신호 → 에코 제거</tspan>
</text>

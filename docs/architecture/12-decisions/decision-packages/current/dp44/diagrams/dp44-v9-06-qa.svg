ont-size="24" font-weight="400" text-anchor="middle"><tspan x="1032.5" y="303.16">0.923초</tspan></text></g><g id="undefined"><rect x="1170" y="263" width="690" height="64" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1515" y="303.16">동점. UI는 음성과 독립</tspan></text></g><g id="undefined"><rect x="60" y="327" width="560" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="340" y="369.66">QA02 지칭 대상 집합 정확도</tspan></text></g><g id="undefined"><rect x="620" y="327" width="275" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="757.5" y="369.66">120/120</tspan></text></g><g id="undefined"><rect x="895" y="327" width="275" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1032.5" y="369.66">120/120</tspan></text></g><g id="undefined"><rect x="1170" y="327" width="690" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1515" y="369.66">고정 정답 조건. 모델 정확도 증거 아님</tspan></text></g><g id="undefined"><rect x="60" y="396" width="560" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="340" y="438.66">QA03 VIA 처리시간</tspan></text></g><g id="undefined"><rect x="620" y="396" width="275" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="757.5" y="438.66">1.965초</tspan></text></g><g id="undefined"><rect x="895" y="396" width="275" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1032.5" y="438.66">2.710초</tspan></text></g><g id="undefined"><rect x="1170" y="396" width="690" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1515" y="438.66">A 0.745초 감소. 원래 목표 90개의 인과 경로</tspan></text></g><g id="undefined"><rect x="60" y="465" width="560" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="340" y="507.66">QA04 예상 변경 모듈 수</tspan></text></g><g id="undefined"><rect x="620" y="465" width="275" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="757.5" y="507.66">2.333개</tspan></text></g><g id="undefined"><rect x="895" y="465" width="275" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1032.5" y="507.66">2.000개</tspan></text></g><g id="undefined"><rect x="1170" y="465" width="690" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1515" y="507.66">B 유리 가정. 실제 Rust diff 아님</tspan></text></g><g id="undefined"><rect x="60" y="534" width="560" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="340" y="576.66">QA05 전체 VIA 모델 비용</tspan></text></g><g id="undefined"><rect x="620" y="534" width="275" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="757.5" y="576.66">$2.479873</tspan></text></g><g id="undefined"><rect x="895" y="534" width="275" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1032.5" y="576.66">$2.224660</tspan></text></g><g id="undefined"><rect x="1170" y="534" width="690" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1515" y="576.66">B $0.255213 절감. A가 11.47% 높음</tspan></text></g><g id="undefined"><rect x="60" y="603" width="560" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="340" y="645.66">QA06 최대 동시 로컬 RAM</tspan></text></g><g id="undefined"><rect x="620" y="603" width="275" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="757.5" y="645.66">561.659 MB</tspan></text></g><g id="undefined"><rect x="895" y="603" width="275" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1032.5" y="645.66">561.507 MB</tspan></text></g><g id="undefined"><rect x="1170" y="603" width="690" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1515" y="645.66">0.152 MB 차이. 큰 선택 근거 아님</tspan></text></g><g id="undefined"><rect x="60" y="672" width="560" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="340" y="714.66">QA07 요청 의미 해석 정확도</tspan></text></g><g id="undefined"><rect x="620" y="672" width="275" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="757.5" y="714.66">80/80</tspan></text></g><g id="undefined"><rect x="895" y="672" width="275" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1032.5" y="714.66">80/80</tspan></text></g><g id="undefined"><rect x="1170" y="672" width="690" height="69" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1515" y="714.66">고정 정답 조건. 별도 우선순위 미합의</tspan></text></g><g id="undefined"><rect x="60" y="741" width="560" height="74" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="340" y="786.16">첫 실제 음성 / 별도 종료점</tspan></text></g><g id="undefined"><rect x="620" y="741" width="275" height="74" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="757.5" y="786.16">1.069초</tspan></text></g><g id="undefined"><rect x="895" y="741" width="275" height="74" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1032.5" y="786.16">1.276초</tspan></text></g><g id="undefined"><rect x="1170" y="741" width="690" height="74" rx="0" fill="#FFFFFF" stroke="#B7B9B9" stroke-width="1.7" /><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="24" font-weight="400" text-anchor="middle"><tspan x="1515" y="786.16">A 0.207초 감소. QA01 화면값 대체 안 함</tspan></text></g><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="25.333333" font-weight="700" text-anchor="start"><tspan x="65" y="904.61333322">A의 폐기 준비 비용 $0.263333 − B의 추가 재개 문맥 비용 $0.008120 = 순차이 $0.255213</tspan></text><text fill="#111111" font-family="Calibri,Arial,sans-serif" font-size="22.666667" font-weight="400" text-anchor="start"><tspan x="65" y="959.01333326">QA03은 외부 업무, 사용자 대기와 순수 재생 duration을 제외한 인과 계산이다. 실제 경과시간 단축과 다르다.</tspan><tspan x="65" y="984.4000003">8유형 × 10작성변형은 독립 실험이나 실사용 빈도 분포가 아니다. 수신 Agent 내부 비용과 원격 RAM은 제외한다.</tspan></text><text fill="#50555B" font-family="Calibri,Arial,sans-serif" font-size="21.333333" font-weight="400" text-anchor="middle"><tspan x="1605" y="1030.25333322">가정 기반 합성 수치 / 실측 아님</tspan></text><text fill="#50555B" font-family="Calibri,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="middle"><tspan x="1845" y="1067.78">29 / 36</tspan></text></svg>
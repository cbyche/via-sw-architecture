<text x="55" y="89" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">문제 2 / 기본 B: 공통 대화를 유지하고 긴 판단을 요청별 실행으로 나눈다</text>
<text x="55" y="139" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="400" fill="#516275">A와 같은 원본 / 실제 전달 / 호출 상한 K. 짧은 답은 바로 반환하며 R1과 R2는 자원 여유가 있을 때만 함께 진행한다.</text>
<text x="55" y="192" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="22" font-weight="400" fill="#176EAD">기본 구조의 선택   |   파랑: 처리 경로   |   주황: 유지 상태   |   하단: 선택 후 보완 기법</text>
<text x="55" y="1666" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="21" font-weight="400" fill="#516275">설계 분석 그림. 성능 수치와 측정 결과가 아니며 실패 및 복구 계약은 연결된 본문에 수록.</text>
<text x="55" y="1495" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#A45A18">선택 후 보완: 아래 기법은 기본 B의 정상 경로에 포함하지 않는다. B2는 B1을 자동 포함하지 않는다.</text>

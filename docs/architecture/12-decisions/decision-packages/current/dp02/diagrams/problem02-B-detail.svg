<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
<title>problem02-B-detail</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516275"/></marker></defs>
<rect width="2200" height="1700" fill="white"/>
<rect x="55" y="235" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="73" y="276" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">1a 사용자 입력: Interaction Manager</text>
<text x="73" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">수신 / VAD에서 로컬 음성 즉시 중단 [코드]</text>
<text x="73" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원문 / 전사 revision / 화면 근거 참조</text>
<text x="73" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">새 질문, 정정, 실제 표시한 질문의 답변</text>
<rect x="775" y="235" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="793" y="276" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">1b 외부 Agent 통지: Task Manager</text>
<text x="793" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">진행 / 질문 / 승인 필요 / 결과 / 실패</text>
<text x="793" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">접수 ID와 외부에서 확인된 사실 보존</text>
<text x="793" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">취소 요청과 확인된 종료는 별도 사실</text>
<rect x="1495" y="235" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1513" y="276" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">1c 실제 전달 receipt: 표시 / 재생 결과</text>
<text x="1513" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Interaction Manager: UI 표시 / 실제 재생</text>
<text x="1513" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Response Manager: 전달 범위 / Q1 기록</text>
<text x="1513" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">생성 문장과 실제 전달 / 미전달을 구별</text>
<rect x="775" y="450" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="793" y="491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">2 입력 등록 / hold: Request Controller [코드]</text>
<text x="793" y="526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 / revision 보존, 관련 미전송 효과 hold</text>
<text x="793" y="561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">명시 ID 제어 / 단순 상태는 코드로 6에 전달</text>
<text x="793" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">관계가 모호한 입력은 의미 판단에 전달</text>
<rect x="55" y="450" width="650" height="165" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="73" y="491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">원본 상태: 각 owner의 내구 원장</text>
<text x="73" y="526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller: 입력 / 목표 / revision</text>
<text x="73" y="561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Task Manager: Task / execution / 외부 사실</text>
<text x="73" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Response Manager: 실제 전달 / 질문 receipt</text>
<rect x="1495" y="450" width="650" height="190" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1513" y="491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">cloud 모델 호출 경계: 공통 상한 K</text>
<text x="1513" y="526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">모든 [모델] 단계는 같은 예산에서 admission</text>
<text x="1513" y="561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">시작한 호출은 실제 종료까지 slot 점유</text>
<text x="1513" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">외부 Agent 업무 대기는 VIA slot 미점유</text>
<text x="1513" y="631" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">API 송신 시각은 provider 계산 시작 아님</text>
<rect x="55" y="665" width="650" height="165" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="73" y="706" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">공통 최근 문맥: Request Interpreter</text>
<text x="73" y="741" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">최근 실제 전달, 활성 요청 / 질문, 원문 참조</text>
<text x="73" y="776" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">문제 1의 유효한 공통 view도 그대로 사용 가능</text>
<text x="73" y="811" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">대화 수명 유지. 원본은 각 owner 원장에 보존</text>
<rect x="775" y="665" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="793" y="706" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">3 공통 대화 해석: Request Interpreter</text>
<text x="793" y="741" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">관계 / 내용의 자유 의미가 필요할 때 [모델]</text>
<text x="793" y="776" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">짧은 답은 같은 판단에서 생성해 4a로 반환</text>
<text x="793" y="811" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">긴 판단만 목표 / revision / 근거 참조로 분리</text>
<rect x="1495" y="690" width="650" height="140" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1513" y="731" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">4a 짧은 답 / 확인 질문 → 6으로 바로</text>
<text x="1513" y="766" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">별도 요청 worker 호출을 강제하지 않음</text>
<text x="1513" y="801" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">모호하면 질문을 실제 표시하고 답변은 1a로</text>
<rect x="55" y="885" width="650" height="235" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="73" y="926" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">4b R1 실행: Request Interpreter</text>
<text x="73" y="961" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">D1 목적에 필요한 근거를 골라 원본 조회</text>
<text x="73" y="996" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">자유 의미 판단 필요 시 [모델], 매 호출 admission</text>
<text x="73" y="1031" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">상태: R1 revision / 근거 / 잠정 결과 / 대기</text>
<text x="73" y="1066" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">수명: R1의 수정 / 재개 / 완료까지</text>
<text x="73" y="1101" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">유효한 공통 근거도 사용하며 원본 참조 보존</text>
<rect x="775" y="885" width="650" height="235" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="793" y="926" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">4c R2 실행: Request Interpreter</text>
<text x="793" y="961" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">D2 목적에 필요한 근거를 골라 원본 조회</text>
<text x="793" y="996" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">자유 의미 판단 필요 시 [모델], 매 호출 admission</text>
<text x="793" y="1031" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">상태: R2 revision / 근거 / 잠정 결과 / 대기</text>
<text x="793" y="1066" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">수명: R2의 수정 / 재개 / 완료까지</text>
<text x="793" y="1101" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">전체 대화 복제나 선별 정답을 가정하지 않음</text>
<rect x="1495" y="885" width="650" height="235" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1513" y="926" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">5 정정 / 확인 답변 / Agent 질문 연결</text>
<text x="1513" y="961" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">관계는 3에서 판단하고 해당 Request에 전달</text>
<text x="1513" y="996" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">정정: 해당 R1 또는 R2의 revision / 목표 갱신</text>
<text x="1513" y="1031" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">미전송 효과 hold, 모호하면 4a에서 확인</text>
<text x="1513" y="1066" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Q1 답변: 실제 질문 receipt를 보고 연결</text>
<text x="1513" y="1101" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">대응 / 변경 / 완료 ID: Request Controller 소유</text>
<rect x="55" y="1170" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="73" y="1211" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">실패 / 포화: 실행 상태와 목표 보존</text>
<text x="73" y="1246" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실패 run 재개, 무관한 다른 목표는 유지</text>
<text x="73" y="1281" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">취소 요청 ≠ 실제 종료: 종료까지 slot 점유</text>
<text x="73" y="1316" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">외부 수행 불명은 재시작하지 않고 상태 확인</text>
<rect x="775" y="1170" width="650" height="190" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="793" y="1211" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">6 각 반환 확인 / 채택: Request Controller</text>
<text x="793" y="1246" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실행 ID / revision / 관계 / 권한을 재확인</text>
<text x="793" y="1281" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">재결합 필요 시 Request Interpreter [모델]</text>
<text x="793" y="1316" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필요한 결과만 최신 대화와 결합해 채택</text>
<text x="793" y="1351" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">늦은 결과 보관, 현재 답으로는 채택하지 않음</text>
<rect x="1495" y="1170" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1513" y="1211" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">7 Response Manager: 응답 준비 / 게시 원장</text>
<text x="1513" y="1246" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Interaction Manager: 실제 UI 표시 / 음성 재생</text>
<text x="1513" y="1281" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">표시 / 재생 receipt로 실제 전달 범위 기록</text>
<text x="1513" y="1316" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">이 기록이 다음 입력 관계 판단의 근거가 됨</text>
<rect x="55" y="1380" width="2090" height="80" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="73" y="1421" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">8 공통 대화는 다음 입력을 받고 각 실행은 남은 목표를 계속한다. 모든 run의 완료를 한꺼번에 기다리지 않는다.</text>
<text x="73" y="1456" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원본 취득 정책은 A와 같고 실행별 문맥만 선별한다. 완료 상태 보존 후 실행 문맥을 해제하며 내구 원장 수명은 별도다.</text>
<rect x="55" y="1510" width="1010" height="100" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="73" y="1551" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">B1 불변 문맥 참조 공유: 같은 근거 buffer의 로컬 중복 감소</text>
<text x="73" y="1586" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">version / 권한 철회 / 해제 관리 추가. cloud 토큰 절감과 구별</text>
<rect x="1135" y="1510" width="1010" height="100" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1153" y="1551" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">B2 foreground 호출 여유 예약: 같은 총 K 안에서 새 입력 보호</text>
<text x="1153" y="1586" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원래 요청의 시작 / 완료 지연 비용. K를 늘려 얻은 이익이 아님</text>
<polyline points="380,400 380,425 930,425 930,450" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>

<polyline points="1100,795 1100,880" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="380,830 380,880" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="705,960 775,960" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>

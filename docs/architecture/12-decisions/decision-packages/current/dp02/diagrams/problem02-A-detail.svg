<polyline points="1425,565 1460,565 1460,1180 1425,1180" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="775,1180 705,1180" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="55,1180 25,1180 25,530 55,530" fill="none" stroke="#516275" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<polyline points="1100,1265 1100,1330" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1820,1265 1820,1330" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<text x="55" y="89" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="42" font-weight="700" fill="#182B40">문제 2 / 기본 A: 하나의 대화 해석 실행에서 다음 판단으로 이어 간다</text>
<text x="55" y="139" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="27" font-weight="400" fill="#516275">D1 판단 중 새 질문, D2 요청, “비용만” 정정과 Agent의 Q1이 들어온다. 앞선 요청 전체 완료를 기다리지 않는다.</text>
<text x="55" y="192" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="22" font-weight="400" fill="#176EAD">기본 구조의 선택   |   파랑: 처리 경로   |   주황: 유지 상태   |   하단: 선택 후 보완 기법</text>
<text x="55" y="1666" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="21" font-weight="400" fill="#516275">설계 분석 그림. 성능 수치와 측정 결과가 아니며 실패 및 복구 계약은 연결된 본문에 수록.</text>
<text x="55" y="1475" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#A45A18">선택 후 보완: 아래 기법은 기본 A의 정상 경로에 포함하지 않는다. A2는 A1을 자동 포함하지 않는다.</text>
</svg>

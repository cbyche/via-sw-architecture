<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
<title>problem02-A-detail</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#516275"/></marker></defs>
<rect width="2200" height="1700" fill="white"/>
<rect x="55" y="235" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="73" y="276" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">1a 사용자 입력: Interaction Manager</text>
<text x="73" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">수신 / VAD에서 로컬 음성 즉시 중단 [코드]</text>
<text x="73" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원문 / 전사 revision / 화면 근거 참조</text>
<text x="73" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">새 질문, 정정, 실제 표시한 질문의 답변</text>
<rect x="775" y="235" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="793" y="276" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">1b 외부 Agent 통지: Task Manager</text>
<text x="793" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">진행 / 질문 / 승인 필요 / 결과 / 실패</text>
<text x="793" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">접수 ID와 외부에서 확인된 사실 보존</text>
<text x="793" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">취소 요청과 확인된 종료는 별도 사실</text>
<rect x="1495" y="235" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1513" y="276" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">1c 실제 전달 receipt: 표시 / 재생 결과</text>
<text x="1513" y="311" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Interaction Manager: UI 표시 / 실제 재생</text>
<text x="1513" y="346" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Response Manager: 전달 범위 / Q1 기록</text>
<text x="1513" y="381" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">생성 문장과 실제 전달 / 미전달을 구별</text>
<rect x="775" y="450" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="793" y="491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">2 입력 등록 / hold: Request Controller [코드]</text>
<text x="793" y="526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 / revision 보존, 관련 미전송 효과 hold</text>
<text x="793" y="561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">명시 ID 제어 / 단순 상태는 코드로 6에 전달</text>
<text x="793" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">관계가 모호한 입력은 의미 판단에 전달</text>
<rect x="55" y="450" width="650" height="165" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="73" y="491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">원본 상태: 각 owner의 내구 원장</text>
<text x="73" y="526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Request Controller: 입력 / 목표 / revision</text>
<text x="73" y="561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Task Manager: Task / execution / 외부 사실</text>
<text x="73" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Response Manager: 실제 전달 / 질문 receipt</text>
<rect x="1495" y="450" width="650" height="190" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1513" y="491" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">cloud 모델 호출 경계: 공통 상한 K</text>
<text x="1513" y="526" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">모든 [모델] 단계는 같은 예산에서 admission</text>
<text x="1513" y="561" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">시작한 호출은 실제 종료까지 slot 점유</text>
<text x="1513" y="596" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">외부 Agent 업무 대기는 VIA slot 미점유</text>
<text x="1513" y="631" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">API 송신 시각은 provider 계산 시작 아님</text>
<rect x="55" y="665" width="650" height="165" rx="10" fill="#FFF4E7" stroke="#A45A18" stroke-width="2"/>
<text x="73" y="706" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">대화 해석 문맥: Request Interpreter</text>
<text x="73" y="741" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">대화 수명 동안 읽은 근거와 잠정 판단 유지</text>
<text x="73" y="776" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">R1 / R2의 미해결 목표와 사용 근거를 구별</text>
<text x="73" y="811" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">모델 문맥은 왼쪽 위 내구 원장의 대체물 아님</text>
<rect x="775" y="665" width="650" height="130" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="793" y="706" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">3 다음 판단 경계에서 입력 반영 [코드]</text>
<text x="793" y="741" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">현재 VIA 호출 / 읽기 step의 종료를 기다림</text>
<text x="793" y="776" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">원래 목표 전체 완료나 외부 업무 종료는 안 기다림</text>
<rect x="1495" y="690" width="650" height="140" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1513" y="731" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">진행 중인 step: Request Interpreter</text>
<text x="1513" y="766" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">필요한 원본 조회 [코드 / I/O]</text>
<text x="1513" y="801" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">자유 의미 판단이 필요할 때만 [모델]</text>
<rect x="55" y="880" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="73" y="921" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">필요 근거 공급: 문제 1의 같은 정책</text>
<text x="73" y="956" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">새 입력 + 최근 실제 전달 + 활성 목표</text>
<text x="73" y="991" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">유지 문맥의 유효 근거를 계속 사용</text>
<text x="73" y="1026" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">부족한 범위는 허용 원본을 bounded read</text>
<rect x="775" y="880" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="793" y="921" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">4 관계와 내용 판단: Request Interpreter</text>
<text x="793" y="956" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">모호한 의미 / 대상 / 목표 연결이면 [모델]</text>
<text x="793" y="991" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">독립 질문, 정정, Q1 답변의 관계를 제안</text>
<text x="793" y="1026" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">새 입력 전에 읽은 유효 문맥도 함께 사용</text>
<rect x="1495" y="880" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1513" y="921" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">5 관계에 따른 다음 처리</text>
<text x="1513" y="956" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">독립 질문: 원래 목표를 남기고 새 답 준비</text>
<text x="1513" y="991" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">정정: 해당 요청의 변경 / 보존 범위 반영</text>
<text x="1513" y="1026" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Q1 답변: 실제 제시한 질문과 연결</text>
<rect x="55" y="1100" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="73" y="1141" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">7 Response Manager: 응답 준비 / 게시 원장</text>
<text x="73" y="1176" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">Interaction Manager: 실제 UI 표시 / 음성 재생</text>
<text x="73" y="1211" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">표시 / 재생 receipt로 실제 전달 범위 기록</text>
<text x="73" y="1246" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실제 표시한 질문의 답변은 새 입력 1a로</text>
<rect x="775" y="1100" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="793" y="1141" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">6 현재성 확인 / 채택: Request Controller</text>
<text x="793" y="1176" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">입력 / source revision, 관계, 권한 재확인</text>
<text x="793" y="1211" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">미해결 효과는 hold, 재판단이 필요하면 4로</text>
<text x="793" y="1246" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">늦은 결과는 보관해도 최신 답으로 채택 안 함</text>
<rect x="1495" y="1100" width="650" height="165" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1513" y="1141" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">실패 / 늦은 완료: 같은 실행에서 복구</text>
<text x="1513" y="1176" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">실패 step과 유효 목표를 보존해 다시 진행</text>
<text x="1513" y="1211" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">취소 요청과 실제 종료를 구별해 slot 추적</text>
<text x="1513" y="1246" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">외부 수행 불명이면 새 Action으로 재시작 금지</text>
<rect x="55" y="1330" width="2090" height="100" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="73" y="1371" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">8 남은 유효 목표 / 입력을 같은 실행에서 계속 처리 → 다음 판단 경계 3</text>
<text x="73" y="1406" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">외부 Agent 결과나 사용자 답변을 기다릴 때는 VIA 호출 자원을 놓는다. 내구 원본과 실제 전달 기록은 해석 문맥보다 오래 보존한다.</text>
<rect x="55" y="1495" width="1010" height="115" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="73" y="1536" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">A1 제한된 별도 질문: 도구 없는 side 답변 경로</text>
<text x="73" y="1571" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">짧은 질문의 대기를 줄이되 실제 전달 이력은 보존</text>
<text x="73" y="1606" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">추가 근거 필요 / 분류 오류이면 본 실행 복귀와 중복 비용</text>
<rect x="1135" y="1495" width="1010" height="115" rx="10" fill="#E9F4FB" stroke="#176EAD" stroke-width="2"/>
<text x="1153" y="1536" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="700" fill="#182B40">A2 현재 호출 중단 / 재개: 최신 정정으로 다시 판단</text>
<text x="1153" y="1571" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">취소 요청 뒤 실제 종료까지 slot 유지, 폐기 / 재입력 비용</text>
<text x="1153" y="1606" font-family="Apple SD Gothic Neo,Arial,sans-serif" font-size="25" font-weight="400" fill="#182B40">독립 질문 때문에 중단했다면 원래 목표의 재개 비용도 기록</text>
<polyline points="380,400 380,425 930,425 930,450" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>
<polyline points="1100,400 1100,450" fill="none" stroke="#516275" stroke-width="3"  marker-end="url(#arrow)"/>

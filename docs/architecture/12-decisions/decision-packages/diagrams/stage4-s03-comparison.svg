<g id="1-index"><rect x="1352" y="920" width="380" height="80" rx="8" fill="#F3F7FD" stroke="#1458C0" stroke-width="2.5"/><ellipse cx="1542.0" cy="936" rx="190.0" ry="16" fill="#F3F7FD" stroke="#1458C0" stroke-width="2"/><text x="1368" y="966" font-size="20" font-weight="700" fill="#1458C0">Vector Index + Source Manifest</text></g>
<g id="1-retrieve"><rect x="2072" y="570" width="400" height="70" rx="8" fill="#F3F7FD" stroke="#1458C0" stroke-width="2.5"/><text x="2088" y="598" font-size="20" font-weight="700" fill="#1458C0">Semantic Retrieval Service</text></g>
<text x="698" y="520" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">① 허용 scope와 이름, 기간, Task 단서 전달</text>
<text x="413" y="575" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">② 기존 index와 cache에서 후보 조회</text>
<text x="498" y="430" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">③ 후보 원문과 revision 읽기</text>
<text x="823" y="900" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">④ 원문, coverage와 receipt 반환</text>
<text x="1377" y="420" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">① source 변경과 삭제 수집</text>
<text x="1377" y="625" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">② 문서 embedding 생성</text>
<text x="1377" y="870" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">③ 완성 generation을 원자 게시</text>
<text x="2077" y="500" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">④ 같은 허용 scope로 검색 요청</text>
<text x="1742" y="825" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">⑤ 의미, lexical 후보 조회</text>
<text x="2012" y="800" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">⑥ 후보와 source revision 반환</text>
<text x="2087" y="900" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">⑦ 후보, coverage와 manifest 반환</text>
<text x="1682" y="225" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">⑧ 현재 원문과 권한 요청</text>
<text x="2002" y="980" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">⑨ 원문, revision과 권한 반환</text>
<text x="48" y="58" font-size="38" font-weight="700" fill="#171717">S-03  |  숨은 자료의 후보를 어떻게 찾는가</text>
<text x="48" y="104" font-size="22" font-weight="400" fill="#171717">공통 Request Controller와 Context Manager는 같은 위치 / T는 요청별 조회 / A는 사전 색인 생산과 검색 서비스</text>
<text x="48" y="1414" font-size="18" font-weight="400" fill="#171717">VIA / Stage 4 / 구조 탐색, 미채택 대안 / 구현 및 측정 결과 아님</text>
<text x="72" y="215" font-size="28" font-weight="700" fill="#171717">T  실제 reviewed target</text>
<text x="1336" y="215" font-size="28" font-weight="700" fill="#171717">A  대안 구조</text>
<text x="48" y="1345" font-size="21" font-weight="400" fill="#171717">박스: Component, 서브시스템, 논리 실행체 또는 저장소 이름 / 번호 화살표: 동작과 순서 / 검정: 공통 / 파랑: 달라지는 구조</text>
<text x="498" y="1165" font-size="19" font-weight="400" fill="#171717">⑤ Context Manager가 현재 권한과 identity를 확인해 Context를 조립한다.</text>
<text x="498" y="1194" font-size="19" font-weight="400" fill="#171717">별도 embedding helper, 색인 worker와 vector 저장소는 없다.</text>
<text x="2022" y="1230" font-size="19" font-weight="400" fill="#1458C0">⑩ Context Manager가 검증된 원문으로 Context를 조립한다.</text>
<text x="2022" y="1259" font-size="19" font-weight="400" fill="#1458C0">후보 1위도 대상 확정이나 실행 권한은 아니다.</text>
</g></svg>

<title id="title">S-03  |  숨은 자료의 후보를 어떻게 찾는가</title><desc id="desc">공통 Request Controller와 Context Manager는 같은 위치 / T는 요청별 조회 / A는 사전 색인 생산과 검색 서비스</desc>

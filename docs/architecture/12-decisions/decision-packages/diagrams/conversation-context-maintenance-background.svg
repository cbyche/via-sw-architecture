<g id="e12"><rect x="1410" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="570" font-size="20" font-weight="700" fill="#171717">기억·권한</text><text x="1426" y="606" font-size="20" fill="#171717">Context Manager 삭제</text><text x="1426" y="631" font-size="20" fill="#171717">Policy Manager 철회</text></g>

<g id="e20"><rect x="330" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="346" y="732" font-size="20" font-weight="700" fill="#171717">요청별 조합</text><text x="346" y="768" font-size="20" fill="#171717">필요 범위 read + cache</text><text x="346" y="793" font-size="20" fill="#171717">원문·typed field 보존</text></g>
<g id="e21"><rect x="870" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="886" y="732" font-size="20" font-weight="700" fill="#171717">지속 view 갱신</text><text x="886" y="768" font-size="20" fill="#171717">변경 delta → projector</text><text x="886" y="793" font-size="20" fill="#171717">관심 없는 갱신 비용도 존재</text></g>
<g id="e22"><rect x="1410" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="732" font-size="20" font-weight="700" fill="#171717">lag 또는 누락</text><text x="1426" y="768" font-size="20" fill="#171717">dirty / revision gap</text><text x="1426" y="793" font-size="20" fill="#171717">read barrier 또는 rebuild</text></g>
<g id="e23"><rect x="1950" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="732" font-size="20" font-weight="700" fill="#171717">확정 전 검증</text><text x="1966" y="768" font-size="20" fill="#171717">read set 최신성 확인</text><text x="1966" y="793" font-size="20" fill="#171717">view는 운영 원본이 아님</text></g>
<g id="pressure0"><rect x="48" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="953" font-size="20" font-weight="700" fill="#171717">요청 시 구성</text><text x="64" y="989" font-size="20" fill="#171717">쓰는 범위만 읽고 조합한다.</text><text x="64" y="1014" font-size="20" fill="#171717">유효 cache·summary는 재사용한다.</text><text x="64" y="1039" font-size="20" fill="#171717">반복 조합 비용이 요청 경로에 남는다.</text></g>
<g id="pressure1"><rect x="884" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="900" y="953" font-size="20" font-weight="700" fill="#171717">지속 갱신 view</text><text x="900" y="989" font-size="20" fill="#171717">다음 요청 전에 준비할 수 있다.</text><text x="900" y="1014" font-size="20" fill="#171717">변경 전달·적용 위치·회수 책임이 생긴다.</text><text x="900" y="1039" font-size="20" fill="#171717">요청이 없어도 메모리·계산을 사용한다.</text></g>
<g id="pressure2"><rect x="1720" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1736" y="953" font-size="20" font-weight="700" fill="#171717">삭제·정정의 어려움</text><text x="1736" y="989" font-size="20" fill="#171717">epoch로 즉시 사용 차단해야 한다.</text><text x="1736" y="1014" font-size="20" fill="#171717">projector가 늦다고 사용을 허용할 수 없다.</text><text x="1736" y="1039" font-size="20" fill="#171717">늦은 summary·옛 checkpoint도 차단한다.</text></g>
<g id="challenge"><rect x="48" y="1170" width="2464" height="170" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="1198" font-size="20" font-weight="700" fill="#171717">Architecture Challenge</text><text x="64" y="1234" font-size="20" fill="#171717">여러 owner 기록을 요청 시 조합할 것인가, 활성 대화의 working view를 지속 갱신하고 revision barrier 뒤 소비할 것인가?</text></g>

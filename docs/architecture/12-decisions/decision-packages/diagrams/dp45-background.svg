</defs><g font-family="Apple SD Gothic Neo, Arial, sans-serif">
<rect id="n1" fill="white" stroke="none" stroke-width="1.7" x="0" y="0" width="1920" height="1080"/>
<text id="n2-0" data-width="1250" x="64" y="43.400000000000006" text-anchor="start" font-size="20" font-weight="700" fill="#087E8B">VIA SOFTWARE ARCHITECTURE / DP 배경</text>
<text id="n3-0" data-width="280" x="1856" y="43.400000000000006" text-anchor="end" font-size="20" font-weight="400" fill="#5F6B77">04-45</text>
<text id="n4-0" data-width="1780" x="64" y="107.32" text-anchor="start" font-size="46" font-weight="700" fill="#18232E">04-45. 기능 정확성을 위한 VIA 기억과 Context 제공 설계</text>
<polyline id="n5" points="64,127 1856,127" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<rect id="n6" fill="#FFF4A8" stroke="none" stroke-width="1.7" x="64" y="151" width="1792" height="52"/>
<text id="n7-0" data-width="1756" x="82" y="186.52" text-anchor="start" font-size="31" font-weight="700" fill="#18232E">여러 기록에 흩어진 과거 정정 내용과 실제 결과</text>
<text id="n8-0" data-width="1792" x="64" y="243.0" text-anchor="start" font-size="25" font-weight="400" fill="#5F6B77">지난번의 표현 방식을 다시 사용하기 위한 정정, 결과 버전과 전달 기록의 연결</text>
<polyline id="n9" points="1213,285 1213,852" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<text id="n10-0" data-width="596" x="1260" y="317.68" text-anchor="start" font-size="29" font-weight="700" fill="#18232E">설계 고려 사항</text>
<polyline id="n11" points="64,875 1856,875" fill="none" stroke="#2858A5" stroke-width="2"/>
<text id="n12-0" data-width="165" x="64" y="931.76" text-anchor="start" font-size="28" font-weight="700" fill="#B63732">설계 과제</text>
<text id="n13-0" data-width="1616" x="240" y="928.6" text-anchor="start" font-size="30" font-weight="700" fill="#18232E">정확한 과거 정보 제공을 위한 조회, 보관과 갱신 책임 설계</text>
<text id="n14-0" data-width="1616" x="240" y="971.08" text-anchor="start" font-size="24" font-weight="400" fill="#2858A5">이번 Request의 과거 정보 참조 / 장기 User Memory 등록은 별도 사용자 지시</text>
<text id="n15-0" data-width="1260" x="64" y="1036.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">품질 쟁점: 기능 정확성 / 반응성 / 자원 활용성</text>
<text id="n16-0" data-width="480" x="1856" y="1036.4" text-anchor="end" font-size="20" font-weight="400" fill="#5F6B77">구조 후보 / 미선정 / 미측정</text>
<text id="n17-0" data-width="1110" x="64" y="304.16" text-anchor="start" font-size="23" font-weight="700" fill="#5F6B77">지난번 / 보고서를 읽은 뒤의 정정 발화</text>
<rect id="n18" fill="#EAF0F8" stroke="none" stroke-width="1.7" x="64" y="324" width="1110" height="58"/>
<text id="n19-0" data-width="1070" x="84" y="362.68" text-anchor="start" font-size="29" font-weight="700" fill="#18232E">“결론을 먼저 쓰고, 문장은 짧게 바꿔줘.”</text>
<path id="n20" fill="#F6F7F9" stroke="#CDD6DE" stroke-width="1.7" d="M64 414H346L364 432V642H64Z M346 414V432H364"/>
<text id="n21-0" data-width="260" x="80" y="449.08" text-anchor="start" font-size="24" font-weight="700" fill="#5F6B77">지난 보고서 / 수정 전</text>
<text id="n22-0" data-width="260" x="84" y="495.24" text-anchor="start" font-size="22" font-weight="700" fill="#5F6B77">배경 설명</text>
<polyline id="n23" points="84,511 326,511" fill="none" stroke="#CDD6DE" stroke-width="4"/>
<polyline id="n24" points="84,529 326,529" fill="none" stroke="#CDD6DE" stroke-width="4"/>
<polyline id="n25" points="84,547 326,547" fill="none" stroke="#CDD6DE" stroke-width="4"/>
<text id="n26-0" data-width="260" x="84" y="600.24" text-anchor="start" font-size="22" font-weight="400" fill="#5F6B77">결론 / 마지막 단락</text>
<polyline id="n27" points="377,529 429,529" fill="none" stroke="#2858A5" stroke-width="2" marker-end="url(#a2858A5)"/>
<text id="n28-0" data-width="55" x="379" y="506.4" text-anchor="start" font-size="20" font-weight="700" fill="#2858A5">수정</text>
<path id="n29" fill="#F0F8F7" stroke="#CDD6DE" stroke-width="1.7" d="M442 414H746L764 432V642H442Z M746 414V432H764"/>
<text id="n30-0" data-width="282" x="458" y="449.08" text-anchor="start" font-size="24" font-weight="700" fill="#087E8B">같은 보고서 / 수정 후</text>
<text id="n31-0" data-width="280" x="462" y="497.08" text-anchor="start" font-size="24" font-weight="700" fill="#087E8B">결론 / 첫 단락</text>
<polyline id="n32" points="462,517 637,517" fill="none" stroke="#087E8B" stroke-width="4"/>
<polyline id="n33" points="462,544 612,544" fill="none" stroke="#087E8B" stroke-width="4"/>
<polyline id="n34" points="462,571 645,571" fill="none" stroke="#087E8B" stroke-width="4"/>
<text id="n35-0" data-width="280" x="462" y="622.32" text-anchor="start" font-size="21" font-weight="400" fill="#087E8B">짧은 문장으로 변경</text>
<polyline id="n36" points="777,529 814,529" fill="none" stroke="#2858A5" stroke-width="2" marker-end="url(#a2858A5)"/>
<text id="n37-0" data-width="55" x="778" y="506.4" text-anchor="start" font-size="20" font-weight="700" fill="#2858A5">전달</text>
<path id="n38" fill="#F3F6FA" stroke="#CDD6DE" stroke-width="1.7" d="M828 414H1156L1174 432V642H828Z M1156 414V432H1174"/>
<text id="n39-0" data-width="306" x="844" y="449.08" text-anchor="start" font-size="24" font-weight="700" fill="#2858A5">실제 전달 기록</text>
<text id="n40-0" data-width="304" x="848" y="497.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">수정 후 보고서의</text>
<text id="n40-1" data-width="304" x="848" y="532.0799999999999" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">사용자 전달 확인</text>
<text id="n41-0" data-width="304" x="848" y="595.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">어느 결과 버전을</text>
<text id="n41-1" data-width="304" x="848" y="624.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">실제로 받았는지 확인</text>
<text id="n42-0" data-width="1110" x="64" y="696.16" text-anchor="start" font-size="23" font-weight="700" fill="#5F6B77">이번 / 새 보고서의 Request</text>
<rect id="n43" fill="#EAF0F8" stroke="none" stroke-width="1.7" x="64" y="715" width="1110" height="79"/>
<text id="n44-0" data-width="1070" x="84" y="753.76" text-anchor="start" font-size="28" font-weight="700" fill="#18232E">“지난번에 내가 고친 표현 방식으로 이번 보고서도 정리해줘.”</text>
<text id="n45-0" data-width="1110" x="64" y="842.0" text-anchor="start" font-size="25" font-weight="700" fill="#2858A5">필요한 Context / 정정 내용 + 수정된 결과 + 실제 전달 기록</text>
<text id="n46-0" data-width="596" x="1260" y="388.76" text-anchor="start" font-size="28" font-weight="700" fill="#2858A5">과거 기록 사이의 연결</text>
<text id="n47-0" data-width="596" x="1260" y="433.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">정정 발화, 수정 전후 결과와</text>
<text id="n47-1" data-width="596" x="1260" y="468.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">실제 전달 버전의 연결</text>
<text id="n48-0" data-width="596" x="1260" y="551.76" text-anchor="start" font-size="28" font-weight="700" fill="#2858A5">재사용할 정보의 유효성</text>
<text id="n49-0" data-width="596" x="1260" y="596.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">요약의 조건 누락, 원본 수정과</text>
<text id="n49-1" data-width="596" x="1260" y="631.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">삭제에 따른 사용 가능 여부 확인</text>
<text id="n50-0" data-width="596" x="1260" y="714.76" text-anchor="start" font-size="28" font-weight="700" fill="#2858A5">반복 참조와 유지 비용</text>
<text id="n51-0" data-width="596" x="1260" y="759.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">필요한 과거 정보의 조회와</text>
<text id="n51-1" data-width="596" x="1260" y="794.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">보관, 갱신 비용의 균형</text>
</g></svg>

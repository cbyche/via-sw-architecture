<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title">
<title id="title">04-45. 기능 정확성을 위한 VIA 기억과 Context 제공 설계 — DP 배경</title>
<defs>
<marker id="a18232E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#18232E" stroke-width="1.6"/></marker>
<marker id="a2858A5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#2858A5" stroke-width="1.6"/></marker>
<marker id="aB63732" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B63732" stroke-width="1.6"/></marker>
<marker id="a087E8B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#087E8B" stroke-width="1.6"/></marker>
<marker id="a5F6B77" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5F6B77" stroke-width="1.6"/></marker>
</defs><g font-family="Apple SD Gothic Neo, Arial, sans-serif">
<rect id="n1" fill="white" stroke="none" stroke-width="1.7" x="0" y="0" width="1920" height="1080"/>
<text id="n2-0" data-width="1250" x="64" y="43.400000000000006" text-anchor="start" font-size="20" font-weight="700" fill="#087E8B">VIA SOFTWARE ARCHITECTURE / DP 배경</text>
<text id="n3-0" data-width="280" x="1856" y="43.400000000000006" text-anchor="end" font-size="20" font-weight="400" fill="#5F6B77">04-45</text>
<text id="n4-0" data-width="1780" x="64" y="101.80000000000001" text-anchor="start" font-size="40" font-weight="700" fill="#18232E">04-45. 기능 정확성을 위한 VIA 기억과 Context 제공 설계</text>
<polyline id="n5" points="64,127 1856,127" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<rect id="n6" fill="#FFF4A8" stroke="none" stroke-width="1.7" x="64" y="151" width="1792" height="64"/>
<text id="n7-0" data-width="1756" x="82" y="198.12" text-anchor="start" font-size="36" font-weight="700" fill="#18232E">과거 정정의 누락과 유효하지 않은 결과 재사용 위험</text>
<polyline id="n8" points="1213,282 1213,859" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<text id="n9-0" data-width="596" x="1260" y="306.92" text-anchor="start" font-size="26" font-weight="700" fill="#5F6B77">설계 고려 사항</text>
<polyline id="n10" points="64,888 1856,888" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<text id="n11-0" data-width="165" x="64" y="948.92" text-anchor="start" font-size="26" font-weight="700" fill="#B63732">설계 과제</text>
<text id="n12-0" data-width="1616" x="240" y="948.52" text-anchor="start" font-size="31" font-weight="700" fill="#18232E">과거 기록을 연결한 Context의 생산, 조회와 갱신 책임 설계</text>
<text id="n13-0" data-width="1616" x="240" y="993.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">과거 정보 참조 / 장기 User Memory 등록은 별도 사용자 지시</text>
<text id="n14-0" data-width="1260" x="64" y="1051.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">품질 관점: 기능 정확성 / 반응성 / 자원 활용성</text>
<text id="n15-0" data-width="480" x="1856" y="1051.56" text-anchor="end" font-size="18" font-weight="400" fill="#5F6B77">구조 후보 / 미선정 / 미측정</text>
<text id="n16-0" data-width="1110" x="64" y="286.0" text-anchor="start" font-size="25" font-weight="400" fill="#5F6B77">지난번 / 서로 연결해야 할 세 종류의 기록</text>
<path id="n17" fill="#F4F6F8" stroke="#CDD6DE" stroke-width="1.7" d="M64 329H396L414 347V616H64Z M396 329V347H414"/>
<path id="n18" fill="#F4F6F8" stroke="#CDD6DE" stroke-width="1.7" d="M444 329H776L794 347V616H444Z M776 329V347H794"/>
<path id="n19" fill="#F4F6F8" stroke="#CDD6DE" stroke-width="1.7" d="M824 329H1156L1174 347V616H824Z M1156 329V347H1174"/>
<text id="n20-0" data-width="310" x="84" y="370.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">정정 Request</text>
<text id="n21-0" data-width="310" x="84" y="434.68" text-anchor="start" font-size="29" font-weight="700" fill="#18232E">“결론 먼저,</text>
<text id="n21-1" data-width="310" x="84" y="471.68" text-anchor="start" font-size="29" font-weight="700" fill="#18232E">짧은 문장으로</text>
<text id="n21-2" data-width="310" x="84" y="508.68" text-anchor="start" font-size="29" font-weight="700" fill="#18232E">바꿔줘.”</text>
<text id="n22-0" data-width="310" x="84" y="591.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">사용자가 고친 내용</text>
<text id="n23-0" data-width="310" x="464" y="370.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">수정 전후 결과</text>
<text id="n24-0" data-width="310" x="464" y="420.48" text-anchor="start" font-size="19" font-weight="400" fill="#5F6B77">수정 전</text>
<text id="n25-0" data-width="310" x="464" y="458.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">배경 설명 … 결론</text>
<polyline id="n26" points="464,481 774,481" fill="none" stroke="#CDD6DE" stroke-width="1"/>
<text id="n27-0" data-width="310" x="464" y="523.48" text-anchor="start" font-size="19" font-weight="400" fill="#087E8B">수정 후</text>
<text id="n28-0" data-width="310" x="464" y="571.0" text-anchor="start" font-size="25" font-weight="700" fill="#087E8B">결론 먼저 / 짧은 문장</text>
<text id="n29-0" data-width="310" x="844" y="370.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">실제 전달 기록</text>
<text id="n30-0" data-width="310" x="844" y="436.84" text-anchor="start" font-size="27" font-weight="700" fill="#087E8B">수정 후 결과 전달</text>
<text id="n31-0" data-width="310" x="844" y="512.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">어느 결과 버전을</text>
<text id="n31-1" data-width="310" x="844" y="546.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">실제로 받았는지 확인</text>
<polyline id="n32" points="423,471 435,471" fill="none" stroke="#5F6B77" stroke-width="2" marker-end="url(#a5F6B77)"/>
<polyline id="n33" points="803,471 815,471" fill="none" stroke="#5F6B77" stroke-width="2" marker-end="url(#a5F6B77)"/>
<polyline id="n34" points="239,622 239,646 999,646 999,622" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<text id="n35-0" data-width="1110" x="64" y="685.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">이번 / 새 보고서의 Request</text>
<rect id="n36" fill="#EAF0F8" stroke="none" stroke-width="1.7" x="64" y="708" width="1110" height="81"/>
<text id="n37-0" data-width="1070" x="84" y="753.76" text-anchor="start" font-size="28" font-weight="700" fill="#18232E">“지난번에 내가 고친 표현 방식으로 이번 보고서도 정리해줘.”</text>
<rect id="n38" fill="#F0F8F7" stroke="none" stroke-width="1.7" x="64" y="811" width="1110" height="55"/>
<polyline id="n39" points="619,646 1192,646 1192,839 1174,839" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#a087E8B)"/>
<text id="n40-0" data-width="1070" x="84" y="847.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">이번 Request에 연결할 과거 Context / 정정 내용, 결과 버전과 실제 전달</text>
<text id="n41-0" data-width="596" x="1260" y="377.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">기록 간 관계의 복원</text>
<text id="n42-0" data-width="596" x="1260" y="418.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">정정 내용과 결과 버전 및 실제 전달의 연결</text>
<text id="n43-0" data-width="596" x="1260" y="537.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">재사용 정보의 유효성</text>
<text id="n44-0" data-width="596" x="1260" y="578.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">원본 수정과 삭제 및 요약 누락의 확인</text>
<text id="n45-0" data-width="596" x="1260" y="697.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">반복 조회와 유지 비용</text>
<text id="n46-0" data-width="596" x="1260" y="738.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">Context 생산과 조회 및 갱신 비용의 균형</text>
</g></svg>

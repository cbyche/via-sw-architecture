<polyline id="n36" points="999,622 999,645" fill="none" stroke="#087E8B" stroke-width="2" stroke-dasharray="7 6"/>
<polyline id="n37" points="239,645 1192,645 1192,841 1174,841" fill="none" stroke="#087E8B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a087E8B)"/>
<text id="n38-0" data-width="1110" x="64" y="683.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">이번 C23 / R23: 여러 활동을 참조하는 새 제안서 요청</text>
<rect id="n39" fill="#EAF0F8" stroke="none" stroke-width="1.7" x="64" y="702" width="1110" height="103"/>
<text id="n40-0" data-width="1070" x="84" y="740.92" text-anchor="start" font-size="26" font-weight="700" fill="#18232E">“지난번 네가 설명한 평가 기준에 맞춰, 앞서 조사한 제품 비교 결과와</text>
<text id="n40-1" data-width="1070" x="84" y="777.92" text-anchor="start" font-size="26" font-weight="700" fill="#18232E">받아둔 견적을 이번 제안서에 반영해줘.”</text>
<rect id="n41" fill="#F0F8F7" stroke="none" stroke-width="1.7" x="64" y="821" width="1110" height="46"/>
<text id="n42-0" data-width="1070" x="84" y="852.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">VIA: P20 전달 범위와 D21/D22 발췌 또는 참조를 이번 Context에 연결</text>
<text id="n43-0" data-width="596" x="1260" y="377.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">여러 활동의 근거 연결</text>
<text id="n44-0" data-width="596" x="1260" y="418.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">직접 설명과 두 업무 결과의 후보 및 버전 확인</text>
<text id="n45-0" data-width="596" x="1260" y="537.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">실제 전달과 자료 범위</text>
<text id="n46-0" data-width="596" x="1260" y="578.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">설명 원문과 실제 표시/재생 범위 구별</text>
<text id="n46-1" data-width="596" x="1260" y="611.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">결과 본문과 허용된 참조 구별</text>
<text id="n47-0" data-width="596" x="1260" y="697.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">제공 방식과 비용</text>
<text id="n48-0" data-width="596" x="1260" y="738.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">단순 실행 맥락이나 index/cache로 충분한지</text>
<text id="n48-1" data-width="596" x="1260" y="771.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">공통 파생 관계의 유지가 필요한지 검토</text>
</g></svg>

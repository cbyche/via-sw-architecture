<rect id="n1" fill="white" stroke="none" stroke-width="1.7" x="0" y="0" width="1920" height="1080"/>
<text id="n2-0" data-width="1250" x="64" y="43.400000000000006" text-anchor="start" font-size="20" font-weight="700" fill="#087E8B">VIA SOFTWARE ARCHITECTURE / DP 배경</text>
<text id="n3-0" data-width="280" x="1856" y="43.400000000000006" text-anchor="end" font-size="20" font-weight="400" fill="#5F6B77">04-45</text>
<text id="n4-0" data-width="1780" x="64" y="101.80000000000001" text-anchor="start" font-size="40" font-weight="700" fill="#18232E">04-45. 기능 정확성을 위한 VIA 기억과 Context 제공 설계</text>
<polyline id="n5" points="64,127 1856,127" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<rect id="n6" fill="#FFF4A8" stroke="none" stroke-width="1.7" x="64" y="151" width="1792" height="64"/>
<text id="n7-0" data-width="1756" x="82" y="198.12" text-anchor="start" font-size="36" font-weight="700" fill="#18232E">여러 활동의 과거 근거 누락과 실제 전달 내용의 오연결 위험</text>
<polyline id="n8" points="1213,282 1213,859" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<text id="n9-0" data-width="596" x="1260" y="306.92" text-anchor="start" font-size="26" font-weight="700" fill="#5F6B77">설계 고려 사항</text>
<polyline id="n10" points="64,888 1856,888" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<text id="n11-0" data-width="165" x="64" y="948.92" text-anchor="start" font-size="26" font-weight="700" fill="#B63732">설계 과제</text>
<text id="n12-0" data-width="1616" x="240" y="948.52" text-anchor="start" font-size="31" font-weight="700" fill="#18232E">과거 근거를 연결하는 Context의 생산, 조회와 갱신 책임 설계</text>
<text id="n13-0" data-width="1616" x="240" y="993.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">VIA는 허용 근거를 연결 / 업무 판단과 제안서 작성은 Downstream Agent</text>
<text id="n14-0" data-width="1260" x="64" y="1051.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">품질 관점: 기능 정확성 / 반응성 / 자원 활용성</text>
<text id="n15-0" data-width="480" x="1856" y="1051.56" text-anchor="end" font-size="18" font-weight="400" fill="#5F6B77">구조 후보 / 미선정 / 미측정</text>
<text id="n16-0" data-width="1110" x="64" y="285.08" text-anchor="start" font-size="24" font-weight="400" fill="#5F6B77">과거 활동의 시간 흐름 / VIA가 받은 기록과 허용된 참조</text>
<path id="n17" fill="#F4F6F8" stroke="#CDD6DE" stroke-width="1.7" d="M64 329H396L414 347V616H64Z M396 329V347H414"/>
<path id="n18" fill="#F4F6F8" stroke="#CDD6DE" stroke-width="1.7" d="M444 329H776L794 347V616H444Z M776 329V347H794"/>
<path id="n19" fill="#F4F6F8" stroke="#CDD6DE" stroke-width="1.7" d="M824 329H1156L1174 347V616H824Z M1156 329V347H1174"/>
<text id="n20-0" data-width="310" x="84" y="369.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">앞선 대화 C20</text>
<text id="n21-0" data-width="310" x="84" y="425.92" text-anchor="start" font-size="26" font-weight="700" fill="#18232E">VIA의 직접 설명 E20</text>
<text id="n21-1" data-width="310" x="84" y="462.92" text-anchor="start" font-size="26" font-weight="700" fill="#18232E">평가 기준</text>
<text id="n22-0" data-width="310" x="84" y="516.16" text-anchor="start" font-size="23" font-weight="700" fill="#087E8B">실제 전달 P20의</text>
<text id="n22-1" data-width="310" x="84" y="550.16" text-anchor="start" font-size="23" font-weight="700" fill="#087E8B">설명 내용과 범위</text>
<text id="n23-0" data-width="310" x="84" y="597.48" text-anchor="start" font-size="19" font-weight="400" fill="#5F6B77">생성과 실제 전달 구별</text>
<text id="n24-0" data-width="310" x="464" y="369.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">이후 제품 조사 T21</text>
<text id="n25-0" data-width="310" x="464" y="425.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">한 Downstream Agent</text>
<text id="n25-1" data-width="310" x="464" y="462.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">제품 비교 수행</text>
<text id="n26-0" data-width="310" x="464" y="516.16" text-anchor="start" font-size="23" font-weight="700" fill="#087E8B">VIA가 확인한 결과 참조</text>
<text id="n26-1" data-width="310" x="464" y="550.16" text-anchor="start" font-size="23" font-weight="700" fill="#087E8B">D21@v2</text>
<text id="n27-0" data-width="310" x="464" y="597.48" text-anchor="start" font-size="19" font-weight="400" fill="#5F6B77">C21 대화에 연결</text>
<text id="n28-0" data-width="310" x="844" y="369.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">이후 견적 업무 T22</text>
<text id="n29-0" data-width="310" x="844" y="425.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">다른 Downstream Agent</text>
<text id="n29-1" data-width="310" x="844" y="462.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">견적 업무 수행</text>
<text id="n30-0" data-width="310" x="844" y="516.16" text-anchor="start" font-size="23" font-weight="700" fill="#087E8B">VIA가 확인한 결과 참조</text>
<text id="n30-1" data-width="310" x="844" y="550.16" text-anchor="start" font-size="23" font-weight="700" fill="#087E8B">D22@v1</text>
<text id="n31-0" data-width="310" x="844" y="597.48" text-anchor="start" font-size="19" font-weight="400" fill="#5F6B77">C22 대화에 연결</text>
<polyline id="n32" points="416,367 442,367" fill="none" stroke="#5F6B77" stroke-width="2" marker-end="url(#a5F6B77)"/>
<polyline id="n33" points="796,367 822,367" fill="none" stroke="#5F6B77" stroke-width="2" marker-end="url(#a5F6B77)"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#FFFFFF"/>
<g font-family="Calibri, sans-serif">
<text id="dp45-background-1-text-0" x="60" y="73.6" font-size="40.0" text-anchor="start" font-weight="700" fill="#000000" data-width="1040">DP45. 과거 설명과 업무 결과의 재사용</text>
<polyline id="dp45-background-2" points="52,104 1872,104" fill="none" stroke="#A6A6A6" stroke-width="1.5"/>
<polyline id="dp45-background-3" points="52,908 1868,908" fill="none" stroke="#A6A6A6" stroke-width="1.5"/>
<text id="dp45-background-4-text-0" x="52" y="970.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#C00000" data-width="180">설계 질문</text>
<text id="dp45-background-5-text-0" x="260" y="974.0266666666668" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1608">VIA의 설명, 여러 Agent 결과와 정정·실제 전달 기록을</text>
<text id="dp45-background-5-text-1" x="260" y="1010.8266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1608">나중 요청에서 어떻게 다시 연결해 사용할까?</text>
<text id="dp45-background-6-text-0" x="52" y="195.64000000000001" font-size="36.0" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">“지난번 네가 설명한 기준으로,</text>
<text id="dp45-background-6-text-1" x="52" y="238.84" font-size="36.0" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">제품 비교와 견적도 이번 제안서에 반영해줘.”</text>
<text id="dp45-background-7-text-0" x="52" y="345.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="568">VIA에게 들은 설명</text>
<rect x="52" y="382" width="568" height="117" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2"/>
<text id="dp45-background-8-text-0" x="336.0" y="432.87333333333333" font-size="29.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="568">평가 기준</text>
<text id="dp45-background-8-text-1" x="336.0" y="468.0733333333333" font-size="29.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="568">원문과 실제 전달 범위</text>
<text id="dp45-background-9-text-0" x="676" y="345.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="568">제품 조사 Agent 결과</text>
<rect x="676" y="382" width="568" height="117" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2"/>
<text id="dp45-background-10-text-0" x="960.0" y="432.87333333333333" font-size="29.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="568">제품 비교</text>
<text id="dp45-background-10-text-1" x="960.0" y="468.0733333333333" font-size="29.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="568">확인된 결과와 자료 참조</text>
<text id="dp45-background-11-text-0" x="1300" y="345.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="568">견적 Agent 결과</text>
<rect x="1300" y="382" width="568" height="117" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2"/>
<text id="dp45-background-12-text-0" x="1584.0" y="432.87333333333333" font-size="29.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="568">견적</text>
<text id="dp45-background-12-text-1" x="1584.0" y="468.0733333333333" font-size="29.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="568">확인된 결과와 버전</text>
<polyline id="dp45-background-13" points="336,503 336,523" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline id="dp45-background-14" points="336,590 336,605" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline points="329.7674679981454,593.5914266954252 336,605 342.2325320018546,593.5914266954252" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline id="dp45-background-15" points="960,503 960,523" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline id="dp45-background-16" points="960,590 960,605" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline points="953.7674679981453,593.5914266954252 960,605 966.2325320018547,593.5914266954252" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline id="dp45-background-17" points="1584,503 1584,523" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline id="dp45-background-18" points="1584,590 1584,605" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline points="1577.7674679981453,593.5914266954252 1584,605 1590.2325320018547,593.5914266954252" fill="none" stroke="#00889A" stroke-width="2.5"/>
<text id="dp45-background-19-text-0" x="52" y="570.88" font-size="32.0" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">그 뒤 “가격은 비교에서 빼줘”라고 조건을 고쳤습니다.</text>
<rect x="52" y="627" width="1816" height="109" fill="#F2F2F2" stroke="#A6A6A6" stroke-width="2"/>
<text id="dp45-background-20-text-0" x="960.0" y="673.5266666666668" font-size="30.666666666666668" text-anchor="middle" font-weight="700" fill="#000000" data-width="1816">이번 요청의 과거 맥락</text>
<text id="dp45-background-20-text-1" x="960.0" y="710.3266666666667" font-size="30.666666666666668" text-anchor="middle" font-weight="700" fill="#000000" data-width="1816">실제 전달한 기준 · 정정한 조건 · 사용 가능한 결과</text>
<text id="dp45-background-21-text-0" x="52" y="803.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">옛 조건이나 전달하지 않은 설명을 쓰면, 이번 업무를 다른 뜻으로 맡기게 됩니다.</text>
<text id="dp45-background-22-text-0" x="52" y="870.9733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="1816">기록이 여러 곳에 흩어져 있고, 수정·삭제 후 사용할 수 있는 범위도 바뀝니다.</text>
</g></svg>

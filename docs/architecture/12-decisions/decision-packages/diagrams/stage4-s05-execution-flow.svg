<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">S-05 / 실행 순서  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="129.0" text-anchor="start" font-size="42" font-weight="700" fill="#263445">음성을 허가 전에 준비할 것인가, 허가한 Text에서 만들 것인가</text></g>
<g id="e5"><text x="64" y="174.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">공통 음성 수집과 정규 인식 뒤의 비교. 직접 경로의 음성은 허가 전까지 사용자에게 들리지 않는다.</text></g>
<g id="e8"><text x="88" y="284.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">T의 직접 응답 / 자체 지식 질문이며 현재 입력 검사를 통과한 경우</text></g>
<g id="e17"><text x="1916" y="370.0" text-anchor="middle" font-size="18" font-weight="400" fill="#5B697B">직접 경로에서 호출 없음</text></g>
<g id="e21" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="466.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">1. 원음 전달 → 직접 음성 후보 준비 요청</text></g>
<g id="e23" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="540.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">2. 공유 Omni에 직접 음성 후보 요청</text></g>
<g id="e25" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="614.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">3. 후보와 보류 음성 반환</text></g>
<g id="e27" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="688.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">4. 후보와 보류 실행 ID 반환</text></g>
<g id="e29" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="762.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">5. 정규 문장, 입력 버전과 후보 전달</text></g>
<g id="e31" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1547" y="840.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">6. 문장 일치, 자료와 업무 의존성 검사</text></g>
<g id="e33" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1504" y="910.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">7. 직접 응답 게시 허용</text></g>
<g id="e35" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="984.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">8. 해당 Text 게시와 보류 음성 재생 요청</text></g>
<g id="e37" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="1058.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">9. 실제 표시와 들린 범위 반환</text></g>
<g id="e38"><text x="88" y="1150.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">6이 불분명하면 같은 Request를 아래 일반 경로로 보낸다. 허용 전 재생은 금지한다.</text></g>
<g id="e40"><text x="88" y="1280.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">T의 일반 경로와 A의 모든 요청 / 직접 후보를 사용하지 않는 경우</text></g>
<g id="e54" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1504" y="1462.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">1. 확정 입력과 기본 Context 해석 요청</text></g>
<g id="e56" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="1536.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">2. 의미 해석 모델 호출 요청</text></g>
<g id="e58" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="1610.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">3. 공유 Omni에 의미 해석 요청</text></g>
<g id="e60" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="1684.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">4. 해석 결과 반환</text></g>
<g id="e62" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="1758.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">5. 모델 결과 반환</text></g>
<g id="e64" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1504" y="1832.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">6. 의미와 답변 제안 반환</text></g>
<g id="e66" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1504" y="1906.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">7. 현재 입력을 확인해 Text 게시 허용</text></g>
<g id="e68" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="1980.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">8. 허용된 Text 표시 요청</text></g>
<g id="e70" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="2054.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">9. 허용된 Text의 음성 생성 요청</text></g>
<g id="e72" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="2128.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">10. 공유 Omni에 음성 생성 요청</text></g>
<g id="e74" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="2202.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">11. 음성 결과 반환</text></g>
<g id="e76" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="2276.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">12. 음성 결과 반환 / 문장 대응 검사</text></g>
<g id="e78" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="2350.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">13. 검사한 음성 재생 요청</text></g>
<g id="e80" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="2424.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">14. 실제 들린 범위 반환</text></g>
<g id="e81"><text x="88" y="2516.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">승인된 Text는 조건이 맞으면 음성 생성을 기다리지 않고 게시한다. A에는 직접 S2S 기능이 없다.</text></g>
<g id="e83"><text x="64" y="2891.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">색:  검정 = 공통     파랑 = T 전용     초록 = A/B 전용</text></g>
<g id="e84"><text x="2496" y="2890.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달     점선 → 결과/복원</text></g>
<g id="e85"><text x="64" y="2927.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">모양:  제목 칸이 있는 박스 = Component   |   내부 둥근 박스 = Module   |   원통 = 저장소   |   접힌 종이 = 자료   |   육각형 = 연동 대상/모델</text></g>
<g id="e86"><text x="64" y="2967.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">S2S 직접 경로는 이번 발화만을 보는 제한 기능이다. 일반 경로는 자료 기반 답변과 업무 위임을 계속 지원한다.</text></g>
<g id="e87"><text x="2496" y="2967.0" text-anchor="end" font-size="17" font-weight="400" fill="#5B697B">탐색안 / 미채택 / 미측정</text></g>
</g></svg>

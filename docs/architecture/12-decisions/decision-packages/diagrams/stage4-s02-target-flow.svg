<text x="2340.0" y="365.25" text-anchor="middle" font-size="19" font-weight="700" fill="#263445">공유 Omni</text><text x="2340.0" y="389.0" text-anchor="middle" font-size="19" font-weight="700" fill="#263445">의미 해석</text>
</g>
<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">S-02 / T 실행  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="129.0" text-anchor="start" font-size="42" font-weight="700" fill="#263445">T: 당시 화면 근거를 조회하고 요청에 맞게 해석한다</text></g>
<g id="e5"><text x="64" y="174.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">공통 입력 수집 뒤의 요청 처리 예. 발화 시작 때 준비한 기본 근거와 기존 UI 정보 및 cache는 유효한 범위에서 재사용한다.</text></g>
<g id="e8"><text x="88" y="284.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">요청 처리 / 대상 의미 해석이 필요한 입력</text></g>
<g id="e11"><text x="573" y="370.0" text-anchor="middle" font-size="18" font-weight="400" fill="#5B697B">별도 생산자 없음</text></g>
<g id="e23" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="466.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">1. 인식 문장, 입력 버전과 당시 화면 근거 참조 전달</text></g>
<g id="e25" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="939" y="540.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">2. 허용 근거 구성 요청</text></g>
<g id="e27" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="614.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">3. 발화 당시 화면과 조작 기록 조회</text></g>
<g id="e29" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="688.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">4. 보관된 이미지, UI 정보, 시간 오차와 누락 범위 반환</text></g>
<g id="e31" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="939" y="762.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">5. 필요한 현재 원문과 권한 확인 후 Context 반환</text></g>
<g id="e33" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1292" y="836.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">6. 입력과 Context로 해석 요청</text></g>
<g id="e35" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1645" y="910.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">7. 필요한 화면을 포함해 의미 해석 요청</text></g>
<g id="e37" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1999" y="984.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">8. 모델 입력 전달</text></g>
<g id="e39" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1999" y="1058.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">9. 해석 결과 반환</text></g>
<g id="e41" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1645" y="1132.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">10. 결과 반환</text></g>
<g id="e43" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1292" y="1206.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">11. 대상과 의도 제안 또는 확인 필요성 반환</text></g>
<g id="e45" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1335" y="1284.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">12. 현재 입력과 근거 검증 → 확정 또는 보류</text></g>
<g id="e46"><text x="88" y="1372.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">부족한 근거는 허용된 추가 조회 또는 사용자 확인으로 보완한다. 이 흐름은 외부 업무 실행이 아니다.</text></g>
<g id="e48"><text x="64" y="1491.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">색:  검정 = 공통     파랑 = T 전용     초록 = A/B 전용</text></g>
<g id="e49"><text x="2496" y="1490.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달     점선 → 결과/복원</text></g>
<g id="e50"><text x="64" y="1527.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">모양:  제목 칸이 있는 박스 = Component   |   내부 둥근 박스 = Module   |   원통 = 저장소   |   접힌 종이 = 자료   |   육각형 = 연동 대상/모델</text></g>
<g id="e51"><text x="64" y="1567.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">Context Manager의 현재 원문 조회는 해당 자료 소유자의 인터페이스를 사용한다. 최종 확정 주체는 Request Controller다.</text></g>
<g id="e52"><text x="2496" y="1567.0" text-anchor="end" font-size="17" font-weight="400" fill="#5B697B">탐색안 / 미채택 / 미측정</text></g>
</g></svg>

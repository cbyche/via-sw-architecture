<g id="e2"><text x="64" y="48.0" text-anchor="start" font-size="24" font-weight="700" fill="#5B697B">VIA / 43 / A 통합 판단 · C 기능별 판단</text></g>
<g id="e3"><text x="2496" y="48.0" text-anchor="end" font-size="24" font-weight="400" fill="#5B697B">설계 후보 / 미선정 / 미측정</text></g>
<g id="e4"><text x="64" y="113.0" text-anchor="start" font-size="41" font-weight="700" fill="#263445">같은 정정: 누가 바꾸고, 무엇을 보존하며, 어디로 재판단을 돌리는가?</text></g>
<g id="e5"><text x="64" y="168.0" text-anchor="start" font-size="28" font-weight="400" fill="#263445">이미 채택된 조건: 보고서 PDF / 메일에 보고서 결론. 새 입력: “메일에는 결론 대신 표만 넣어줘.”</text></g>
<g id="e6"><text x="64" y="209.0" text-anchor="start" font-size="25" font-weight="400" fill="#5B697B">보고서·메일은 데이터 예시다. R/M 연결이나 표 대상이 모호하면 후보를 유지하고 추가 근거/확인을 요청한다.</text></g>
<g id="e7"><text x="64" y="282.0" text-anchor="start" font-size="32" font-weight="700" fill="#195FBD">A  같은 결과, 다른 의미 생산 책임</text></g>
<g id="e9"><text x="204" y="357" text-anchor="middle" font-size="24" font-weight="700" fill="#195FBD">Request</text><text x="204" y="387" text-anchor="middle" font-size="24" font-weight="700" fill="#195FBD">Controller</text></g>
<g id="e12"><text x="654" y="357" text-anchor="middle" font-size="24" font-weight="700" fill="#195FBD">Integrated Semantic</text><text x="654" y="387" text-anchor="middle" font-size="24" font-weight="700" fill="#195FBD">Interpreter</text></g>
<g id="e15"><text x="1104" y="357" text-anchor="middle" font-size="24" font-weight="700" fill="#195FBD">Interpretation</text><text x="1104" y="387" text-anchor="middle" font-size="24" font-weight="700" fill="#195FBD">Attempt State</text></g>
<g id="e17"><text x="69" y="469.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">1  새 원문 + 이전 의미 + Task 후보 + 표 근거</text></g>
<g id="e19"><text x="69" y="609.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">2  F1~F6 전체 제안: 메일 내용만 교체 / PDF 유지</text></g>
<g id="e21"><text x="69" y="749.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">현재 제안·근거 / 수정 이력 반환</text></g>
<g id="e23"><text x="69" y="889.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">3  새 통합 의미와 근거 / 경쟁 후보가 있으면 미해결</text></g>
<g id="e25"><text x="69" y="1029.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">4  현재 검사 → State Store 채택 → 공통 위임/응답</text></g>
<g id="e27"><text x="69" y="1169.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">5  뒤늦은 새 근거: 영향을 받은 의미만 재판단</text></g>
<g id="e29"><text x="69" y="1309.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">부분 수정 또는 새 전체 제안 / 필요한 확인 질문</text></g>
<g id="e31"><text x="1306" y="282.0" text-anchor="start" font-size="32" font-weight="700" fill="#7446A4">C  같은 결과, 다른 의미 생산 책임</text></g>
<g id="e33"><text x="1406" y="355" text-anchor="middle" font-size="22" font-weight="700" fill="#7446A4">Request</text><text x="1406" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#7446A4">Controller</text></g>
<g id="e36"><text x="1648" y="355" text-anchor="middle" font-size="22" font-weight="700" fill="#7446A4">Interpretation</text><text x="1648" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#7446A4">Coordinator</text></g>
<g id="e39"><text x="1890" y="355" text-anchor="middle" font-size="22" font-weight="700" fill="#7446A4">Referent</text><text x="1890" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#7446A4">Resolver</text></g>
<g id="e42"><text x="2132" y="355" text-anchor="middle" font-size="22" font-weight="700" fill="#7446A4">Request Revision</text><text x="2132" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#7446A4">Interpreter</text></g>
<g id="e45"><text x="2374" y="355" text-anchor="middle" font-size="22" font-weight="700" fill="#7446A4">Request Relation</text><text x="2374" y="385" text-anchor="middle" font-size="22" font-weight="700" fill="#7446A4">Interpreter</text></g>
<g id="e47"><text x="1311" y="469.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">1  같은 입력/근거 / F1 의도·F3 연결·F6 방향도 유효성 확인</text></g>
<g id="e49"><text x="1311" y="554.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">2  F2: 표 후보 + 원문 + 관련 자료</text></g>
<g id="e51"><text x="1311" y="639.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">표 참조의 새 제안 / 불명확하면 후보 유지</text></g>
<g id="e53"><text x="1311" y="724.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">F5: 이전 의미 + F1/F3/F4/F2 참조 → 교체 범위 판단</text></g>
<g id="e55"><text x="1311" y="809.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">메일 내용 조건 교체 / 보고서 PDF 조건 보존</text></g>
<g id="e57"><text x="1311" y="894.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">F4: 새 표 참조 + F5 변경 → 의존 관계 갱신</text></g>
<g id="e59"><text x="1311" y="979.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">결론 의존 제거 / 표 의존 생성</text></g>
<g id="e61"><text x="1311" y="1064.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">3  유효한 F1~F6 제안 참조를 결합해 반환</text></g>
<g id="e63"><text x="1311" y="1149.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">4  같은 현재 검사/채택. 필수 의미 미해결이면 보류</text></g>
<g id="e65"><text x="1311" y="1234.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">5  새 근거로 대상 충돌: 원 생산자 F2에 재판단 요청</text></g>
<g id="e67"><text x="1311" y="1319.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">영향받은 F4/F5/F6 재판단 / 중앙에서 값 덮기 금지</text></g>
<g id="e69"><text x="64" y="1479.0" text-anchor="start" font-size="29" font-weight="700" fill="#263445">공통 예외와 경계</text></g>
<g id="e70"><text x="64" y="1525" text-anchor="start" font-size="25" font-weight="400" fill="#263445">새 입력은 관련 미전송 의도를 보류. 전송 후에는 실제 외부 접수/실행 확인 없이 취소 완료나 rollback을 주장하지 않는다.</text><text x="64" y="1565" text-anchor="start" font-size="25" font-weight="400" fill="#263445">철회/삭제: 관련 근거·전체/부분 제안·모델 Context/KV의 신규 사용을 차단. 이미 제공한 정보의 소급 회수는 보장하지 않는다.</text><text x="64" y="1605" text-anchor="start" font-size="25" font-weight="400" fill="#263445">실패/재시작: 내구 채택 기록과 외부 Task 사실을 복원. 임시 제안은 재검증/재계산하며 이전 명령을 중복 실행하지 않는다.</text><text x="64" y="1645" text-anchor="start" font-size="25" font-weight="400" fill="#263445">C의 F1/F3/F6과 원장은 메인에 표시. 이 보충 사건도는 정정으로 변하는 F2/F5/F4를 확대하며 고정 실행 순서를 뜻하지 않는다.</text><text x="64" y="1685" text-anchor="start" font-size="25" font-weight="400" fill="#263445">모든 의미 추론은 Model Access의 공유 Omni. 외부 업무 계획·도구 선택·실행은 Downstream Agent 책임.</text></g>
<g id="e71"><text x="64" y="1752.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">실선 = 요청/전달 · 점선 화살표 = 결과 반환. 메인 비교는 choice43-structure.svg. 두 안 모두 설계 후보이며 미측정.</text></g>
</g></svg>

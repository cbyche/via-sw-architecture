<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-34  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">음성 대화의 반응성과 정정 정확성을 위한 실행</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">발화 단위와 연속 수정</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">“이 표를 보내…” → “아니, 설명만 해줘” → 준비는 재사용할 수 있지만 보내기는 실행 금지</text></g>
<g id="e7"><text x="64" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#195FBD">A  확정 발화부터 처리</text></g>
<g id="e8"><text x="64" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e10"><text x="180" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interaction</text><text x="180" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Manager</text></g>
<g id="e13"><text x="418" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e16"><text x="656" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Context Manager</text></g>
<g id="e19"><text x="894" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request</text><text x="894" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interpreter</text></g>
<g id="e22"><text x="1132" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Response Manager</text></g>
<g id="e24"><text x="74" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">1  “이 표를 보내…” 연속 수신; 아직 발화 미확정</text></g>
<g id="e26"><text x="74" y="712.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">2  의미 처리는 기다리고 ASR 수신/재생 중단은 계속</text></g>
<g id="e28"><text x="74" y="823.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">3  “아니 보내지 말고 설명만”까지 확정 입력</text></g>
<g id="e30"><text x="74" y="934.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">현재 허용된 표 읽기 요청</text></g>
<g id="e32"><text x="74" y="1045.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">표 내용/버전 반환</text></g>
<g id="e34"><text x="74" y="1156.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">확정 입력과 근거의 전체 의미 요청</text></g>
<g id="e36"><text x="74" y="1267.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">설명 의도; 발송 금지 반환</text></g>
<g id="e38"><text x="74" y="1378.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">4  현재 검사 후 설명 응답 허용</text></g>
<g id="e40"><text x="74" y="1489.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">5  음성/Text 전달; 실제 재생 구간 반환</text></g>
<g id="e42"><text x="74" y="1600.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">“세 번째 열” 정정: 먼저 재생 stop, 새 요청</text></g>
<g id="e44"><text x="74" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#195FBD">읽을 결론: 최종 발화만 처리해 추론 낭비를 줄임</text></g>
<g id="e45"><text x="74" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 발화 종료 뒤 읽기/해석/응답 준비 대기</text></g>
<g id="e46"><text x="1312" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#087A53">B  잠정 작업을 수정하며 처리</text></g>
<g id="e47"><text x="1312" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e49"><text x="1428" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interaction</text><text x="1428" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Manager</text></g>
<g id="e52"><text x="1666" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Incremental</text><text x="1666" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interaction Runtime</text></g>
<g id="e55"><text x="1904" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Context Manager</text></g>
<g id="e58"><text x="2142" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request</text><text x="2142" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interpreter</text></g>
<g id="e61"><text x="2380" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e63"><text x="1322" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">1  같은 부분 발화 + 수정 버전</text></g>
<g id="e65"><text x="1322" y="712.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">2  잠정 의미 요청; 외부 실행 허용은 아님</text></g>
<g id="e67"><text x="1322" y="823.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">이미 동의한 범위의 표 미리 읽기</text></g>
<g id="e69"><text x="1322" y="934.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">표/버전 반환; 의존 관계에 기록</text></g>
<g id="e71"><text x="1322" y="1045.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">잠정 의미/의존 입력 버전 반환</text></g>
<g id="e73"><text x="1322" y="1156.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">3  “아니 보내지 말고 설명만” 수정</text></g>
<g id="e75"><text x="1322" y="1267.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">보내기 의미/응답 폐기; 유효한 표 읽기는 유지</text></g>
<g id="e77"><text x="1322" y="1378.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">설명 의미로 재해석; 취소 불가 job은 늦은 결과 폐기</text></g>
<g id="e79"><text x="1322" y="1489.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">설명 의미와 새 입력 버전 반환</text></g>
<g id="e81"><text x="1322" y="1600.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">4  유효 준비 결과 + 최종 입력; 현재 검사 요청</text></g>
<g id="e83"><text x="1322" y="1711.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">5  Response Manager를 통해 허용된 음성/Text 전달</text></g>
<g id="e85"><text x="1322" y="1822.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">새 정정: 먼저 stop; 관련 잠정 작업만 무효화</text></g>
<g id="e87"><text x="1322" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#087A53">읽을 결론: 발화 중 준비; 정정 뒤 유효한 읽기 재사용</text></g>
<g id="e88"><text x="1322" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 취소 낭비/버전 누락/공유 모델 backlog</text></g>
<g id="e89"><text x="64" y="2219.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">생략한 공통 연동: 추론은 Model Access의 한 벌 Omni; 업무 실행은 Task Manager/Agent Gateway가 Downstream Agent에 위임.</text></g>
<g id="e90"><text x="64" y="2259.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">실선 = 요청/전달, 점선 = 결과. 별도 언급 없는 참여자는 논리 책임. 시간 간격은 성능 수치가 아닌 사건 순서. 수작업 설계 추적, 미측정.</text></g>
</g></svg>

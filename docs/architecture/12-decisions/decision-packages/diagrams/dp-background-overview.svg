<marker id="aB63732" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B63732" stroke-width="1.6"/></marker>
<marker id="a087E8B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#087E8B" stroke-width="1.6"/></marker>
<marker id="a5F6B77" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5F6B77" stroke-width="1.6"/></marker>
</defs><g font-family="Apple SD Gothic Neo, Arial, sans-serif">
<rect id="n1" fill="white" stroke="none" stroke-width="1.7" x="0" y="0" width="1920" height="1080"/>
<text id="n2-0" data-width="1792" x="64" y="46.400000000000006" text-anchor="start" font-size="20" font-weight="700" fill="#5F6B77">VIA 사용자 경험</text>
<text id="n3-0" data-width="1792" x="64" y="104.80000000000001" text-anchor="start" font-size="40" font-weight="700" fill="#18232E">사용자가 계속 말하는 동안에도, VIA는 대화와 업무를 이어가야 합니다</text>
<text id="n4-0" data-width="1792" x="64" y="149.92000000000002" text-anchor="start" font-size="26" font-weight="400" fill="#5F6B77">한 번의 이해로 끝나지 않습니다. 새 입력, 업무 알림, 과거 정보와 서로 다른 종료 시점이 겹칩니다.</text>
<polyline id="n5" points="64,169 1856,169" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<text id="n6-0" data-width="160" x="64" y="212.08" text-anchor="start" font-size="24" font-weight="700" fill="#5F6B77">이전에</text>
<text id="n7-0" data-width="500" x="232" y="210.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">VIA의 직접 설명</text>
<text id="n8-0" data-width="500" x="232" y="244.24" text-anchor="start" font-size="22" font-weight="400" fill="#5F6B77">평가 기준 · 사용자에게 실제 전달</text>
<text id="n9-0" data-width="500" x="770" y="210.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">제품 조사 Agent의 확인된 결과</text>
<text id="n10-0" data-width="500" x="770" y="244.24" text-anchor="start" font-size="22" font-weight="400" fill="#5F6B77">제품 비교 · 결과 참조 / 필요한 발췌</text>
<text id="n11-0" data-width="500" x="1340" y="210.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">견적 Agent의 확인된 결과</text>
<text id="n12-0" data-width="500" x="1340" y="244.24" text-anchor="start" font-size="22" font-weight="400" fill="#5F6B77">견적 · 결과 참조 / 필요한 발췌</text>
<polyline id="n13" points="435,257 435,275 1355,275" fill="none" stroke="#5F6B77" stroke-width="1.7" stroke-dasharray="7 6"/>
<polyline id="n14" points="985,257 985,275 1355,275" fill="none" stroke="#5F6B77" stroke-width="1.7" stroke-dasharray="7 6"/>
<polyline id="n15" points="1540,257 1540,275 1355,275" fill="none" stroke="#5F6B77" stroke-width="1.7" stroke-dasharray="7 6"/>
<polyline id="n16" points="1355,275 1490,275 1490,672 1320,672" fill="none" stroke="#5F6B77" stroke-width="1.7" stroke-dasharray="7 6" marker-end="url(#a5F6B77)"/>
<text id="n17-0" data-width="130" x="64" y="315.24" text-anchor="start" font-size="22" font-weight="700" fill="#5F6B77">시간 →</text>
<text id="n18-0" data-width="390" x="225" y="315.24" text-anchor="start" font-size="22" font-weight="700" fill="#5F6B77">현재 요청</text>
<text id="n19-0" data-width="355" x="670" y="315.24" text-anchor="start" font-size="22" font-weight="700" fill="#5F6B77">처리 중 겹치는 사건</text>
<text id="n20-0" data-width="410" x="1080" y="315.24" text-anchor="start" font-size="22" font-weight="700" fill="#5F6B77">이후 과거 정보 재사용</text>
<text id="n21-0" data-width="160" x="1540" y="315.24" text-anchor="start" font-size="22" font-weight="700" fill="#5F6B77">음성 종료</text>
<text id="n22-0" data-width="120" x="1730" y="315.24" text-anchor="start" font-size="22" font-weight="700" fill="#5F6B77">돌아옴</text>
<polyline id="n23" points="220,330 1850,330" fill="none" stroke="#CDD6DE" stroke-width="1.7" marker-end="url(#aCDD6DE)"/>
<text id="n24-0" data-width="140" x="64" y="382.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">사용자</text>
<text id="n24-1" data-width="140" x="64" y="414.5" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">입력·대화</text>
<text id="n25-0" data-width="400" x="225" y="382.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">“이 표를 제안서에 넣고,</text>
<text id="n25-1" data-width="400" x="225" y="417.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">공유 메일은 초안만</text>
<text id="n25-2" data-width="400" x="225" y="452.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">만들어줘.”</text>
<text id="n26-0" data-width="400" x="225" y="490.24" text-anchor="start" font-size="22" font-weight="400" fill="#5F6B77">화면의 표를 가리킴</text>
<text id="n27-0" data-width="390" x="670" y="382.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">“잠깐, 가격은</text>
<text id="n27-1" data-width="390" x="670" y="417.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">비교에서 빼줘.”</text>
<text id="n28-0" data-width="330" x="735" y="490.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">메일 업무의 질문</text>
<text id="n28-1" data-width="330" x="735" y="521.0799999999999" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">“수신자는 누구인가요?”</text>
<text id="n29-0" data-width="410" x="1080" y="381.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">“지난번 네가 설명한 기준으로,</text>
<text id="n29-1" data-width="410" x="1080" y="415.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">제품 비교 결과와 견적도</text>
<text id="n29-2" data-width="410" x="1080" y="449.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">반영해줘.”</text>
<text id="n30-0" data-width="150" x="1530" y="384.08" text-anchor="start" font-size="24" font-weight="400" fill="#5F6B77">대화는</text>
<text id="n30-1" data-width="150" x="1530" y="416.08" text-anchor="start" font-size="24" font-weight="400" fill="#5F6B77">끝나도…</text>
<text id="n31-0" data-width="170" x="1710" y="412.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">같은 업무의</text>
<text id="n31-1" data-width="170" x="1710" y="444.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">진행·결과</text>
<polyline id="n32" points="1540,456 1540,890" fill="none" stroke="#CDD6DE" stroke-width="1.7" stroke-dasharray="7 6"/>
<text id="n33-0" data-width="140" x="64" y="613.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">VIA</text>
<text id="n33-1" data-width="140" x="64" y="645.5" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">처리·연결</text>
<polyline id="n34" points="225,580 1850,580" fill="none" stroke="#CDD6DE" stroke-width="7"/>
<text id="n35-0" data-width="395" x="225" y="635.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">표의 대상 확인 · 업무 구분</text>
<text id="n35-1" data-width="395" x="225" y="669.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">메일은 초안만 조건 유지</text>
<text id="n36-0" data-width="385" x="670" y="634.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">정정의 적용 업무 확인</text>
<text id="n36-1" data-width="385" x="670" y="667.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">질문을 메일 업무에 연결</text>
<text id="n37-0" data-width="405" x="1080" y="634.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">과거 설명·결과 참조 연결</text>
<text id="n37-1" data-width="405" x="1080" y="667.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">현재 제안서 업무에 제공</text>
<text id="n38-0" data-width="230" x="1640" y="633.16" text-anchor="start" font-size="23" font-weight="400" fill="#18232E">업무의 진행·결과를</text>
<text id="n38-1" data-width="230" x="1640" y="665.16" text-anchor="start" font-size="23" font-weight="400" fill="#18232E">사용자에게 전달</text>
<polyline id="n39" points="280,504 280,570" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<polyline id="n40" points="695,438 695,570" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<polyline id="n41" points="855,570 855,536" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<polyline id="n42" points="1110,471 1110,570" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<polyline id="n43" points="1760,570 1760,476" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<text id="n44-0" data-width="440" x="900" y="713.24" text-anchor="start" font-size="22" font-weight="400" fill="#5F6B77">늦게 끝난 이전 조건의 후보 → 현재 유효성 확인</text>
<text id="n45-0" data-width="140" x="64" y="808.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">외부 Agent</text>
<text id="n45-1" data-width="140" x="64" y="840.5" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">업무 수행</text>
<text id="n46-0" data-width="325" x="225" y="777.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">제안서 업무</text>
<polyline id="n47" points="555,790 1850,790" fill="none" stroke="#CDD6DE" stroke-width="7"/>
<text id="n48-0" data-width="410" x="1110" y="773.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">기준 적용·분석·제안서 작성</text>
<polyline id="n49" points="575,680 575,780" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<rect id="n50" fill="white" stroke="none" stroke-width="1.7" x="505" y="715" width="65" height="32.6"/>
<text id="n51-0" data-width="55" x="510" y="737.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">위임</text>
<polyline id="n52" points="650,780 650,682" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<rect id="n53" fill="white" stroke="none" stroke-width="1.7" x="599" y="715" width="112" height="30.0"/>
<text id="n54-0" data-width="102" x="604" y="735.4" text-anchor="start" font-size="20" font-weight="400" fill="#18232E">접수 확인</text>
<text id="n55-0" data-width="300" x="225" y="717.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">위임 요청의 처리 완료</text>
<text id="n55-1" data-width="300" x="225" y="745.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">(외부 접수 확인 후)</text>
<polyline id="n56" points="1320,688 1320,740" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<polyline id="n57" points="1760,780 1760,690" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<text id="n58-0" data-width="325" x="1550" y="840.24" text-anchor="start" font-size="22" font-weight="400" fill="#5F6B77">대화가 끝나도 업무는 지속</text>
<text id="n59-0" data-width="320" x="225" y="880.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">공유 메일 초안 업무</text>
<polyline id="n60" points="555,900 1450,900" fill="none" stroke="#CDD6DE" stroke-width="7"/>
<polyline id="n61" points="555,684 555,890" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<polyline id="n62" points="725,890 725,682" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<text id="n63-0" data-width="120" x="610" y="832.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">메일 질문</text>
<text id="n64-0" data-width="690" x="755" y="870.24" text-anchor="start" font-size="22" font-weight="400" fill="#5F6B77">수신자 질문은 VIA로 → 답변 연결 후 초안 준비 (발송 없음)</text>
<polyline id="n65" points="985,780 985,725" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<polyline id="n66" points="64,930 1856,930" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<polyline id="n67" points="64,951 117,951" fill="none" stroke="#18232E" stroke-width="1.7" marker-end="url(#a18232E)"/>
<text id="n68-0" data-width="330" x="133" y="954.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">입력·위임·알림·전달</text>
<polyline id="n69" points="485,951 538,951" fill="none" stroke="#5F6B77" stroke-width="1.7" stroke-dasharray="7 6" marker-end="url(#a5F6B77)"/>
<text id="n70-0" data-width="200" x="554" y="954.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">과거 정보 참조</text>
<polyline id="n71" points="780,951 833,951" fill="none" stroke="#CDD6DE" stroke-width="7"/>
<text id="n72-0" data-width="960" x="849" y="954.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">계속되는 처리·업무   /   위치·길이는 설명용이며 측정 시간이 아님</text>
<text id="n73-0" data-width="425" x="64" y="993.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">① 지금 요청의 대상과</text>
<text id="n73-1" data-width="425" x="64" y="1023.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">조건 이해</text>
<text id="n74-0" data-width="425" x="516" y="993.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">② 새 입력·업무 알림이</text>
<text id="n74-1" data-width="425" x="516" y="1023.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">겹쳐도 처리 이어가기</text>
<text id="n75-0" data-width="425" x="968" y="993.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">③ 과거 설명과 여러</text>
<text id="n75-1" data-width="425" x="968" y="1023.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">업무 결과 연결</text>
<text id="n76-0" data-width="425" x="1420" y="993.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">④ 대화와 업무의</text>
<text id="n76-1" data-width="425" x="1420" y="1023.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">서로 다른 수명 관리</text>
<text id="n77-0" data-width="1792" x="64" y="1059.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">VIA: 사용자 상호작용·요청 이해·업무 연결과 위임·결과 전달   /   업무 수행 Agent: 도메인 분석·계획·도구 선택·업무 실행</text>
</g></svg>

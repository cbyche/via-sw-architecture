<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-31  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">요청 이해의 정확성을 위한 의미 구성</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">전체 의미 생성과 제약 결합</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">구조도 / 실행 순서 번호 없음 / 공통 책임을 유지하면서 실제 생산 원리와 상태를 비교</text></g>
<g id="e8"><text x="88" y="270.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">A</text></g>
<g id="e9"><text x="132" y="263.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">전체 의미 생성</text></g>
<g id="e11"><text x="86" y="374.0" text-anchor="start" font-size="18" font-weight="700" fill="#263445">VIA SOFTWARE</text></g>
<g id="e12"><text x="1226" y="374.0" text-anchor="end" font-size="16" font-weight="400" fill="#5B697B">역할/논리 구조, OS process는 별도 명시</text></g>
<g id="e15"><text x="864" y="1658.0" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">외부 업무는 공통</text><text x="864" y="1682.3" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">Task Manager</text><text x="864" y="1706.6" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">→ Agent Gateway</text><text x="864" y="1730.9" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">→ Downstream Agent</text><text x="864" y="1755.2" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">접수/결과는 같은 경로로 반환</text></g>
<g id="e21" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="499" y="968.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">모델 결과</text></g>
<g id="e23" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="499" y="1188.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">완성안 검사</text></g>
<g id="e27" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="899" y="1858.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">추론 요청</text></g>
<g id="e30" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="829" y="803.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">요청</text></g>
<g id="e33" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="494" y="608.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">해석 요청 / 제안 반환</text></g>
<g id="e36" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="494" y="1528.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">의미 / 미해결 반환</text></g>
<g id="e37"><text x="100" y="1931.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">A: 모델이 전체 관계 생산 → 코드가 실행 가능성 검사</text><text x="100" y="1959.35" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">B: 모델은 후보 생산 → 규칙/해법이 관계 구성</text><text x="100" y="1987.7" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">같은 Request Interpreter 책임 안의 핵심 생산 구조 교체</text></g>
<g id="e39"><text x="1336" y="270.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">B</text></g>
<g id="e40"><text x="1380" y="263.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">후보와 제약으로 구성</text></g>
<g id="e42"><text x="1334" y="374.0" text-anchor="start" font-size="18" font-weight="700" fill="#263445">VIA SOFTWARE</text></g>
<g id="e43"><text x="2474" y="374.0" text-anchor="end" font-size="16" font-weight="400" fill="#5B697B">역할/논리 구조, OS process는 별도 명시</text></g>
<g id="e46"><text x="2112" y="1658.0" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">외부 업무는 공통</text><text x="2112" y="1682.3" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">Task Manager</text><text x="2112" y="1706.6" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">→ Agent Gateway</text><text x="2112" y="1730.9" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">→ Downstream Agent</text><text x="2112" y="1755.2" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">접수/결과는 같은 경로로 반환</text></g>
<g id="e52" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1747" y="968.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">모델 결과</text></g>
<g id="e54" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1747" y="1188.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">관계의 해를 구성</text></g>
<g id="e58" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2147" y="1858.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">추론 요청</text></g>
<g id="e61" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2077" y="803.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">요청</text></g>
<g id="e64" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1742" y="608.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">해석 요청 / 제안 반환</text></g>
<g id="e67" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1742" y="1528.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">의미 / 미해결 반환</text></g>
<g id="e68"><text x="1348" y="1931.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">A: 모델이 전체 관계 생산 → 코드가 실행 가능성 검사</text><text x="1348" y="1959.35" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">B: 모델은 후보 생산 → 규칙/해법이 관계 구성</text><text x="1348" y="1987.7" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">같은 Request Interpreter 책임 안의 핵심 생산 구조 교체</text></g>
<g id="e70"><text x="64" y="2157.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">검정 = 공통 / 파랑 = A 고유 / 초록 = B 고유 / 색은 우위가 아님</text></g>
<g id="e71"><text x="2496" y="2156.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달 / 점선 → 반환/확인</text></g>
<g id="e72"><text x="64" y="2193.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">제목 상자 = Component / 내부 둥근 상자 = Module / 원통 = 저장 / 접힌 종이 = 자료 / 육각형 = 연동 대상</text></g>
<g id="e73"><text x="64" y="2229.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">설계안 / 미선정 / 미측정. Component 이름의 반복은 같은 owner의 다른 역할을 설명할 수 있다.</text></g>
</g></svg>

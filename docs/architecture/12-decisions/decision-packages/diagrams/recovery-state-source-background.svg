<title id="title">복구 원본 · 다시 켜지는 것과 업무를 올바르게 이어가는 것은 다르다  |  배경</title><desc id="desc">UC-12 · UC-13 · UC-16 · UC-18  ·  아래 사건은 설계를 설명하는 시나리오이며 측정 trace가 아님</desc>

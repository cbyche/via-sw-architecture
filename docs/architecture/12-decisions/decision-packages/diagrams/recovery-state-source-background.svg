<g id="scenario"><rect x="48" y="142" width="2464" height="104" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="170" font-size="20" font-weight="700" fill="#171717">사용자 상황</text><text x="64" y="206" font-size="20" fill="#171717">취소 command 전송 직후 ACK가 사라지고 VIA가 종료된다. 다른 Task의 결과는 저장됐지만 사용자에게 아직 전달되지 않았다.</text></g>
<g id="lane0"><rect x="48" y="380" width="246" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="408" font-size="20" font-weight="700" fill="#171717">업무 제어</text></g>
<g id="e00"><rect x="330" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="346" y="408" font-size="20" font-weight="700" fill="#171717">사용자 취소</text><text x="346" y="444" font-size="20" fill="#171717">Task A / command C17</text><text x="346" y="469" font-size="20" fill="#171717">현재 승인·revision 검사</text></g>
<g id="e01"><rect x="870" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="886" y="408" font-size="20" font-weight="700" fill="#171717">전송 시작</text><text x="886" y="444" font-size="20" fill="#171717">DISPATCHING commit</text><text x="886" y="469" font-size="20" fill="#171717">외부 호출은 transaction 밖</text></g>
<g id="e02"><rect x="1410" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="408" font-size="20" font-weight="700" fill="#171717">ACK 미수신 + crash</text><text x="1426" y="444" font-size="20" fill="#171717">Agent가 받았는지 불명</text><text x="1426" y="469" font-size="20" fill="#171717">취소 완료라고 단정 금지</text></g>
<g id="e03"><rect x="1950" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="408" font-size="20" font-weight="700" fill="#171717">재연결</text><text x="1966" y="444" font-size="20" fill="#171717">같은 command key로 query</text><text x="1966" y="469" font-size="20" fill="#171717">미확인은 UNKNOWN 유지</text></g>
<g id="lane1"><rect x="48" y="542" width="246" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="570" font-size="20" font-weight="700" fill="#171717">결과 전달</text></g>
<g id="e10"><rect x="330" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="346" y="570" font-size="20" font-weight="700" fill="#171717">Task B 결과 확정</text><text x="346" y="606" font-size="20" fill="#171717">result r9 / publication P3</text><text x="346" y="631" font-size="20" fill="#171717">source-confirmed 완료</text></g>
<g id="e11"><rect x="870" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="886" y="570" font-size="20" font-weight="700" fill="#171717">인계 중단</text><text x="886" y="606" font-size="20" fill="#171717">domain outbox는 남음</text><text x="886" y="631" font-size="20" fill="#171717">UI receipt 아직 없음</text></g>
<g id="e12"><rect x="1410" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="570" font-size="20" font-weight="700" fill="#171717">재시작</text><text x="1426" y="606" font-size="20" fill="#171717">원래 대화·질문 관계 복구</text><text x="1426" y="631" font-size="20" fill="#171717">새 Task로 중복 생성 금지</text></g>
<g id="e13"><rect x="1950" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="570" font-size="20" font-weight="700" fill="#171717">사용자 결과</text><text x="1966" y="606" font-size="20" fill="#171717">Text는 같은 ID upsert</text><text x="1966" y="631" font-size="20" fill="#171717">불명 음성 자동 재생 금지</text></g>
<g id="lane2"><rect x="48" y="704" width="246" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="732" font-size="20" font-weight="700" fill="#171717">저장·삭제</text></g>
<g id="e20"><rect x="330" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="346" y="732" font-size="20" font-weight="700" fill="#171717">현재 state 또는 이력</text><text x="346" y="768" font-size="20" fill="#171717">owner별 확정 전이</text><text x="346" y="793" font-size="20" fill="#171717">같은 local DB 내구성</text></g>
<g id="e21"><rect x="870" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="886" y="732" font-size="20" font-weight="700" fill="#171717">memory 삭제</text><text x="886" y="768" font-size="20" fill="#171717">epoch·tombstone commit</text><text x="886" y="793" font-size="20" fill="#171717">payload purge 예약</text></g>
<g id="e22"><rect x="1410" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="732" font-size="20" font-weight="700" fill="#171717">옛 checkpoint</text><text x="1426" y="768" font-size="20" fill="#171717">삭제 전 데이터 포함 가능</text><text x="1426" y="793" font-size="20" fill="#171717">그대로 복원하면 기억 부활</text></g>
<g id="e23"><rect x="1950" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="732" font-size="20" font-weight="700" fill="#171717">운영 가능 상태</text><text x="1966" y="768" font-size="20" fill="#171717">삭제 fence 먼저 적용</text><text x="1966" y="793" font-size="20" fill="#171717">schema·effect identity 검증</text></g>
<g id="pressure0"><rect x="48" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="953" font-size="20" font-weight="700" fill="#171717">현재 상태 중심 복원</text><text x="64" y="989" font-size="20" fill="#171717">owner row·pending 기록을 직접 읽는다.</text><text x="64" y="1014" font-size="20" fill="#171717">복구에 필요한 관계의 원자성 유지</text><text x="64" y="1039" font-size="20" fill="#171717">audit·outbox가 없는 안이 아니다.</text></g>
<g id="pressure1"><rect x="884" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="900" y="953" font-size="20" font-weight="700" fill="#171717">확정 이력 중심 재구성</text><text x="900" y="989" font-size="20" fill="#171717">checkpoint + tail로 projection을 만든다.</text><text x="900" y="1014" font-size="20" fill="#171717">과거 schema·reducer·삭제 호환 필요</text><text x="900" y="1039" font-size="20" fill="#171717">모델 판단·외부 Action은 재실행하지 않는다.</text></g>
<g id="pressure2"><rect x="1720" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1736" y="953" font-size="20" font-weight="700" fill="#171717">두 안 모두 못하는 일</text><text x="1736" y="989" font-size="20" fill="#171717">잃어버린 외부 ACK를 추측할 수 없다.</text><text x="1736" y="1014" font-size="20" fill="#171717">실제 들은 음성을 로그만으로 증명 못한다.</text><text x="1736" y="1039" font-size="20" fill="#171717">권위 저장 자체 손상은 별도 복구가 필요하다.</text></g>
<g id="challenge"><rect x="48" y="1170" width="2464" height="170" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="1198" font-size="20" font-weight="700" fill="#171717">Architecture Challenge</text><text x="64" y="1234" font-size="20" fill="#171717">운영 상태를 현재 owner 기록에서 복원할 것인가, 확정 domain 이력에서 검증된 checkpoint와 tail로 재구성할 것인가?</text></g>

<text id="note0-0" x="64" y="50" font-size="26" fill="#233247" text-anchor="start" font-weight="700">VIA / DP-42 / 구현을 가정한 상세 설계</text>
<text id="note1-0" x="3776" y="50" font-size="24" fill="#233247" text-anchor="end" font-weight="400">설계 제안 / 제품 구현과 측정 없음 / A/B 미선정</text>
<text id="note2-0" x="64" y="118" font-size="44" fill="#233247" text-anchor="start" font-weight="700">B. 같은 Q1 답변을 입력부터 실제 전달까지 추적</text>
<text id="note3-0" x="64" y="175" font-size="27" fill="#233247" text-anchor="start" font-weight="400">초기: T1 / X1의 Q1=OPEN v7, P1 실제 제시 확인. u2에는 Task ID가 없으며 읽기 근거를 본 뒤 의미를 채택한다.</text>
<text id="note4-0" x="192.0" y="397" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">01  u2 onset / 새 입력 → 보호 hold 요청</text>
<text id="note5-0" x="627.0" y="444" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">02  Hold 요청 / control session + sequence</text>
<text id="note6-0" x="627.0" y="491" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">03  HoldAck: 적용한 gate revision / 영향 범위 / 충돌</text>
<text id="note7-0" x="627.0" y="538" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">04  질문 / Task 후보 bounded 조회</text>
<text id="note8-0" x="627.0" y="585" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">05  Q1=OPEN v7 / T1 / X1 / source revision</text>
<text id="note9-0" x="627.0" y="632" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">06  P1 실제 제시 범위 조회</text>
<text id="note10-0" x="627.0" y="679" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">07  P1 → Q1 actual reference</text>
<text id="note11-0" x="627.0" y="726" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">08  원문 u2 + 현재 근거 / 필요한 추가 조회와 모델 호출</text>
<text id="note12-0" x="627.0" y="773" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">09  MeaningProposal: 상반기 답변 → Q1 / T1 (아직 미채택)</text>
<text id="note13-0" x="30" y="823" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note14-0" x="627.0" y="820" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">10  D1: R2 ACCEPTANCE_PENDING + K1 의도 + outbox</text>
<text id="note15-0" x="627.0" y="867" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">11  ReleaseAndReconcile + K1 / same ID / expected gate revision</text>
<text id="note16-0" x="30" y="917" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note17-0" x="1497.0" y="914" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">12  W1: inbox 중복 검사 + Q1 v8 + K1 + gate + receipt/event</text>
<text id="note18-0" x="627.0" y="961" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">13  AcceptanceReceipt(K1, ACCEPTED, PENDING, revision)</text>
<text id="note19-0" x="30" y="1011" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note20-0" x="627.0" y="1008" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">14  D2: 접수 사실 + Request projection + event cursor</text>
<text id="note21-0" x="1497.0" y="1055" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">15  claim(K1): D2와 독립 / 현재 gate와 권한 검사</text>
<text id="note22-0" x="30" y="1105" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note23-0" x="1497.0" y="1102" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">16  W2: PENDING → DISPATCHING 조건부 CAS</text>
<text id="note24-0" x="2367.0" y="1149" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">17  claim 성공 / 실패면 외부 send 없음</text>
<text id="note25-0" x="2802.0" y="1196" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">18  send(K1, X1, Q1, answer=상반기) / transaction 밖</text>
<text id="note26-0" x="2802.0" y="1243" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">19  외부 receipt / 수신 확인된 K1 / 단순 socket 성공과 구별</text>
<text id="note27-0" x="30" y="1293" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note28-0" x="2367.0" y="1290" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">20  I1: raw receipt / event inbox 내구 저장, 확인 응답은 저장 뒤</text>
<text id="note29-0" x="1497.0" y="1337" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">21  외부 사실 적용 요청 / 원본 event ID와 revision</text>
<text id="note30-0" x="30" y="1387" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note31-0" x="1497.0" y="1384" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">22  W3: EXTERNAL_ACCEPTED + 실행 관측 + 내구 반환 event</text>
<text id="note32-0" x="627.0" y="1431" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">23  확인된 외부 사실 / event 재전달과 cursor 반영</text>
<text id="note33-0" x="30" y="1481" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note34-0" x="627.0" y="1478" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">24  D3: 외부 확인 사실 projection + event cursor 함께 반영</text>
<text id="note35-0" x="627.0" y="1525" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">25  현재성 검사 뒤 P2 게시 허용 / 확인된 사실만 구성</text>
<text id="note36-0" x="192.0" y="1572" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">26  release(P2, output epoch) → 현재 발화 상태 검사 뒤 실제 출력</text>
<text id="note37-0" x="192.0" y="1619" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">27  actual receipt(P2, Text / audible range)</text>
<text id="note38-0" x="30" y="1669" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note39-0" x="1932.0" y="1666" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">28  D4: 실제 전달 범위와 UNKNOWN 경계를 내구 원장에 기록</text>
<text id="note40-0" x="627.0" y="1713" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">29  P2 actual reference 반환 / Request의 실제 제시 관계 갱신</text>
<text id="note41-0" x="64" y="1848" font-size="27" fill="#233247" text-anchor="start" font-weight="700">확정 전 실패</text>
<text id="note42-0" x="64" y="1893" font-size="25" fill="#233247" text-anchor="start" font-weight="400">W1 충돌: 업무 변경 미반영, 현재 원본 재조회.</text>
<text id="note42-1" x="64" y="1929.25" font-size="25" fill="#233247" text-anchor="start" font-weight="400">D1 의도는 거절 / 보류 사실로 갱신.</text>
<text id="note43-0" x="1370" y="1848" font-size="27" fill="#233247" text-anchor="start" font-weight="700">확정 뒤 응답 유실</text>
<text id="note44-0" x="1370" y="1893" font-size="25" fill="#233247" text-anchor="start" font-weight="400">같은 K1로 접수 결과 조회. 새 업무 ID로 재실행하지 않음.</text>
<text id="note44-1" x="1370" y="1929.25" font-size="25" fill="#233247" text-anchor="start" font-weight="400">W1 뒤 D2 전 단절: 업무 원본 유지, receipt / cursor 재결합.</text>
<text id="note45-0" x="2640" y="1848" font-size="27" fill="#233247" text-anchor="start" font-weight="700">정정과 전송의 경합</text>
<text id="note46-0" x="2640" y="1893" font-size="25" fill="#233247" text-anchor="start" font-weight="400">hold가 CAS보다 먼저: K1 보류 후 새 K2로 교체.</text>
<text id="note46-1" x="2640" y="1929.25" font-size="25" fill="#233247" text-anchor="start" font-weight="400">CAS가 먼저: 외부 효력을 조회하고 지원되는 정정 / 취소.</text>
<text id="note47-0" x="64" y="2030" font-size="25" fill="#596A7C" text-anchor="start" font-weight="400">각 줄은 설명용 정상 실행 순서다. 입력 수신과 다른 Task는 계속된다. 모델 / 네트워크 / 실제 출력 대기는 local transaction 밖이다.</text>
<text id="note48-0" x="64" y="2073" font-size="25" fill="#A65E2E" text-anchor="start" font-weight="400">내부 접수 ACCEPTED ≠ 외부 EXTERNAL_ACCEPTED ≠ 사용자 실제 제시. 전송 timeout은 UNKNOWN이며 외부 확인 없이 새 start를 만들지 않는다.</text>
<text id="note49-0" x="64" y="2116" font-size="24" fill="#596A7C" text-anchor="start" font-weight="400">B: W2는 D2를 기다리지 않는다. 같은 ID의 같은 payload는 저장된 결과를 반환하고, 다른 payload는 거절한다. 늦은 release는 새 hold를 해제하지 않는다.</text>
</g></svg>

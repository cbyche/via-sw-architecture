<polyline id="n3" points="54,103 1866,103" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<rect id="n4" fill="#F4F7FA" stroke="#CDD6DE" stroke-width="1.7" x="54" y="129" width="1812" height="103"/>
<text id="n5-0" data-width="170" x="72" y="159.4" text-anchor="start" font-size="20" font-weight="700" fill="#18232E">같은 사건</text>
<text id="n6-0" data-width="1600" x="241" y="161.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">Request Controller가 R1 rev2를 채택한다. rev1에 의존한 J1은 더는 유효하지 않다.</text>
<text id="n7-0" data-width="1600" x="241" y="194.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">취소 요청 뒤에도 provider가 J1을 끝낼 수 있다. 결과 폐기와 실제 실행 종료는 구별한다.</text>
<rect id="n8" fill="#EAF2FB" stroke="#CDD6DE" stroke-width="1.7" x="54" y="263" width="1812" height="54"/>
<text id="n9-0" data-width="1740" x="75" y="298.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">A  Job Index에서 무효화하고 Event Mailbox 완료를 폐기</text>

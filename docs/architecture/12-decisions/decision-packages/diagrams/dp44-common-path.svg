<text x="2318.0" y="1082.0" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Downstream Agent</text><text x="2318.0" y="1108.0" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">비동기 질문 / 결과</text>
</g>
<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">DP-44  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="129.0" text-anchor="start" font-size="42" font-weight="700" fill="#263445">DP-44의 공통 대화 경로와 A/B 비교 범위</text></g>
<g id="e5"><text x="64" y="174.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">핵심은 Interaction Manager, Request Controller, Response Manager의 협력. 업무 사실 확인과 업무 제어는 양안 공통이다.</text></g>
<g id="e10"><text x="104" y="438" text-anchor="start" font-size="28" font-weight="400" fill="#263445">계속 듣기와 입력 취득</text><text x="104" y="496" text-anchor="start" font-size="28" font-weight="400" fill="#263445">입력 시작 알림과 전사 전달</text><text x="104" y="554" text-anchor="start" font-size="28" font-weight="400" fill="#263445">발화 중 끼어들면 즉시 중단</text><text x="104" y="612" text-anchor="start" font-size="28" font-weight="400" fill="#263445">허용된 Text와 음성 실제 전달</text><text x="104" y="670" text-anchor="start" font-size="28" font-weight="400" fill="#263445">실제 전달 범위 확인</text></g>
<g id="e11"><text x="864" y="438" text-anchor="start" font-size="28" font-weight="400" fill="#263445">입력 해석 요청과 의미 채택</text><text x="864" y="496" text-anchor="start" font-size="28" font-weight="400" fill="#263445">대화, Request와 질문 연결</text><text x="864" y="554" text-anchor="start" font-size="28" font-weight="400" fill="#263445">정정 범위와 미전송 hold</text><text x="864" y="612" text-anchor="start" font-size="28" font-weight="400" fill="#263445">채택한 입력을 후속 실행에 연결</text><text x="864" y="670" text-anchor="start" font-size="28" font-weight="400" fill="#263445">Task Manager와 업무 제어</text></g>
<g id="e12"><text x="1824" y="437" text-anchor="start" font-size="27" font-weight="400" fill="#263445">응답 내용과 음성 준비</text><text x="1824" y="495" text-anchor="start" font-size="27" font-weight="400" fill="#263445">대기 후보의 게시 차례 관리</text><text x="1824" y="553" text-anchor="start" font-size="27" font-weight="400" fill="#263445">현재성, 권한과 중복 최종 검사</text><text x="1824" y="611" text-anchor="start" font-size="27" font-weight="400" fill="#263445">Interaction Manager에 release</text><text x="1824" y="669" text-anchor="start" font-size="27" font-weight="400" fill="#263445">실제 전달 기록의 내구 저장</text></g>
<g id="e17"><text x="894" y="1103" text-anchor="start" font-size="23" font-weight="400" fill="#263445">업무 원본 확인과 저장</text><text x="894" y="1138" text-anchor="start" font-size="23" font-weight="400" fill="#263445">질문 / 결과 / command 상태</text></g>
<g id="e18"><text x="1640" y="1103" text-anchor="start" font-size="23" font-weight="400" fill="#263445">외부 사건 접수</text><text x="1640" y="1138" text-anchor="start" font-size="23" font-weight="400" fill="#263445">명령 전달</text></g>
<g id="e20" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="100" y="936.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">1 발화</text></g>
<g id="e22" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="682" y="561.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">2 입력</text><text x="682" y="588.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">onset / 전사</text></g>
<g id="e25" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2043" y="1076.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">3 접수</text></g>
<g id="e26" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1496" y="1076.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">3 확인</text></g>
<g id="e28" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1326" y="934.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">4 확인 사실</text></g>
<g id="e30" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="887" y="934.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">공통 업무 명령</text></g>
<g id="e31"><text x="864" y="1243.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">Request Controller ↔ Task Manager: A/B 공통</text></g>
<g id="e33" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1640" y="561.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">5 채택 입력</text><text x="1640" y="588.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">허용 Notice</text></g>
<g id="e35" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="922" y="242.0" text-anchor="start" font-size="22" font-weight="400" fill="#263445">6 내용 / 음성 / release → 실제 출력</text></g>
<g id="e37" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="440" y="936.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">7 실제 전달</text></g>
<g id="e39" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1500" y="911.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">8 actual receipt / 내구 저장</text></g>
<g id="e41" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1640" y="759.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">8 Presented</text><text x="1640" y="783.3" text-anchor="start" font-size="18" font-weight="400" fill="#263445">질문 focus</text></g>
<g id="e43"><text x="64" y="1300" text-anchor="start" font-size="23" font-weight="400" fill="#263445">A/B 차이: 입력과 확인된 업무 사건으로 시작한 이해 / 준비 / 게시의 완료, 대기, 정정과 취소를 누가 이어가는가.</text><text x="64" y="1339" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Interpreter, Context Manager, Policy Manager, State Store, Model Access의 공통 기능은 아래 상세 구조에서 유지한다.</text></g>
<g id="e44"><text x="64" y="1397.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">직각 = Component  /  육각형 = 사용자 또는 외부 Agent  /  실선 = 입력 및 요청  /  점선 = 확인된 사건과 전달 사실</text></g>
<g id="e45"><text x="2496" y="1428.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">공통 계약 설명 / A/B 미선정 / 미측정</text></g>
</g></svg>

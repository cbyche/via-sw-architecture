<g id="scenario"><rect x="48" y="142" width="2464" height="104" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="170" font-size="20" font-weight="700" fill="#171717">사용자 상황</text><text x="64" y="206" font-size="20" fill="#171717">“이 표로 보고서를 만들고 끝나면 메일을 준비해줘.” 수신인 질문에 답하기 전에 다른 업무로 전환하고 VIA가 재시작된다.</text></g>
<g id="lane0"><rect x="48" y="380" width="246" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="408" font-size="20" font-weight="700" fill="#171717">사용자 대화</text></g>
<g id="e00"><rect x="330" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="346" y="408" font-size="20" font-weight="700" fill="#171717">복합 요청</text><text x="346" y="444" font-size="20" fill="#171717">보고서 결과 → 메일 준비</text><text x="346" y="469" font-size="20" fill="#171717">VIA는 상호작용 진행만 소유</text></g>
<g id="e01"><rect x="870" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="886" y="408" font-size="20" font-weight="700" fill="#171717">사용자 질문</text><text x="886" y="444" font-size="20" fill="#171717">수신인을 질문 / WAIT_USER</text><text x="886" y="469" font-size="20" fill="#171717">Omni KV 점유는 해제</text></g>
<g id="e02"><rect x="1410" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="408" font-size="20" font-weight="700" fill="#171717">교차 사건</text><text x="1426" y="444" font-size="20" fill="#171717">다른 대화·정정·취소</text><text x="1426" y="469" font-size="20" fill="#171717">현재 Request revision 증가</text></g>
<g id="e03"><rect x="1950" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="408" font-size="20" font-weight="700" fill="#171717">답변 후 재개</text><text x="1966" y="444" font-size="20" fill="#171717">맞는 질문·Request에 연결</text><text x="1966" y="469" font-size="20" fill="#171717">옛 조건의 실행은 차단</text></g>
<g id="lane1"><rect x="48" y="542" width="246" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="570" font-size="20" font-weight="700" fill="#171717">진행 상태</text></g>
<g id="e10"><rect x="330" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="346" y="570" font-size="20" font-weight="700" fill="#171717">graph 진행</text><text x="346" y="606" font-size="20" fill="#171717">선행 결과·질문·admission</text><text x="346" y="631" font-size="20" fill="#171717">Task 실행 자체는 Task Manager</text></g>
<g id="e11"><rect x="870" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="886" y="570" font-size="20" font-weight="700" fill="#171717">durable wait</text><text x="886" y="606" font-size="20" fill="#171717">대기 이유·timer·effect intent</text><text x="886" y="631" font-size="20" fill="#171717">target도 이미 기록한다</text></g>
<g id="e12"><rect x="1410" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="570" font-size="20" font-weight="700" fill="#171717">crash / 재시작</text><text x="1426" y="606" font-size="20" fill="#171717">signal 중복·timer 만료</text><text x="1426" y="631" font-size="20" fill="#171717">같은 activity ID로 확인</text></g>
<g id="e13"><rect x="1950" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="570" font-size="20" font-weight="700" fill="#171717">계속할 위치</text><text x="1966" y="606" font-size="20" fill="#171717">현재 revision의 continuation</text><text x="1966" y="631" font-size="20" fill="#171717">모델을 replay해서 복원하지 않음</text></g>
<g id="lane2"><rect x="48" y="704" width="246" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="732" font-size="20" font-weight="700" fill="#171717">책임의 위치</text></g>
<g id="e20"><rect x="330" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="346" y="732" font-size="20" font-weight="700" fill="#171717">target controller</text><text x="346" y="768" font-size="20" fill="#171717">Request Controller가 graph 진행</text><text x="346" y="793" font-size="20" fill="#171717">domain UoW + outbox</text></g>
<g id="e21"><rect x="870" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="886" y="732" font-size="20" font-weight="700" fill="#171717">대안 실행체</text><text x="886" y="768" font-size="20" fill="#171717">Interaction Workflow Runtime</text><text x="886" y="793" font-size="20" fill="#171717">진행·질문·대기 상태 소유</text></g>
<g id="e22"><rect x="1410" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="732" font-size="20" font-weight="700" fill="#171717">owner 협력</text><text x="1426" y="768" font-size="20" fill="#171717">의미·Task·기억의 owner 유지</text><text x="1426" y="793" font-size="20" fill="#171717">고정 VIA activity만 호출</text></g>
<g id="e23"><rect x="1950" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="732" font-size="20" font-weight="700" fill="#171717">구조적 대가</text><text x="1966" y="768" font-size="20" fill="#171717">signal / timer / continuation</text><text x="1966" y="793" font-size="20" fill="#171717">버전 호환·중복 계약 유지</text></g>
<g id="pressure0"><rect x="48" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="953" font-size="20" font-weight="700" fill="#171717">왜 VIA에 중요한가</text><text x="64" y="989" font-size="20" fill="#171717">긴 Agent 업무와 짧은 사용자 대화가 겹친다.</text><text x="64" y="1014" font-size="20" fill="#171717">잘못된 재개는 옛 요청·다른 질문을 실행한다.</text><text x="64" y="1039" font-size="20" fill="#171717">재시작 후도 동일 대화와 업무 관계를 이어야 한다.</text></g>
<g id="pressure1"><rect x="884" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="900" y="953" font-size="20" font-weight="700" fill="#171717">왜 Architecture 문제인가</text><text x="900" y="989" font-size="20" fill="#171717">진행 상태를 domain controller가 직접 소유할지,</text><text x="900" y="1014" font-size="20" fill="#171717">별도 실행체에 continuation을 맡길지 결정한다.</text><text x="900" y="1039" font-size="20" fill="#171717">상태·수명·호출·버전 계약의 주체가 바뀐다.</text></g>
<g id="pressure2"><rect x="1720" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1736" y="953" font-size="20" font-weight="700" fill="#171717">공정한 대안의 조건</text><text x="1736" y="989" font-size="20" fill="#171717">양안 모두 durable wait·중복 방지·KV 해제를 갖춘다.</text><text x="1736" y="1014" font-size="20" fill="#171717">별도 서버나 자동 병렬화의 효과를 주장하지 않는다.</text><text x="1736" y="1039" font-size="20" fill="#171717">Agent의 업무 planning을 VIA로 옮기지 않는다.</text></g>
<g id="challenge"><rect x="48" y="1170" width="2464" height="170" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="1198" font-size="20" font-weight="700" fill="#171717">Architecture Challenge</text><text x="64" y="1234" font-size="20" fill="#171717">Request Controller가 진행·대기·재개를 직접 관리할 것인가, 별도 workflow 실행체가 continuation을 소유하고 owner들을 호출할 것인가?</text></g>
<text x="48" y="58" font-size="38" font-weight="700" fill="#171717">대기와 재개 · 대화가 끊겨도 요청의 진행 관계는 이어져야 한다  |  배경</text>

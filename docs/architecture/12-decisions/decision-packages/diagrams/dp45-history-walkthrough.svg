<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">DP-45  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="129.0" text-anchor="start" font-size="42" font-weight="700" fill="#263445">같은 과거 기록을 이번 요청의 근거로 만드는 두 구조</text></g>
<g id="e5"><text x="64" y="174.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">R23: “지난번 설명한 평가 기준으로 제품 비교와 견적을 이번 제안서에 반영해줘.” 후보 ID는 조회 후 발견한다.</text></g>
<g id="e7"><text x="64" y="268.0" text-anchor="start" font-size="32" font-weight="700" fill="#263445">A 원본 서비스 조합형</text></g>
<g id="e11"><text x="104" y="1011" text-anchor="start" font-size="22" font-weight="400" fill="#263445">현재 R23 / 허용 범위</text><text x="104" y="1044" text-anchor="start" font-size="22" font-weight="400" fill="#263445">후보 발견 / 추가 조회</text><text x="104" y="1077" text-anchor="start" font-size="22" font-weight="400" fill="#263445">현재 조건과 Task 의미 제안</text></g>
<g id="e16" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="809" y="481.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">원본 port의 검색 / 범위 읽기 / 반환</text></g>
<g id="e21" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="86" y="761.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">1 현재 조회 → / 3 Bundle 반환 ←</text></g>
<g id="e22"><text x="516" y="1000" text-anchor="start" font-size="22" font-weight="400" fill="#263445">필요한 원본을 추가 조회 / 누락 해결</text><text x="516" y="1036" text-anchor="start" font-size="22" font-weight="400" fill="#263445">요청별 구성 책임은 Composer에 유지</text></g>
<g id="e23"><text x="86" y="585" text-anchor="start" font-size="21" font-weight="400" fill="#263445">현재 조회가 원본 조합을 시작</text><text x="86" y="621" text-anchor="start" font-size="21" font-weight="400" fill="#263445">조건부 의미 가공: Model Access</text><text x="86" y="657" text-anchor="start" font-size="21" font-weight="400" fill="#263445">→ 같은 클라우드 의미 LLM</text><text x="86" y="693" text-anchor="start" font-size="21" font-weight="400" fill="#263445">현재 해석 호출도 양안에 유지</text></g>
<g id="e24"><text x="84" y="1186" text-anchor="start" font-size="23" font-weight="400" fill="#263445">같은 반환: 실제 설명[0:52] + 제품/견적 결과 참조 + 출처 / revision / 누락</text><text x="84" y="1222" text-anchor="start" font-size="23" font-weight="400" fill="#263445">이 예시에는 REVISES가 없다. 정정 채택 후에만 추가한다.</text></g>
<g id="e25"><text x="1312" y="268.0" text-anchor="start" font-size="32" font-weight="700" fill="#263445">B 공통 파생 기억 저장소형</text></g>
<g id="e29"><text x="1352" y="1011" text-anchor="start" font-size="22" font-weight="400" fill="#263445">현재 R23 / 허용 범위</text><text x="1352" y="1044" text-anchor="start" font-size="22" font-weight="400" fill="#263445">후보 발견 / 추가 조회</text><text x="1352" y="1077" text-anchor="start" font-size="22" font-weight="400" fill="#263445">현재 조건과 Task 의미 제안</text></g>
<g id="e34" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1337" y="484.0" text-anchor="start" font-size="21" font-weight="400" fill="#263445">1 확정 변경 → 원본 읽기</text></g>
<g id="e39" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1337" y="761.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">4 현재 조회 → / 5 Bundle 반환 ←</text></g>
<g id="e40"><text x="1764" y="1022" text-anchor="start" font-size="22" font-weight="400" fill="#263445">원문 locator / 권한 / revision 확인</text><text x="1764" y="1056" text-anchor="start" font-size="22" font-weight="400" fill="#263445">미생산: 생산 / 게시 후 Reader 재조회</text><text x="1764" y="1090" text-anchor="start" font-size="22" font-weight="400" fill="#263445">표현 미지원: 제한 또는 명시 B+</text></g>
<g id="e41"><text x="1334" y="585" text-anchor="start" font-size="21" font-weight="400" fill="#263445">과거 생산과 현재 조회는 다른 시작점</text><text x="1334" y="621" text-anchor="start" font-size="21" font-weight="400" fill="#263445">조건부 의미 가공: Model Access</text><text x="1334" y="657" text-anchor="start" font-size="21" font-weight="400" fill="#263445">→ 같은 클라우드 의미 LLM</text><text x="1334" y="693" text-anchor="start" font-size="21" font-weight="400" fill="#263445">현재 해석 호출도 양안에 유지</text></g>
<g id="e42"><text x="1332" y="1186" text-anchor="start" font-size="23" font-weight="400" fill="#263445">같은 반환: 실제 설명[0:52] + 제품/견적 결과 참조 + 출처 / revision / 누락</text><text x="1332" y="1222" text-anchor="start" font-size="23" font-weight="400" fill="#263445">이 예시에는 REVISES가 없다. 정정 채택 후에만 추가한다.</text></g>
<g id="e44"><text x="64" y="1312" text-anchor="start" font-size="24" font-weight="400" fill="#263445">공통 후속: Request Interpreter의 현재 의미 제안 → Request Controller의 채택 → Task Manager / Agent Gateway의 위임</text><text x="64" y="1351" text-anchor="start" font-size="24" font-weight="400" fill="#263445">기준 적용과 제안서 작성은 Downstream Agent가 수행. 입력은 생산 대기를 하지 않는다.</text></g>
<g id="e45"><text x="64" y="1401.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">검정 = 공통, 살구색 = 구성 / 생산 / 읽기 책임의 차이. 화살표는 왕복 읽기의 시작 경로를 축약. 설계 예시 / 미선정 / 미측정.</text></g>
</g></svg>

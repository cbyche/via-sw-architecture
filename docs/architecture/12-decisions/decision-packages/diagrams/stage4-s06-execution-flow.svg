<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">S-06 / 실행 순서  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="129.0" text-anchor="start" font-size="42" font-weight="700" fill="#263445">같은 원음을 누가 글과 발화 시간 정보로 바꾸는가</text></g>
<g id="e5"><text x="64" y="174.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">원음 수집과 즉시 재생 중단은 공통. T는 ASR와 Omni에 병행 전달하고 A는 공유 Omni에서 인식한다.</text></g>
<g id="e8"><text x="88" y="284.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">T / 독립 Streaming ASR가 인식 근거 생산</text></g>
<g id="e24" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="466.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">1. 원음 도착 → 발화 시작과 즉시 재생 중단</text></g>
<g id="e26" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="585" y="540.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">2. 원음과 시각을 독립 인식 경로에 전달</text></g>
<g id="e28" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="585" y="614.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">3. 같은 원음을 공유 Omni 음성 역할에도 병행 전달</text></g>
<g id="e30" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="939" y="688.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">4. 음성 인식 요청</text></g>
<g id="e32" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="939" y="762.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">5. 인식 문장, 수정과 발화 시간 반환</text></g>
<g id="e34" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="585" y="836.0" text-anchor="start" font-size="20" font-weight="400" fill="#195FBD">6. 인식 근거와 누락 범위 반환</text></g>
<g id="e36" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1645" y="910.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">7. 공유 Omni 음성 역할에 원음 전달</text></g>
<g id="e38" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1645" y="984.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">8. 공유 Omni 음성 결과 반환</text></g>
<g id="e40" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="585" y="1058.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">9. Omni 결과 전달 / ASR와 불일치 보존</text></g>
<g id="e42" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="585" y="1132.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">10. 당시 화면과 연결한 정규 입력 전달</text></g>
<g id="e43"><text x="88" y="1224.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">Omni 장애에도 녹음과 독립 ASR의 인식은 계속될 수 있다. 의미 해석과 음성 생성은 멈춘다.</text></g>
<g id="e45"><text x="88" y="1354.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">A / 공유 Omni가 인식 근거까지 생산</text></g>
<g id="e50"><text x="927" y="1440.0" text-anchor="middle" font-size="18" font-weight="400" fill="#5B697B">별도 Worker 없음</text></g>
<g id="e51"><text x="1280" y="1440.0" text-anchor="middle" font-size="18" font-weight="400" fill="#5B697B">별도 ASR 없음</text></g>
<g id="e59" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="1536.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">1. 원음 도착 → 발화 시작과 즉시 재생 중단</text></g>
<g id="e61" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="585" y="1610.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">2. 원음을 Shared Inference Service에 전달</text></g>
<g id="e63" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1645" y="1684.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">3. 공유 Omni에 인식 요청</text></g>
<g id="e65" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1645" y="1758.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">4. 인식 결과 반환 → Adapter가 제공된 정보 변환</text></g>
<g id="e67" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="585" y="1832.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">5. 변환한 문장, 시각과 누락 범위 반환</text></g>
<g id="e69" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="585" y="1906.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">6. 당시 화면과 연결한 정규 입력 전달</text></g>
<g id="e70"><text x="88" y="1998.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">Omni 장애에는 녹음과 local stop만 계속된다. 인식이 멈춘 구간은 복구 가능 여부를 구별해 기록한다.</text></g>
<g id="e72"><text x="64" y="2341.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">색:  검정 = 공통     파랑 = T 전용     초록 = A/B 전용</text></g>
<g id="e73"><text x="2496" y="2340.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달     점선 → 결과/복원</text></g>
<g id="e74"><text x="64" y="2377.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">모양:  제목 칸이 있는 박스 = Component   |   내부 둥근 박스 = Module   |   원통 = 저장소   |   접힌 종이 = 자료   |   육각형 = 연동 대상/모델</text></g>
<g id="e75"><text x="64" y="2417.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">모델과 실행 경계를 구분한다. Native Evidence Adapter는 인식하지 않고 모델 결과를 VIA 입력 형식으로 변환한다.</text></g>
<g id="e76"><text x="2496" y="2417.0" text-anchor="end" font-size="17" font-weight="400" fill="#5B697B">탐색안 / 미채택 / 미측정</text></g>
</g></svg>

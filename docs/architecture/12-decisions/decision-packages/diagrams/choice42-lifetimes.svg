<g id="e2"><text x="64" y="55.0" text-anchor="start" font-size="28" font-weight="700" fill="#5B697B">VIA / DECISION POINT CANDIDATE</text></g>
<g id="e3"><text x="2496" y="55.0" text-anchor="end" font-size="28" font-weight="400" fill="#5B697B">42  /  설계 비교</text></g>
<g id="e4"><text x="64" y="132.0" text-anchor="start" font-size="49" font-weight="700" fill="#263445">같은 사용자 사례, 서로 다른 수명</text></g>
<g id="e5"><text x="64" y="182.0" text-anchor="start" font-size="28" font-weight="400" fill="#5B697B">A와 B 모두 지원해야 하는 기능이다.  기록의 수명과 owner process의 수명은 별개다.</text></g>
<g id="e7"><text x="535" y="282.0" text-anchor="middle" font-size="25" font-weight="700" fill="#5B697B">E1</text></g>
<g id="e8"><text x="535" y="330.0" text-anchor="middle" font-size="30" font-weight="700" fill="#263445">보고서 요청</text></g>
<g id="e9"><text x="535" y="369.0" text-anchor="middle" font-size="25" font-weight="400" fill="#5B697B">Agent 접수</text></g>
<g id="e11"><text x="865" y="282.0" text-anchor="middle" font-size="25" font-weight="700" fill="#5B697B">E2</text></g>
<g id="e12"><text x="865" y="330.0" text-anchor="middle" font-size="30" font-weight="700" fill="#263445">기간 질문</text></g>
<g id="e13"><text x="865" y="369.0" text-anchor="middle" font-size="25" font-weight="400" fill="#5B697B">C1에 제시</text></g>
<g id="e15"><text x="1195" y="282.0" text-anchor="middle" font-size="25" font-weight="700" fill="#5B697B">E3</text></g>
<g id="e16"><text x="1195" y="330.0" text-anchor="middle" font-size="30" font-weight="700" fill="#263445">다른 대화 C2</text></g>
<g id="e17"><text x="1195" y="369.0" text-anchor="middle" font-size="25" font-weight="400" fill="#5B697B">업무는 유지</text></g>
<g id="e19"><text x="1525" y="282.0" text-anchor="middle" font-size="25" font-weight="700" fill="#5B697B">E4</text></g>
<g id="e20"><text x="1525" y="330.0" text-anchor="middle" font-size="30" font-weight="700" fill="#263445">C1에서 답변</text></g>
<g id="e21"><text x="1525" y="369.0" text-anchor="middle" font-size="25" font-weight="400" fill="#5B697B">“상반기로”</text></g>
<g id="e23"><text x="1855" y="282.0" text-anchor="middle" font-size="25" font-weight="700" fill="#5B697B">E5</text></g>
<g id="e24"><text x="1855" y="330.0" text-anchor="middle" font-size="30" font-weight="700" fill="#263445">보고서 완료</text></g>
<g id="e25"><text x="1855" y="369.0" text-anchor="middle" font-size="25" font-weight="400" fill="#5B697B">X1 종료</text></g>
<g id="e27"><text x="2185" y="282.0" text-anchor="middle" font-size="25" font-weight="700" fill="#5B697B">E6</text></g>
<g id="e28"><text x="2185" y="330.0" text-anchor="middle" font-size="30" font-weight="700" fill="#263445">결론 수정</text></g>
<g id="e29"><text x="2185" y="369.0" text-anchor="middle" font-size="25" font-weight="400" fill="#5B697B">X2 시작</text></g>
<g id="e31"><text x="72" y="499.0" text-anchor="start" font-size="31" font-weight="700" fill="#263445">Conversation</text></g>
<g id="e32"><text x="72" y="538.0" text-anchor="start" font-size="25" font-weight="400" fill="#5B697B">대화·참조</text></g>
<g id="e33"><text x="72" y="649.0" text-anchor="start" font-size="31" font-weight="700" fill="#263445">Request</text></g>
<g id="e34"><text x="72" y="688.0" text-anchor="start" font-size="25" font-weight="400" fill="#5B697B">요청 처리</text></g>
<g id="e35"><text x="72" y="799.0" text-anchor="start" font-size="31" font-weight="700" fill="#263445">Question</text></g>
<g id="e36"><text x="72" y="838.0" text-anchor="start" font-size="25" font-weight="400" fill="#5B697B">질문</text></g>
<g id="e37"><text x="72" y="949.0" text-anchor="start" font-size="31" font-weight="700" fill="#263445">Task</text></g>
<g id="e38"><text x="72" y="988.0" text-anchor="start" font-size="25" font-weight="400" fill="#5B697B">사용자 업무</text></g>
<g id="e39"><text x="72" y="1099.0" text-anchor="start" font-size="31" font-weight="700" fill="#263445">Execution</text></g>
<g id="e40"><text x="72" y="1138.0" text-anchor="start" font-size="25" font-weight="400" fill="#5B697B">외부 실행</text></g>
<g id="e42"><text x="1450.0" y="501.0" text-anchor="middle" font-size="26" font-weight="700" fill="#263445">C1  기록·참조는 유지 / 화면에서 다른 대화로 이동해도 삭제·취소되지 않음</text></g>
<g id="e44"><text x="1275.0" y="575.0" text-anchor="middle" font-size="26" font-weight="700" fill="#263445">C2</text></g>
<g id="e46"><text x="585.0" y="671.0" text-anchor="middle" font-size="26" font-weight="700" fill="#263445">R1 위임 접수</text></g>
<g id="e48"><text x="1560.0" y="671.0" text-anchor="middle" font-size="26" font-weight="700" fill="#263445">답변 요청</text></g>
<g id="e50"><text x="2265.0" y="671.0" text-anchor="middle" font-size="26" font-weight="700" fill="#263445">후속 수정 요청</text></g>
<g id="e52"><text x="1220.0" y="821.0" text-anchor="middle" font-size="26" font-weight="700" fill="#263445">Q1  Agent 질문 → 실제 제시 P1 → 유효한 답변</text></g>
<g id="e54"><text x="1450.0" y="971.0" text-anchor="middle" font-size="26" font-weight="700" fill="#263445">T1  같은 업무 identity / 결과 보존 → 수정 시 revision 증가</text></g>
<g id="e56"><text x="1200.0" y="1121.0" text-anchor="middle" font-size="26" font-weight="700" fill="#263445">X1  외부 실행 → 완료 / 완료 이력 유지</text></g>
<g id="e58"><text x="2265.0" y="1121.0" text-anchor="middle" font-size="26" font-weight="700" fill="#263445">X2  새 실행</text></g>
<g id="e59"><text x="72" y="1270.0" text-anchor="start" font-size="35" font-weight="700" fill="#263445">대화 종료 ≠ 요청 완료 ≠ Task 종료 ≠ 외부 실행 종료 ≠ 기록 삭제</text></g>
<g id="e61"><text x="64" y="1383.0" text-anchor="start" font-size="28" font-weight="400" fill="#5B697B">검정: 공통  ·  파랑: A  ·  초록: B     실선: 요청·변경  /  점선 화살표: 반환·조회 결과</text></g>
<g id="e62"><text x="2496" y="1420.0" text-anchor="end" font-size="21" font-weight="400" fill="#5B697B">시간축은 사건 순서만 표시하며 실제 소요시간·저장 기간을 뜻하지 않음</text></g>
</g></svg>

<g id="e70" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1742" y="1518.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">후보 반환 / 현재 유효성 확인</text></g>
<g id="e74"><text x="1348" y="1849.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">source 요청/반환: A 관측 획득 / B 객체 읽기, 유효성 재확인</text></g>
<g id="e76"><text x="64" y="2157.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">검정 = 공통 / 파랑 = A 고유 / 초록 = B 고유 / 색은 우위가 아님</text></g>
<g id="e77"><text x="2496" y="2156.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달 / 점선 → 반환/확인</text></g>
<g id="e78"><text x="64" y="2193.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">제목 상자 = Component / 내부 둥근 상자 = Module / 원통 = 저장 / 접힌 종이 = 자료 / 육각형 = 연동 대상</text></g>
<g id="e79"><text x="64" y="2229.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">설계안 / 미선정 / 미측정. Component 이름의 반복은 같은 owner의 다른 역할을 설명할 수 있다.</text></g>
</g></svg>

<g id="pressure0"><rect x="48" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="953" font-size="20" font-weight="700" fill="#171717">왜 VIA에 중요한가</text><text x="64" y="989" font-size="20" fill="#171717">대화 속 표현만으로 과거 자료를 다시 찾는다.</text><text x="64" y="1014" font-size="20" fill="#171717">후보 누락은 재질문·잘못된 자료 전달로 이어진다.</text><text x="64" y="1039" font-size="20" fill="#171717">검색 점수로 Action 대상을 확정할 수는 없다.</text></g>
<g id="pressure1"><rect x="884" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="900" y="953" font-size="20" font-weight="700" fill="#171717">왜 Architecture 문제인가</text><text x="900" y="989" font-size="20" fill="#171717">source 조회를 반복할지 검색 자산을 유지할지 결정한다.</text><text x="900" y="1014" font-size="20" fill="#171717">추가 helper·worker·저장소·삭제 경로가 생긴다.</text><text x="900" y="1039" font-size="20" fill="#171717">요청 속도와 상시 유지 비용을 교환한다.</text></g>
<g id="pressure2"><rect x="1720" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1736" y="953" font-size="20" font-weight="700" fill="#171717">공정한 대안의 조건</text><text x="1736" y="989" font-size="20" fill="#171717">동일 자료·권한·사용자 목표를 유지한다.</text><text x="1736" y="1014" font-size="20" fill="#171717">target의 기존 cache·summary를 제거하지 않는다.</text><text x="1736" y="1039" font-size="20" fill="#171717">embedding 지원·효과는 구현 전 설계 가정이다.</text></g>
<g id="challenge"><rect x="48" y="1170" width="2464" height="170" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="1198" font-size="20" font-weight="700" fill="#171717">Architecture Challenge</text><text x="64" y="1234" font-size="20" fill="#171717">요청마다 owner의 자료를 조회할 것인가, 별도 색인 생산체와 검색 서비스를 유지하고 현재 원문을 다시 검증할 것인가?</text></g>

<text x="1089" y="380" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">① 확정된 목표 전달</text>
<text x="1925" y="380" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">① 확정된 목표 전달</text>
<text x="148" y="600" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">② 목표 관계와 대기 조건 생성</text>
<text x="133" y="885" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">③ graph, 질문 identity와 전이 저장</text>
<text x="130" y="515" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">④ 사용자 답변 또는 Task 결과</text>
<text x="518" y="560" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">⑤ 후속 요청 제안 반환</text>
<text x="468" y="1095" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">⑥ 현재성 확인 뒤 명령 전달</text>
<text x="168" y="825" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">⑦ 재시작 뒤 graph 복원</text>
<text x="1024" y="600" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">② continuation 시작 signal</text>
<text x="939" y="885" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">③ continuation, signal과 activity intent 저장</text>
<text x="966" y="515" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">④ 답변 또는 결과 signal</text>
<text x="1374" y="560" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">⑤ admission 요청 반환</text>
<text x="1304" y="1095" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">⑥ 현재성 확인 뒤 명령 전달</text>
<text x="989" y="825" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">⑦ 재시작 뒤 continuation 복원</text>
<text x="1815" y="600" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">② 세션 메모리에 목표 관계 생성</text>
<text x="1802" y="515" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">③ 답변 또는 결과 수신</text>
<text x="2195" y="560" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">④ 후속 요청 제안 반환</text>
<text x="1845" y="835" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">⑤ Task, command와 publication 원장만 저장</text>
<text x="2140" y="1095" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">⑥ 현재성 확인 뒤 명령 전달</text>
<text x="48" y="58" font-size="38" font-weight="700" fill="#171717">S-04  |  대기 중인 목표를 어디에 기록하고 어떻게 다시 잇는가</text>
<text x="48" y="104" font-size="22" font-weight="400" fill="#171717">공통 Component는 같은 위치 / T는 domain graph / A는 workflow continuation / B는 세션 메모리만 사용</text>
<text x="48" y="1414" font-size="18" font-weight="400" fill="#171717">VIA / Stage 4 / 구조 탐색, 미채택 대안 / 구현 및 측정 결과 아님</text>
<text x="72" y="215" font-size="28" font-weight="700" fill="#171717">T  실제 reviewed target</text>
<text x="908" y="215" font-size="28" font-weight="700" fill="#171717">A  대안 구조</text>
<text x="1744" y="215" font-size="28" font-weight="700" fill="#171717">B  기능을 제한한 대안</text>
<text x="48" y="1345" font-size="21" font-weight="400" fill="#171717">박스: Component, 서브시스템, 논리 실행체 또는 저장소 이름 / 번호 화살표: 동작과 순서 / 검정: 공통 / 파랑: 달라지는 구조</text>
<text x="118" y="1240" font-size="18" font-weight="400" fill="#1458C0">차이: 대기와 질문의 권위 원본이 VIA domain 상태다.</text>
<text x="118" y="1268" font-size="18" font-weight="400" fill="#1458C0">외부 실행 결과는 source에서 다시 확인한다.</text>
<text x="954" y="1240" font-size="18" font-weight="400" fill="#1458C0">차이: 대기와 재개의 권위 원본이 workflow continuation이다.</text>
<text x="954" y="1268" font-size="18" font-weight="400" fill="#1458C0">Task lifecycle과 Agent 실행 책임은 옮기지 않는다.</text>
<text x="1790" y="1240" font-size="18" font-weight="400" fill="#1458C0">재시작: 기존 Task는 source와 원장으로 확인한다.</text>
<text x="1790" y="1268" font-size="18" font-weight="400" fill="#1458C0">잃은 목표 관계와 질문은 복원하지 않고 사용자에게 다시 묻는다.</text>
<text x="48" y="1380" font-size="20" font-weight="400" fill="#171717">공통: Request Controller가 의미와 현재성을 최종 확인한다. 저장된 상태를 재생하는 것만으로 외부 실행 또는 실제 전달 성공을 만들지 않는다.</text>
</g></svg>

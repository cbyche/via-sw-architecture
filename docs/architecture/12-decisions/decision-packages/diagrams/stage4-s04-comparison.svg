<g id="1-store"><rect x="944" y="995" width="672" height="150" rx="8" fill="#F3F7FD" stroke="#1458C0" stroke-width="2.5"/><ellipse cx="1280.0" cy="1011" rx="336.0" ry="16" fill="#F3F7FD" stroke="#1458C0" stroke-width="2"/><text x="960" y="1041" font-size="20" font-weight="700" fill="#1458C0">Continuation Store</text><text x="960" y="1074" font-size="20" fill="#1458C0">같은 State Store 안의 논리 영역</text><text x="960" y="1099" font-size="20" fill="#1458C0">continuation + signal + activity intent</text></g>
<g id="2-rc"><rect x="1780" y="265" width="672" height="120" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1796" y="293" font-size="20" font-weight="700" fill="#171717">Request Controller</text><path d="M1780 310H2452" stroke="#171717" fill="none"/><text x="1796" y="329" font-size="20" fill="#171717">현재 입력과 최종 admission 유지</text></g>
<g id="2-volatile"><rect x="1780" y="535" width="672" height="170" rx="8" fill="#F3F7FD" stroke="#1458C0" stroke-width="2.5"/><text x="1796" y="563" font-size="20" font-weight="700" fill="#1458C0">세션 한정 요청 coordinator</text><path d="M1780 580H2452" stroke="#1458C0" fill="none"/><text x="1796" y="599" font-size="20" fill="#1458C0">목표 관계와 질문 focus는 RAM</text><text x="1796" y="624" font-size="20" fill="#1458C0">Core 재시작 때 그래프 복원 없음</text></g>
<g id="2-store"><rect x="1780" y="860" width="672" height="175" rx="8" fill="#F3F7FD" stroke="#1458C0" stroke-width="2.5"/><ellipse cx="2116.0" cy="876" rx="336.0" ry="16" fill="#F3F7FD" stroke="#1458C0" stroke-width="2"/><text x="1796" y="906" font-size="20" font-weight="700" fill="#1458C0">State Store</text><text x="1796" y="939" font-size="20" fill="#1458C0">Task, command와 publication 원장 유지</text><text x="1796" y="964" font-size="20" fill="#1458C0">대기 graph와 질문 continuation은 저장하지 않음</text></g>
<g id="2-task"><rect x="1780" y="1160" width="672" height="100" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1796" y="1188" font-size="20" font-weight="700" fill="#171717">Task Manager → Agent Gateway</text><text x="1796" y="1224" font-size="20" fill="#171717">기존 실행의 source 확인 및 중복 방지 유지</text></g>
<text x="148" y="725" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">owner 전이와 intent 원자 기록</text>
<text x="138" y="1040" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">host admission 뒤 command</text>
<text x="974" y="440" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">내구 시작 signal / 현재 Request</text>
<text x="1009" y="960" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">전이와 intent 원자 기록</text>
<text x="954" y="930" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">활동마다 현재 admission</text>
<text x="1825" y="470" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">세션 중 대기와 후속 조정</text>
<text x="1800" y="800" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">내구 command admission은 유지</text>
<text x="2160" y="450" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">후속 제안 / 현재성 검사</text>
<text x="1810" y="1110" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">현재 admission과 내구 원장 뒤 전달</text>
<text x="48" y="58" font-size="38" font-weight="700" fill="#171717">S-04  |  대기와 재개의 권위 원본을 선택한다</text>
<text x="48" y="104" font-size="22" font-weight="400" fill="#171717">T와 A는 내구 대기 복구 / B는 대기 graph 복구 포기, Task와 command 원장은 유지</text>
<text x="48" y="1414" font-size="18" font-weight="400" fill="#171717">VIA / Stage 4 / 구조 탐색, 미채택 대안 / 구현 및 측정 결과 아님</text>
<text x="72" y="215" font-size="28" font-weight="700" fill="#171717">T  실제 reviewed target</text>
<text x="908" y="215" font-size="28" font-weight="700" fill="#171717">A  대안 구조</text>
<text x="1744" y="215" font-size="28" font-weight="700" fill="#171717">B  기능을 제한한 대안</text>
<text x="48" y="1345" font-size="21" font-weight="400" fill="#171717">파랑: 바뀌는 책임과 자료 / 검정: 공통 책임 / 박스는 명시한 논리 구성 또는 runtime / 화살표 label의 경계를 비교</text>
<text x="949" y="1215" font-size="20" font-weight="400" fill="#171717">활동 → host admission → Task Manager → Agent Gateway</text>
<text x="949" y="1245" font-size="20" font-weight="400" fill="#171717">Agent 내부 계획과 외부 실행은 이동하지 않음</text>
<text x="48" y="1380" font-size="20" font-weight="400" fill="#171717">복구는 같은 업무의 상태 확인이다. 어떤 안도 workflow 재실행만으로 외부 exactly-once나 실제 청취를 보장하지 않는다.</text>
</g></svg>

<text x="998" y="1766.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">D14  GroundingProposal r2 / base version / raw dependency</text>
</g>
<g id="note19" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="1910.0" font-size="26" font-weight="400" text-anchor="start" fill="#263445">A: 새 lower extent와 keep/replace 의미를 같은 해석 책임이 직접 생산한다. crop/cache/부분 patch를 허용한다.</text>
</g>
<g id="note20" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="1965.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">공통: 결과 대기 중 capture / 전사 / local stop은 계속된다. Request Controller가 최신 revision, 사용권, 근거와 base version을 검사한다.</text>
</g>
<g id="note21" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="2015.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">채택 뒤에는 전체 요청 해석과 admission을 거쳐 응답 / 업무로 연결한다. 일부 지칭 실패는 해당 범위를 질문하며 앞의 의미를 임의 확정하지 않는다.</text>
</g>
<g id="note22" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="2065.0" font-size="23" font-weight="400" text-anchor="start" fill="#758294">B 모델 왕복과 candidate 완료 통지는 메시지에 축약했다. 구조도에서 실제 호출과 반환을 표시한다. D 간격과 병행 정도는 성능 주장이 아니다.</text>
</g>
<g id="note23" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="2120.0" font-size="23" font-weight="400" text-anchor="start" fill="#758294">실선: 요청 / 파랑 점선: 결과 / 빨강 점선: 정정과 무효화 / 회색 점선: 상태 게시 / 실행 trace가 아닌 같은 사건의 설계 예시</text>
</g>

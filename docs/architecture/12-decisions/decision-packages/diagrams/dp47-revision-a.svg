<g id="note16" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="2278" y="1558.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">D12  j2 done: KEEP b1,b2 / REPLACE b3 → lower extent</text>
</g>
<g id="note17" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="2278" y="1662.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">D13  a2 / r2 / source 유효성 확인 후 patch 기록</text>

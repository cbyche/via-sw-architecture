<text x="40" y="56.0" data-width="2480" font-size="36" font-weight="700" text-anchor="start">46 | 같은 늦은 전사 정정에서 다시 준비되는 근거</text>
<rect x="37" y="75" width="2486" height="31.200000000000003" fill="white"/>
<text x="40" y="99.0" data-width="2480" font-size="24" font-weight="400" text-anchor="start">named participant 사건도 | 행 간격은 설명 순서이며 실행 시간이나 순차 스케줄링 제약을 뜻하지 않는다</text>
<rect x="27" y="125" width="1206" height="37.7" fill="white"/>
<text x="30" y="154.0" data-width="1200" font-size="29" font-weight="700" text-anchor="start">A  요청별 구성과 재조회</text>
<rect x="790" y="281" width="290" height="22.1" fill="white"/>
<text x="793" y="298.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D1 input u46@r1 / W46</text>
<rect x="490" y="346" width="290" height="22.1" fill="white"/>
<text x="493" y="363.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D2 EvidenceQuery(r1)</text>
<rect x="190" y="411" width="290" height="22.1" fill="white"/>
<text x="193" y="428.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D3 TemporalQuery: 원본 결합</text>
<rect x="190" y="476" width="290" height="22.1" fill="white"/>
<text x="193" y="493.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D4 Q1 Result / source vector</text>
<rect x="490" y="541" width="290" height="22.1" fill="white"/>
<text x="493" y="558.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D5 Bundle b1 / Receipt</text>
<rect x="190" y="606" width="890" height="22.1" fill="white"/>
<text x="193" y="623.0" data-width="884" font-size="17" font-weight="400" text-anchor="start">D6 late r2 → 같은 입력 정정, 기존 근거/의미 사용 차단</text>
<rect x="190" y="671" width="290" height="22.1" fill="white"/>
<text x="193" y="688.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D7 query/set/cache dirty</text>
<rect x="790" y="736" width="290" height="22.1" fill="white"/>
<text x="793" y="753.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D8 j1 폐기 / j2 시작</text>
<rect x="790" y="801" width="290" height="22.1" fill="white"/>
<text x="793" y="818.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D9 늦은 r1 의미: 거절</text>
<rect x="490" y="866" width="290" height="22.1" fill="white"/>
<text x="493" y="883.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D10 EvidenceQuery(r2)</text>
<rect x="190" y="931" width="290" height="22.1" fill="white"/>
<text x="193" y="948.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D11 Q2: 필요한 원본 재결합</text>
<rect x="190" y="996" width="290" height="22.1" fill="white"/>
<text x="193" y="1013.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D12 Q2 Result / r2 vector</text>
<rect x="490" y="1061" width="290" height="22.1" fill="white"/>
<text x="493" y="1078.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D13 Bundle b2 / 새 vector</text>
<rect x="790" y="1126" width="290" height="22.1" fill="white"/>
<text x="793" y="1143.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D14 r2 의미 제안 → 채택</text>
<rect x="47" y="1280" width="1166" height="52.0" fill="white"/>
<text x="50" y="1300.0" data-width="1160" font-size="20" font-weight="400" text-anchor="start">A: 살아 있는 원본에서 필요한 관계를 다시 구성. 유효 부분/cache는 재사용 가능.</text>
<text x="50" y="1326.0" data-width="1160" font-size="20" font-weight="400" text-anchor="start">양안: 원본/gap/timing 한계, 현재성 검사는 동일. 원본 소실 시 자동 복원 보장 없음.</text>
<rect x="1317" y="125" width="1206" height="37.7" fill="white"/>
<text x="1320" y="154.0" data-width="1200" font-size="29" font-weight="700" text-anchor="start">B  게시 유효성 차단과 재게시/재조회</text>
<rect x="2080" y="281" width="290" height="22.1" fill="white"/>
<text x="2083" y="298.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D1 input u46@r1 / W46</text>
<rect x="1780" y="346" width="290" height="22.1" fill="white"/>
<text x="1783" y="363.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D2 EvidenceQuery(r1)</text>
<rect x="1480" y="411" width="290" height="22.1" fill="white"/>
<text x="1483" y="428.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D3 TemporalRead: 유효 TEv1</text>
<rect x="1480" y="476" width="290" height="22.1" fill="white"/>
<text x="1483" y="493.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D4 TEv1 / coverage / refs</text>
<rect x="1780" y="541" width="290" height="22.1" fill="white"/>
<text x="1783" y="558.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D5 Bundle b1 / Receipt</text>
<rect x="1480" y="606" width="890" height="22.1" fill="white"/>
<text x="1483" y="623.0" data-width="884" font-size="17" font-weight="400" text-anchor="start">D6 late r2 → 같은 입력 정정, 기존 근거/의미 사용 차단</text>
<rect x="1480" y="671" width="290" height="22.1" fill="white"/>
<text x="1483" y="688.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D7 TEv1 DIRTY / 소비 차단</text>
<rect x="2080" y="736" width="290" height="22.1" fill="white"/>
<text x="2083" y="753.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D8 j1 폐기 / j2 시작</text>
<rect x="2080" y="801" width="290" height="22.1" fill="white"/>
<text x="2083" y="818.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D9 늦은 r1 의미: 거절</text>
<rect x="1780" y="866" width="290" height="22.1" fill="white"/>
<text x="1783" y="883.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D10 EvidenceQuery(r2)</text>
<rect x="1480" y="931" width="290" height="22.1" fill="white"/>
<text x="1483" y="948.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D11 유효 TEv2 없으면 대기</text>
<rect x="1480" y="996" width="290" height="22.1" fill="white"/>
<text x="1483" y="1013.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D12 조건부 게시 TEv2 → read</text>
<rect x="1780" y="1061" width="290" height="22.1" fill="white"/>
<text x="1783" y="1078.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D13 Bundle b2 / 새 vector</text>
<rect x="2080" y="1126" width="290" height="22.1" fill="white"/>
<text x="2083" y="1143.0" data-width="284" font-size="17" font-weight="400" text-anchor="start">D14 r2 의미 제안 → 채택</text>
<rect x="1337" y="1280" width="1166" height="52.0" fill="white"/>
<text x="1340" y="1300.0" data-width="1160" font-size="20" font-weight="400" text-anchor="start">B: Publisher가 relation + coverage를 함께 확정. Reader는 재결합하지 않음.</text>
<text x="1340" y="1326.0" data-width="1160" font-size="20" font-weight="400" text-anchor="start">양안: 원본/gap/timing 한계, 현재성 검사는 동일. 원본 소실 시 자동 복원 보장 없음.</text>
<rect x="37" y="1390" width="2456" height="26.0" fill="white"/>
<text x="40" y="1410.0" data-width="2450" font-size="20" font-weight="400" text-anchor="start">B의 최초 TEv1 생산은 read보다 먼저 또는 요청 뒤에 일어날 수 있다. Input 확정/local stop는 생산 완료를 기다리지 않는다.</text>
</g></svg>

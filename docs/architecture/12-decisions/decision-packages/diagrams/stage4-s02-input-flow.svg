</g>
<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">S-02 / 공통 입력  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="129.0" text-anchor="start" font-size="42" font-weight="700" fill="#263445">화면 변화와 사용자 음성은 서로 다른 경로로 들어온다</text></g>
<g id="e5"><text x="64" y="174.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">T와 A의 공통 입력. 위아래 흐름은 병행하며 각 흐름의 번호는 독립적이다. 모델은 연동 대상이고 원격 배치를 뜻하지 않는다.</text></g>
<g id="e8"><text x="88" y="284.0" text-anchor="start" font-size="26" font-weight="700" fill="#263445">화면 수집 / 입력 활성 + 수집 권한이 있을 때</text></g>
<g id="e14" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="466.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">1. 화면 변경과 사용자 조작 알림 구독</text></g>
<g id="e16" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="540.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">2. 변경 알림 또는 주기 수집 → 화면 이미지와 조작 정보 확보</text></g>
<g id="e18" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1770" y="618.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">3. 화면 기록 관리자가 발생 시각과 함께 보관</text></g>
<g id="e19"><text x="88" y="706.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">같은 화면은 참조 재사용. A는 새 기록이 준비되면 Screen Grounding Service에 알린다.</text></g>
<g id="e21"><text x="88" y="836.0" text-anchor="start" font-size="26" font-weight="700" fill="#263445">음성 입력 / 사용자가 말할 때</text></g>
<g id="e35" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="1018.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">1. 음성 도착 → 발화 시작 감지, 관련 화면 기록 유지, Request Controller에 시작 알림</text></g>
<g id="e37" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="1092.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">2. 연속 음성 전달</text></g>
<g id="e39" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1080" y="1166.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">3. 음성 인식 요청</text></g>
<g id="e41" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1080" y="1240.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">4. 인식 문장, 수정과 발화 시간 반환</text></g>
<g id="e43" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="1314.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">5. 인식 근거 전달 → 입력 시각 연결기가 당시 화면과 연결</text></g>
<g id="e45" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="656" y="1388.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">6. 같은 음성 참조 전달 / 2~5와 병행</text></g>
<g id="e47" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1928" y="1462.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">7. 공유 Omni 음성 처리 / ASR 완료를 기다리지 않음</text></g>
<g id="e48"><text x="88" y="1554.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">1의 발화 시작은 ASR 문장이 나온 뒤가 아니다. S2S 결과와 불일치 처리는 별도 응답 계약을 따른다.</text></g>
<g id="e50"><text x="64" y="1991.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">색:  검정 = 공통     파랑 = T 전용     초록 = A/B 전용</text></g>
<g id="e51"><text x="2496" y="1990.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달     점선 → 결과/복원</text></g>
<g id="e52"><text x="64" y="2027.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">모양:  제목 칸이 있는 박스 = Component   |   내부 둥근 박스 = Module   |   원통 = 저장소   |   접힌 종이 = 자료   |   육각형 = 연동 대상/모델</text></g>
<g id="e53"><text x="64" y="2067.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">화면 수집은 발화 조각마다 시작되지 않는다. 관련 기록 유지와 시간 연결은 Interaction Manager의 서로 다른 내부 책임이다.</text></g>
<g id="e54"><text x="2496" y="2067.0" text-anchor="end" font-size="17" font-weight="400" fill="#5B697B">탐색안 / 미채택 / 미측정</text></g>
</g></svg>

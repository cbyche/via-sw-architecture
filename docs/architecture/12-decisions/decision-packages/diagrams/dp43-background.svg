<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title">
<title id="title">04-43. 기능 정확성을 위한 VIA Request 의미 판단 설계 — DP 배경</title>
<defs>
<marker id="a18232E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#18232E" stroke-width="1.6"/></marker>
<marker id="a2858A5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#2858A5" stroke-width="1.6"/></marker>
<marker id="aB63732" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B63732" stroke-width="1.6"/></marker>
<marker id="a087E8B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#087E8B" stroke-width="1.6"/></marker>
<marker id="a5F6B77" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5F6B77" stroke-width="1.6"/></marker>
</defs><g font-family="Apple SD Gothic Neo, Arial, sans-serif">
<rect id="n1" fill="white" stroke="none" stroke-width="1.7" x="0" y="0" width="1920" height="1080"/>
<text id="n2-0" data-width="1250" x="64" y="43.400000000000006" text-anchor="start" font-size="20" font-weight="700" fill="#087E8B">VIA SOFTWARE ARCHITECTURE / DP 배경</text>
<text id="n3-0" data-width="280" x="1856" y="43.400000000000006" text-anchor="end" font-size="20" font-weight="400" fill="#5F6B77">04-43</text>
<text id="n4-0" data-width="1780" x="64" y="107.32" text-anchor="start" font-size="46" font-weight="700" fill="#18232E">04-43. 기능 정확성을 위한 VIA Request 의미 판단 설계</text>
<polyline id="n5" points="64,127 1856,127" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<rect id="n6" fill="#FFF4A8" stroke="none" stroke-width="1.7" x="64" y="151" width="1792" height="52"/>
<text id="n7-0" data-width="1756" x="82" y="186.52" text-anchor="start" font-size="31" font-weight="700" fill="#18232E">정정한 내용뿐 아니라 관련 조건과 연결까지 함께 판단</text>
<text id="n8-0" data-width="1792" x="64" y="243.0" text-anchor="start" font-size="25" font-weight="400" fill="#5F6B77">메일의 결론을 표로 바꿀 때, 보고서 형식과 관련 Task도 함께 확인</text>
<polyline id="n9" points="1213,285 1213,852" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<text id="n10-0" data-width="596" x="1260" y="317.68" text-anchor="start" font-size="29" font-weight="700" fill="#18232E">설계 고려 사항</text>
<polyline id="n11" points="64,875 1856,875" fill="none" stroke="#2858A5" stroke-width="2"/>
<text id="n12-0" data-width="165" x="64" y="931.76" text-anchor="start" font-size="28" font-weight="700" fill="#B63732">설계 과제</text>
<text id="n13-0" data-width="1616" x="240" y="928.6" text-anchor="start" font-size="30" font-weight="700" fill="#18232E">서로 영향을 주는 의미 판단의 책임과 협력 설계</text>
<text id="n14-0" data-width="1260" x="64" y="1036.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">품질 쟁점: 기능 정확성 / 기능 지원 범위 / 변경 용이성</text>
<text id="n15-0" data-width="480" x="1856" y="1036.4" text-anchor="end" font-size="20" font-weight="400" fill="#5F6B77">구조 후보 / 미선정 / 미측정</text>
<text id="n16-0" data-width="1110" x="64" y="305.0" text-anchor="start" font-size="25" font-weight="400" fill="#5F6B77">상황 / 보고서 작성과 메일 초안 작성 진행 중</text>
<rect id="n17" fill="#EAF0F8" stroke="none" stroke-width="1.7" x="64" y="328" width="540" height="140"/>
<rect id="n18" fill="#FFF0EC" stroke="none" stroke-width="1.7" x="652" y="328" width="522" height="140"/>
<text id="n19-0" data-width="500" x="84" y="358.4" text-anchor="start" font-size="20" font-weight="700" fill="#2858A5">먼저 / User Turn</text>
<text id="n20-0" data-width="500" x="84" y="399.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">“보고서는 PDF로, 메일에는</text>
<text id="n20-1" data-width="500" x="84" y="431.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">그 보고서의 결론을 넣어줘.”</text>
<text id="n21-0" data-width="500" x="84" y="457.48" text-anchor="start" font-size="19" font-weight="400" fill="#2858A5">Request 해석 / PDF 조건과 메일 내용</text>
<text id="n22-0" data-width="482" x="672" y="358.4" text-anchor="start" font-size="20" font-weight="700" fill="#B63732">잠시 뒤 / 정정 User Turn</text>
<text id="n23-0" data-width="482" x="672" y="399.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">“메일에는 결론 대신</text>
<text id="n23-1" data-width="482" x="672" y="431.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">표만 넣어줘.”</text>
<text id="n24-0" data-width="482" x="672" y="457.48" text-anchor="start" font-size="19" font-weight="400" fill="#B63732">Request 해석 / 메일 내용 정정</text>
<polyline id="n25" points="616,390 640,390" fill="none" stroke="#5F6B77" stroke-width="2" marker-end="url(#a5F6B77)"/>
<text id="n26-0" data-width="1110" x="64" y="499.92" text-anchor="start" font-size="26" font-weight="700" fill="#18232E">정정으로 바뀌는 내용과 유지할 조건</text>
<path id="n27" fill="#F0F8F7" stroke="#CDD6DE" stroke-width="1.7" d="M64 525H396L414 543V676H64Z M396 525V543H414"/>
<text id="n28-0" data-width="310" x="80" y="561.0" text-anchor="start" font-size="25" font-weight="700" fill="#087E8B">보고서 Task의 조건</text>
<text id="n29-0" data-width="310" x="84" y="600.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">형식 / PDF 유지</text>
<text id="n29-1" data-width="310" x="84" y="634.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">참조할 결과 / 결론과 표</text>
<polyline id="n30" points="426,609 686,609" fill="none" stroke="#2858A5" stroke-width="2" marker-end="url(#a2858A5)"/>
<text id="n31-0" data-width="235" x="441" y="572.16" text-anchor="start" font-size="23" font-weight="700" fill="#2858A5">보고서 결과 참조</text>
<text id="n32-0" data-width="235" x="441" y="656.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">결과 준비 후 사용</text>
<path id="n33" fill="#F3F6FA" stroke="#CDD6DE" stroke-width="1.7" d="M698 525H1156L1174 543V676H698Z M1156 525V543H1174"/>
<text id="n34-0" data-width="436" x="714" y="561.0" text-anchor="start" font-size="25" font-weight="700" fill="#2858A5">메일 초안 Task의 조건</text>
<text id="n35-0" data-width="436" x="718" y="602.08" text-anchor="start" font-size="24" font-weight="400" fill="#5F6B77">기존 / 보고서 결론</text>
<polyline id="n36" points="797,595 972,595" fill="none" stroke="#B63732" stroke-width="2"/>
<text id="n37-0" data-width="436" x="718" y="646.08" text-anchor="start" font-size="24" font-weight="700" fill="#B63732">변경 / 같은 보고서의 표만 사용</text>
<text id="n38-0" data-width="1110" x="64" y="724.24" text-anchor="start" font-size="22" font-weight="400" fill="#5F6B77">함께 판단할 의미 / SW 모듈이나 실행 순서가 아닌 판단 항목</text>
<text id="n39-0" data-width="342" x="64" y="765.16" text-anchor="start" font-size="23" font-weight="700" fill="#2858A5">의도</text>
<text id="n40-0" data-width="342" x="64" y="793.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">PDF 보고서와 메일 초안</text>
<text id="n41-0" data-width="342" x="448" y="765.16" text-anchor="start" font-size="23" font-weight="700" fill="#2858A5">Referent</text>
<text id="n42-0" data-width="342" x="448" y="793.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">같은 보고서의 표</text>
<text id="n43-0" data-width="342" x="832" y="765.16" text-anchor="start" font-size="23" font-weight="700" fill="#2858A5">Task Association</text>
<text id="n44-0" data-width="342" x="832" y="793.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">관련 보고서 및 메일 Task</text>
<text id="n45-0" data-width="342" x="64" y="828.16" text-anchor="start" font-size="23" font-weight="700" fill="#2858A5">Request 관계</text>
<text id="n46-0" data-width="342" x="64" y="856.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">보고서 결과를 메일에 사용</text>
<text id="n47-0" data-width="342" x="448" y="828.16" text-anchor="start" font-size="23" font-weight="700" fill="#2858A5">정정 범위</text>
<text id="n48-0" data-width="342" x="448" y="856.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">PDF 유지 / 메일 내용 교체</text>
<text id="n49-0" data-width="342" x="832" y="828.16" text-anchor="start" font-size="23" font-weight="700" fill="#2858A5">처리 방향</text>
<text id="n50-0" data-width="342" x="832" y="856.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">Delegation 및 자료 대기</text>
<text id="n51-0" data-width="596" x="1260" y="388.76" text-anchor="start" font-size="28" font-weight="700" fill="#2858A5">현재 Request의 Task Association</text>
<text id="n52-0" data-width="596" x="1260" y="433.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">전체 발화와 이전 기록을 활용한</text>
<text id="n52-1" data-width="596" x="1260" y="468.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">관련 Task의 판단</text>
<text id="n53-0" data-width="596" x="1260" y="551.76" text-anchor="start" font-size="28" font-weight="700" fill="#2858A5">변경과 유지 범위의 구분</text>
<text id="n54-0" data-width="596" x="1260" y="596.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">메일 내용과 보고서 참조의 변경,</text>
<text id="n54-1" data-width="596" x="1260" y="631.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">기존 PDF 조건의 유지</text>
<text id="n55-0" data-width="596" x="1260" y="714.76" text-anchor="start" font-size="28" font-weight="700" fill="#2858A5">서로 관련된 판단의 일치</text>
<text id="n56-0" data-width="596" x="1260" y="759.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">Referent, Task Association과 결과 사용의</text>
<text id="n56-1" data-width="596" x="1260" y="794.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">불일치 및 조건 누락 방지</text>
</g></svg>

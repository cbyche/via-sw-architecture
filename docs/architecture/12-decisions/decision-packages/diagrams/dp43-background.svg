<text id="n26-0" data-width="260" x="84" y="563.68" text-anchor="start" font-size="29" font-weight="700" fill="#087E8B">PDF 조건 유지</text>
<text id="n27-0" data-width="260" x="84" y="624.24" text-anchor="start" font-size="22" font-weight="400" fill="#5F6B77">결과 / 결론과 표</text>

<polyline id="n44" points="772,819 818,819" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<text id="n45-0" data-width="596" x="1260" y="377.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">의도와 처리 방향</text>
<text id="n46-0" data-width="596" x="1260" y="418.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">요청 목표와 Delegation 및 자료 대기의 판단</text>
<text id="n47-0" data-width="596" x="1260" y="537.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">Referent와 Task Association</text>
<text id="n48-0" data-width="596" x="1260" y="578.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">자료와 관련 Task 및 결과 사용 관계의 일치</text>
<text id="n49-0" data-width="596" x="1260" y="697.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">정정 범위와 기존 조건</text>
<text id="n50-0" data-width="596" x="1260" y="738.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">메일 내용만 교체하고 PDF 조건 유지</text>

<text id="n30-0" data-width="382" x="772" y="559.08" text-anchor="start" font-size="24" font-weight="400" fill="#5F6B77">기존 / 보고서 결론</text>
<polyline id="n31" points="853,553 1028,553" fill="none" stroke="#B63732" stroke-width="2"/>
<text id="n32-0" data-width="382" x="772" y="630.76" text-anchor="start" font-size="28" font-weight="700" fill="#087E8B">같은 보고서의 표만 사용</text>
<polyline id="n33" points="380,578 730,578" fill="none" stroke="#087E8B" stroke-width="3" marker-end="url(#a087E8B)"/>
<text id="n34-0" data-width="322" x="399" y="517.08" text-anchor="start" font-size="24" font-weight="700" fill="#B63732">메일의 보고서 참조 변경</text>
<text id="n35-0" data-width="322" x="399" y="645.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">보고서 결과 준비 후 사용</text>
<text id="n36-0" data-width="1110" x="64" y="741.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">정정 시 함께 맞춰야 할 판단</text>
<text id="n37-0" data-width="310" x="80" y="782.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">Referent</text>
<text id="n38-0" data-width="310" x="80" y="827.92" text-anchor="start" font-size="26" font-weight="700" fill="#18232E">같은 보고서의 표</text>
<text id="n39-0" data-width="310" x="464" y="782.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">Task Association</text>
<text id="n40-0" data-width="310" x="464" y="827.92" text-anchor="start" font-size="26" font-weight="700" fill="#18232E">메일 초안 Task</text>
<text id="n41-0" data-width="310" x="848" y="782.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">정정 범위</text>
<text id="n42-0" data-width="310" x="848" y="827.92" text-anchor="start" font-size="26" font-weight="700" fill="#18232E">메일 내용만 교체</text>

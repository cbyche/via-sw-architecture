<text id="n12-0" data-width="1616" x="240" y="948.52" text-anchor="start" font-size="31" font-weight="700" fill="#18232E">연관된 의미 판단의 생산 책임과 조정 방식 설계</text>
<text id="n13-0" data-width="1260" x="64" y="1051.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">품질 관점: 기능 정확성 / 기능 지원 범위 / 변경 용이성</text>
<text id="n14-0" data-width="480" x="1856" y="1051.56" text-anchor="end" font-size="18" font-weight="400" fill="#5F6B77">구조 후보 / 미선정 / 미측정</text>
<rect id="n15" fill="#EFF3F8" stroke="none" stroke-width="1.7" x="64" y="275" width="540" height="147"/>
<rect id="n16" fill="#FFF0EC" stroke="none" stroke-width="1.7" x="652" y="275" width="522" height="147"/>
<text id="n17-0" data-width="500" x="84" y="305.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">진행 중인 두 Task의 조건 지정</text>
<text id="n18-0" data-width="500" x="84" y="348.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">“보고서는 PDF로, 메일에는</text>
<text id="n18-1" data-width="500" x="84" y="380.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">그 보고서의 결론을 넣어줘.”</text>
<text id="n19-0" data-width="500" x="84" y="408.48" text-anchor="start" font-size="19" font-weight="400" fill="#5F6B77">Request / PDF 조건과 메일 내용</text>
<text id="n20-0" data-width="482" x="672" y="305.4" text-anchor="start" font-size="20" font-weight="400" fill="#B63732">잠시 뒤 / 메일 내용 정정</text>
<text id="n21-0" data-width="482" x="672" y="348.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">“메일에는 결론 대신</text>
<text id="n21-1" data-width="482" x="672" y="380.84" text-anchor="start" font-size="27" font-weight="700" fill="#18232E">표만 넣어줘.”</text>
<text id="n22-0" data-width="482" x="672" y="408.48" text-anchor="start" font-size="19" font-weight="400" fill="#5F6B77">Request / 메일 내용 교체</text>

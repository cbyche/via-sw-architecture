<text x="1930.0" y="410.44" text-anchor="middle" font-size="23" font-weight="700" fill="#263445">Evidence</text><text x="1930.0" y="438.5" text-anchor="middle" font-size="23" font-weight="700" fill="#263445">Reader</text>
</g>
<g id="e2"><text x="64" y="47.0" text-anchor="start" font-size="23" font-weight="700" fill="#5B697B">VIA / 45 / MEMORY AND CONTEXT</text></g>
<g id="e3"><text x="2496" y="47.0" text-anchor="end" font-size="23" font-weight="400" fill="#5B697B">설계 후보 / 미선정 / 미측정</text></g>
<g id="e4"><text x="64" y="110.0" text-anchor="start" font-size="40" font-weight="700" fill="#263445">정정과 삭제: 오래된 기억을 읽지 못하게 하고, 필요한 원문을 다시 확인한다</text></g>
<g id="e5"><text x="64" y="166.0" text-anchor="start" font-size="28" font-weight="400" fill="#263445">공통 사건: D21@v2 → v3 수정 / 선호 삭제 / D21 접근 철회. 같은 원본 보존 범위, 권한, 실제 삭제 시점을 적용한다.</text></g>
<g id="e6"><text x="64" y="210.0" text-anchor="start" font-size="25" font-weight="700" fill="#263445">유효하지 않은 근거의 신규 사용 차단은 배경 재생산이나 물리 삭제의 완료를 기다리지 않는다.</text></g>
<g id="e7"><text x="64" y="289.0" text-anchor="start" font-size="32" font-weight="700" fill="#263445">A  요청별 조합을 다시 수행</text></g>
<g id="e9"><text x="170" y="342" text-anchor="middle" font-size="17" font-weight="400" fill="#263445">원본 owner (사건 접점)</text><text x="170" y="363" text-anchor="middle" font-size="17" font-weight="400" fill="#263445">Request Controller</text><text x="170" y="384" text-anchor="middle" font-size="17" font-weight="400" fill="#263445">Response Manager</text><text x="170" y="405" text-anchor="middle" font-size="17" font-weight="400" fill="#263445">Task Manager</text></g>
<g id="e14"><text x="654" y="363" text-anchor="middle" font-size="23" font-weight="700" fill="#263445">Request</text><text x="654" y="392" text-anchor="middle" font-size="23" font-weight="700" fill="#263445">Interpreter</text></g>
<g id="e17"><text x="896" y="363" text-anchor="middle" font-size="23" font-weight="700" fill="#263445">Request</text><text x="896" y="392" text-anchor="middle" font-size="23" font-weight="700" fill="#263445">Controller</text></g>
<g id="e20"><text x="1138" y="378" text-anchor="middle" font-size="23" font-weight="700" fill="#263445">Model Access</text></g>
<g id="e22"><text x="70" y="469.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">1  현재 원장 변경 + 동기 사용 승인 차단</text></g>
<g id="e24"><text x="70" y="571.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">2  Source View Cache와 요청 근거를 무효화</text></g>
<g id="e26"><text x="70" y="673.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">3  차단 버전 반영 / 영향 요청에 취소 전파</text></g>
<g id="e28"><text x="70" y="775.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">4  영향받은 Context/KV와 진행 중 생성 폐기</text></g>
<g id="e30"><text x="70" y="877.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">5  새 요청 / 재시도: 허용된 원본을 범위 읽기</text></g>
<g id="e32"><text x="70" y="979.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">6  현재 자료 + 버전 + 누락 / 복구 불가 반환</text></g>
<g id="e34"><text x="70" y="1081.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">7  다시 조합한 근거 / 미해결 범위 반환</text></g>
<g id="e36"><text x="70" y="1183.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">8  원본은 그대로, 기억과 모순 발견 → EvidenceDispute</text></g>
<g id="e38"><text x="70" y="1285.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">9  기억 ID / 파생 버전 / 원문 모순을 회송</text></g>
<g id="e40"><text x="70" y="1387.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">10  해당 파생 버전 무효화 → 원본 재조합</text></g>
<g id="e42"><text x="1340" y="289.0" text-anchor="start" font-size="32" font-weight="700" fill="#263445">B  읽기 차단과 기억 복구를 분리</text></g>
<g id="e44"><text x="1446" y="342" text-anchor="middle" font-size="17" font-weight="400" fill="#263445">원본 owner (사건 접점)</text><text x="1446" y="363" text-anchor="middle" font-size="17" font-weight="400" fill="#263445">Request Controller</text><text x="1446" y="384" text-anchor="middle" font-size="17" font-weight="400" fill="#263445">Response Manager</text><text x="1446" y="405" text-anchor="middle" font-size="17" font-weight="400" fill="#263445">Task Manager</text></g>
<g id="e51"><text x="2172" y="363" text-anchor="middle" font-size="23" font-weight="700" fill="#263445">Request</text><text x="2172" y="392" text-anchor="middle" font-size="23" font-weight="700" fill="#263445">Interpreter</text></g>
<g id="e54"><text x="2414" y="363" text-anchor="middle" font-size="23" font-weight="700" fill="#263445">Request</text><text x="2414" y="392" text-anchor="middle" font-size="23" font-weight="700" fill="#263445">Controller</text></g>
<g id="e56"><text x="1346" y="469.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">1  읽기 차단 버전 / 삭제 / 권한 철회 먼저 반영</text></g>
<g id="e58"><text x="1346" y="571.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">2  이전 근거 차단 → 영향 Context/KV 폐기 요청</text></g>
<g id="e60"><text x="1346" y="673.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">3  변경 사건 + 원본 버전 + 영향 참조</text></g>
<g id="e62"><text x="1346" y="775.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">4  파생 관계 무효화 / 허용된 원본으로 재생산</text></g>
<g id="e64"><text x="1346" y="877.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">5  검증된 관계 + coverage 게시; revision/상태 반환 → Reader 재조회</text></g>
<g id="e66"><text x="1346" y="979.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">6  정확한 인용 / 모순 확인 → 원문 재확인</text></g>
<g id="e68"><text x="1346" y="1081.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">7  현재 자료 / 누락 / 복구 불가 반환</text></g>
<g id="e70"><text x="1346" y="1183.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">8  원본은 그대로, 기억과 모순 발견 → EvidenceDispute</text></g>
<g id="e72"><text x="1346" y="1285.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">9  기억 ID / 파생 버전 / 원문 모순을 회송</text></g>
<g id="e74"><text x="1346" y="1387.0" text-anchor="start" font-size="23" font-weight="400" fill="#263445">10  해당 파생 버전 차단 → 재생산 / 조건부 재게시</text></g>
<g id="e77"><text x="64" y="1545.0" text-anchor="start" font-size="30" font-weight="700" fill="#263445">같은 계약, 다른 관리 대상</text></g>
<g id="e78"><text x="64" y="1593" text-anchor="start" font-size="25" font-weight="400" fill="#263445">원본이 남아 있으면 재확인한다. 삭제되었거나 허용 범위 밖이면 “모름 / 자료 부재”로 반환하며 요약에서 사실을 복원하지 않는다.</text><text x="64" y="1636" text-anchor="start" font-size="25" font-weight="400" fill="#263445">Context Manager의 User Memory: 명시 저장만 허용. 이번 요청의 일회성 지시가 우선하며, 과거 사례 재사용은 장기 선호가 아니다.</text><text x="64" y="1679" text-anchor="start" font-size="25" font-weight="400" fill="#263445">삭제 tombstone과 권한 버전은 재구축에도 적용한다. 옛 대화와 파생 관계에서 삭제된 선호를 다시 활성화하지 않는다.</text><text x="64" y="1722" text-anchor="start" font-size="25" font-weight="400" fill="#263445">최종 대상 / Task 판단은 Request Interpreter, 채택은 Request Controller 책임이다. 각 사용점의 검사와 실제 허용을 직렬화한다.</text><text x="64" y="1765" text-anchor="start" font-size="25" font-weight="400" fill="#263445">하나의 Model Access / Omni를 공유한다. 배경 기억 생산은 취소 가능한 낮은 우선순위이며 음성 입력과 ASR은 계속된다.</text><text x="64" y="1808" text-anchor="start" font-size="25" font-weight="400" fill="#263445">양안의 Source Owner는 실제 원본 생산자들을 묶은 생명선이다. B의 미게시 범위는 생산 후 게시를 기다리며, 직접 조합 우회는 B+ 혼합이다.</text></g>
<g id="e79"><text x="64" y="1880.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">실선 요청 / 전달, 점선 반환. 8~10은 원본 수정 없이 발생한 별도 오류 사건. A의 원본별 배경 요약도 허용. B의 표현 불가는 미게시 범위와 구별한다.</text></g>
</g></svg>

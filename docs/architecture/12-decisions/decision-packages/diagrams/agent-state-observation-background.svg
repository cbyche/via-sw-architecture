<g id="e02"><rect x="1410" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="408" font-size="20" font-weight="700" fill="#171717">현재 snapshot</text><text x="1426" y="444" font-size="20" fill="#171717">phase / revision / artifact</text><text x="1426" y="469" font-size="20" fill="#171717">대기 질문·terminal 확인</text></g>
<g id="e03"><rect x="1950" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="408" font-size="20" font-weight="700" fill="#171717">원격의 사실</text><text x="1966" y="444" font-size="20" fill="#171717">완료와 취소 접수는 다름</text><text x="1966" y="469" font-size="20" fill="#171717">실행 내부는 VIA 밖</text></g>

<g id="e10"><rect x="330" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="346" y="570" font-size="20" font-weight="700" fill="#171717">정상 연결</text><text x="346" y="606" font-size="20" fill="#171717">event 구독 + query API</text><text x="346" y="631" font-size="20" fill="#171717">동일 capability 전제</text></g>
<g id="e11"><rect x="870" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="886" y="570" font-size="20" font-weight="700" fill="#171717">지연·단절</text><text x="886" y="606" font-size="20" fill="#171717">중복 / gap / 재연결</text><text x="886" y="631" font-size="20" fill="#171717">과거 메시지가 늦게 도착</text></g>
<g id="e12"><rect x="1410" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="570" font-size="20" font-weight="700" fill="#171717">확인된 최신성</text><text x="1426" y="606" font-size="20" fill="#171717">마지막 확인 시각 표시</text><text x="1426" y="631" font-size="20" fill="#171717">필요하면 source 재조회</text></g>
<g id="e13"><rect x="1950" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="570" font-size="20" font-weight="700" fill="#171717">필수 사건 전달</text><text x="1966" y="606" font-size="20" fill="#171717">질문·완료·실패 내구 보존</text><text x="1966" y="631" font-size="20" fill="#171717">사용자 재질문 없이 안내</text></g>
<g id="lane2"><rect x="48" y="704" width="246" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="732" font-size="20" font-weight="700" fill="#171717">사용자 창구</text></g>
<g id="e20"><rect x="330" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="346" y="732" font-size="20" font-weight="700" fill="#171717">같은 Conversation</text><text x="346" y="768" font-size="20" fill="#171717">Task identity 유지</text><text x="346" y="793" font-size="20" fill="#171717">Agent thread 선택 불필요</text></g>
<g id="e21"><rect x="870" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="886" y="732" font-size="20" font-weight="700" fill="#171717">상태 질문</text><text x="886" y="768" font-size="20" fill="#171717">기존 업무만 선택</text><text x="886" y="793" font-size="20" fill="#171717">다른 Task와 혼동 금지</text></g>
<g id="e22"><rect x="1410" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="732" font-size="20" font-weight="700" fill="#171717">알림 구성</text><text x="1426" y="768" font-size="20" fill="#171717">현재 사실 + 불확실성</text><text x="1426" y="793" font-size="20" fill="#171717">낡은 상태 덮어쓰기 금지</text></g>
<g id="e23"><rect x="1950" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="732" font-size="20" font-weight="700" fill="#171717">동일한 결과</text><text x="1966" y="768" font-size="20" fill="#171717">Text 기록 / Voice 차례</text><text x="1966" y="793" font-size="20" fill="#171717">승인 응답을 정확한 Q에 결합</text></g>
<g id="pressure0"><rect x="48" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="953" font-size="20" font-weight="700" fill="#171717">로컬 projection 유지</text><text x="64" y="989" font-size="20" fill="#171717">query 없이 확인한 상태를 읽을 수 있다.</text><text x="64" y="1014" font-size="20" fill="#171717">event 의미·순서·gap 보정 책임이 생긴다.</text><text x="64" y="1039" font-size="20" fill="#171717">로컬 값이 원격의 지금을 보장하지 않는다.</text></g>
<g id="pressure1"><rect x="884" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="900" y="953" font-size="20" font-weight="700" fill="#171717">snapshot 중심 구성</text><text x="900" y="989" font-size="20" fill="#171717">원격이 만든 현재 상태를 활용한다.</text><text x="900" y="1014" font-size="20" fill="#171717">API 지연·한도·snapshot 완전성에 의존한다.</text><text x="900" y="1039" font-size="20" fill="#171717">cache·query 합치기로 과도한 조회를 줄인다.</text></g>
<g id="pressure2"><rect x="1720" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1736" y="953" font-size="20" font-weight="700" fill="#171717">공통으로 보존할 사실</text><text x="1736" y="989" font-size="20" fill="#171717">질문·승인·완료를 일시 hint로 버리지 않는다.</text><text x="1736" y="1014" font-size="20" fill="#171717">Task·Execution·command 결합은 VIA 책임이다.</text><text x="1736" y="1039" font-size="20" fill="#171717">새 snapshot이 확인된 terminal을 지우면 안 된다.</text></g>
<g id="challenge"><rect x="48" y="1170" width="2464" height="170" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="1198" font-size="20" font-weight="700" fill="#171717">Architecture Challenge</text><text x="64" y="1234" font-size="20" fill="#171717">일반 progress를 event reducer로 계속 구성할 것인가, 변경 신호와 사용자 조회에 따라 snapshot을 읽어 구성할 것인가?</text></g>

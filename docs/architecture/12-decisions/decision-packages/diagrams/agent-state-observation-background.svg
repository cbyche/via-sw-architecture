<g id="scenario"><rect x="48" y="142" width="2464" height="104" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="170" font-size="20" font-weight="700" fill="#171717">사용자 상황</text><text x="64" y="206" font-size="20" fill="#171717">보고서와 메일 업무가 동시에 진행된다. 사용자는 “보고서 어디까지 됐어?”라고 묻고, 다른 Agent는 승인을 요청한다.</text></g>

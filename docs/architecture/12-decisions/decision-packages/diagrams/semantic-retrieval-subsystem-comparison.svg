<text x="48" y="58" font-size="38" font-weight="700" fill="#171717">자료·대화·Task의 후보 검색  |  SW Architecture 비교</text>
<text x="48" y="104" font-size="22" font-weight="400" fill="#171717">검정: 공통 구성·책임  /  파랑: 양안의 대체·추가·제거 대상  /  실선 경계: 논리 Component  /  점선 경계: process  /  원통: 저장소</text>
<text x="48" y="1414" font-size="18" font-weight="400" fill="#171717">VIA  /  Decision Reconstruction  /  설계 비교 · 구현 및 측정 결과 아님</text>
<text x="56" y="161" font-size="27" font-weight="700" fill="#171717">방안 1 · target  |  owner 조회 중심</text>
<text x="1320" y="161" font-size="27" font-weight="700" fill="#171717">방안 2 · 대안  |  지속 색인 + 검색 서브시스템</text>
<text x="110" y="1060" font-size="20" font-weight="400" fill="#1458C0">별도 embedding runtime · vector index · 색인 worker 없음</text>
<text x="1362" y="590" font-size="19" font-weight="400" fill="#1458C0">변경 생산 경로가 요청과 독립적으로 유지됨</text>
<text x="55" y="1354" font-size="25" font-weight="700" fill="#171717">핵심 구조 차이: 요청별 원본 조회  ↔  독립 색인 생산체 + 검색 서비스 + 파생 검색 저장소</text>
</g></svg>

<text x="40" y="54.0" data-width="2480" font-size="36" font-weight="700" fill="#20252b">DP-47 / 화면이 바뀌어도 말과 손동작이 지정한 대상을 연결하고 일부 정정을 이어간다</text>
<text x="40" y="100.0" data-width="2470" font-size="24" font-weight="400" fill="#20252b">선택한 매출 범위 → PDF 표 지칭 → scrollbar drag로 페이지 이동 → 버튼 없는 원형 지칭 → “아니, 아래 graph만”</text>
<text x="40" y="136.0" data-width="2470" font-size="22" font-weight="400" fill="#20252b">전사는 늦게 도착한다. foreground, pointer 대상은 다를 수 있다. 당시 frame, path, selection, 시간 오차를 양안 모두 보존한다.</text>

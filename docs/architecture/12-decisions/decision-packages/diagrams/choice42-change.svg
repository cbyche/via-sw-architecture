<g id="e2"><text x="64" y="55.0" text-anchor="start" font-size="28" font-weight="700" fill="#5B697B">VIA / DECISION POINT CANDIDATE</text></g>
<g id="e3"><text x="2496" y="55.0" text-anchor="end" font-size="28" font-weight="400" fill="#5B697B">42  /  설계 비교</text></g>
<g id="e4"><text x="64" y="132.0" text-anchor="start" font-size="49" font-weight="700" fill="#000000">모듈화의 이익과 독립 운영의 이익을 구별한다</text></g>
<g id="e5"><text x="64" y="182.0" text-anchor="start" font-size="28" font-weight="400" fill="#5B697B">같은 Agent 변화: 상태 조회를 polling에서 event stream으로 바꾸되 VIA의 사용자 의미는 유지</text></g>
<g id="e7"><text x="80" y="292.0" text-anchor="start" font-size="39" font-weight="700" fill="#B8753F">A  통합 Core</text></g>
<g id="e9"><text x="120" y="413.0" text-anchor="start" font-size="28" font-weight="700" fill="#B8753F">VIA Core process</text></g>
<g id="e14" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="480" y="547.0" text-anchor="start" font-size="25" font-weight="400" fill="#000000">같은 VIA 업무 계약</text></g>
<g id="e15"><text x="130" y="776.0" text-anchor="start" font-size="29" font-weight="700" fill="#000000">대화 코드 유지 가능</text></g>
<g id="e16"><text x="680" y="776.0" text-anchor="start" font-size="29" font-weight="700" fill="#B8753F">연동·수신 경로 변경</text></g>
<g id="e17"><text x="100" y="909.0" text-anchor="start" font-size="29" font-weight="700" fill="#000000">일반 protocol 변경은 양안 모두 국소화 가능</text></g>
<g id="e18"><text x="100" y="978.0" text-anchor="start" font-size="28" font-weight="700" fill="#B8753F">차이가 남는 조건</text></g>
<g id="e19"><text x="100" y="1029" text-anchor="start" font-size="29" font-weight="400" fill="#5B697B">Core process 재시작이 필요한 갱신이면</text><text x="100" y="1077" text-anchor="start" font-size="29" font-weight="400" fill="#5B697B">대화 owner와 업무 owner가 함께 멈춤.</text><text x="100" y="1125" text-anchor="start" font-size="29" font-weight="400" fill="#5B697B">worker·동적 교체로 줄이는 혼합안도 검토.</text></g>
<g id="e20"><text x="1330" y="292.0" text-anchor="start" font-size="39" font-weight="700" fill="#B8753F">B  독립 서비스</text></g>
<g id="e23"><text x="1370" y="413.0" text-anchor="start" font-size="28" font-weight="700" fill="#B8753F">대화 서비스 process</text></g>
<g id="e24"><text x="1910" y="413.0" text-anchor="start" font-size="28" font-weight="700" fill="#B8753F">업무 서비스 process</text></g>
<g id="e29" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1730" y="547.0" text-anchor="start" font-size="25" font-weight="400" fill="#000000">같은 VIA 업무 계약</text></g>
<g id="e30"><text x="1380" y="776.0" text-anchor="start" font-size="29" font-weight="700" fill="#000000">대화 코드 유지 가능</text></g>
<g id="e31"><text x="1930" y="776.0" text-anchor="start" font-size="29" font-weight="700" fill="#B8753F">연동·수신 경로 변경</text></g>
<g id="e32"><text x="1350" y="909.0" text-anchor="start" font-size="29" font-weight="700" fill="#000000">일반 protocol 변경은 양안 모두 국소화 가능</text></g>
<g id="e33"><text x="1350" y="978.0" text-anchor="start" font-size="28" font-weight="700" fill="#B8753F">차이가 남는 조건</text></g>
<g id="e34"><text x="1350" y="1029" text-anchor="start" font-size="29" font-weight="400" fill="#5B697B">공개 계약이 호환되면 업무 서비스만 갱신.</text><text x="1350" y="1077" text-anchor="start" font-size="29" font-weight="400" fill="#5B697B">대화 서비스는 유지하며 업무 요청은 보류 가능.</text><text x="1350" y="1125" text-anchor="start" font-size="29" font-weight="400" fill="#5B697B">새 승인 의미 등 계약 변화는 양쪽으로 전파.</text></g>
<g id="e35"><text x="80" y="1264.0" text-anchor="start" font-size="30" font-weight="700" fill="#000000">V-08  변경 범위 감소는 조건부  /  독립 갱신의 이익을 변경 요소 수 우위로 바꾸어 말하지 않는다.</text></g>
<g id="e37"><text x="2496" y="1363.0" text-anchor="end" font-size="17" font-weight="400" fill="#000000">양안 공통 Agent Gateway / 배치 차이는 바깥 경계 / 미선정과 미측정</text></g>

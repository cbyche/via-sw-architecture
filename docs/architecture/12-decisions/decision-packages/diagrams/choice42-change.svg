<g id="e60"><text x="1120" y="1425.0" text-anchor="start" font-size="17" font-weight="400" fill="#000000">요청 / 전달</text></g>
<g id="e62"><text x="1360" y="1425.0" text-anchor="start" font-size="17" font-weight="400" fill="#000000">응답 / 반환</text></g>
<g id="e64"><text x="2248.5" y="1390.0" text-anchor="middle" font-size="12" font-weight="400" fill="#000000">A</text></g>
<g id="e66"><text x="2331.5" y="1390.0" text-anchor="middle" font-size="12" font-weight="400" fill="#000000">B</text></g>
<g id="e67"><text x="2160" y="1425.0" text-anchor="start" font-size="17" font-weight="400" fill="#000000">설계 차이: 강조 경계 / 채움 없음</text></g>

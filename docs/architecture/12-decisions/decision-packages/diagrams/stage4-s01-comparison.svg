<text x="48" y="58" font-size="38" font-weight="700" fill="#171717">S-01  |  추가 근거가 필요할 때 해석을 어떻게 이어가는가</text>
<text x="48" y="104" font-size="22" font-weight="400" fill="#171717">①~⑤ 기본 Context 구성은 공통 / T는 첫 해석을 끝내고 다시 호출 / A는 실행을 멈췄다가 같은 실행을 재개 (지원 미확인)</text>
<text x="48" y="1414" font-size="18" font-weight="400" fill="#171717">VIA / Stage 4 / 구조 탐색, 미채택 대안 / 구현 및 측정 결과 아님</text>
<text x="72" y="215" font-size="28" font-weight="700" fill="#171717">T  실제 reviewed target</text>
<text x="1336" y="215" font-size="28" font-weight="700" fill="#171717">A  대안 구조</text>
<text x="48" y="1345" font-size="21" font-weight="400" fill="#171717">박스: Component 또는 논리 실행체 이름 / 번호 화살표: 동작과 순서 / 검정: 공통 / 파랑: 달라지는 구조</text>
<text x="88" y="1188" font-size="19" font-weight="400" fill="#171717">공통 ①~⑤: 두 안 모두 최초 해석 전에 같은 기본 Context를 구성한다.</text>
<text x="88" y="1217" font-size="19" font-weight="400" fill="#171717">기본 Context는 현재 입력, 선택과 화면 근거, 최근 응답, 관련 Task 후보 등 허용된 최소 근거다.</text>
<text x="1352" y="1188" font-size="19" font-weight="400" fill="#171717">공통 ①~⑤: 두 안 모두 최초 해석 전에 같은 기본 Context를 구성한다.</text>
<text x="1352" y="1217" font-size="19" font-weight="400" fill="#171717">기본 Context는 현재 입력, 선택과 화면 근거, 최근 응답, 관련 Task 후보 등 허용된 최소 근거다.</text>
<text x="608" y="1000" font-size="19" font-weight="400" fill="#1458C0">⑱ Request Controller가 현재 revision과 receipt를 확인한다.</text>
<text x="608" y="1029" font-size="19" font-weight="400" fill="#1458C0">조건이 맞으면 Semantic Commit, 아니면 질문 또는 실패로 보낸다.</text>
<text x="608" y="1058" font-size="19" font-weight="400" fill="#1458C0">차이: 첫 해석은 끝나며, 추가 근거를 넣은 새 호출이 시작된다.</text>
<text x="1872" y="1000" font-size="19" font-weight="400" fill="#1458C0">⑱ Request Controller가 현재 revision과 receipt를 확인한다.</text>
<text x="1872" y="1029" font-size="19" font-weight="400" fill="#1458C0">조건이 맞으면 Semantic Commit, 아니면 질문 또는 실패로 보낸다.</text>
<text x="1872" y="1058" font-size="19" font-weight="400" fill="#1458C0">차이: 읽기 동안 연산을 양보하고, 근거를 받은 뒤 같은 실행을 재개한다.</text>
</g></svg>

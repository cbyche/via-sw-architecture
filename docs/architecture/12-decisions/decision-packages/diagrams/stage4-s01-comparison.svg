<text x="2047" y="1050" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">실제 source 조회</text>
<text x="48" y="58" font-size="38" font-weight="700" fill="#171717">S-01  |  근거 보완의 실행 경계를 바꾼다</text>
<text x="48" y="104" font-size="22" font-weight="400" fill="#171717">T: 중간 제안 종료 후 host 재호출 / A: READ_REQUIRED에서 연산 양보 후 같은 실행 재개 (runtime 지원 미확인)</text>
<text x="48" y="1414" font-size="18" font-weight="400" fill="#171717">VIA / Stage 4 / 구조 탐색, 미채택 대안 / 구현 및 측정 결과 아님</text>
<text x="72" y="215" font-size="28" font-weight="700" fill="#171717">T  실제 reviewed target</text>
<text x="1336" y="215" font-size="28" font-weight="700" fill="#171717">A  대안 구조</text>
<text x="48" y="1345" font-size="21" font-weight="400" fill="#171717">파랑: 바뀌는 책임과 자료 / 검정: 공통 책임 / 박스는 명시한 논리 구성 또는 runtime / 화살표 label의 경계를 비교</text>

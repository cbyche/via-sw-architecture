</g>
<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">S-02 / A 실행  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="129.0" text-anchor="start" font-size="42" font-weight="700" fill="#263445">A: 화면 대상 생산은 요청과 독립적으로 진행한다</text></g>
<g id="e5"><text x="64" y="174.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">생산 흐름과 요청 흐름은 병행한다. 준비된 정보가 없거나 불확실하면 원래 화면 기록을 조회한다. 두 흐름은 각각 1부터 읽는다.</text></g>
<g id="e8"><text x="88" y="284.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">배경 생산 / Interaction Manager의 새 화면 기록 알림</text></g>
<g id="e18" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="466.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">1. 변경 알림과 허용된 화면 근거 참조 전달</text></g>
<g id="e20" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="982" y="544.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">2. 변경 범위, 현재 권한과 처리 예산 확인</text></g>
<g id="e22" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="939" y="614.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">3. 이미지 해석이 필요한 경우에만 분석 요청</text></g>
<g id="e24" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1645" y="688.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">4. 항목 위치, 종류와 변경 관계 후보 요청</text></g>
<g id="e26" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1645" y="762.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">5. 분석 후보 반환</text></g>
<g id="e28" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="939" y="836.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">6. 분석 결과 반환</text></g>
<g id="e30" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="982" y="914.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">7. 원래 화면과 캡처 시각 연결 → 검증 후 보관</text></g>
<g id="e31"><text x="88" y="1002.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">앱의 구조 정보로 충분하면 모델 요청과 4~6을 생략한다. 발화 시작을 기다리지 않으며 단순 포인터 이동마다 모델을 호출하지 않는다.</text></g>
<g id="e33"><text x="88" y="1132.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">요청 처리 / 발화 당시 대상 정보가 필요한 입력</text></g>
<g id="e49" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="1314.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">1. 인식 문장, 입력 버전과 당시 근거 참조 전달</text></g>
<g id="e51" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="939" y="1388.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">2. 허용 근거 구성 요청</text></g>
<g id="e53" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="585" y="1462.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">3. 발화 시간과 창, 문서에 맞는 대상 정보 조회</text></g>
<g id="e55" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="585" y="1536.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">4. 항목, 변경 관계, 분석 범위와 준비 상태 반환</text></g>
<g id="e57" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="1610.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">5. 미준비, 불확실 또는 원래 이미지가 필요하면 당시 기록 조회</text></g>
<g id="e59" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="232" y="1684.0" text-anchor="start" font-size="20" font-weight="400" fill="#087A53">6. 보관 범위의 화면과 조작 기록 반환 / 5를 생략하면 함께 생략</text></g>
<g id="e61" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="939" y="1758.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">7. 현재 원문과 권한 확인 후 Context 반환</text></g>
<g id="e63" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1292" y="1832.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">8. 입력과 Context로 해석 요청</text></g>
<g id="e65" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1645" y="1906.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">9. 발화의 대상 역할과 의도 해석 요청</text></g>
<g id="e67" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1999" y="1980.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">10. 모델 입력 전달</text></g>
<g id="e69" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1999" y="2054.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">11. 해석 결과 반환</text></g>
<g id="e71" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1645" y="2128.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">12. 결과 반환</text></g>
<g id="e73" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1292" y="2202.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">13. 의미 제안 또는 확인 필요성 반환</text></g>
<g id="e75" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1335" y="2280.0" text-anchor="start" font-size="20" font-weight="400" fill="#263445">14. 현재 입력과 근거 검증 → 확정 또는 보류</text></g>
<g id="e76"><text x="88" y="2368.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">사전 분석은 사용자 의도를 확정하지 않는다. 생산 완료를 무한 대기하지 않으며 없는 과거는 확인 질문으로 처리한다.</text></g>
<g id="e78"><text x="64" y="2641.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">색:  검정 = 공통     파랑 = T 전용     초록 = A/B 전용</text></g>
<g id="e79"><text x="2496" y="2640.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달     점선 → 결과/복원</text></g>
<g id="e80"><text x="64" y="2677.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">모양:  제목 칸이 있는 박스 = Component   |   내부 둥근 박스 = Module   |   원통 = 저장소   |   접힌 종이 = 자료   |   육각형 = 연동 대상/모델</text></g>
<g id="e81"><text x="64" y="2717.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">A의 배경 분석도 같은 Omni 자원을 사용한다. 준비된 정보의 정확성과 실제 시간 및 자원 이익은 미확인이다.</text></g>
<g id="e82"><text x="2496" y="2717.0" text-anchor="end" font-size="17" font-weight="400" fill="#5B697B">탐색안 / 미채택 / 미측정</text></g>
</g></svg>

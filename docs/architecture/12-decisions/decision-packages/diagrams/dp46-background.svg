<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title">
<title id="title">46의 문제 | 말한 당시 화면과 행동, 과거 설명과 업무 결과를 함께 연결</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#333" stroke-width="1.2"/></marker></defs>
<rect width="2560" height="1440" fill="white"/>
<g font-family="Apple SD Gothic Neo, Arial, sans-serif" fill="#111">
<rect x="40" y="140" width="2480" height="250" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.6" stroke-dasharray="9 6"/>
<text x="55" y="169.0" data-width="2450" font-size="21" font-weight="400" text-anchor="start">관련 과거 원본</text>
<path d="M80,220H802L820,238V350H80Z M802,220V238H820" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="450.0" y="265.05" data-width="716" font-size="21" font-weight="400" text-anchor="middle">C20 / E20 / P20</text>
<text x="450.0" y="292.35" data-width="716" font-size="21" font-weight="400" text-anchor="middle">평가 기준 설명 원문</text>
<text x="450.0" y="319.65000000000003" data-width="716" font-size="21" font-weight="400" text-anchor="middle">실제 전달한 범위</text>
<path d="M890,220H1612L1630,238V350H890Z M1612,220V238H1630" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="1260.0" y="265.05" data-width="716" font-size="21" font-weight="400" text-anchor="middle">T21 / D21@v2</text>
<text x="1260.0" y="292.35" data-width="716" font-size="21" font-weight="400" text-anchor="middle">제품 비교의 확인된 결과 참조</text>
<text x="1260.0" y="319.65000000000003" data-width="716" font-size="21" font-weight="400" text-anchor="middle">Agent 내부 자료 전체 아님</text>
<path d="M1700,220H2422L2440,238V350H1700Z M2422,220V238H2440" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="2070.0" y="265.05" data-width="716" font-size="21" font-weight="400" text-anchor="middle">T22 / D22@v1</text>
<text x="2070.0" y="292.35" data-width="716" font-size="21" font-weight="400" text-anchor="middle">견적의 확인된 결과 참조</text>
<text x="2070.0" y="319.65000000000003" data-width="716" font-size="21" font-weight="400" text-anchor="middle">현재 표와 동일하다고 미리 확정하지 않음</text>
<rect x="40" y="445" width="2480" height="480" rx="0" fill="#FFFFFF" stroke="#222222" stroke-width="1.6" stroke-dasharray="9 6"/>
<text x="55" y="474.0" data-width="2450" font-size="21" font-weight="400" text-anchor="start">W46: 같은 음성과 관측 원본 window</text>
<path d="M80,510H762L780,528V605H80Z M762,510V528H780" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="430.0" y="551.2" data-width="676" font-size="21" font-weight="400" text-anchor="middle">a: “이 표와”</text>
<text x="430.0" y="578.5" data-width="676" font-size="21" font-weight="400" text-anchor="middle">가능한 acoustic span / sample 범위</text>
<path d="M1020,510H1702L1720,528V605H1020Z M1702,510V528H1720" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="1370.0" y="551.2" data-width="676" font-size="21" font-weight="400" text-anchor="middle">b: “저 표를 아까 네가 설명한 기준으로…”</text>
<text x="1370.0" y="578.5" data-width="676" font-size="21" font-weight="400" text-anchor="middle">가능한 acoustic span / sample 범위</text>
<path d="M80,690H762L780,708V810H80Z M762,690V708H780" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="430.0" y="730.05" data-width="676" font-size="21" font-weight="400" text-anchor="middle">S1 / P1</text>
<text x="430.0" y="757.3499999999999" data-width="676" font-size="21" font-weight="400" text-anchor="middle">첫 viewport의 표, pointer/선택/drag 경로</text>
<text x="430.0" y="784.65" data-width="676" font-size="21" font-weight="400" text-anchor="middle">capture interval / 좌표계 / 오차</text>
<path d="M810,710H962L980,728V785H810Z M962,710V728H980" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="895.0" y="741.2" data-width="146" font-size="21" font-weight="400" text-anchor="middle">스크롤 /</text>
<text x="895.0" y="768.5" data-width="146" font-size="21" font-weight="400" text-anchor="middle">창 전환</text>
<path d="M1020,690H1702L1720,708V810H1020Z M1702,690V708H1720" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="1370.0" y="730.05" data-width="676" font-size="21" font-weight="400" text-anchor="middle">S2 / P2</text>
<text x="1370.0" y="757.3499999999999" data-width="676" font-size="21" font-weight="400" text-anchor="middle">바뀐 viewport의 표와 당시 pointer/선택</text>
<text x="1370.0" y="784.65" data-width="676" font-size="21" font-weight="400" text-anchor="middle">capture interval / 좌표계 / 오차</text>
<path d="M1840,510H2442L2460,528V700H1840Z M2442,510V528H2460" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="2150.0" y="571.4" data-width="596" font-size="21" font-weight="400" text-anchor="middle">u46@r1 → r2</text>
<text x="2150.0" y="598.6999999999999" data-width="596" font-size="21" font-weight="400" text-anchor="middle">전사는 화면 변경 뒤 도착/정정 가능</text>
<text x="2150.0" y="626.0" data-width="596" font-size="21" font-weight="400" text-anchor="middle">provider item ↔ local sample mapping</text>
<text x="2150.0" y="653.3" data-width="596" font-size="21" font-weight="400" text-anchor="middle">span timing 미제공이면 unknown</text>
<path d="M80,980H1492L1510,998V1150H80Z M1492,980V998H1510" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="795.0" y="1045.05" data-width="1406" font-size="21" font-weight="400" text-anchor="middle">현재 u46</text>
<text x="795.0" y="1072.35" data-width="1406" font-size="21" font-weight="400" text-anchor="middle">“이 표와 저 표를 아까 기준으로 비교해서 제안서 초안을 만들어줘. 메일은 보내지 마.”</text>
<text x="795.0" y="1099.6499999999999" data-width="1406" font-size="21" font-weight="400" text-anchor="middle">지칭, 과거 설명 연결, Task 관계, 위임과 금지 조건이 아직 잠정 상태</text>
<path d="M1720,980H2442L2460,998V1150H1720Z M2442,980V998H2460" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="2090.0" y="1045.05" data-width="716" font-size="21" font-weight="400" text-anchor="middle">채택 뒤의 R46 / 필요 시 T46</text>
<text x="2090.0" y="1072.35" data-width="716" font-size="21" font-weight="400" text-anchor="middle">관련 근거와 조건을 연결해 외부 Agent에 위임</text>
<text x="2090.0" y="1099.6499999999999" data-width="716" font-size="21" font-weight="400" text-anchor="middle">비교 분석과 제안서 작성은 Agent 책임</text>
<polyline points="430,605 430,690" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="1370,605 1370,690" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="780,750 810,750" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="980,750 1020,750" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="1720,560 1840,560" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="1510,1065 1720,1065" fill="none" stroke="#333" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="37" y="20" width="2486" height="46.800000000000004" fill="white"/>
<text x="40" y="56.0" data-width="2480" font-size="36" font-weight="700" text-anchor="start">46의 문제 | 말한 당시 화면과 행동, 과거 설명과 업무 결과를 함께 연결</text>
<rect x="37" y="75" width="2486" height="31.200000000000003" fill="white"/>
<text x="40" y="99.0" data-width="2480" font-size="24" font-weight="400" text-anchor="start">사용자 발화 뒤에 전사가 도착해도, 마지막 화면 하나나 전사 도착 시각으로 앞선 지칭을 대체할 수 없다</text>
<rect x="87" y="830" width="2366" height="62.400000000000006" fill="white"/>
<text x="90" y="854.0" data-width="2360" font-size="24" font-weight="400" text-anchor="start">음성/화면/행동 순서와 오차를 보존 → 시간 관계 후보 구성 → 현재 Request Interpreter가 지칭과 Task 관계 판단</text>
<text x="90" y="885.2" data-width="2360" font-size="24" font-weight="400" text-anchor="start">VAD는 발화 경계만 제공. 단어 시각 미지원/gap/원본 만료는 양안 같은 한계. 시각 overlap이 의도 정답은 아님.</text>
<rect x="77" y="1210" width="2376" height="105.3" fill="white"/>
<text x="80" y="1237.0" data-width="2370" font-size="27" font-weight="400" text-anchor="start">후속 u47: “두 번째 표 대신 새 견적으로 다시 만들어줘. 메일은 계속 보내지 마.”</text>
<text x="80" y="1272.1" data-width="2370" font-size="27" font-weight="400" text-anchor="start">u46 전사 정정은 같은 입력 revision. u47은 별도 입력이며 현재 의미가 채택돼야 수정 범위가 정해진다.</text>
<text x="80" y="1307.2" data-width="2370" font-size="27" font-weight="400" text-anchor="start">이 그림은 공통 문제와 원본을 설명한다. A/B의 관계 구성과 게시/조회는 MAIN에서 비교한다.</text>
</g></svg>

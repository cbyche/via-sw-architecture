<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440" role="img" aria-labelledby="title">
<title id="title">46 | 구조 차이가 만드는 조건별 QA 손익</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#333" stroke-width="1.2"/></marker></defs>
<rect width="2560" height="1440" fill="white"/>
<g font-family="Apple SD Gothic Neo, Arial, sans-serif" fill="#111">
<rect x="37" y="20" width="2486" height="46.800000000000004" fill="white"/>
<text x="40" y="56.0" data-width="2480" font-size="36" font-weight="700" text-anchor="start">46 | 구조 차이가 만드는 조건별 QA 손익</text>
<rect x="37" y="75" width="2486" height="31.200000000000003" fill="white"/>
<text x="40" y="99.0" data-width="2480" font-size="24" font-weight="400" text-anchor="start">설명용 가설 / 미선정·미구현·미측정. 시간 관계는 코드이며 과거 의미 가공만 조건부 모델 호출이다.</text>
<rect x="37" y="150" width="386" height="36.4" fill="white"/>
<text x="40" y="178.0" data-width="380" font-size="28" font-weight="700" text-anchor="start">QA 관점</text>
<rect x="427" y="150" width="996" height="36.4" fill="white"/>
<text x="430" y="178.0" data-width="990" font-size="28" font-weight="700" text-anchor="start">A 요청별 원본 결합</text>
<rect x="1497" y="150" width="1016" height="36.4" fill="white"/>
<text x="1500" y="178.0" data-width="1010" font-size="28" font-weight="700" text-anchor="start">B 공통 관계 생산 / 조회</text>
<rect x="37" y="250" width="386" height="35.1" fill="white"/>
<text x="40" y="277.0" data-width="380" font-size="27" font-weight="700" text-anchor="start">요청 처리 정확성</text>
<rect x="427" y="250" width="996" height="70.2" fill="white"/>
<text x="430" y="277.0" data-width="990" font-size="27" font-weight="400" text-anchor="start">이번 요청의 원본·새 관계를 직접 검토</text>
<text x="430" y="312.1" data-width="990" font-size="27" font-weight="400" text-anchor="start">cache도 허용 / query 결합 오류 가능</text>
<rect x="1497" y="250" width="1016" height="70.2" fill="white"/>
<text x="1500" y="277.0" data-width="1010" font-size="27" font-weight="400" text-anchor="start">게시된 관계·coverage 범위에서 검토</text>
<text x="1500" y="312.1" data-width="1010" font-size="27" font-weight="400" text-anchor="start">누락·낡은 view·공통 오류 전파 가능</text>
<rect x="37" y="435" width="386" height="35.1" fill="white"/>
<text x="40" y="462.0" data-width="380" font-size="27" font-weight="700" text-anchor="start">응답속도</text>
<rect x="427" y="435" width="996" height="70.2" fill="white"/>
<text x="430" y="462.0" data-width="990" font-size="27" font-weight="400" text-anchor="start">필요한 순간 시간·과거 근거 결합</text>
<text x="430" y="497.1" data-width="990" font-size="27" font-weight="400" text-anchor="start">prefetch/cache로 대기 줄일 수 있음</text>
<rect x="1497" y="435" width="1016" height="70.2" fill="white"/>
<text x="1500" y="462.0" data-width="1010" font-size="27" font-weight="400" text-anchor="start">유효 hit면 반복 결합을 줄일 수 있음</text>
<text x="1500" y="497.1" data-width="1010" font-size="27" font-weight="400" text-anchor="start">첫 생산·정정·NOT_COVERED는 대기</text>
<rect x="37" y="620" width="386" height="35.1" fill="white"/>
<text x="40" y="647.0" data-width="380" font-size="27" font-weight="700" text-anchor="start">모델 사용 비용</text>
<rect x="427" y="620" width="996" height="70.2" fill="white"/>
<text x="430" y="647.0" data-width="990" font-size="27" font-weight="400" text-anchor="start">필요한 과거 의미만 가공</text>
<text x="430" y="682.1" data-width="990" font-size="27" font-weight="400" text-anchor="start">재사용 시 cache / 반복 가공 비용</text>
<rect x="1497" y="620" width="1016" height="70.2" fill="white"/>
<text x="1500" y="647.0" data-width="1010" font-size="27" font-weight="400" text-anchor="start">과거 의미 생산비를 반복 사용에 상각</text>
<text x="1500" y="682.1" data-width="1010" font-size="27" font-weight="400" text-anchor="start">미사용·재생산·실패·폐기 비용 포함</text>
<rect x="37" y="805" width="386" height="35.1" fill="white"/>
<text x="40" y="832.0" data-width="380" font-size="27" font-weight="700" text-anchor="start">변경 용이성</text>
<rect x="427" y="805" width="996" height="70.2" fill="white"/>
<text x="430" y="832.0" data-width="990" font-size="27" font-weight="400" text-anchor="start">query/result·원본 adapter가 변경 경계</text>
<text x="430" y="867.1" data-width="990" font-size="27" font-weight="400" text-anchor="start">새 관계는 Resolver/Composer 지원 변경</text>
<rect x="1497" y="805" width="1016" height="70.2" fill="white"/>
<text x="1500" y="832.0" data-width="1010" font-size="27" font-weight="400" text-anchor="start">producer/schema/coverage·reader가 경계</text>
<text x="1500" y="867.1" data-width="1010" font-size="27" font-weight="400" text-anchor="start">공통 생산 변경과 소비 호환 비용</text>
<rect x="37" y="990" width="386" height="35.1" fill="white"/>
<text x="40" y="1017.0" data-width="380" font-size="27" font-weight="700" text-anchor="start">로컬 메모리</text>
<rect x="427" y="990" width="996" height="70.2" fill="white"/>
<text x="430" y="1017.0" data-width="990" font-size="27" font-weight="400" text-anchor="start">같은 raw 예산 + 동시 query/set/cache</text>
<text x="430" y="1052.1" data-width="990" font-size="27" font-weight="400" text-anchor="start">동시 query가 적으면 상태 비용 축소</text>
<rect x="1497" y="990" width="1016" height="70.2" fill="white"/>
<text x="1500" y="1017.0" data-width="1010" font-size="27" font-weight="400" text-anchor="start">같은 raw + view/index/dep/backlog/lease</text>
<text x="1500" y="1052.1" data-width="1010" font-size="27" font-weight="400" text-anchor="start">중복 query 축소량이 추가 상태보다 커야 이익</text>
<rect x="37" y="1210" width="2486" height="93.60000000000001" fill="white"/>
<text x="40" y="1234.0" data-width="2480" font-size="24" font-weight="400" text-anchor="start">시간 overlap/순서의 생산·조회만으로 모델 요금 절감을 부여하지 않는다.</text>
<text x="40" y="1265.2" data-width="2480" font-size="24" font-weight="400" text-anchor="start">46 전체 A/B는 시간+과거 선택의 두 묶음이다. 시간 A+45B / 시간 B+45A는 별도 교차 조합이다.</text>
<text x="40" y="1296.4" data-width="2480" font-size="24" font-weight="400" text-anchor="start">상위 QA로 구조를 선택한 후 약한 축을 tactic으로 보완한다. 숫자 우열·선택 승자는 아직 없다.</text>
</g></svg>

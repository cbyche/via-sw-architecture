<text id="dp45-basic-structures-21-text-0" x="52" y="983.5200000000001" font-size="28.0" text-anchor="start" font-weight="400" fill="#000000" data-width="1816">A의 구성 비용과 B의 생산·유지 비용을, 첫 사용·반복·정정 이후 장면에서 비교합니다.</text>

<g id="e2"><text x="64" y="48.0" text-anchor="start" font-size="24" font-weight="700" fill="#5B697B">VIA / 43 / A 통합 판단 · C 기능별 판단</text></g>
<g id="e3"><text x="2496" y="48.0" text-anchor="end" font-size="24" font-weight="400" fill="#5B697B">설계 후보 / 미선정 / 미측정</text></g>
<g id="e4"><text x="64" y="113.0" text-anchor="start" font-size="41" font-weight="700" fill="#263445">같은 여섯 판단을 함께 할 것인가, 기능별로 나누어 할 것인가?</text></g>
<g id="e5"><text x="64" y="166.0" text-anchor="start" font-size="29" font-weight="700" fill="#263445">예시 입력  “보고서는 PDF로, 메일에는 그 보고서의 결론을 넣어줘.” → “메일에는 결론 대신 표만.”</text></g>
<g id="e6"><text x="64" y="209.0" text-anchor="start" font-size="25" font-weight="400" fill="#5B697B">같은 근거: 원문·화면 시점, 관련 자료, 이전 조건·실제 질문, Task 후보와 확인된 결과. Task 연결은 아직 판단할 대상이다.</text></g>
<g id="e8"><text x="64" y="275.0" text-anchor="start" font-size="35" font-weight="700" fill="#195FBD">A  한 모듈이 전체 의미를 생산</text></g>
<g id="e9"><text x="1306" y="275.0" text-anchor="start" font-size="35" font-weight="700" fill="#7446A4">C  기능별 모듈이 자기 의미를 생산</text></g>
<g id="e10"><text x="64" y="313.0" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">F1~F6을 함께 판단 / Task별 검색·부분 수정·모듈화 가능</text></g>
<g id="e11"><text x="1306" y="313.0" text-anchor="start" font-size="25" font-weight="400" fill="#7446A4">F1~F6을 분리 / 코드가 교환·의존 관리 / 충돌은 원 생산자 재판단</text></g>
<g id="e18" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="140" y="454.0" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">1  원문 + 관련 근거</text></g>
<g id="e20" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="720" y="492.0" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">3  전체 의미 제안 / 미해결 반환</text></g>
<g id="e23" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="210" y="814.0" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">2  F1 의도 / F2 대상 / F3 대화·Task 연결</text><text x="210" y="847.75" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">    F4 요청 관계 / F5 정정 범위 / F6 처리 방향</text></g>
<g id="e25" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="210" y="933.0" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">이전 제안·근거 읽기 / 같은 판단 책임으로 수정</text></g>
<g id="e26" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="140" y="1107.0" text-anchor="start" font-size="24" font-weight="400" fill="#195FBD">임시 전체 제안과 근거 / 소유: Request Interpreter</text></g>
<g id="e29" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1390" y="454.0" text-anchor="start" font-size="25" font-weight="400" fill="#7446A4">1  같은 원문 + 기능별 허용 근거</text></g>
<g id="e31" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2050" y="492.0" text-anchor="start" font-size="25" font-weight="400" fill="#7446A4">3  참조로 결합한 의미 / 미해결</text></g>
<g id="e32" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1738" y="599.0" text-anchor="start" font-size="22" font-weight="400" fill="#263445">2  코드: 배정·검사·재판단 회송</text></g>
<g id="e34" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1336" y="615.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">F1  원문 → 목표·완료 조건·제약</text></g>
<g id="e38" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1336" y="760.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">F2  화면/자료 → 지칭 대상·범위</text></g>
<g id="e42" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1336" y="905.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">F3  대화/Task 후보 → 연결</text></g>
<g id="e46" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2116" y="615.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">F4  F1~F3 → 요청 간 의존·조건</text></g>
<g id="e50" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2116" y="760.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">F5  이전 의미 → 유지·교체·취소</text></g>
<g id="e54" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2116" y="905.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">F6  F1~F5 → 직접응답·위임·확인</text></g>
<g id="e60"><text x="64" y="1162.0" text-anchor="start" font-size="25" font-weight="700" fill="#263445">공통 4  Request Controller: 현재 입력·근거·질문·권한 검사 → State Store에 채택 기록. 미채택 제안은 실행·게시 금지.</text></g>
<g id="e61"><text x="64" y="1199.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">위임: Task Manager → Agent Gateway ↔ Downstream Agent  |  직접 응답/질문: Response Manager ↔ Interaction Manager</text></g>
<g id="e63"><text x="64" y="1259" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">정정: 한 모듈이 메일 조건만 교체한 전체 의미를 제안. PDF 유지.</text><text x="64" y="1296" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">이익 후보: 전체 관계 이해·적은 조정  /  대가: 맥락 혼입·통합 판단 부담</text></g>
<g id="e64"><text x="1306" y="1259" text-anchor="start" font-size="25" font-weight="400" fill="#7446A4">정정: F2 표 → F5 교체 → F4 의존 갱신. 기존 PDF 조건 유지.</text><text x="1306" y="1296" text-anchor="start" font-size="25" font-weight="400" fill="#7446A4">이익 후보: 기능별 집중·오류 분석  /  대가: 불일치·추가 호출·왕복</text></g>
<g id="e65"><text x="64" y="1344.0" text-anchor="start" font-size="24" font-weight="700" fill="#263445">모든 해석 모듈 → Model Access ↔ 공유 on-device Omni 1벌. 역할별 Context/KV·호출·조정 비용은 남고 음성 입력/ASR은 계속.</text></g>
<g id="e66"><text x="64" y="1384.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">외곽은 Component / 내부 둥근 상자는 Module / 원통은 채택 전 임시 상태. 실선: 근거·유효 제안 전달 / 점선 화살표: 판단·미해결 반환.</text></g>
<g id="e67"><text x="64" y="1421.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">공통 자료 읽기는 Request Controller → Context Manager 및 각 원본 소유자. 최종 Task 사실은 Task Manager 소유. 여섯 기능은 고정 호출 횟수가 아니다.</text></g>
</g></svg>

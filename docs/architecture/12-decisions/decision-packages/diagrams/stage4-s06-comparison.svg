<g id="0-asr"><rect x="103" y="690" width="460" height="130" rx="8" fill="#F3F7FD" stroke="#1458C0" stroke-width="2.5"/><text x="119" y="718" font-size="20" font-weight="700" fill="#1458C0">Streaming ASR</text><path d="M103 735H563" stroke="#1458C0" fill="none"/><text x="119" y="754" font-size="20" fill="#1458C0">독립 CPU 인식과 시각 근거</text><text x="119" y="779" font-size="20" fill="#1458C0">추가 helper weights</text></g>

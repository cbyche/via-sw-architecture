<g id="1-native"><rect x="1472" y="810" width="910" height="145" rx="8" fill="#F3F7FD" stroke="#1458C0" stroke-width="2.5"/><text x="1488" y="838" font-size="20" font-weight="700" fill="#1458C0">Omni native evidence producer</text><path d="M1472 855H2382" stroke="#1458C0" fill="none"/><text x="1488" y="874" font-size="20" fill="#1458C0">음성 session에서 transcript revision과 sample 시각 생산</text><text x="1488" y="899" font-size="20" fill="#1458C0">semantic과 실행 기회 공유, 지속 인식 지원 미확인</text></g>
<g id="1-ma"><rect x="1512" y="1100" width="830" height="160" rx="8" fill="#F3F7FD" stroke="#1458C0" stroke-width="2.5"/><text x="1528" y="1128" font-size="20" font-weight="700" fill="#1458C0">Model Access</text><path d="M1512 1145H2342" stroke="#1458C0" fill="none"/><text x="1528" y="1164" font-size="20" fill="#1458C0">Native Evidence Adapter → SpeechEvidence</text><text x="1528" y="1189" font-size="20" fill="#1458C0">없는 시각 근거를 adapter가 만들지 않음</text></g>
<text x="118" y="535" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">독립 인식 경로</text>
<text x="798" y="535" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">Omni 원음 경로</text>
<text x="123" y="995" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">전사 / 시각 / gap</text>
<text x="1013" y="970" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">Omni 결과</text>
<text x="1562" y="520" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">같은 runtime에 입력과 의미 처리 의존</text>
<text x="1612" y="1055" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">native event와 incarnation</text>
<text x="48" y="58" font-size="38" font-weight="700" fill="#171717">S-06  |  음성 근거 생산자의 실행 및 장애 경계</text>
<text x="48" y="104" font-size="22" font-weight="400" fill="#171717">capture/local stop은 양안 모두 추론 밖 / 공유 Omni weights는 양안 각각 한 벌</text>
<text x="48" y="1414" font-size="18" font-weight="400" fill="#171717">VIA / Stage 4 / 구조 탐색, 미채택 대안 / 구현 및 측정 결과 아님</text>
<text x="72" y="215" font-size="28" font-weight="700" fill="#171717">T  실제 reviewed target</text>
<text x="1336" y="215" font-size="28" font-weight="700" fill="#171717">A  대안 구조</text>
<text x="48" y="1345" font-size="21" font-weight="400" fill="#171717">파랑: 바뀌는 책임과 자료 / 검정: 공통 책임 / 박스는 명시한 논리 구성 또는 runtime / 화살표 label의 경계를 비교</text>
<text x="48" y="1380" font-size="20" font-weight="400" fill="#171717">Omni 장애 시 T는 독립 전사를 계속 만들 수 있지만 A의 recognition은 중단된다. 두 안 모두 의미 이해와 Voice 생성은 불가.</text>
</g></svg>

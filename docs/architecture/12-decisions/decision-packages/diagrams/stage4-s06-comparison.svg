<g id="e2"><text x="64" y="63.0" text-anchor="start" font-size="18" font-weight="700" fill="#5E6D80">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="63.0" text-anchor="end" font-size="18" font-weight="700" fill="#5E6D80">S-06   /   STAGE 04</text></g>
<g id="e4"><text x="64" y="134.0" text-anchor="start" font-size="42" font-weight="700" fill="#233247">음성 인식의 진행과 장애를 Omni 추론으로부터 분리할 것인가?</text></g>
<g id="e5"><text x="64" y="183.0" text-anchor="start" font-size="24" font-weight="400" fill="#5E6D80">capture와 local stop은 공통으로 추론 밖에 둔다. 달라지는 것은 인식 근거 생산자의 실행 경계와 모델 의존성이다.</text></g>
<g id="e8"><text x="88" y="273.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">T</text></g>
<g id="e9"><text x="132" y="264.0" text-anchor="start" font-size="27" font-weight="700" fill="#233247">독립 ASR + 공유 Omni</text></g>
<g id="e10"><text x="132" y="294.0" text-anchor="start" font-size="18" font-weight="400" fill="#5E6D80">실제 reviewed target / 인식 실행 경계 분리</text></g>
<g id="e12"><text x="88" y="371.0" text-anchor="start" font-size="18" font-weight="700" fill="#233247">VIA SOFTWARE</text></g>
<g id="e13"><text x="1224" y="370.0" text-anchor="end" font-size="16" font-weight="400" fill="#5E6D80">논리적 책임 경계</text></g>
<g id="e15"><text x="113" y="531.0" text-anchor="start" font-size="18" font-weight="400" fill="#5E6D80">capture / local stop은 모델 진행을 기다리지 않음</text></g>
<g id="e17"><text x="116" y="611.0" text-anchor="start" font-size="18" font-weight="700" fill="#233247">Model Access</text></g>
<g id="e18"><text x="1196" y="610.0" text-anchor="end" font-size="16" font-weight="400" fill="#5E6D80">논리적 연동 책임 / 아래는 실제 실행 경계</text></g>
<g id="e20"><text x="733" y="673.0" text-anchor="start" font-size="18" font-weight="700" fill="#195FBD">Shared Inference Service</text></g>
<g id="e22"><text x="738" y="833.0" text-anchor="start" font-size="18" font-weight="400" fill="#5E6D80">Voice / Semantic session + KV 분리</text></g>
<g id="e27" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="964" y="550.0" text-anchor="start" font-size="18" font-weight="400" fill="#233247">② 원음</text></g>
<g id="e29" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="975" y="912.0" text-anchor="start" font-size="18" font-weight="400" fill="#233247">④ 해석 결과</text></g>
<g id="e31"><text x="148" y="673.0" text-anchor="start" font-size="18" font-weight="700" fill="#195FBD">Speech Input Worker</text></g>
<g id="e33"><text x="153" y="833.0" text-anchor="start" font-size="18" font-weight="400" fill="#5E6D80">독립 CPU 예산 / producer incarnation</text></g>
<g id="e35" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="137" y="565.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">① 같은 원음</text></g>
<g id="e37" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="147" y="913.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">③ 전사 + 시각 + gap</text></g>
<g id="e41"><text x="119" y="1011.0" text-anchor="start" font-size="17" font-weight="400" fill="#5E6D80">모델 내부 구현 / 학습은 VIA 책임 밖. 두 모델 모두 PC 안에 배치될 수 있다.</text></g>
<g id="e44"><text x="89" y="1267.0" text-anchor="start" font-size="18" font-weight="700" fill="#195FBD">DESIGN FOCUS  /  장애 경계 확대: Omni 중단</text></g>
<g id="e45"><text x="89" y="1309" text-anchor="start" font-size="22" font-weight="400" fill="#233247">capture 지속 | 독립 ASR 전사 생산 지속 가능 | 의미 이해와 Voice 생성 중단</text><text x="89" y="1342" text-anchor="start" font-size="22" font-weight="400" fill="#233247">⑤ Interaction Manager가 정규 입력 기록을 구성하고 중요한 근거 충돌을 보존한다.</text><text x="89" y="1375" text-anchor="start" font-size="22" font-weight="400" fill="#233247">Request Controller가 입력 revision의 최종 변경 권한을 가진다.</text></g>
<g id="e46"><text x="89" y="1417.0" text-anchor="start" font-size="18" font-weight="400" fill="#956016">추가 모델 비용이 있다. process 분리가 PC 전력과 메모리 대역폭까지 격리하지는 않는다.</text></g>
<g id="e48"><text x="1336" y="273.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">A</text></g>
<g id="e49"><text x="1380" y="264.0" text-anchor="start" font-size="27" font-weight="700" fill="#233247">공유 Omni native evidence</text></g>
<g id="e50"><text x="1380" y="294.0" text-anchor="start" font-size="18" font-weight="400" fill="#5E6D80">탐색안 / 독립 인식 모델과 worker 제거</text></g>
<g id="e52"><text x="1336" y="371.0" text-anchor="start" font-size="18" font-weight="700" fill="#233247">VIA SOFTWARE</text></g>
<g id="e53"><text x="2472" y="370.0" text-anchor="end" font-size="16" font-weight="400" fill="#5E6D80">논리적 책임 경계</text></g>
<g id="e55"><text x="1361" y="531.0" text-anchor="start" font-size="18" font-weight="400" fill="#5E6D80">capture / local stop은 모델 진행을 기다리지 않음</text></g>
<g id="e57"><text x="1364" y="611.0" text-anchor="start" font-size="18" font-weight="700" fill="#233247">Model Access</text></g>
<g id="e58"><text x="2444" y="610.0" text-anchor="end" font-size="16" font-weight="400" fill="#5E6D80">논리적 연동 책임 / 아래는 실제 실행 경계</text></g>
<g id="e60"><text x="1981" y="673.0" text-anchor="start" font-size="18" font-weight="700" fill="#195FBD">Shared Inference Service</text></g>
<g id="e62"><text x="1986" y="833.0" text-anchor="start" font-size="18" font-weight="400" fill="#5E6D80">Voice / Semantic session + KV 분리</text></g>
<g id="e67" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2212" y="550.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">① 원음</text></g>
<g id="e69" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2223" y="912.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">② native 전사와 시각</text></g>
<g id="e71"><text x="1403" y="685.0" text-anchor="start" font-size="18" font-weight="700" fill="#5E6D80">제거되는 독립 인식 경로</text></g>
<g id="e72"><text x="1403" y="732" text-anchor="start" font-size="23" font-weight="400" fill="#5E6D80">Speech Input Worker</text><text x="1403" y="769" text-anchor="start" font-size="23" font-weight="400" fill="#5E6D80">Streaming ASR weights</text><text x="1403" y="806" text-anchor="start" font-size="23" font-weight="400" fill="#5E6D80">독립 인식 실행 예산</text></g>
<g id="e73"><text x="1378" y="1095.0" text-anchor="start" font-size="18" font-weight="400" fill="#956016">Native Evidence Adapter가 모델의 event를 변환한다.</text><text x="1378" y="1119.3" text-anchor="start" font-size="18" font-weight="400" fill="#956016">모델이 제공하지 않는 시각 근거를 만들 수는 없다.</text></g>
<g id="e74"><text x="1367" y="1011.0" text-anchor="start" font-size="17" font-weight="400" fill="#5E6D80">모델 내부 구현 / 학습은 VIA 책임 밖. 두 모델 모두 PC 안에 배치될 수 있다.</text></g>
<g id="e77"><text x="1337" y="1267.0" text-anchor="start" font-size="18" font-weight="700" fill="#195FBD">DESIGN FOCUS  /  장애 경계 확대: 같은 runtime 의존</text></g>
<g id="e78"><text x="1337" y="1309" text-anchor="start" font-size="22" font-weight="400" fill="#233247">capture 지속 | recognition과 의미 처리가 함께 중단 | 유한 backlog 이후 gap</text><text x="1337" y="1342" text-anchor="start" font-size="22" font-weight="400" fill="#233247">③ Interaction Manager가 native 근거를 정규 입력 기록에 연결한다.</text><text x="1337" y="1375" text-anchor="start" font-size="22" font-weight="400" fill="#233247">동시 인식, partial/final, 시각 및 취소 계약이 실제로 제공되어야 한다.</text></g>
<g id="e79"><text x="1337" y="1417.0" text-anchor="start" font-size="18" font-weight="400" fill="#956016">native capability는 미확인. 인식이 멎은 동안 녹음만 계속된 것을 기능 성공으로 세지 않는다.</text></g>
<g id="e81"><text x="64" y="1569.0" text-anchor="start" font-size="17" font-weight="700" fill="#5E6D80">범례</text></g>
<g id="e83"><text x="190" y="1568.0" text-anchor="start" font-size="17" font-weight="400" fill="#5E6D80">호출 / 전달</text></g>
<g id="e85"><text x="405" y="1568.0" text-anchor="start" font-size="17" font-weight="400" fill="#5E6D80">결과 / 복원</text></g>
<g id="e87"><text x="597" y="1568.0" text-anchor="start" font-size="17" font-weight="400" fill="#5E6D80">구조 차이 또는 확대 대상</text></g>
<g id="e88"><text x="1020" y="1568.0" text-anchor="start" font-size="17" font-weight="400" fill="#5E6D80">외부 책임 경계 ≠ 원격 배치  |  모델은 on-device 의존성</text></g>
<g id="e89"><text x="64" y="1615.0" text-anchor="start" font-size="18" font-weight="400" fill="#5E6D80">Model Access는 client, worker adapter와 공유 추론 scheduler를 아우른다. 모델 자체와 VIA의 연동 코드를 구별한다.</text></g>
<g id="e90"><text x="2496" y="1615.0" text-anchor="end" font-size="17" font-weight="400" fill="#5E6D80">설계 탐색  /  미채택 대안  /  미측정</text></g>
</g></svg>

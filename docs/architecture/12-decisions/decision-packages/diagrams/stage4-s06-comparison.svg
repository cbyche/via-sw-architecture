<g id="0-ma"><rect x="318" y="1050" width="790" height="180" rx="8" fill="#F3F7FD" stroke="#1458C0" stroke-width="2.5"/><text x="334" y="1078" font-size="20" font-weight="700" fill="#1458C0">Model Access</text><path d="M318 1095H1108" stroke="#1458C0" fill="none"/><text x="334" y="1114" font-size="20" fill="#1458C0">ASR adapter → SpeechEvidence</text><text x="334" y="1139" font-size="20" fill="#1458C0">Omni 해석과 중요한 불일치는 보존</text><text x="334" y="1164" font-size="20" fill="#1458C0">두 producer의 revision과 incarnation 구별</text></g>

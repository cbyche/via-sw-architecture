<g id="1-native"><rect x="2067" y="730" width="380" height="65" rx="8" fill="#F3F7FD" stroke="#1458C0" stroke-width="2.5"/><text x="2083" y="758" font-size="18" font-weight="700" fill="#1458C0">Native Evidence Producer</text></g>
<text x="98" y="445" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">① 원음을 독립 인식 경로에 전달</text>
<text x="838" y="445" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">② 원음을 Omni 경로에도 전달</text>
<text x="103" y="850" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">③ 전사 revision, 시각과 gap 반환</text>
<text x="878" y="850" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">④ Omni 해석 결과 반환</text>
<text x="488" y="1110" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">⑤ 근거를 구별해 canonical 입력 기록</text>
<text x="2107" y="445" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">① 원음을 공유 Omni에 전달</text>
<text x="2107" y="850" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">② native 전사 event와 시각 반환</text>
<text x="1742" y="1110" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">③ adapter가 canonical 입력으로 기록</text>
<text x="48" y="58" font-size="38" font-weight="700" fill="#171717">S-06  |  사용자의 음성을 누가 인식 근거로 만드는가</text>
<text x="48" y="104" font-size="22" font-weight="400" fill="#171717">공통 Component는 같은 위치 / T는 독립 Streaming ASR / A는 공유 Omni의 native evidence에 의존</text>
<text x="48" y="1414" font-size="18" font-weight="400" fill="#171717">VIA / Stage 4 / 구조 탐색, 미채택 대안 / 구현 및 측정 결과 아님</text>
<text x="72" y="215" font-size="28" font-weight="700" fill="#171717">T  실제 reviewed target</text>
<text x="1336" y="215" font-size="28" font-weight="700" fill="#171717">A  대안 구조</text>
<text x="48" y="1345" font-size="21" font-weight="400" fill="#171717">박스: Component, 서브시스템, 논리 실행체 또는 저장소 이름 / 번호 화살표: 동작과 순서 / 검정: 공통 / 파랑: 달라지는 구조</text>
<text x="88" y="1260" font-size="18" font-weight="400" fill="#1458C0">차이: Streaming ASR와 Omni가 서로 다른 실행 경로에서 근거를 만든다.</text>
<text x="88" y="1288" font-size="18" font-weight="400" fill="#1458C0">Omni 장애 중에도 독립 전사는 계속될 수 있지만 의미 이해와 Voice 생성은 불가하다.</text>
<text x="1352" y="650" font-size="18" font-weight="400" fill="#1458C0">독립 Speech Input Worker 없음</text>
<text x="1352" y="678" font-size="18" font-weight="400" fill="#1458C0">인식과 의미 처리가 같은 runtime의 실행 기회와 장애 경계를 공유한다.</text>
<text x="1352" y="1260" font-size="18" font-weight="400" fill="#1458C0">차이: 별도 ASR weights와 실행체를 제거한다.</text>
<text x="1352" y="1288" font-size="18" font-weight="400" fill="#1458C0">Omni 장애 중 capture는 계속되지만 recognition도 중단되며 gap을 남겨야 한다.</text>
<text x="48" y="1380" font-size="20" font-weight="400" fill="#171717">공통: capture와 local stop은 추론 밖에서 계속된다. 공유 Omni weights는 한 벌이며 Voice와 semantic session의 상태 및 권한은 격리한다.</text>
</g></svg>

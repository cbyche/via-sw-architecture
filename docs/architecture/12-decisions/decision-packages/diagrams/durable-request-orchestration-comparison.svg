<text x="48" y="58" font-size="38" font-weight="700" fill="#171717">사용자 질문·선행 결과의 대기와 재개  |  SW Architecture 비교</text>
<text x="48" y="104" font-size="22" font-weight="400" fill="#171717">검정: 공통 구성·책임  /  파랑: 양안의 대체·추가·제거 대상  /  실선 경계: 논리 Component  /  점선 경계: process  /  원통: 저장소</text>
<text x="48" y="1414" font-size="18" font-weight="400" fill="#171717">VIA  /  Decision Reconstruction  /  설계 비교 · 구현 및 측정 결과 아님</text>
<text x="56" y="161" font-size="27" font-weight="700" fill="#171717">방안 1 · target  |  domain controller가 진행 소유</text>
<text x="1320" y="161" font-size="27" font-weight="700" fill="#171717">방안 2 · 대안  |  workflow runtime이 continuation 소유</text>
<text x="248" y="616" font-size="22" font-weight="400" fill="#1458C0">domain 전이 코드가 각 대기와 재개를 구현</text>
<text x="248" y="658" font-size="20" font-weight="400" fill="#171717">미완료 원장·교차 owner transaction·재시작 복구 포함</text>
<text x="55" y="1354" font-size="25" font-weight="700" fill="#171717">핵심 구조 차이: domain 상태기계  ↔  별도 실행 substrate · Agent 업무 planning과 Task 소유권은 유지</text>

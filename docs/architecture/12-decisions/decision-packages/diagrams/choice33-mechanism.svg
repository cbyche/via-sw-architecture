<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-33  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">여러 업무의 대화 정확성을 위한 협력</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">중앙 해석과 업무별 대화 처리</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">실제 자료를 사용한 설계 추적 / 본문 §4.1 / 모델 실행 또는 정확도 측정 결과가 아님</text></g>
<g id="e7"><text x="64" y="278.0" text-anchor="start" font-size="28" font-weight="700" fill="#195FBD">A  중앙이 전체 대화 해석</text></g>
<g id="e10"><text x="92" y="391.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">1. 실제로 제시된 두 질문</text></g>
<g id="e11"><text x="92" y="453" text-anchor="start" font-size="23" font-weight="400" fill="#263445">중앙 대화 상태: 보고서 qR=형식 질문, 메일 qM=본문 질문. 이전에 제시한 결론 R.result@4.</text></g>
<g id="e15"><text x="92" y="696.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">2. “보고서는 PDF로, 메일에는 그 결론”</text></g>
<g id="e16"><text x="92" y="758" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Interpreter가 두 업무 근거와 원문을 함께 읽고 qR=PDF,</text><text x="92" y="791" text-anchor="start" font-size="23" font-weight="400" fill="#263445">qM.content=R.result@4를 제안.</text></g>
<g id="e20"><text x="92" y="1001.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">3. 결론 참조를 연결</text></g>
<g id="e21"><text x="92" y="1063" text-anchor="start" font-size="23" font-weight="400" fill="#263445">전체 제안에서 두 대상과 관계 검사. Context Manager로 현재 자료 확인.</text></g>
<g id="e25"><text x="92" y="1306.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">4. 채택 직전 메일 질문 취소가 확인됨</text></g>
<g id="e26"><text x="92" y="1368" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Task Manager의 qM 버전 변경 확인. Request Controller가 아직 보내지 않은 qM 답</text><text x="92" y="1401" text-anchor="start" font-size="23" font-weight="400" fill="#263445">적용을 보류.</text></g>
<g id="e30"><text x="92" y="1611.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">5. 현재 검사 후 가능한 부분 적용</text></g>
<g id="e31"><text x="92" y="1673" text-anchor="start" font-size="23" font-weight="400" fill="#263445">qR/자료/권한 검사 후 독립적인 PDF 선택만 저장/전달. M의 옛 답변은 보내지 않고 질문 종료 안내.</text></g>
<g id="e32"><text x="84" y="1945.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">A도 업무별 버전 검사/부분 진행 가능. B만의 결과라고 주장하지 않음.</text><text x="84" y="1972.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">B의 차이는 상태 전이 작성자와 참조 협력. 모델/DB/프로세스 격리 아님.</text></g>
<g id="e33"><text x="1312" y="278.0" text-anchor="start" font-size="28" font-weight="700" fill="#087A53">B  업무 대화 actor가 협력</text></g>
<g id="e36"><text x="1340" y="391.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">1. 실제로 제시된 두 질문</text></g>
<g id="e37"><text x="1340" y="453" text-anchor="start" font-size="23" font-weight="400" fill="#263445">보고서 actor: qR / R.result@4. 메일 actor: qM. Task Manager가 외부</text><text x="1340" y="486" text-anchor="start" font-size="23" font-weight="400" fill="#263445">질문/결과 사실의 원본.</text></g>
<g id="e41"><text x="1340" y="696.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">2. “보고서는 PDF로, 메일에는 그 결론”</text></g>
<g id="e42"><text x="1340" y="758" text-anchor="start" font-size="23" font-weight="400" fill="#263445">보고서 actor → Dialogue Coordinator: qR=PDF, export=R.result@4.</text><text x="1340" y="791" text-anchor="start" font-size="23" font-weight="400" fill="#263445">메일 actor → Dialogue Coordinator: qM, need=보고서 결론.</text></g>
<g id="e46"><text x="1340" y="1001.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">3. 결론 참조를 연결</text></g>
<g id="e47"><text x="1340" y="1063" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Dialogue Coordinator → 메일 actor: R.result@4 전달. 메일 actor가 허용</text><text x="1340" y="1096" text-anchor="start" font-size="23" font-weight="400" fill="#263445">근거/질문 의미 확인 후 자기 변경 재제안. 중앙의 본문 재작성 없음.</text></g>
<g id="e51"><text x="1340" y="1306.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">4. 채택 직전 메일 질문 취소가 확인됨</text></g>
<g id="e52"><text x="1340" y="1368" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Task Manager → 메일 actor: qM 종료. 메일 actor 상태 버전 변경. Dialogue</text><text x="1340" y="1401" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Coordinator가 옛 M 제안의 채택을 거절.</text></g>
<g id="e56"><text x="1340" y="1611.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">5. 현재 검사 후 가능한 부분 적용</text></g>
<g id="e57"><text x="1340" y="1673" text-anchor="start" font-size="23" font-weight="400" fill="#263445">같은 guard 후 Dialogue Coordinator가 유효한 R 제안만 저장/전달하고 actor에 통지.</text><text x="1340" y="1706" text-anchor="start" font-size="23" font-weight="400" fill="#263445">M은 현재 질문 종료 상태를 알림.</text></g>
<g id="e58"><text x="1332" y="1945.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">A도 업무별 버전 검사/부분 진행 가능. B만의 결과라고 주장하지 않음.</text><text x="1332" y="1972.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">B의 차이는 상태 전이 작성자와 참조 협력. 모델/DB/프로세스 격리 아님.</text></g>
<g id="e60"><text x="64" y="2157.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">검정 = 공통 / 파랑 = A 고유 / 초록 = B 고유 / 색은 우위가 아님</text></g>
<g id="e61"><text x="2496" y="2156.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달 / 점선 → 반환/확인</text></g>
<g id="e62"><text x="64" y="2193.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">제목 상자 = Component / 내부 둥근 상자 = Module / 원통 = 저장 / 접힌 종이 = 자료 / 육각형 = 연동 대상</text></g>
<g id="e63"><text x="64" y="2229.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">예시의 입력/근거는 양안에 동일. 실제 사용 빈도, 정확도와 시간 이익은 미측정.</text></g>
</g></svg>

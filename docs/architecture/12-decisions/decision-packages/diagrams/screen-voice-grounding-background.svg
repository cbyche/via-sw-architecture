<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#FFFFFF"/>
<g font-family="Calibri, sans-serif">
<text id="screen-voice-grounding-background-1-text-0" x="60" y="73.6" font-size="40.0" text-anchor="start" font-weight="700" fill="#000000" data-width="1040">화면과 음성 지칭의 결합 (문제)</text>
<polyline id="screen-voice-grounding-background-2" points="52,104 1872,104" fill="none" stroke="#A6A6A6" stroke-width="1.5"/>
<polyline id="screen-voice-grounding-background-3" points="52,908 1868,908" fill="none" stroke="#A6A6A6" stroke-width="1.5"/>
<text id="screen-voice-grounding-background-4-text-0" x="52" y="970.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#C00000" data-width="180">설계 질문</text>
<text id="screen-voice-grounding-background-5-text-0" x="260" y="974.0266666666668" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1608">말과 손동작을 당시 화면에 연결해,</text>
<text id="screen-voice-grounding-background-5-text-1" x="260" y="1010.8266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1608">사용자가 뜻한 대상을 어떻게 찾을까?</text>
<text id="screen-voice-grounding-background-6-text-0" x="52" y="191.38" font-size="32.0" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">첫 표를 가리켜 “이 표와…”라고 말하고, 화면을 바꿔 “…저 표를 비교해줘”라고 이어 갑니다.</text>
<text id="screen-voice-grounding-background-7-text-0" x="52" y="288.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="568">말하는 순간 1</text>
<text id="screen-voice-grounding-background-8-text-0" x="676" y="288.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="568">말하는 순간 2</text>
<text id="screen-voice-grounding-background-9-text-0" x="1300" y="288.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="568">전사가 도착한 순간</text>
<rect x="52" y="325" width="568" height="54" fill="#F2F2F2" stroke="#A6A6A6" stroke-width="2"/>
<text id="screen-voice-grounding-background-10-text-0" x="66" y="361.06666666666666" font-size="26.666666666666668" text-anchor="start" font-weight="400" fill="#000000" data-width="568">문서 A의 화면</text>
<rect x="676" y="325" width="568" height="54" fill="#F2F2F2" stroke="#A6A6A6" stroke-width="2"/>
<text id="screen-voice-grounding-background-11-text-0" x="690" y="361.06666666666666" font-size="26.666666666666668" text-anchor="start" font-weight="400" fill="#000000" data-width="568">문서 B의 화면</text>
<rect x="1300" y="325" width="568" height="54" fill="#F2F2F2" stroke="#A6A6A6" stroke-width="2"/>
<text id="screen-voice-grounding-background-12-text-0" x="1314" y="361.06666666666666" font-size="26.666666666666668" text-anchor="start" font-weight="400" fill="#000000" data-width="568">현재 문서 B의 화면</text>
<rect x="80" y="405" width="512" height="153" fill="#FFFFFF" stroke="#00889A" stroke-width="2"/>
<text id="screen-voice-grounding-background-13-text-0" x="336.0" y="492.8333333333333" font-size="33.333333333333336" text-anchor="middle" font-weight="700" fill="#000000" data-width="512">첫 표</text>
<rect x="704" y="399" width="512" height="81" fill="#FFFFFF" stroke="#00889A" stroke-width="2"/>
<text id="screen-voice-grounding-background-14-text-0" x="960.0" y="449.4733333333333" font-size="29.333333333333332" text-anchor="middle" font-weight="700" fill="#000000" data-width="512">둘째 표</text>
<rect x="704" y="515" width="512" height="81" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2"/>
<text id="screen-voice-grounding-background-15-text-0" x="960.0" y="565.4733333333334" font-size="29.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="512">아래 표</text>
<rect x="1328" y="399" width="512" height="81" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2"/>
<text id="screen-voice-grounding-background-16-text-0" x="1584.0" y="449.4733333333333" font-size="29.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="512">둘째 표</text>
<rect x="1328" y="515" width="512" height="81" fill="#FFFFFF" stroke="#00889A" stroke-width="2"/>
<text id="screen-voice-grounding-background-17-text-0" x="1584.0" y="548.5666666666667" font-size="26.666666666666668" text-anchor="middle" font-weight="700" fill="#000000" data-width="512">정정한 아래 표</text>
<text id="screen-voice-grounding-background-17-text-1" x="1584.0" y="580.5666666666667" font-size="26.666666666666668" text-anchor="middle" font-weight="700" fill="#000000" data-width="512">선택 범위</text>
<polyline id="screen-voice-grounding-background-18" points="149,578 193,552 230,505" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline points="227.840253859574,517.8193407244255 230,505 218.0459809162677,510.10895564139713" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline id="screen-voice-grounding-background-19" points="690,500 725,470 760,445" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline points="754.3390476864063,456.7027184407392 760,445 747.0938764002974,446.55947864018674" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline id="screen-voice-grounding-background-20" points="1315,610 1350,585 1385,555" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline points="1380.3940434565284,567.1566921619185 1385,555 1372.2818873333379,557.6925100181962" fill="none" stroke="#00889A" stroke-width="2.5"/>
<text id="screen-voice-grounding-background-21-text-0" x="80" y="632.6133333333332" font-size="25.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="512">pointer로 첫 표 지시</text>
<text id="screen-voice-grounding-background-22-text-0" x="704" y="649.6133333333332" font-size="25.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="512">다른 창의 표로 이동</text>
<text id="screen-voice-grounding-background-23-text-0" x="1328" y="649.6133333333332" font-size="25.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="512">첫 표는 이미 보이지 않음</text>
<polyline id="screen-voice-grounding-background-24" points="620,479 656,479" fill="none" stroke="#A6A6A6" stroke-width="2.5"/>
<polyline points="644.5914266954252,485.2325320018546 656,479 644.5914266954252,472.7674679981454" fill="none" stroke="#A6A6A6" stroke-width="2.5"/>
<polyline id="screen-voice-grounding-background-25" points="1244,479 1280,479" fill="none" stroke="#A6A6A6" stroke-width="2.5"/>
<polyline points="1268.591426695425,485.2325320018546 1280,479 1268.591426695425,472.7674679981454" fill="none" stroke="#A6A6A6" stroke-width="2.5"/>
<text id="screen-voice-grounding-background-26-text-0" x="52" y="737.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">“아니, 여기.”로 정정하면 선택 범위와 바꿀 지칭도 다시 연결해야 합니다.</text>
<text id="screen-voice-grounding-background-27-text-0" x="52" y="800.9733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="1816">근거: 말한 구간, 당시 화면, pointer 경로와 선택 범위</text>
<text id="screen-voice-grounding-background-28-text-0" x="52" y="875.9733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">마지막 화면만 쓰면 첫 표를 잃고, 시각이 겹친다는 이유만으로 대상을 정하면 틀릴 수 있습니다.</text>
<text id="screen-voice-grounding-background-29-text-0" x="52" y="1056.7066666666667" font-size="22.666666666666668" text-anchor="start" font-weight="400" fill="#000000" data-width="1816">새 주제 탐색 · 번호와 A/B 미정</text>
</g></svg>

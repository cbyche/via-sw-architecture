<g id="e02"><rect x="1410" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="408" font-size="20" font-weight="700" fill="#171717">입력 확정</text><text x="1426" y="444" font-size="20" fill="#171717">“지난주 견적 메일”</text><text x="1426" y="469" font-size="20" fill="#171717">읽을 source·범위가 드러남</text></g>
<g id="e03"><rect x="1950" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="408" font-size="20" font-weight="700" fill="#171717">의미 해석</text><text x="1966" y="444" font-size="20" fill="#171717">근거 + 사용자 목표</text><text x="1966" y="469" font-size="20" fill="#171717">설명 또는 확인 질문</text></g>

<g id="scenario"><rect x="48" y="142" width="2464" height="104" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="170" font-size="20" font-weight="700" fill="#171717">사용자 상황</text><text x="64" y="206" font-size="20" fill="#171717">“아까 그 보고서 어디까지 됐어?”와 “지난주 견적 메일을 요약해줘”는 필요한 source가 다르다.</text></g>

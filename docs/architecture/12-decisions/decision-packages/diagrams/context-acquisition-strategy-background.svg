<g id="e10"><rect x="330" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="346" y="570" font-size="20" font-weight="700" fill="#171717">기본 근거</text><text x="346" y="606" font-size="20" fill="#171717">현재 선택 · 최근 대화</text><text x="346" y="631" font-size="20" fill="#171717">Task 요약 · 연결 metadata</text></g>
<g id="e11"><rect x="870" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="886" y="570" font-size="20" font-weight="700" fill="#171717">추가 근거 후보</text><text x="886" y="606" font-size="20" fill="#171717">파일 / 메일 / 일정 / Task</text><text x="886" y="631" font-size="20" fill="#171717">모두 읽을 수는 없음</text></g>
<g id="e12"><rect x="1410" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="570" font-size="20" font-weight="700" fill="#171717">실제 bounded read</text><text x="1426" y="606" font-size="20" fill="#171717">source + filter + page 한도</text><text x="1426" y="631" font-size="20" fill="#171717">실패·누락·revision 기록</text></g>
<g id="e13"><rect x="1950" y="542" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="570" font-size="20" font-weight="700" fill="#171717">사용 가능한 근거</text><text x="1966" y="606" font-size="20" fill="#171717">원문 · typed record</text><text x="1966" y="631" font-size="20" fill="#171717">coverage · 현재 권한</text></g>
<g id="lane2"><rect x="48" y="704" width="246" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="732" font-size="20" font-weight="700" fill="#171717">설계의 긴장</text></g>
<g id="e20"><rect x="330" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="346" y="732" font-size="20" font-weight="700" fill="#171717">사전 준비</text><text x="346" y="768" font-size="20" fill="#171717">발화와 조회를 겹칠 여지</text><text x="346" y="793" font-size="20" fill="#171717">사용되지 않을 수도 있음</text></g>
<g id="e21"><rect x="870" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="886" y="732" font-size="20" font-weight="700" fill="#171717">계획 선행</text><text x="886" y="768" font-size="20" fill="#171717">선택적 조회로 낭비 감소</text><text x="886" y="793" font-size="20" fill="#171717">계획 자체에 근거가 필요</text></g>
<g id="e22"><rect x="1410" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="732" font-size="20" font-weight="700" fill="#171717">source 대기</text><text x="1426" y="768" font-size="20" fill="#171717">API / 파일 / owner read</text><text x="1426" y="793" font-size="20" fill="#171717">병렬 query도 결과 대기 필요</text></g>
<g id="e23"><rect x="1950" y="704" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1966" y="732" font-size="20" font-weight="700" fill="#171717">동일 완료 조건</text><text x="1966" y="768" font-size="20" fill="#171717">당시 화면·후보 누락 보존</text><text x="1966" y="793" font-size="20" fill="#171717">빠른 잘못된 응답은 실패</text></g>
<g id="pressure0"><rect x="48" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="953" font-size="20" font-weight="700" fill="#171717">입력 전에 할 수 있는 일</text><text x="64" y="989" font-size="20" fill="#171717">당시 화면 관측은 두 안 모두 필요하다.</text><text x="64" y="1014" font-size="20" fill="#171717">의미 기반 자료 읽기와 구분해야 한다.</text><text x="64" y="1039" font-size="20" fill="#171717">현재 화면으로 과거 지칭을 복원할 수 없다.</text></g>
<g id="pressure1"><rect x="884" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="900" y="953" font-size="20" font-weight="700" fill="#171717">응답 경로의 비용</text><text x="900" y="989" font-size="20" fill="#171717">선행 준비의 적중과 폐기를 함께 본다.</text><text x="900" y="1014" font-size="20" fill="#171717">조회 계획·query·해석의 의존이 생긴다.</text><text x="900" y="1039" font-size="20" fill="#171717">cache·병렬 읽기는 두 안 모두 허용한다.</text></g>
<g id="pressure2"><rect x="1720" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1736" y="953" font-size="20" font-weight="700" fill="#171717">구조로 해결할 난점</text><text x="1736" y="989" font-size="20" fill="#171717">첫 읽기를 무엇이 trigger하는가?</text><text x="1736" y="1014" font-size="20" fill="#171717">첫 모델 입력에 어떤 근거가 있는가?</text><text x="1736" y="1039" font-size="20" fill="#171717">누락·source 실패를 어디서 종료하는가?</text></g>
<g id="challenge"><rect x="48" y="1170" width="2464" height="170" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="1198" font-size="20" font-weight="700" fill="#171717">Architecture Challenge</text><text x="64" y="1234" font-size="20" fill="#171717">기본 Context를 발화 중 준비할 것인가, 확정 입력에서 조회 계획을 만든 뒤 필요한 source를 읽을 것인가?</text></g>

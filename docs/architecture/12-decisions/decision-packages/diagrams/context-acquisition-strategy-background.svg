<g id="e00"><rect x="330" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="346" y="408" font-size="20" font-weight="700" fill="#171717">발화 시작</text><text x="346" y="444" font-size="20" fill="#171717">화면·포인터 당시 상태</text><text x="346" y="469" font-size="20" fill="#171717">최근 대화가 관련될 수 있음</text></g>

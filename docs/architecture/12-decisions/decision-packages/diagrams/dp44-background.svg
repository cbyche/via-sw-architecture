<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#FFFFFF"/>
<g font-family="Calibri, sans-serif">
<text id="dp44-background-1-text-0" x="60" y="73.6" font-size="40.0" text-anchor="start" font-weight="700" fill="#000000" data-width="1040">DP44. 정정과 업무 알림이 겹치는 대화</text>
<polyline id="dp44-background-2" points="52,104 1872,104" fill="none" stroke="#A6A6A6" stroke-width="1.5"/>
<polyline id="dp44-background-3" points="52,908 1868,908" fill="none" stroke="#A6A6A6" stroke-width="1.5"/>
<text id="dp44-background-4-text-0" x="52" y="970.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#C00000" data-width="180">설계 질문</text>
<text id="dp44-background-5-text-0" x="260" y="974.0266666666668" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1608">정정과 업무 질문이 계속 들어와도</text>
<text id="dp44-background-5-text-1" x="260" y="1010.8266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1608">청취와 발화를 어떻게 자연스럽게 이어갈까?</text>
<text id="dp44-background-6-text-0" x="52" y="191.33333333333334" font-size="33.333333333333336" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">VIA가 보고서를 설명하는 동안, 사용자는 “잠깐, 표부터 설명해줘”라고 고칩니다.</text>
<text id="dp44-background-7-text-0" x="52" y="251.42666666666665" font-size="30.666666666666668" text-anchor="start" font-weight="400" fill="#000000" data-width="1816">그 사이 메일 업무의 질문이 오고, 정정 전 답변도 뒤늦게 준비됩니다.</text>
<text id="dp44-background-8-text-0" x="52" y="360.9733333333333" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="280">사용자</text>
<polyline id="dp44-background-9" points="345,350 1850,350" fill="none" stroke="#D0D0D0" stroke-width="1.4" stroke-dasharray="8 7"/>
<text id="dp44-background-10-text-0" x="52" y="448.9733333333333" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="280">VIA 설명</text>
<polyline id="dp44-background-11" points="345,438 730,438" fill="none" stroke="#D0D0D0" stroke-width="1.4" stroke-dasharray="8 7"/>
<text id="dp44-background-12-text-0" x="52" y="558.9733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="280">메일 업무</text>
<polyline id="dp44-background-13" points="345,548 910,548" fill="none" stroke="#D0D0D0" stroke-width="1.4" stroke-dasharray="8 7"/>
<text id="dp44-background-14-text-0" x="52" y="660.9733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="280">이전 답변 준비</text>
<polyline id="dp44-background-15" points="345,650 1050,650" fill="none" stroke="#D0D0D0" stroke-width="1.4" stroke-dasharray="8 7"/>
<text id="dp44-background-16-text-0" x="740" y="327.88" font-size="32.0" text-anchor="start" font-weight="700" fill="#000000" data-width="710">“잠깐, 표부터 설명해줘.”</text>
<polyline id="dp44-background-17" points="745,350 1290,350" fill="none" stroke="#00889A" stroke-width="8"/>
<polyline id="dp44-background-18" points="360,438 745,438" fill="none" stroke="#00889A" stroke-width="8"/>
<polyline id="dp44-background-19" points="745,417 745,460" fill="none" stroke="#C00000" stroke-width="4"/>
<text id="dp44-background-20-text-0" x="780" y="441.9733333333333" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="1050">즉시 중단하고 입력은 계속 수신</text>
<text id="dp44-background-21-text-0" x="360" y="496.61333333333334" font-size="25.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="350">보고서 설명 중</text>
<ellipse cx="929.0" cy="548.0" rx="14.0" ry="14.0" fill="#FFFFFF" stroke="#00889A" stroke-width="2"/>
<text id="dp44-background-22-text-0" x="929.0" y="557.5200000000001" font-size="28.0" text-anchor="middle" font-weight="400" fill="#000000" data-width="28"></text>
<text id="dp44-background-23-text-0" x="910" y="611.9733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="620">“받는 사람은 누구인가요?”</text>
<polyline id="dp44-background-24" points="943,548 1430,548" fill="none" stroke="#00889A" stroke-width="2.5" stroke-dasharray="8 7"/>
<polyline points="1418.591426695425,554.2325320018547 1430,548 1418.591426695425,541.7674679981453" fill="none" stroke="#00889A" stroke-width="2.5"/>
<text id="dp44-background-25-text-0" x="1460" y="551.3733333333333" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="390">메일 업무로 연결</text>
<text id="dp44-background-25-text-1" x="1460" y="586.5733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="390">적절한 차례에 제시</text>
<ellipse cx="1080.0" cy="650.0" rx="14.0" ry="14.0" fill="#FFFFFF" stroke="#C00000" stroke-width="2"/>
<text id="dp44-background-26-text-0" x="1080.0" y="659.5200000000001" font-size="28.0" text-anchor="middle" font-weight="400" fill="#000000" data-width="28"></text>
<polyline id="dp44-background-27" points="1094,650 1295,650" fill="none" stroke="#C00000" stroke-width="2.5"/>
<polyline points="1283.591426695425,656.2325320018547 1295,650 1283.591426695425,643.7674679981453" fill="none" stroke="#C00000" stroke-width="2.5"/>
<polyline id="dp44-background-28" points="1320,636 1348,664" fill="none" stroke="#C00000" stroke-width="3"/>
<polyline id="dp44-background-29" points="1348,636 1320,664" fill="none" stroke="#C00000" stroke-width="3"/>
<text id="dp44-background-30-text-0" x="1390" y="662.5200000000001" font-size="28.0" text-anchor="start" font-weight="700" fill="#000000" data-width="460">정정 전 후보는 다시 말하지 않음</text>
<text id="dp44-background-31-text-0" x="52" y="770.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">정정 전 답변을 다시 말하거나 메일 질문을 놓치면, 사용자의 제어가 무너집니다.</text>
<text id="dp44-background-32-text-0" x="52" y="858.9733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="1816">도착 순서만으로 다음 처리를 정할 수 없습니다. 준비 완료와 실제 전달도 구별해야 합니다.</text>
</g></svg>

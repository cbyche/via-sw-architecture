<title id="title">04-44. 계속 듣고 응답하는 대화의 실행 구조 — DP 배경</title>
<defs>
<marker id="a18232E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#18232E" stroke-width="1.6"/></marker>
<marker id="a2858A5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#2858A5" stroke-width="1.6"/></marker>
<marker id="aB63732" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B63732" stroke-width="1.6"/></marker>
<marker id="a087E8B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#087E8B" stroke-width="1.6"/></marker>
<marker id="a5F6B77" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5F6B77" stroke-width="1.6"/></marker>
</defs><g font-family="Apple SD Gothic Neo, Arial, sans-serif">
<rect id="n1" fill="white" stroke="none" stroke-width="1.7" x="0" y="0" width="1920" height="1080"/>
<text id="n2-0" data-width="1250" x="64" y="43.400000000000006" text-anchor="start" font-size="20" font-weight="700" fill="#087E8B">VIA SOFTWARE ARCHITECTURE / DP 배경</text>
<text id="n3-0" data-width="280" x="1856" y="43.400000000000006" text-anchor="end" font-size="20" font-weight="400" fill="#5F6B77">04-44</text>
<text id="n4-0" data-width="1780" x="64" y="107.32" text-anchor="start" font-size="46" font-weight="700" fill="#18232E">04-44. 계속 듣고 응답하는 대화의 실행 구조</text>
<polyline id="n5" points="64,127 1856,127" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<rect id="n6" fill="#FFF4A8" stroke="none" stroke-width="1.7" x="64" y="151" width="1792" height="52"/>
<text id="n7-0" data-width="1756" x="82" y="186.52" text-anchor="start" font-size="31" font-weight="700" fill="#18232E">VIA가 생각하거나 말하는 동안에도 새 발화와 업무 사건이 도착한다</text>
<text id="n8-0" data-width="1792" x="64" y="243.0" text-anchor="start" font-size="25" font-weight="400" fill="#5F6B77">입력은 계속 받고, 현재 정정과 기존 업무의 질문·결과를 같은 대화에서 올바르게 이어가야 한다.</text>
<polyline id="n9" points="1213,285 1213,852" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<text id="n10-0" data-width="596" x="1260" y="317.68" text-anchor="start" font-size="29" font-weight="700" fill="#18232E">구조 설계에서 어려운 점</text>
<polyline id="n11" points="64,875 1856,875" fill="none" stroke="#2858A5" stroke-width="2"/>
<text id="n12-0" data-width="165" x="64" y="931.76" text-anchor="start" font-size="28" font-weight="700" fill="#B63732">설계 과제</text>
<text id="n13-0" data-width="1616" x="240" y="928.6" text-anchor="start" font-size="30" font-weight="700" fill="#18232E">겹쳐 도착하는 사건의 후속 실행과 중간 상태를 어떻게 조직할 것인가?</text>
<text id="n14-0" data-width="1616" x="240" y="971.08" text-anchor="start" font-size="24" font-weight="400" fill="#2858A5">A 중앙 비동기 Orchestration/Mediator / B 반응형 Dataflow/Pipes-and-Filters</text>
<text id="n15-0" data-width="1260" x="64" y="1036.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">품질 쟁점: 반응성·전달 정확성과 대기열·취소·자원 경합</text>
<text id="n16-0" data-width="480" x="1856" y="1036.4" text-anchor="end" font-size="20" font-weight="400" fill="#5F6B77">구조 후보 / 미선정 / 미측정</text>
<text id="n17-0" data-width="1120" x="64" y="313.76" text-anchor="start" font-size="28" font-weight="700" fill="#18232E">보고서 설명을 듣다가  “잠깐, 표부터 설명해줘.”</text>
<path id="n18" fill="#F2F6FA" stroke="#CDD6DE" stroke-width="1.7" d="M64 355H581L599 373V457H64Z M581 355V373H599"/>
<text id="n19-0" data-width="495" x="80" y="391.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">사용자: 새 발화·정정 u2</text>
<text id="n19-1" data-width="495" x="80" y="423.5" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">현재 음성 P1을 즉시 중단</text>
<path id="n20" fill="#F2F6FA" stroke="#CDD6DE" stroke-width="1.7" d="M650 355H1156L1174 373V457H650Z M1156 355V373H1174"/>
<text id="n21-0" data-width="484" x="666" y="391.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">별도 업무: 질문 Q1 / 결과 r1 도착</text>
<text id="n21-1" data-width="484" x="666" y="423.5" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">현재 발화와 다른 시점에 발생</text>
<rect id="n22" fill="white" stroke="#18232E" stroke-width="1.7" x="64" y="539" width="440" height="72"/>
<text id="n23-0" data-width="424" x="284.0" y="581.92" text-anchor="middle" font-size="26" font-weight="700" fill="#18232E">Interaction Manager</text>
<rect id="n24" fill="white" stroke="#18232E" stroke-width="1.7" x="734" y="539" width="440" height="72"/>
<text id="n25-0" data-width="424" x="954.0" y="581.92" text-anchor="middle" font-size="26" font-weight="700" fill="#18232E">Task Manager</text>
<rect id="n26" fill="white" stroke="#18232E" stroke-width="1.7" x="64" y="732" width="440" height="72"/>
<text id="n27-0" data-width="424" x="284.0" y="774.92" text-anchor="middle" font-size="26" font-weight="700" fill="#18232E">Request Controller</text>
<rect id="n28" fill="white" stroke="#18232E" stroke-width="1.7" x="734" y="732" width="440" height="72"/>
<text id="n29-0" data-width="424" x="954.0" y="774.92" text-anchor="middle" font-size="26" font-weight="700" fill="#18232E">Response Manager</text>
<polyline id="n30" points="284,457 284,539" fill="none" stroke="#18232E" stroke-width="2" marker-end="url(#a18232E)"/>
<rect id="n31" fill="white" stroke="none" stroke-width="1.7" x="298" y="474" width="285" height="32.6"/>
<text id="n32-0" data-width="275" x="303" y="496.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">1 지속 수신·인식</text>
<polyline id="n33" points="954,457 954,539" fill="none" stroke="#18232E" stroke-width="2" marker-end="url(#a18232E)"/>
<rect id="n34" fill="white" stroke="none" stroke-width="1.7" x="672" y="474" width="280" height="32.6"/>
<text id="n35-0" data-width="270" x="677" y="496.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">2 확인된 업무 사건</text>
<polyline id="n36" points="284,611 284,732" fill="none" stroke="#18232E" stroke-width="2" marker-end="url(#a18232E)"/>
<rect id="n37" fill="white" stroke="none" stroke-width="1.7" x="298" y="650" width="285" height="32.6"/>
<text id="n38-0" data-width="275" x="303" y="672.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">3 현재 입력 해소</text>
<polyline id="n39" points="954,611 954,732" fill="none" stroke="#18232E" stroke-width="2" marker-end="url(#a18232E)"/>
<rect id="n40" fill="white" stroke="none" stroke-width="1.7" x="672" y="650" width="300" height="32.6"/>
<text id="n41-0" data-width="290" x="677" y="672.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">4 질문·결과 전달 준비</text>
<polyline id="n42" points="504,768 734,768" fill="none" stroke="#2858A5" stroke-width="2" marker-end="url(#a2858A5)"/>
<rect id="n43" fill="white" stroke="none" stroke-width="1.7" x="501" y="809" width="236" height="32.6"/>
<text id="n44-0" data-width="226" x="506" y="831.24" text-anchor="start" font-size="22" font-weight="400" fill="#2858A5">현재 의미·허용</text>
<polyline id="n45" points="1174,752 1192,752 1192,513 470,513 470,539" fill="none" stroke="#2858A5" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#a2858A5)"/>
<text id="n46-0" data-width="226" x="619" y="601.24" text-anchor="middle" font-size="22" font-weight="400" fill="#2858A5">게시 허용 후 실제 출력</text>
<text id="n46-1" data-width="226" x="619" y="629.84" text-anchor="middle" font-size="22" font-weight="400" fill="#2858A5">전달 결과는 다시 기록</text>
<text id="n47-0" data-width="1120" x="64" y="860.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">음성 중단은 업무 취소와 다르다. 생성 완료는 실제 전달과 다르다.</text>
<text id="n48-0" data-width="596" x="1260" y="389.76" text-anchor="start" font-size="28" font-weight="700" fill="#2858A5">01  입력 보호와 처리 병행</text>
<text id="n49-0" data-width="596" x="1260" y="434.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">긴 해석 중에도 입력과 중단을 받음.</text>
<text id="n49-1" data-width="596" x="1260" y="469.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">비동기는 두 안의 공통 조건이다.</text>
<text id="n50-0" data-width="596" x="1260" y="540.76" text-anchor="start" font-size="28" font-weight="700" fill="#2858A5">02  정정 전 효과와 전달 제어</text>
<text id="n51-0" data-width="596" x="1260" y="585.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">미전송 효과·오래된 응답을 보류하고,</text>
<text id="n51-1" data-width="596" x="1260" y="620.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">실제로 들은 범위에 맞게 이어간다.</text>
<text id="n52-0" data-width="596" x="1260" y="691.76" text-anchor="start" font-size="28" font-weight="700" fill="#2858A5">03  분기·대기·합류의 조직</text>
<text id="n53-0" data-width="596" x="1260" y="736.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">중앙의 명령·반환 관리와</text>
<text id="n53-1" data-width="596" x="1260" y="771.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">소비자 활성화·국소 결합을 비교한다.</text>
</g></svg>

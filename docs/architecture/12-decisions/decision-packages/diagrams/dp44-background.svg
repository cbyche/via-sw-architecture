<marker id="aB63732" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#B63732" stroke-width="1.6"/></marker>
<marker id="a087E8B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#087E8B" stroke-width="1.6"/></marker>
<marker id="a5F6B77" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#5F6B77" stroke-width="1.6"/></marker>
</defs><g font-family="Apple SD Gothic Neo, Arial, sans-serif">
<rect id="n1" fill="white" stroke="none" stroke-width="1.7" x="0" y="0" width="1920" height="1080"/>
<text id="n2-0" data-width="1250" x="64" y="43.400000000000006" text-anchor="start" font-size="20" font-weight="700" fill="#087E8B">VIA SOFTWARE ARCHITECTURE / DP 배경</text>
<text id="n3-0" data-width="280" x="1856" y="43.400000000000006" text-anchor="end" font-size="20" font-weight="400" fill="#5F6B77">04-44</text>
<text id="n4-0" data-width="1780" x="64" y="101.80000000000001" text-anchor="start" font-size="40" font-weight="700" fill="#18232E">04-44. 반응성을 위한 VIA 지속 입력과 Response 전달 설계</text>
<polyline id="n5" points="64,127 1856,127" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<rect id="n6" fill="#FFF4A8" stroke="none" stroke-width="1.7" x="64" y="151" width="1792" height="64"/>
<text id="n7-0" data-width="1756" x="82" y="198.12" text-anchor="start" font-size="36" font-weight="700" fill="#18232E">새 발화 누락과 현재 대화에 맞지 않는 Response 전달 위험</text>
<polyline id="n8" points="1213,282 1213,859" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<text id="n9-0" data-width="596" x="1260" y="306.92" text-anchor="start" font-size="26" font-weight="700" fill="#5F6B77">설계 고려 사항</text>
<polyline id="n10" points="64,888 1856,888" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<text id="n11-0" data-width="165" x="64" y="948.92" text-anchor="start" font-size="26" font-weight="700" fill="#B63732">설계 과제</text>
<text id="n12-0" data-width="1616" x="240" y="948.52" text-anchor="start" font-size="31" font-weight="700" fill="#18232E">겹친 사건의 후속 실행과 전달을 이어가는 실행 구조 설계</text>
<text id="n13-0" data-width="1260" x="64" y="1051.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">품질 관점: 반응성 / 기능 정확성 / 자원 활용성</text>
<text id="n14-0" data-width="480" x="1856" y="1051.56" text-anchor="end" font-size="18" font-weight="400" fill="#5F6B77">구조 후보 / 미선정 / 미측정</text>
<text id="n15-0" data-width="1110" x="64" y="280.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">처음 / “보고서 내용 설명해주고, 내일 회의 안내 메일 초안도 만들어줘.”</text>
<text id="n16-0" data-width="310" x="80" y="331.16" text-anchor="start" font-size="23" font-weight="700" fill="#5F6B77">처리 시작</text>
<text id="n17-0" data-width="310" x="464" y="331.16" text-anchor="start" font-size="23" font-weight="700" fill="#B63732">설명 도중 / 두 사건 도착</text>
<text id="n18-0" data-width="310" x="848" y="331.16" text-anchor="start" font-size="23" font-weight="700" fill="#5F6B77">발화 해석 후</text>
<polyline id="n19" points="411,326 440,326" fill="none" stroke="#5F6B77" stroke-width="2" marker-end="url(#a5F6B77)"/>
<polyline id="n20" points="795,326 824,326" fill="none" stroke="#5F6B77" stroke-width="2" marker-end="url(#a5F6B77)"/>
<rect id="n21" fill="#F2F5F9" stroke="none" stroke-width="1.7" x="64" y="356" width="342" height="189"/>
<rect id="n22" fill="#FFF0EC" stroke="none" stroke-width="1.7" x="448" y="356" width="342" height="189"/>
<rect id="n23" fill="#F2F5F9" stroke="none" stroke-width="1.7" x="832" y="356" width="342" height="189"/>
<text id="n24-0" data-width="310" x="80" y="388.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">Response</text>
<text id="n25-0" data-width="310" x="80" y="441.68" text-anchor="start" font-size="29" font-weight="700" fill="#18232E">보고서 설명 중</text>
<text id="n26-0" data-width="310" x="80" y="504.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">사용자 발화 계속 수신</text>
<polyline id="n27" points="89,524 89,532" fill="none" stroke="#2858A5" stroke-width="5"/>
<polyline id="n28" points="111,518 111,532" fill="none" stroke="#2858A5" stroke-width="5"/>
<polyline id="n29" points="133,509 133,532" fill="none" stroke="#2858A5" stroke-width="5"/>
<polyline id="n30" points="155,521 155,532" fill="none" stroke="#2858A5" stroke-width="5"/>
<polyline id="n31" points="177,514 177,532" fill="none" stroke="#2858A5" stroke-width="5"/>
<polyline id="n32" points="199,523 199,532" fill="none" stroke="#2858A5" stroke-width="5"/>
<text id="n33-0" data-width="310" x="464" y="388.4" text-anchor="start" font-size="20" font-weight="400" fill="#B63732">새 User Turn</text>
<text id="n34-0" data-width="310" x="464" y="433.76" text-anchor="start" font-size="28" font-weight="700" fill="#18232E">“잠깐, 표부터</text>
<text id="n34-1" data-width="310" x="464" y="467.76" text-anchor="start" font-size="28" font-weight="700" fill="#18232E">설명해줘.”</text>
<text id="n35-0" data-width="310" x="464" y="524.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">현재 음성 중단과 발화 해석</text>
<text id="n36-0" data-width="310" x="848" y="388.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">현재 Request의 Response</text>
<text id="n37-0" data-width="310" x="848" y="440.76" text-anchor="start" font-size="28" font-weight="700" fill="#087E8B">표 설명으로 전환</text>
<text id="n38-0" data-width="310" x="848" y="504.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">Text 및 음성 전달</text>
<text id="n39-0" data-width="1110" x="64" y="613.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">메일 초안 Task / Downstream Agent의 작업 실행</text>
<rect id="n40" fill="#F3F7F7" stroke="none" stroke-width="1.7" x="64" y="638" width="342" height="164"/>
<rect id="n41" fill="#FFF0EC" stroke="none" stroke-width="1.7" x="448" y="638" width="342" height="164"/>
<rect id="n42" fill="#F3F7F7" stroke="none" stroke-width="1.7" x="832" y="638" width="342" height="164"/>
<text id="n43-0" data-width="310" x="80" y="677.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">Delegation 후 초안 작성</text>
<text id="n44-0" data-width="310" x="80" y="724.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">Agent Execution 진행 중</text>
<text id="n45-0" data-width="310" x="464" y="677.16" text-anchor="start" font-size="23" font-weight="700" fill="#B63732">메일 Task의 질문 도착</text>
<text id="n46-0" data-width="310" x="464" y="725.92" text-anchor="start" font-size="26" font-weight="700" fill="#18232E">“받는 사람은</text>
<text id="n46-1" data-width="310" x="464" y="759.92" text-anchor="start" font-size="26" font-weight="700" fill="#18232E">누구인가요?”</text>
<text id="n47-0" data-width="310" x="848" y="677.16" text-anchor="start" font-size="23" font-weight="700" fill="#087E8B">표 설명 후 메일 질문 전달</text>
<text id="n48-0" data-width="310" x="848" y="722.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">“메일 초안의 받는 사람은</text>
<text id="n48-1" data-width="310" x="848" y="752.24" text-anchor="start" font-size="22" font-weight="400" fill="#18232E">누구인가요?”</text>
<text id="n49-0" data-width="310" x="848" y="832.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">Agent Execution / 답변 대기</text>
<text id="n50-0" data-width="1110" x="64" y="865.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">음성 중단 / Task 취소 의도 확인은 별도</text>
<polyline id="n51" points="426,350 426,834" fill="none" stroke="#CDD6DE" stroke-width="1" stroke-dasharray="7 6"/>
<polyline id="n52" points="810,350 810,834" fill="none" stroke="#CDD6DE" stroke-width="1" stroke-dasharray="7 6"/>
<text id="n53-0" data-width="596" x="1260" y="377.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">수신과 중단의 우선 처리</text>
<text id="n54-0" data-width="596" x="1260" y="418.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">긴 해석 중에도 새 발화의 수신과 음성 중단</text>
<text id="n55-0" data-width="596" x="1260" y="537.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">후속 실행과 대기 상태</text>
<text id="n56-0" data-width="596" x="1260" y="578.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">현재 Request와 메일 질문의 처리 연결</text>
<text id="n57-0" data-width="596" x="1260" y="697.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">현재성 확인과 실제 전달</text>
<text id="n58-0" data-width="596" x="1260" y="738.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">정정 전 Response 보류와 전달 차례 결정</text>
</g></svg>

<text id="n52-0" data-width="321" x="567" y="772.56" text-anchor="start" font-size="18" font-weight="400" fill="#18232E">미전송 효과 hold</text>
<text id="n53-0" data-width="345" x="555" y="854.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">관련 소비자에 제어 전달</text>

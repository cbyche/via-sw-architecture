<text id="n2-0" data-width="1790" x="54" y="66.8" text-anchor="start" font-size="40" font-weight="700" fill="#18232E">DP44 3/4. 새 발화 시작: 출력 중단과 미전송 hold</text>
<polyline id="n3" points="54,103 1866,103" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<rect id="n4" fill="#F4F7FA" stroke="#CDD6DE" stroke-width="1.7" x="54" y="129" width="1812" height="103"/>
<text id="n5-0" data-width="170" x="72" y="159.4" text-anchor="start" font-size="20" font-weight="700" fill="#18232E">같은 사건</text>
<text id="n6-0" data-width="1600" x="241" y="161.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">Interaction Manager가 InputStarted(u2)를 감지하고 현재 재생을 즉시 멈춘다.</text>
<text id="n7-0" data-width="1600" x="241" y="194.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">R1 응답 J1이 준비 중이다. u2의 뜻은 아직 모르므로 J1과 Task 취소를 확정하지 않는다.</text>
<rect id="n8" fill="#EAF2FB" stroke="#CDD6DE" stroke-width="1.7" x="54" y="263" width="1812" height="54"/>
<text id="n9-0" data-width="1740" x="75" y="298.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">A  Control Lane에서 Dispatcher가 hold를 연결</text>
<text id="n10-0" data-width="345" x="90" y="338.56" text-anchor="start" font-size="18" font-weight="700" fill="#18232E">Request Controller</text>

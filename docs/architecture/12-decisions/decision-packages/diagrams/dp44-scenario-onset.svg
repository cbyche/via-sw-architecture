<rect id="n74" fill="#F4F7FA" stroke="#CDD6DE" stroke-width="1.7" x="54" y="966" width="1812" height="64"/>
<text id="n75-0" data-width="1760" x="72" y="1001.24" text-anchor="start" font-size="22" font-weight="700" fill="#18232E">A는 Control Lane 뒤 Dispatcher가 hold를 연결한다. B는 관련 Stage의 Control Queue에 제어를 전달한다.</text>
<text id="n76-0" data-width="1812" x="54" y="1057.64" text-anchor="start" font-size="17" font-weight="400" fill="#5F6B77">파란선: 일반 사건과 다음 처리    파란 점선: 비동기 완료    붉은 점선: 제어와 무효화    A/B 미선정, 미구현, 미측정</text>

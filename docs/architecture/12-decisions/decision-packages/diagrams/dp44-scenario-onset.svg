<text id="n29-0" data-width="321" x="1032" y="425.56" text-anchor="start" font-size="18" font-weight="400" fill="#18232E">미전송 효과 차단</text>
<text id="n30-0" data-width="345" x="1020" y="507.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">진행 중 J1은 추적 유지</text>

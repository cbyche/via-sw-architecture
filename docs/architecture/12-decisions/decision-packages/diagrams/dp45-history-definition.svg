<polyline id="e6" points="64,202 2496,202" fill="none" stroke="#C7D1DD" stroke-width="2" />
<polyline id="e27" points="64,1202 2496,1202" fill="none" stroke="#C7D1DD" stroke-width="2" />
<g id="input" data-node="true" data-x="88" data-y="382" data-w="712" data-h="120">
<path d="M88 382H780L800 402V502H88Z M780 382V402H800" fill="#F7F9FC" stroke="#263445" stroke-width="1.7" />
<text x="444.0" y="433.6" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">사용자 입력</text><text x="444.0" y="466.0" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">Request Controller: 질문 / 지시 / 확인 답변</text>
</g>
<g id="request" data-node="true" data-x="88" data-y="524" data-w="712" data-h="120">
<path d="M88 524H780L800 544V644H88Z M780 524V544H800" fill="#F7F9FC" stroke="#263445" stroke-width="1.7" />
<text x="444.0" y="575.6" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">요청의 해석과 변경</text><text x="444.0" y="608.0" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">Request Controller: 채택 의미 / 정정 revision</text>
</g>
<g id="work" data-node="true" data-x="88" data-y="666" data-w="712" data-h="120">
<path d="M88 666H780L800 686V786H88Z M780 666V686H800" fill="#F7F9FC" stroke="#263445" stroke-width="1.7" />
<text x="444.0" y="717.6" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">업무 연결과 수신 사건</text><text x="444.0" y="750.0" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">Task Manager: 위임 / receipt / 결과 version</text>
</g>
<g id="response" data-node="true" data-x="88" data-y="808" data-w="712" data-h="120">
<path d="M88 808H780L800 828V928H88Z M780 808V828H800" fill="#F7F9FC" stroke="#263445" stroke-width="1.7" />
<text x="444.0" y="859.6" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">응답 준비와 실제 전달</text><text x="444.0" y="892.0" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">Response Manager: 원문 / Text와 Voice 범위</text>
</g>
<g id="source" data-node="true" data-x="88" data-y="950" data-w="712" data-h="120">
<path d="M88 950H780L800 970V1070H88Z M780 950V970H800" fill="#F7F9FC" stroke="#263445" stroke-width="1.7" />
<text x="444.0" y="1001.6" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">사용 자료와 결과 참조</text><text x="444.0" y="1034.0" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">Context Manager의 읽기 receipt / 채택 근거</text>
</g>
<g id="derived" data-node="true" data-x="924" data-y="382" data-w="712" data-h="190">
<path d="M924 382H1616L1636 402V572H924Z M1616 382V402H1636" fill="#F7F9FC" stroke="#263445" stroke-width="1.7" />
<text x="1280.0" y="452.4" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">요약 / 검색 색인 / 과거 관계</text><text x="1280.0" y="484.79999999999995" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">원본 ID와 revision / 구간 / 생성 방식</text><text x="1280.0" y="517.2" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">파생값의 불확실성과 생산 범위</text>
</g>
<g id="memory" data-node="true" data-x="924" data-y="848" data-w="712" data-h="185">
<path d="M924 848H1616L1636 868V1033H924Z M1616 848V868H1636" fill="#F7F9FC" stroke="#263445" stroke-width="1.7" />
<text x="1280.0" y="915.9" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">User Memory는 별도 원본</text><text x="1280.0" y="948.3" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">명시적으로 저장한 선호 / routine / stable fact</text><text x="1280.0" y="980.7" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">과거 반복만으로 선호 등록하지 않음</text>
</g>
<g id="context" data-node="true" data-x="1760" data-y="382" data-w="712" data-h="246">
<path d="M1760 382H2452L2472 402V628H1760Z M2452 382V402H2472" fill="#F7F9FC" stroke="#263445" stroke-width="1.7" />
<text x="2116.0" y="448.0" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">R23에 필요한 자료</text><text x="2116.0" y="480.4" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">실제 설명 E20[0:52] 원문</text><text x="2116.0" y="512.8" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">제품 비교 D21 개정 2 참조</text><text x="2116.0" y="545.2" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">견적 D22 개정 1 참조</text><text x="2116.0" y="577.6" text-anchor="middle" font-size="24" font-weight="700" fill="#263445">출처 / 유효성 / 읽은 범위 / 누락</text>
</g>
<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">DP-45  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="129.0" text-anchor="start" font-size="42" font-weight="700" fill="#263445">과거 이력의 범위와 현재 Context</text></g>
<g id="e5"><text x="64" y="174.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">과거 이력 = VIA를 통해 이미 수신하거나 처리하거나 전달한 내용의 원본 기록. 진행 중 업무에도 이력이 있다.</text></g>
<g id="e8"><text x="88" y="292.0" text-anchor="start" font-size="30" font-weight="700" fill="#263445">1 원본 과거 이력</text></g>
<g id="e9"><text x="88" y="336.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">A와 B에 같은 기록을 제공</text></g>
<g id="e11"><text x="924" y="292.0" text-anchor="start" font-size="30" font-weight="700" fill="#263445">2 재사용을 위한 파생 자료</text></g>
<g id="e12"><text x="924" y="336.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">원본과 dependency를 가진 가공 정보</text></g>
<g id="e14"><text x="1760" y="292.0" text-anchor="start" font-size="30" font-weight="700" fill="#263445">3 현재 요청의 Context</text></g>
<g id="e15"><text x="1760" y="336.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">이번 목적과 권한에 맞춘 근거 묶음</text></g>
<g id="e22"><text x="928" y="647" text-anchor="start" font-size="25" font-weight="400" fill="#263445">A: 필요할 때 조합, 유효 cache 재사용</text><text x="928" y="690" text-anchor="start" font-size="25" font-weight="400" fill="#263445">B: 공통 관계를 생산 / 게시 / 유지</text><text x="928" y="733" text-anchor="start" font-size="25" font-weight="400" fill="#263445">원본 사실과 현재 의미의 권위는 공통</text></g>
<g id="e25"><text x="1764" y="701" text-anchor="start" font-size="24" font-weight="400" fill="#263445">이번 조건과 Task 연결은 지금 판단</text><text x="1764" y="749" text-anchor="start" font-size="24" font-weight="400" fill="#263445">Request Interpreter: 의미 제안</text><text x="1764" y="797" text-anchor="start" font-size="24" font-weight="400" fill="#263445">Request Controller: 확인 / 채택</text><text x="1764" y="845" text-anchor="start" font-size="24" font-weight="400" fill="#263445">Downstream Agent: 기준 적용 / 제안서 작성</text></g>
<g id="e26"><text x="1764" y="962" text-anchor="start" font-size="24" font-weight="400" fill="#263445">당시 기록 ≠ 지금 상태</text><text x="1764" y="1004" text-anchor="start" font-size="24" font-weight="400" fill="#263445">생성된 설명 ≠ 실제 전달한 설명</text><text x="1764" y="1046" text-anchor="start" font-size="24" font-weight="400" fill="#263445">결과 참조 ≠ 결과 본문 전체 보관</text></g>
<g id="e28"><text x="64" y="1258" text-anchor="start" font-size="24" font-weight="400" fill="#263445">과거 동의는 현재 권한이 아니다. 원본 수정 / 삭제 / 철회와 채널별 전달 범위를 확인한다.</text><text x="64" y="1301" text-anchor="start" font-size="24" font-weight="400" fill="#263445">PC 자료 전체와 Agent 내부 기록은 포함하지 않는다. 파생 기억은 원본을 대신하는 새로운 업무 권위가 아니다.</text></g>
<g id="e29"><text x="64" y="1379.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">접힌 종이 = 자료의 종류. 세 열은 설명 구분이며 새 Component나 세 개의 물리 DB가 아니다.</text></g>
</g></svg>

<text x="268" y="410" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">① 발화 시각과 화면 사건 수집</text>
<text x="128" y="665" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">② 유한 pre-roll과 발화 구간 원시 관측 보존</text>
<text x="113" y="975" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">③ 요청 때 당시 관측과 늦은 전사를 결합</text>
<text x="1104" y="410" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">① 발화 시각과 화면 사건 수집</text>
<text x="1014" y="605" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">② 요청 전에 객체와 관계 후보 생산</text>
<text x="989" y="790" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">③ 객체 version과 source revision 게시</text>
<text x="954" y="1005" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">④ 준비된 객체와 필요한 원시 근거 반환</text>
<text x="1905" y="410" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">① 사용자가 영역 또는 객체를 명시 선택</text>
<text x="1815" y="665" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">② 선택 시점의 identity, revision과 crop 봉인</text>
<text x="1885" y="975" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">③ 선택한 자료와 발화만 반환</text>
<text x="48" y="58" font-size="38" font-weight="700" fill="#171717">S-02  |  말한 당시의 화면 근거를 어떻게 만드는가</text>
<text x="48" y="104" font-size="22" font-weight="400" fill="#171717">공통 Component는 같은 위치 / T는 원시 timeline / A는 사전 객체 이력 / B는 명시 선택 package만 지원</text>
<text x="48" y="1414" font-size="18" font-weight="400" fill="#171717">VIA / Stage 4 / 구조 탐색, 미채택 대안 / 구현 및 측정 결과 아님</text>
<text x="72" y="215" font-size="28" font-weight="700" fill="#171717">T  실제 reviewed target</text>
<text x="908" y="215" font-size="28" font-weight="700" fill="#171717">A  대안 구조</text>
<text x="1744" y="215" font-size="28" font-weight="700" fill="#171717">B  기능을 제한한 대안</text>
<text x="48" y="1345" font-size="21" font-weight="400" fill="#171717">박스: Component, 서브시스템, 논리 실행체 또는 저장소 이름 / 번호 화살표: 동작과 순서 / 검정: 공통 / 파랑: 달라지는 구조</text>
<text x="118" y="1185" font-size="18" font-weight="400" fill="#1458C0">④ Context Manager가 gap, source revision과 현재 적용 가능성을 확인한다.</text>
<text x="118" y="1213" font-size="18" font-weight="400" fill="#1458C0">지원: 자연스러운 과거 지칭 / 비용: 원시 timeline 메모리와 요청 시 해석</text>
<text x="954" y="1185" font-size="18" font-weight="400" fill="#1458C0">⑤ Context Manager가 늦은 전사와 결합하고 현재 원문을 다시 확인한다.</text>
<text x="954" y="1213" font-size="18" font-weight="400" fill="#1458C0">조건: 객체 추적 지원 / 비용: 상시 producer, 저장과 삭제 경로</text>
<text x="1790" y="1185" font-size="18" font-weight="400" fill="#1458C0">④ Context Manager가 현재 source와 권한을 다시 확인한다.</text>
<text x="1790" y="1213" font-size="18" font-weight="400" fill="#1458C0">제한: 선택 밖의 연속 지칭과 과거 복수 지칭은 미지원</text>
<text x="48" y="1380" font-size="20" font-weight="400" fill="#171717">공통 후속: Context Manager → Request Controller로 근거와 receipt 반환 → 입력과 예산 결합 → Request Interpreter 호출.</text>
</g></svg>

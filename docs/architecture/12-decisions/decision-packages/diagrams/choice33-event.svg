<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-33  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">여러 업무의 대화 정확성을 위한 협력</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">중앙 해석과 업무별 대화 처리</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">보고서와 메일이 각각 질문 → “보고서는 PDF, 메일에는 그 결론” → 다른 업무의 참조 연결</text></g>
<g id="e7"><text x="64" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#195FBD">A  중앙이 대화 상태를 작성</text></g>
<g id="e8"><text x="64" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e10"><text x="180" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Task Manager</text></g>
<g id="e13"><text x="418" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e16"><text x="656" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request</text><text x="656" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interpreter</text></g>
<g id="e19"><text x="894" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">State Store</text></g>
<g id="e22"><text x="1132" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Agent Gateway</text></g>
<g id="e24"><text x="74" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">1  보고서 qR=형식?, 메일 qM=본문?; 실제 게시 연결</text></g>
<g id="e26"><text x="74" y="712.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">2  “보고서는 PDF, 메일에는 그 결론” 전체 해석 요청</text></g>
<g id="e28"><text x="74" y="823.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">qR=PDF; qM.content=R.result@4 제안</text></g>
<g id="e30"><text x="74" y="934.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">3  두 절의 관계/질문 버전/결론 참조 확인</text></g>
<g id="e32"><text x="74" y="1045.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">4  현재 검사 후 두 변경 + 전송 intent를 원자 저장</text></g>
<g id="e34"><text x="74" y="1156.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">채택 결과 반환</text></g>
<g id="e36"><text x="74" y="1267.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">5  채택된 각 업무의 답변 전달</text></g>
<g id="e38"><text x="74" y="1378.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">접수/결과 반환; 사용자 전달은 공통 응답 경로</text></g>
<g id="e41"><text x="74" y="1489.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">별도 변형: 위 흐름의 채택 전에 qM 취소가 도착</text></g>
<g id="e43"><text x="74" y="1600.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">옛 qM 답 거절; 독립 qR은 진행, 결합 조건이면 함께 보류</text></g>
<g id="e45"><text x="74" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#195FBD">읽을 결론: 업무 간 생략/교차 참조를 한 번에 해석</text></g>
<g id="e46"><text x="74" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 중앙이 모든 대화 전이 규칙을 관리</text></g>
<g id="e47"><text x="1312" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#087A53">B  업무별 처리자가 상태를 제안</text></g>
<g id="e48"><text x="1312" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e50"><text x="1428" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Dialogue</text><text x="1428" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Coordinator</text></g>
<g id="e53"><text x="1666" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">보고서 대화 actor</text></g>
<g id="e56"><text x="1904" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">메일 대화 actor</text></g>
<g id="e59"><text x="2142" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e62"><text x="2380" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">State Store</text></g>
<g id="e64"><text x="1322" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">1  같은 원문/버전 + 보고서의 허용 맥락</text></g>
<g id="e66"><text x="1322" y="712.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">2  같은 원문/버전 + 메일의 허용 맥락</text></g>
<g id="e68"><text x="1322" y="823.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">qR=PDF 변경 제안; 확정 결론 R.result@4 내보냄</text></g>
<g id="e70"><text x="1322" y="934.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">내가 담당할 메일 절; 보고서 결론 참조 필요</text></g>
<g id="e72"><text x="1322" y="1045.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">3  허용된 결론 참조 전달 → actor가 본문 변경 재제안</text></g>
<g id="e74"><text x="1322" y="1156.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">qM.content=R.result@4 + 예상 버전</text></g>
<g id="e76"><text x="1322" y="1267.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">4  원문 절/관계/현재 질문/Task/권한 검사 요청</text></g>
<g id="e78"><text x="1322" y="1378.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">채택 허용 또는 변경된 의존 집합 거절</text></g>
<g id="e80"><text x="1322" y="1489.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">5  actor가 제안한 상태/intent를 원자 저장</text></g>
<g id="e82"><text x="1322" y="1600.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">채택된 버전/명령 intent 반환</text></g>
<g id="e84"><text x="1322" y="1711.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">저장 성공 후 채택 통지; 메일 actor에도 통지</text></g>
<g id="e87"><text x="1322" y="1822.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">별도 변형: 위 흐름의 채택 전 qM 취소 → 옛 제안 거절</text></g>
<g id="e89"><text x="1322" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#087A53">읽을 결론: 업무별 대화 규칙/사건 처리를 해당 actor가 소유</text></g>
<g id="e90"><text x="1322" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 참가 누락/제안 충돌/참조 왕복/모델 경합</text></g>
<g id="e91"><text x="64" y="2219.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">생략한 공통 연동: 추론은 Model Access의 한 벌 Omni; 업무 실행은 Task Manager/Agent Gateway가 Downstream Agent에 위임.</text></g>
<g id="e92"><text x="64" y="2259.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">실선 = 요청/전달, 점선 = 결과. 별도 언급 없는 참여자는 논리 책임. 시간 간격은 성능 수치가 아닌 사건 순서. 수작업 설계 추적, 미측정.</text></g>
</g></svg>

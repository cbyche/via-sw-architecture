<path d="M1395 834C1395 815 1825 815 1825 834V909C1825 928 1395 928 1395 909Z M1395 834C1395 853 1825 853 1825 834" fill="#EDF9F2" stroke="#087A53" stroke-width="1.7"/>
<text x="1610.0" y="888.0" text-anchor="middle" font-size="28" font-weight="700" fill="#087A53">확정 사건 원장</text>
</g>
<g id="Breducer" data-node="true" data-x="2030" data-y="650" data-w="385" data-h="68">

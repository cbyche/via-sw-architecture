<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-35  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">대화와 업무의 복구 정확성을 위한 기록</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">현재 상태와 사건 이력</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">구조도 / 실행 순서 번호 없음 / 공통 책임을 유지하면서 실제 생산 원리와 상태를 비교</text></g>
<g id="e8"><text x="88" y="270.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">A</text></g>
<g id="e9"><text x="132" y="263.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">현재 상태가 원본</text></g>
<g id="e11"><text x="86" y="374.0" text-anchor="start" font-size="18" font-weight="700" fill="#263445">VIA SOFTWARE</text></g>
<g id="e12"><text x="1226" y="374.0" text-anchor="end" font-size="16" font-weight="400" fill="#5B697B">역할/논리 구조, OS process는 별도 명시</text></g>
<g id="e15"><text x="864" y="1658.0" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">외부 업무는 공통</text><text x="864" y="1682.3" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">Task Manager</text><text x="864" y="1706.6" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">→ Agent Gateway</text><text x="864" y="1730.9" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">→ Downstream Agent</text><text x="864" y="1755.2" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">접수/결과는 같은 경로로 반환</text></g>
<g id="e21" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="494" y="988.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">원자 확정</text></g>
<g id="e23" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="494" y="1208.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">복원 근거</text></g>
<g id="e25" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="494" y="608.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">owner의 변경 / 확정 반환</text></g>
<g id="e28" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="494" y="1528.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">검증된 현재 상태 반환</text></g>
<g id="e29"><text x="874" y="811.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">A도 감사 이력,</text><text x="874" y="839.35" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">inbox/outbox와</text><text x="874" y="867.7" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">backup을 사용할 수 있음.</text><text x="874" y="896.05" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B"></text><text x="874" y="924.4" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">B replay는 모델 추론,</text><text x="874" y="952.75" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">외부 명령 전송이나</text><text x="874" y="981.1" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">음성 재생을 실행하지 않음.</text></g>
<g id="e32" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="504" y="1868.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">Agent Gateway 경유 조회</text></g>
<g id="e35"><text x="1336" y="270.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">B</text></g>
<g id="e36"><text x="1380" y="263.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">확정 사건이 원본</text></g>
<g id="e38"><text x="1334" y="374.0" text-anchor="start" font-size="18" font-weight="700" fill="#263445">VIA SOFTWARE</text></g>
<g id="e39"><text x="2474" y="374.0" text-anchor="end" font-size="16" font-weight="400" fill="#5B697B">역할/논리 구조, OS process는 별도 명시</text></g>
<g id="e42"><text x="2112" y="1658.0" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">외부 업무는 공통</text><text x="2112" y="1682.3" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">Task Manager</text><text x="2112" y="1706.6" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">→ Agent Gateway</text><text x="2112" y="1730.9" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">→ Downstream Agent</text><text x="2112" y="1755.2" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">접수/결과는 같은 경로로 반환</text></g>
<g id="e48" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1742" y="988.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">원자 확정</text></g>
<g id="e50" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1742" y="1208.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">복원 근거</text></g>
<g id="e52" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1742" y="608.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">owner의 변경 / 확정 반환</text></g>
<g id="e55" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1742" y="1528.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">검증된 현재 상태 반환</text></g>
<g id="e56"><text x="2122" y="811.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">A도 감사 이력,</text><text x="2122" y="839.35" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">inbox/outbox와</text><text x="2122" y="867.7" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">backup을 사용할 수 있음.</text><text x="2122" y="896.05" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B"></text><text x="2122" y="924.4" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">B replay는 모델 추론,</text><text x="2122" y="952.75" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">외부 명령 전송이나</text><text x="2122" y="981.1" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">음성 재생을 실행하지 않음.</text></g>
<g id="e59" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1752" y="1868.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">Agent Gateway 경유 조회</text></g>
<g id="e62"><text x="64" y="2157.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">검정 = 공통 / 파랑 = A 고유 / 초록 = B 고유 / 색은 우위가 아님</text></g>
<g id="e63"><text x="2496" y="2156.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달 / 점선 → 반환/확인</text></g>
<g id="e64"><text x="64" y="2193.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">제목 상자 = Component / 내부 둥근 상자 = Module / 원통 = 저장 / 접힌 종이 = 자료 / 육각형 = 연동 대상</text></g>
<g id="e65"><text x="64" y="2229.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">설계안 / 미선정 / 미측정. Component 이름의 반복은 같은 owner의 다른 역할을 설명할 수 있다.</text></g>
</g></svg>

<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-35  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">대화와 업무의 복구 정확성을 위한 기록</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">현재 상태와 사건 이력</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">질문 답변을 확정 → Agent에 전송 → 접수 확인 전에 VIA 종료 → 중복 없이 이어가기</text></g>
<g id="e7"><text x="64" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#195FBD">A  현재 값을 원본으로 저장</text></g>
<g id="e9"><text x="94" y="371.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">질문 답변의 현재 버전/권한 확인; Task/전달 변경도 각 owner가 생성</text></g>
<g id="e15" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="129" y="608.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">1  상태 변경 + 명령 intent</text></g>
<g id="e17" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="159" y="1088.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">2  상태/inbox/outbox를 한 transaction에 기록</text></g>
<g id="e19" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="699" y="1198.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">3  재시작: 현재 record</text></g>
<g id="e22" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="699" y="1018.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">동일 transaction: 진단 이력</text></g>
<g id="e23"><text x="139" y="2035.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">backup 복원 뒤 미완료 원장 확인; 감사 이력은 상태 원본 아님</text></g>
<g id="e24"><text x="94" y="1991.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">단순 재시작은 양안 모두 지원. 사건 재구성의 추가 가치가 있어야 B 선택.</text></g>
<g id="e28" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="134" y="1698.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">4  복원된 미완료 intent; 현재 권한 재검사</text></g>
<g id="e30" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="644" y="1798.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">5  접수 상태 조회</text></g>
<g id="e32" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="644" y="1918.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">접수/결과/불명</text></g>
<g id="e34"><text x="79" y="2148" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">유리: 현재 record를 직접 읽어 단순하게 복구</text><text x="79" y="2187" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">대가: 새 조회/원인 분석은 보존된 기록에 제한</text><text x="79" y="2226" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">선택: 현재 상태 조회와 짧은 재시작이 중심</text></g>
<g id="e35"><text x="1312" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#087A53">B  사건을 원본으로 상태 계산</text></g>
<g id="e37"><text x="1342" y="371.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">질문 답변의 현재 버전/권한 확인; Task/전달 변경도 각 owner가 생성</text></g>
<g id="e44" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1377" y="608.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">1  의미 사건 + 예상 버전 + intent</text></g>
<g id="e46" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1402" y="1068.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">2  append</text></g>
<g id="e48" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1892" y="1138.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">사건 적용: 결정적 코드로 계산</text></g>
<g id="e50" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1937" y="1338.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">같은 transaction에 상태/위치/intent 확정</text></g>
<g id="e53" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1397" y="1348.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">3  재시작: 검증한 중간 상태 + 후속 사건</text></g>
<g id="e55" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1422" y="1588.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">검증한 상태/사건 위치 저장</text></g>
<g id="e56"><text x="1342" y="1991.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">재생은 상태만 계산. 외부 명령/음성은 재실행하지 않음.</text></g>
<g id="e60" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1382" y="1698.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">4  복원된 미완료 intent; 현재 권한 재검사</text></g>
<g id="e62" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1892" y="1798.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">5  접수 상태 조회</text></g>
<g id="e64" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1892" y="1918.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">접수/결과/불명</text></g>
<g id="e66"><text x="1327" y="2148" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">유리: 같은 사건으로 상태 재구성과 원인 추적</text><text x="1327" y="2187" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">대가: 사건 schema/삭제/재생/검증 부담</text><text x="1327" y="2226" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">선택: 과거 의미 전이의 재구성이 실제로 필요</text></g>
<g id="e67"><text x="64" y="2292.0" text-anchor="start" font-size="22" font-weight="400" fill="#263445">공통 마무리: Request Controller 현재 검사 → Task Manager → Agent Gateway → Downstream Agent</text></g>
<g id="e68"><text x="64" y="2332.0" text-anchor="start" font-size="22" font-weight="400" fill="#263445">접수/결과 반환 → Response Manager → Interaction Manager의 실제 표시/음성. 미해결이면 실행 대신 질문.</text></g>
<g id="e69"><text x="64" y="2389.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">검정: 공통 / 파랑: A 고유 / 초록: B 고유. 실선: 요청/전달 / 점선: 결과. 네모: 이름 / 원통: 상태 / 육각형: 외부 의존.</text></g>
<g id="e70"><text x="64" y="2429.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">같은 이름의 반복 상자는 동일 Component. 비교 부분의 책임을 펼친 그림. 별도 process 표기가 없으면 논리 분해. 모델 가중치는 한 벌; 이익은 조건부 설계 가설, 미측정.</text></g>
</g></svg>

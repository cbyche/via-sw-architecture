<path d="M780 664C780 645 1165 645 1165 664V718C1165 737 780 737 780 718Z M780 664C780 683 1165 683 1165 664" fill="#EEF4FF" stroke="#195FBD" stroke-width="1.7"/>
<text x="972.5" y="707.5" text-anchor="middle" font-size="28" font-weight="700" fill="#195FBD">감사 기록</text>

<path d="M2030 869C2030 850 2415 850 2415 869V944C2415 963 2030 963 2030 944Z M2030 869C2030 888 2415 888 2415 869" fill="#EDF9F2" stroke="#087A53" stroke-width="1.7"/>
<text x="2222.5" y="923.0" text-anchor="middle" font-size="28" font-weight="700" fill="#087A53">현재 상태 / 사건 위치</text>
</g>
<g id="e2"><text x="64" y="49.0" text-anchor="start" font-size="28" font-weight="700" fill="#5B697B">VIA / ARCHITECTURE COMPARISON</text></g>
<g id="e3"><text x="2496" y="49.0" text-anchor="end" font-size="28" font-weight="400" fill="#5B697B">35 / 설계 비교</text></g>
<g id="e4"><text x="64" y="122.0" text-anchor="start" font-size="48" font-weight="700" fill="#263445">대화와 업무 상태, 무엇을 원본으로 삼는가?</text></g>
<g id="e5"><text x="64" y="171.0" text-anchor="start" font-size="29" font-weight="400" fill="#5B697B">같은 정상 사용: 보고서 T1의 질문 Q7 “기간은?” → “상반기로 해줘” → 답변 확정과 업무 이어가기</text></g>
<g id="e7"><text x="64" y="242.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">공통 목적</text></g>
<g id="e8"><text x="260" y="242.0" text-anchor="start" font-size="28" font-weight="400" fill="#263445">Q7 답변, T1 조건, 전송 준비를 일관되게 저장. Agent 접수와 사용자 실제 전달은 확인한 뒤 별도 기록.</text></g>
<g id="e9"><text x="64" y="289.0" text-anchor="start" font-size="27" font-weight="700" fill="#263445">같은 해석과 검사</text></g>
<g id="e10"><text x="330" y="289.0" text-anchor="start" font-size="27" font-weight="400" fill="#5B697B">같은 Omni와 현재 권한/버전 검사. 어느 안도 기록만으로 외부 접수나 사용자 전달을 추정하지 않는다.</text></g>
<g id="e12"><text x="80" y="365.0" text-anchor="start" font-size="39" font-weight="700" fill="#195FBD">A  현재 상태가 원본</text></g>
<g id="e13"><text x="80" y="410.0" text-anchor="start" font-size="28" font-weight="400" fill="#195FBD">상태 변경을 확정하고, 그 값을 읽어 계속 처리한다.</text></g>
<g id="e19" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="145" y="556.0" text-anchor="start" font-size="26" font-weight="400" fill="#195FBD">1  상태 변경 값</text></g>
<g id="e21" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="690" y="554.0" text-anchor="start" font-size="24" font-weight="400" fill="#195FBD">T1 조건과 전송 준비도 같은 확정 묶음</text></g>
<g id="e22"><text x="1330" y="365.0" text-anchor="start" font-size="39" font-weight="700" fill="#087A53">B  확정 사건이 원본</text></g>
<g id="e23"><text x="1330" y="410.0" text-anchor="start" font-size="28" font-weight="400" fill="#087A53">사건을 확정하고, 같은 코드로 현재 상태를 계산한다.</text></g>
<g id="e29" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1395" y="556.0" text-anchor="start" font-size="26" font-weight="400" fill="#087A53">1  확정할 의미 사건</text></g>
<g id="e31" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1940" y="554.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">T1 조건과 전송 준비도 같은 확정 묶음</text></g>
<g id="e35" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="155" y="766.0" text-anchor="start" font-size="26" font-weight="400" fill="#195FBD">2  Q7=답변 완료 / T1=상반기</text><text x="155" y="801.1" text-anchor="start" font-size="26" font-weight="400" fill="#195FBD">c9=전송 대기</text></g>
<g id="e37" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="582" y="635.0" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">같은 transaction</text></g>
<g id="e38" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="740" y="852.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">권위 원본은 현재 기록</text><text x="740" y="888.45" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">감사 조회와 backup도 가능</text><text x="740" y="924.9" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">상태 변환 코드도 재사용 가능</text></g>
<g id="e40" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="135" y="1007.0" text-anchor="start" font-size="26" font-weight="400" fill="#195FBD">3  정상 조회 / 재시작에도 현재 기록</text></g>
<g id="e45" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1405" y="766.0" text-anchor="start" font-size="26" font-weight="400" fill="#087A53">2  답변 확정(Q7, 상반기)</text><text x="1405" y="801.1" text-anchor="start" font-size="26" font-weight="400" fill="#087A53">전송 준비(c9)</text></g>
<g id="e47" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1870" y="744.0" text-anchor="start" font-size="26" font-weight="400" fill="#087A53">3  사건 적용</text></g>
<g id="e49" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2050" y="812.0" text-anchor="start" font-size="26" font-weight="400" fill="#087A53">결정적 코드로 상태 계산</text></g>
<g id="e51" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1410" y="992.0" text-anchor="start" font-size="26" font-weight="400" fill="#087A53">보존 사건으로 다시 계산</text></g>
<g id="e53" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2290" y="1025.0" text-anchor="start" font-size="25" font-weight="400" fill="#087A53">4  정상 조회</text></g>
<g id="e54" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1995" y="631.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">사건 + 상태를 같은 transaction에 확정</text></g>
<g id="e55"><text x="80" y="1074.0" text-anchor="start" font-size="24" font-weight="400" fill="#5B697B">반환 화살표는 대표 owner만 표시. 모든 owner가 자기 현재 상태를 조회한다.</text></g>
<g id="e56"><text x="1330" y="1074.0" text-anchor="start" font-size="24" font-weight="400" fill="#5B697B">재구성: 검증된 checkpoint로 단축 가능. 모델/외부 명령은 재실행 안 함.</text></g>
<g id="e58"><text x="80" y="1146.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">같은 사용자 결과</text></g>
<g id="e59"><text x="370" y="1144.0" text-anchor="start" font-size="26" font-weight="400" fill="#263445">Agent Gateway가 저장된 명령을 전달 → 실제 접수 확인 → Response Manager가 상태를 안내하고 전달 사실 기록</text></g>
<g id="e60"><text x="80" y="1213.0" text-anchor="start" font-size="29" font-weight="700" fill="#195FBD">A의 선택 이유</text></g>
<g id="e61"><text x="80" y="1257" text-anchor="start" font-size="27" font-weight="400" fill="#263445">현재 운영과 필요한 감사 조회로 충분할 때</text><text x="80" y="1299" text-anchor="start" font-size="27" font-weight="400" fill="#263445">직접 갱신 중심. 새 조회는 보존 정보와 변환에 의존</text></g>
<g id="e62"><text x="1330" y="1213.0" text-anchor="start" font-size="29" font-weight="700" fill="#087A53">B의 선택 이유와 대가</text></g>
<g id="e63"><text x="1330" y="1257" text-anchor="start" font-size="27" font-weight="400" fill="#263445">재구성과 원인 검증, 조회 구조 변경을 반복 활용할 때</text><text x="1330" y="1299" text-anchor="start" font-size="27" font-weight="400" fill="#263445">대가: 사건의 장기 호환, 삭제와 재생 관리, 저장 공간</text></g>
<g id="e65"><text x="64" y="1395.0" text-anchor="start" font-size="28" font-weight="400" fill="#5B697B">실선: 요청/기록   점선: 반환/재구성   파랑: A   초록: B</text></g>
<g id="e66"><text x="2496" y="1428.0" text-anchor="end" font-size="28" font-weight="400" fill="#5B697B">정상 정확도/속도 우열은 미측정. 감사 기록으로 충분하면 B의 추가 이익은 작다. / 미선정</text></g>
</g></svg>

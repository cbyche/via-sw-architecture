<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#FFFFFF"/>
<g font-family="Calibri, sans-serif">
<text id="via-common-request-background-1-text-0" x="60" y="73.6" font-size="40.0" text-anchor="start" font-weight="700" fill="#000000" data-width="1040">말과 화면, 이전 업무를 섞은 요청</text>
<polyline id="via-common-request-background-2" points="52,104 1872,104" fill="none" stroke="#A6A6A6" stroke-width="1.5"/>
<polyline id="via-common-request-background-3" points="52,908 1868,908" fill="none" stroke="#A6A6A6" stroke-width="1.5"/>
<text id="via-common-request-background-4-text-0" x="52" y="970.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#C00000" data-width="180">설계 질문</text>
<text id="via-common-request-background-5-text-0" x="260" y="992.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1608">이 연결을 유지하며 새 입력, 과거 맥락과 업무를 어떻게 다룰까?</text>
<text id="via-common-request-background-6-text-0" x="52" y="195.64000000000001" font-size="36.0" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">“이 표를 아까 보고서에 넣어줘.</text>
<text id="via-common-request-background-6-text-1" x="52" y="238.84" font-size="36.0" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">아니, 두 번째 표만. 메일은 보내지 말고.”</text>
<text id="via-common-request-background-7-text-0" x="52" y="327.9733333333333" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="568">화면에서 가리킨 자료</text>
<text id="via-common-request-background-8-text-0" x="676" y="327.9733333333333" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="568">앞서 진행한 업무</text>
<text id="via-common-request-background-9-text-0" x="1300" y="327.9733333333333" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="568">바꾼 부분과 유지할 조건</text>
<rect x="80" y="365" width="504" height="72" fill="#F2F2F2" stroke="#A6A6A6" stroke-width="2"/>
<text id="via-common-request-background-10-text-0" x="332.0" y="410.9733333333333" font-size="29.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="504">첫 번째 표</text>
<rect x="80" y="460" width="504" height="72" fill="#FFFFFF" stroke="#00889A" stroke-width="2"/>
<text id="via-common-request-background-11-text-0" x="332.0" y="505.9733333333333" font-size="29.333333333333332" text-anchor="middle" font-weight="700" fill="#000000" data-width="504">두 번째 표</text>
<rect x="704" y="365" width="504" height="72" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2"/>
<text id="via-common-request-background-12-text-0" x="956.0" y="410.9733333333333" font-size="29.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="504">보고서 작성 업무</text>
<rect x="704" y="460" width="504" height="72" fill="#FFFFFF" stroke="#A6A6A6" stroke-width="2"/>
<text id="via-common-request-background-13-text-0" x="956.0" y="505.9733333333333" font-size="29.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="504">메일 초안 업무</text>
<text id="via-common-request-background-14-text-0" x="1328" y="438.68" font-size="32.0" text-anchor="start" font-weight="700" fill="#000000" data-width="504">표는 두 번째만</text>
<text id="via-common-request-background-14-text-1" x="1328" y="477.08" font-size="32.0" text-anchor="start" font-weight="700" fill="#000000" data-width="504">메일 발송 금지 유지</text>
<polyline id="via-common-request-background-15" points="332,560 332,598" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline points="325.7674679981454,586.5914266954252 332,598 338.2325320018546,586.5914266954252" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline id="via-common-request-background-16" points="956,560 956,598" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline points="949.7674679981453,586.5914266954252 956,598 962.2325320018547,586.5914266954252" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline id="via-common-request-background-17" points="1580,560 1580,598" fill="none" stroke="#00889A" stroke-width="2.5"/>
<polyline points="1573.7674679981453,586.5914266954252 1580,598 1586.2325320018547,586.5914266954252" fill="none" stroke="#00889A" stroke-width="2.5"/>
<text id="via-common-request-background-18-text-0" x="336.0" y="651.88" font-size="32.0" text-anchor="middle" font-weight="700" fill="#000000" data-width="568">실제 자료와 범위</text>
<text id="via-common-request-background-19-text-0" x="960.0" y="651.88" font-size="32.0" text-anchor="middle" font-weight="700" fill="#000000" data-width="568">수정할 보고서 업무</text>
<text id="via-common-request-background-20-text-0" x="1584.0" y="651.88" font-size="32.0" text-anchor="middle" font-weight="700" fill="#000000" data-width="568">정정 범위와 기존 조건</text>
<text id="via-common-request-background-21-text-0" x="52" y="749.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">잘못 연결하면 다른 자료를 넣거나, 금지한 메일을 보내게 됩니다.</text>
<text id="via-common-request-background-22-text-0" x="52" y="820.9733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="1816">VIA는 대상과 업무 연결, 정정 범위를 함께 판단하고 기존 조건을 보존해야 합니다.</text>
<text id="via-common-request-background-23-text-0" x="52" y="874.6133333333332" font-size="25.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="1816">보고서를 어떻게 작성할지 추론하고 실제로 만드는 일은 Downstream Agent가 맡습니다.</text>
</g></svg>

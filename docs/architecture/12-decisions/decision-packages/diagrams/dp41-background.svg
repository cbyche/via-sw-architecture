<text id="n52-0" data-width="390" x="754" y="431.24" text-anchor="start" font-size="22" font-weight="700" fill="#18232E">VIA / 이전 Request와 Task 정보</text>
<text id="n53-0" data-width="388" x="755" y="480.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">“예산 보고서 만들어줘”</text>
<text id="n54-0" data-width="388" x="755" y="513.32" text-anchor="start" font-size="21" font-weight="400" fill="#2858A5">예산 보고서 Task / 진행 중</text>

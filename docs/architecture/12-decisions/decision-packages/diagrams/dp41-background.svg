<text id="n56-0" data-width="388" x="755" y="578.08" text-anchor="start" font-size="24" font-weight="400" fill="#18232E">“실적 보고서 만들어줘”</text>
<text id="n57-0" data-width="388" x="755" y="611.32" text-anchor="start" font-size="21" font-weight="400" fill="#2858A5">실적 보고서 Task / 진행 중</text>
<text id="n58-0" data-width="388" x="755" y="653.32" text-anchor="start" font-size="21" font-weight="700" fill="#B63732">수정할 보고서 Task 미확정</text>
<text id="n59-0" data-width="1120" x="64" y="736.92" text-anchor="start" font-size="26" font-weight="700" fill="#2858A5">Request 해석에 필요한 Context</text>
<text id="n60-0" data-width="350" x="64" y="784.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">화면 정보</text>
<text id="n61-0" data-width="350" x="64" y="821.16" text-anchor="start" font-size="23" font-weight="400" fill="#18232E">선택한 표의 범위와 내용</text>
<text id="n62-0" data-width="350" x="64" y="855.24" text-anchor="start" font-size="22" font-weight="400" fill="#2858A5">Referent 식별</text>
<text id="n63-0" data-width="350" x="452" y="784.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">이전 Request와 Task 정보</text>
<text id="n64-0" data-width="350" x="452" y="821.16" text-anchor="start" font-size="23" font-weight="400" fill="#18232E">관련 보고서 Task 후보</text>
<text id="n65-0" data-width="350" x="452" y="855.24" text-anchor="start" font-size="22" font-weight="400" fill="#2858A5">Task Association</text>
<text id="n66-0" data-width="350" x="840" y="784.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">현재 Request의 조건</text>
<text id="n67-0" data-width="350" x="840" y="821.16" text-anchor="start" font-size="23" font-weight="400" fill="#18232E">메일 초안 작성, 발송 제외</text>
<text id="n68-0" data-width="350" x="840" y="855.24" text-anchor="start" font-size="22" font-weight="400" fill="#2858A5">조건 보존</text>
<text id="n69-0" data-width="596" x="1260" y="391.76" text-anchor="start" font-size="28" font-weight="700" fill="#2858A5">필요한 Context의 선택</text>
<text id="n70-0" data-width="596" x="1260" y="436.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">화면 정보, 이전 Request 기록과</text>
<text id="n70-1" data-width="596" x="1260" y="471.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">Task 상태에서 필요한 정보의 확인</text>
<text id="n71-0" data-width="596" x="1260" y="552.76" text-anchor="start" font-size="28" font-weight="700" fill="#2858A5">Referent와 Task의 정확한 연결</text>
<text id="n72-0" data-width="596" x="1260" y="597.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">“이 표”에 해당하는 표의 식별,</text>
<text id="n72-1" data-width="596" x="1260" y="632.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">“아까 보고서”에 해당하는 Task의 구분</text>
<text id="n73-0" data-width="596" x="1260" y="713.76" text-anchor="start" font-size="28" font-weight="700" fill="#2858A5">정보 부족의 보완과 조건 보존</text>
<text id="n74-0" data-width="596" x="1260" y="758.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">보고서 미확정 시 Clarification,</text>
<text id="n74-1" data-width="596" x="1260" y="793.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">“초안만 작성” 조건의 유지</text>

<g id="e2"><text x="64" y="55.0" text-anchor="start" font-size="28" font-weight="700" fill="#5B697B">VIA / DECISION POINT CANDIDATE</text></g>
<g id="e3"><text x="2496" y="55.0" text-anchor="end" font-size="28" font-weight="400" fill="#5B697B">42  /  설계 비교</text></g>
<g id="e4"><text x="64" y="132.0" text-anchor="start" font-size="49" font-weight="700" fill="#263445">B  같은 답변의 확정과 실제 전달</text></g>
<g id="e5"><text x="64" y="182.0" text-anchor="start" font-size="28" font-weight="400" fill="#5B697B">E4 확대: C1에서 “응, 상반기로” → Q1 현재 상태 검사 → 로컬 확정 → 외부 접수 → 사용자에게 전달</text></g>
<g id="e10"><text x="165" y="354.0" text-anchor="middle" font-size="28" font-weight="700" fill="#263445">사용자 입출력</text></g>
<g id="e13"><text x="700" y="354.0" text-anchor="middle" font-size="28" font-weight="700" fill="#263445">대화 서비스</text></g>
<g id="e16"><text x="1660" y="354.0" text-anchor="middle" font-size="28" font-weight="700" fill="#263445">업무 서비스</text></g>
<g id="e19"><text x="2340" y="354.0" text-anchor="middle" font-size="28" font-weight="700" fill="#263445">Downstream Agent</text></g>
<g id="e22" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="183" y="428.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">E4  “응, 상반기로” / 실제 제시 P1 참조</text></g>
<g id="e24" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="718" y="490.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">Q1·T1·X1 현재 상태 조회</text></g>
<g id="e26" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="718" y="552.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">질문·업무 상태와 revision</text></g>
<g id="e28" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="718" y="614.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">해석 후 Request·명령 의도 저장</text></g>
<g id="e30" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="718" y="676.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">조건부 답변 명령 / 같은 command ID</text></g>
<g id="e32" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1678" y="738.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">현재 검사 → 업무 상태·명령·접수 결과 저장</text></g>
<g id="e34" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="718" y="800.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">로컬 접수 결과 / 외부 접수와 별개</text></g>
<g id="e36" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="718" y="862.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">접수 결과를 대화 저장소에 반영</text></g>
<g id="e38" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1678" y="924.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">현재 전송 조건 확인 후 답변 전달</text></g>
<g id="e40" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1678" y="986.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">외부 Agent 접수 확인</text></g>
<g id="e42" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="718" y="1048.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">확인된 외부 접수 상태 전달</text></g>
<g id="e44" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="183" y="1110.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">“상반기 조건을 전달했어요”</text></g>
<g id="e46" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="183" y="1172.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">실제 전달 기록 P2 → 대화 상태에 보관</text></g>
<g id="e47"><text x="64" y="1316.0" text-anchor="start" font-size="26" font-weight="400" fill="#5B697B">경쟁: Q1이 철회되거나 X1이 끝났으면 현재 검사에서 거절. 실패한 명령을 외부에 전달하지 않는다.</text></g>
<g id="e49"><text x="64" y="1383.0" text-anchor="start" font-size="28" font-weight="400" fill="#5B697B">검정: 공통  ·  파랑: A  ·  초록: B     실선: 요청·변경  /  점선 화살표: 반환·조회 결과</text></g>
<g id="e50"><text x="2496" y="1420.0" text-anchor="end" font-size="21" font-weight="400" fill="#5B697B">같은 의미 해석·자료·권한 조건 / 모델 호출과 Agent 연동 내부는 축약 / 선 간격은 소요시간이 아님</text></g>
</g></svg>

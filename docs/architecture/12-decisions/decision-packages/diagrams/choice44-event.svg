<g id="e2"><text x="64" y="48.0" text-anchor="start" font-size="27" font-weight="700" fill="#5B697B">VIA / 44 / CONTINUOUS INTERACTION</text></g>
<g id="e3"><text x="2496" y="48.0" text-anchor="end" font-size="27" font-weight="400" fill="#5B697B">설계 후보 · 미선정 · 미측정</text></g>
<g id="e4"><text x="64" y="115.0" text-anchor="start" font-size="42" font-weight="700" fill="#263445">같은 정정·교차 질문: 중앙 후속 명령과 소비자 활성화의 사건 경로</text></g>
<g id="e5"><text x="64" y="167.0" text-anchor="start" font-size="25" font-weight="400" fill="#263445">공통 E3: u2 발화 시작 → local stop / 미전송 hold. E4: 늦은 u1 폐기. E5: u2 해소. E6: Q1 실제 제시 후 focus.</text></g>
<g id="e6"><text x="64" y="216.0" text-anchor="start" font-size="29" font-weight="700" fill="#195FBD">A  각 반환을 회수한 중앙 소유자가 다음 명령을 발행한다</text></g>
<g id="e22" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="228.0" y="328.0" text-anchor="start" font-size="27" font-weight="400" fill="#263445">E3 u2: output fence</text></g>
<g id="e24" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="544.0" y="361.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">E2 Q1/r1 확정 자료</text></g>
<g id="e26" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="228.0" y="403.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">InputFinal(u2)</text></g>
<g id="e28" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="920.0" y="445.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">E4 u1 반환 → 중앙 revision 검사로 폐기</text></g>
<g id="e30" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="920.0" y="487.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">E5 u2 입력·근거 해석/채택 요청</text></g>
<g id="e32" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="920.0" y="529.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">의미 / 확인 질문 / 승인된 Direct 후보</text></g>
<g id="e34" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="920.0" y="571.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">생성이 필요한 확정 근거만 준비 명령</text></g>
<g id="e36" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="920.0" y="613.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">응답 후보 반환</text></g>

<g id="e45"><text x="64" y="816.0" text-anchor="start" font-size="29" font-weight="700" fill="#087A53">B  생산된 자료를 다음 소비자가 받고, Join과 sink가 게시 조건을 결합한다</text></g>
<g id="e63" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="218.0" y="924.0" text-anchor="start" font-size="27" font-weight="400" fill="#263445">E3 u2: control barrier / output fence</text></g>
<g id="e65" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="529.0" y="953.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">E2 Task Manager의 Q1/r1 확정 자료</text></g>
<g id="e67" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="218.0" y="991.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">InputFinal(u2) → Input Window 활성화</text></g>
<g id="e69" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1477.0" y="1029.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">E4 u1 → window/Join에서 superseded 폐기</text></g>
<g id="e71" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="855.0" y="1067.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">E5 u2 입력·근거 해석/채택</text></g>
<g id="e73" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1171.0" y="1105.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">의미 / InteractionNotice / Direct 통과</text></g>
<g id="e75" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1171.0" y="1143.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">종류별 admission(u2)</text></g>
<g id="e77" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1477.0" y="1181.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">후보·source refs → Window / join</text></g>
<g id="e79" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1778.0" y="1219.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">유효 P2 / Q1 → Guard</text></g>
<g id="e81" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2074.0" y="1257.0" text-anchor="start" font-size="27" font-weight="400" fill="#263445">E6 Text/Voice 실제 제시</text></g>
<g id="e83" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2074.0" y="1295.0" text-anchor="start" font-size="27" font-weight="400" fill="#263445">receipt → Presentation State</text></g>
<g id="e85" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1778.0" y="1333.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">Guard의 credit / State의 past snapshot</text></g>
<g id="e86"><text x="64" y="1414.0" text-anchor="start" font-size="27" font-weight="400" fill="#5B697B">E7 “응”: 양안 모두 실제 Q1 focus + 현재 질문 원본으로 연결. 미해결이면 확인. sequence 간격은 시간 측정값이 아니다.</text></g>
</g></svg>

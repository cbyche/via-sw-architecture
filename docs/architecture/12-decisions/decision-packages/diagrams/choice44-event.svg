<g id="e40" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1953.0" y="697.0" text-anchor="start" font-size="27" font-weight="400" fill="#263445">E6 P2 / Q1 실제 제시</text></g>
<g id="e42" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1953.0" y="739.0" text-anchor="start" font-size="27" font-weight="400" fill="#263445">receipt → Presentation State</text></g>

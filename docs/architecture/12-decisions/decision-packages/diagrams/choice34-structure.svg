<g id="e37" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="829" y="803.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">요청</text></g>
<g id="e40" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="414" y="1528.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">Request Controller의 현재 확정 경계 통과 후</text></g>
<g id="e42"><text x="100" y="1880.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">Context Manager의 허용된 읽기도 작업 결과로 연결.</text><text x="100" y="1907.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">Response Manager → Interaction Manager: Text/음성 게시.</text><text x="100" y="1934.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">Interaction Manager → Response Manager: 실제 전달 반환.</text><text x="100" y="1961.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">A도 입력 ASR와 출력 음성 chunk는 streaming 가능.</text></g>
<g id="e44"><text x="1336" y="270.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">B</text></g>
<g id="e45"><text x="1380" y="263.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">잠정 작업을 계속 수정</text></g>
<g id="e47"><text x="1334" y="374.0" text-anchor="start" font-size="18" font-weight="700" fill="#263445">VIA SOFTWARE</text></g>
<g id="e48"><text x="2474" y="374.0" text-anchor="end" font-size="16" font-weight="400" fill="#5B697B">역할/논리 구조, OS process는 별도 명시</text></g>

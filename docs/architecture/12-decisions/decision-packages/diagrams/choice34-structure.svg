<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-34  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">음성 대화의 반응성과 정정 정확성을 위한 실행</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">발화 단위와 연속 수정</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">“이 표를 보내…” → “아니, 설명만 해줘” → 준비는 재사용할 수 있지만 보내기는 실행 금지</text></g>
<g id="e7"><text x="64" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#195FBD">A  확정 발화부터 처리</text></g>
<g id="e9"><text x="94" y="371.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">공통: Streaming ASR 연속 수신; 음성 끼어들기는 먼저 재생 중단</text></g>
<g id="e15" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="129" y="643.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">1  발화가 확정되면 전체 입력 전달</text></g>
<g id="e17" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="704" y="768.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">2  근거 요청</text></g>
<g id="e19" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="704" y="898.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">근거/버전 반환</text></g>
<g id="e21" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="129" y="998.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">3  확정 발화/근거로 의미 요청</text></g>
<g id="e23" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="449" y="1068.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">의미 반환</text></g>
<g id="e25" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="129" y="1428.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">4  현재 검사 후 응답 허용</text></g>
<g id="e26"><text x="864" y="1151.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">부분 전사는 수신만 유지</text><text x="864" y="1179.35" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">발화 확정 뒤 의미 처리</text><text x="864" y="1207.7" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">후속 정정은 새 요청으로</text></g>
<g id="e27"><text x="94" y="1790.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">Request Interpreter/Response Manager → Model Access → 공유 Omni</text><text x="94" y="1817.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">5  Response Manager → Interaction Manager: 음성/Text; 실제 전달 구간 반환</text></g>
<g id="e29"><text x="79" y="2148" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">유리: 최종 발화만 처리해 추론 낭비를 줄임</text><text x="79" y="2187" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">대가: 발화 종료 뒤 읽기/해석/응답 준비 대기</text><text x="79" y="2226" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">선택: 짧은 발화나 추론 자원이 부족한 환경</text></g>
<g id="e30"><text x="1312" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#087A53">B  잠정 작업을 수정하며 처리</text></g>
<g id="e32"><text x="1342" y="371.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">공통: Streaming ASR 연속 수신; 음성 끼어들기는 먼저 재생 중단</text></g>
<g id="e41" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1377" y="613.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">1  부분 발화 + 수정 버전</text></g>
<g id="e43" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2112" y="773.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">2  잠정 의미</text></g>
<g id="e45" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2122" y="1008.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">결과/버전</text></g>
<g id="e47" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2112" y="1063.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">2  허용 읽기</text></g>
<g id="e49" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2122" y="1298.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">결과/버전</text></g>
<g id="e51" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2112" y="1383.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">2  응답 준비</text></g>
<g id="e53" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2122" y="1618.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">결과/버전</text></g>
<g id="e55" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1402" y="1148.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">3  정정: 관련 결과 폐기/재배정</text></g>
<g id="e57" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1377" y="1638.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">4  유효 결과 + 확정 입력</text></g>
<g id="e59" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2032" y="1698.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">5  현재 검사 뒤 게시 허용</text></g>
<g id="e60"><text x="1342" y="1909.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">추론은 같은 Model Access/Omni; 실제 출력은 Interaction Manager, 외부 실행은 별도 승인</text></g>
<g id="e62"><text x="1327" y="2148" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">유리: 발화 중 준비; 정정 뒤 유효한 읽기 재사용</text><text x="1327" y="2187" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">대가: 취소 낭비/버전 누락/공유 모델 backlog</text><text x="1327" y="2226" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">선택: 긴 발화에서 재사용 가능한 준비가 많을 때</text></g>
<g id="e63"><text x="64" y="2292.0" text-anchor="start" font-size="22" font-weight="400" fill="#263445">공통 마무리: Request Controller 현재 검사 → Task Manager → Agent Gateway → Downstream Agent</text></g>
<g id="e64"><text x="64" y="2332.0" text-anchor="start" font-size="22" font-weight="400" fill="#263445">접수/결과 반환 → Response Manager → Interaction Manager의 실제 표시/음성. 미해결이면 실행 대신 질문.</text></g>
<g id="e65"><text x="64" y="2389.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">검정: 공통 / 파랑: A 고유 / 초록: B 고유. 실선: 요청/전달 / 점선: 결과. 네모: 이름 / 원통: 상태 / 육각형: 외부 의존.</text></g>
<g id="e66"><text x="64" y="2429.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">같은 이름의 반복 상자는 동일 Component. 비교 부분의 책임을 펼친 그림. 별도 process 표기가 없으면 논리 분해. 모델 가중치는 한 벌; 이익은 조건부 설계 가설, 미측정.</text></g>
</g></svg>

<g id="e61" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1717" y="608.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">같은 ASR, 연속 수신과 즉시 stop</text></g>
<g id="e66" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2127" y="1048.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">의미 요청</text></g>
<g id="e70" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2147" y="1858.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">추론 요청</text></g>
<g id="e73" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2077" y="803.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">요청</text></g>
<g id="e76" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1662" y="1528.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">Request Controller의 현재 확정 경계 통과 후</text></g>
<g id="e78"><text x="1348" y="1880.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">Context Manager의 허용된 읽기도 작업 결과로 연결.</text><text x="1348" y="1907.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">Response Manager → Interaction Manager: Text/음성 게시.</text><text x="1348" y="1934.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">Interaction Manager → Response Manager: 실제 전달 반환.</text><text x="1348" y="1961.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">A도 입력 ASR와 출력 음성 chunk는 streaming 가능.</text></g>
<g id="e80"><text x="64" y="2157.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">검정 = 공통 / 파랑 = A 고유 / 초록 = B 고유 / 색은 우위가 아님</text></g>
<g id="e81"><text x="2496" y="2156.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달 / 점선 → 반환/확인</text></g>
<g id="e82"><text x="64" y="2193.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">제목 상자 = Component / 내부 둥근 상자 = Module / 원통 = 저장 / 접힌 종이 = 자료 / 육각형 = 연동 대상</text></g>
<g id="e83"><text x="64" y="2229.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">설계안 / 미선정 / 미측정. Component 이름의 반복은 같은 owner의 다른 역할을 설명할 수 있다.</text></g>
</g></svg>

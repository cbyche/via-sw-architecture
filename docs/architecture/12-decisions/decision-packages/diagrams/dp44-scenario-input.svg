<text id="n84-0" data-width="286" x="1512" y="772.56" text-anchor="start" font-size="18" font-weight="400" fill="#18232E">결과 현재성 확인</text>
<text id="n85-0" data-width="310" x="1500" y="854.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">채택 후 Composer에 전달</text>
<rect id="n86" fill="#F4F7FA" stroke="#CDD6DE" stroke-width="1.7" x="54" y="966" width="1812" height="64"/>
<text id="n87-0" data-width="1760" x="72" y="1001.24" text-anchor="start" font-size="22" font-weight="700" fill="#18232E">A는 같은 Event Mailbox로 완료를 회수한다. B는 입력 Stage의 Done Queue가 완료를 받는다.</text>
<text id="n88-0" data-width="1812" x="54" y="1057.64" text-anchor="start" font-size="17" font-weight="400" fill="#5F6B77">파란선: 일반 사건과 다음 처리    파란 점선: 비동기 완료    붉은 점선: 제어와 무효화    A/B 미선정, 미구현, 미측정</text>

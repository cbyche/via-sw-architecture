<text id="n12-0" data-width="286" x="92" y="382.32" text-anchor="start" font-size="21" font-weight="700" fill="#18232E">Event Mailbox</text>
<text id="n13-0" data-width="286" x="92" y="412.56" text-anchor="start" font-size="18" font-weight="400" fill="#18232E">InputReady(u1)</text>

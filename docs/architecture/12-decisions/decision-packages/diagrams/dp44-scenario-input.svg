<text id="n2-0" data-width="1790" x="54" y="66.8" text-anchor="start" font-size="40" font-weight="700" fill="#18232E">DP44 1/4. 일반 사용자 발화: 이해 완료는 어디로 돌아오는가</text>
<polyline id="n3" points="54,103 1866,103" fill="none" stroke="#CDD6DE" stroke-width="2"/>
<rect id="n4" fill="#F4F7FA" stroke="#CDD6DE" stroke-width="1.7" x="54" y="129" width="1812" height="103"/>
<text id="n5-0" data-width="170" x="72" y="159.4" text-anchor="start" font-size="20" font-weight="700" fill="#18232E">같은 사건</text>
<text id="n6-0" data-width="1600" x="241" y="161.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">Interaction Manager가 InputReady(u1)를 Request Controller에 전달한다.</text>
<text id="n7-0" data-width="1600" x="241" y="194.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">발화 시작의 즉시 재생 중단은 공통이다. 이 장은 확정 입력의 이해 경로만 따라간다.</text>
<rect id="n8" fill="#EAF2FB" stroke="#CDD6DE" stroke-width="1.7" x="54" y="263" width="1812" height="54"/>
<text id="n9-0" data-width="1740" x="75" y="298.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">A  Event Mailbox가 완료를 회수하고 Dispatcher가 다음 처리를 지시</text>

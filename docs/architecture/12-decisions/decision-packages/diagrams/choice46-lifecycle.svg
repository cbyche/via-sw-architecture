<rect x="37" y="75" width="2486" height="31.200000000000003" fill="white"/>
<text x="40" y="99.0" data-width="2480" font-size="24" font-weight="400" text-anchor="start">같은 r2, 권한 철회, 원본 만료 | A의 요청 상태와 B의 게시 상태는 원본 권위나 현재 의미를 대신하지 않는다</text>
<rect x="27" y="135" width="1206" height="37.7" fill="white"/>
<text x="30" y="164.0" data-width="1200" font-size="29" font-weight="700" text-anchor="start">A  조회에 종속된 임시 상태</text>

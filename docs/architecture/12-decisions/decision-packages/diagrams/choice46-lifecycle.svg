<text x="440" y="451.0" data-width="365" font-size="21" font-weight="400" text-anchor="start">r2 / gap / permission 변경</text>
<text x="440" y="478.3" data-width="365" font-size="21" font-weight="400" text-anchor="start">expected source vector 검사</text>
<rect x="487" y="825" width="696" height="57.2" fill="white"/>
<text x="490" y="847.0" data-width="690" font-size="22" font-weight="400" text-anchor="start">input revision / temporal view 또는 query ID</text>
<text x="490" y="875.6" data-width="690" font-size="22" font-weight="400" text-anchor="start">historical refs / gap / permission epoch / lease</text>
<rect x="457" y="1150" width="761" height="57.2" fill="white"/>
<text x="460" y="1172.0" data-width="755" font-size="22" font-weight="400" text-anchor="start">채택 뒤 전송/게시 직전에도 owner의 현재성 재검사</text>
<text x="460" y="1200.6" data-width="755" font-size="22" font-weight="400" text-anchor="start">늦은 invalidation event만 믿지 않음. read 성공 ≠ 실행 허가.</text>
<rect x="27" y="1250" width="1206" height="89.7" fill="white"/>
<text x="30" y="1273.0" data-width="1200" font-size="23" font-weight="400" text-anchor="start">A: 수정된 query/set/cache 무효화 → 원본에서 요청별 재구성</text>
<text x="30" y="1302.9" data-width="1200" font-size="23" font-weight="400" text-anchor="start">공통: DENIED / EXPIRED / GAP / UNKNOWN_TIMING / UNAVAILABLE을 명시</text>
<text x="30" y="1332.8" data-width="1200" font-size="23" font-weight="400" text-anchor="start">원본 만료/철회: active query나 view ref가 원본 수명을 무한 연장하지 않음</text>
<rect x="1317" y="135" width="1206" height="37.7" fill="white"/>
<text x="1320" y="164.0" data-width="1200" font-size="29" font-weight="700" text-anchor="start">B  producer 소유 게시 상태와 coverage</text>

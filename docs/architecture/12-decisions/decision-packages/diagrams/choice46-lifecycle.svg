<text x="1750" y="1200.6" data-width="755" font-size="22" font-weight="400" text-anchor="start">늦은 invalidation event만 믿지 않음. read 성공 ≠ 실행 허가.</text>
<rect x="1317" y="1250" width="1206" height="89.7" fill="white"/>
<text x="1320" y="1273.0" data-width="1200" font-size="23" font-weight="400" text-anchor="start">B: 시간/과거 view 사용 차단 → owner별 재생산/게시 → 소비자 재조회</text>
<text x="1320" y="1302.9" data-width="1200" font-size="23" font-weight="400" text-anchor="start">공통: DENIED / EXPIRED / GAP / UNKNOWN_TIMING / UNAVAILABLE을 명시</text>
<text x="1320" y="1332.8" data-width="1200" font-size="23" font-weight="400" text-anchor="start">원본 만료/철회: active query나 view ref가 원본 수명을 무한 연장하지 않음</text>
<rect x="37" y="1380" width="2486" height="26.0" fill="white"/>
<text x="40" y="1400.0" data-width="2480" font-size="20" font-weight="400" text-anchor="start">살구색 = 차이 Module/상태. 문서형 예시는 상태 이름이 아님. 과거 원본과 시간 원본의 owner별 revision을 남기며 전역 snapshot은 가정하지 않음.</text>

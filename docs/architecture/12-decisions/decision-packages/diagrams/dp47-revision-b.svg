</g>
<g id="note2" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="110.0" font-size="43" font-weight="700" text-anchor="start" fill="#263445">B / 정상 생성, 부분 정정과 늦은 결과의 실제 반환 경로</text>
</g>
<g id="note3" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="166.0" font-size="27" font-weight="400" text-anchor="start" fill="#263445">처음 figure 하나뿐인 후보를 둘로 확장한 뒤 r2로 일부 정정 / 후보 누락과 늦은 결과까지 같은 사건을 추적한다</text>
</g>
<g id="note4" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="215.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">D 번호는 이 사건도의 메시지 순서 / 세로 간격은 시간 측정값이 아님 / target 이름과 후보 key는 생산 이후의 설명 예시</text>
</g>
<g id="note5" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="358" y="414.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">D1  GroundingInput r1 / 확보한 raw refs / coverage</text>

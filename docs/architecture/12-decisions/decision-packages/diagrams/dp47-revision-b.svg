<text x="998" y="1376.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">D14  r2 원음/전사 + prior / 정정 후보 생산 → Model Access</text>
</g>
<g id="note19" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="1638" y="1450.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">D15  m4@v2: lower / KEEP 앞의 두 자료 / raw와 peer refs</text>
</g>
<g id="note20" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="998" y="1524.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">D16  새 g2: m4@v2에 따른 target 검토 / 유효 원본 재사용</text>
</g>
<g id="note21" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="998" y="1598.0" font-size="24" font-weight="400" text-anchor="start" fill="#B63732">D17  g1b late done: expected generation 불일치 → 미게시</text>
</g>
<g id="note22" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="2278" y="1672.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">D18  g2: lower=t8@v3 / extent 재사용 / peer m4@v2 갱신</text>
</g>
<g id="note23" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="998" y="1746.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">D19  m4@v2,t8@v3와 유지 binding read-set → 부분 재결합</text>
</g>
<g id="note24" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="358" y="1820.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">D20  r2 제안: KEEP b1,b2 / REPLACE b3 / stale read-set 거절</text>
</g>
<g id="note25" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="1910.0" font-size="26" font-weight="400" text-anchor="start" fill="#263445">B: 후보가 없으면 D7–D10을 거친다. r2는 D14–D19의 생산자별 갱신과 새 read-set 결합을 거친다.</text>
</g>
<g id="note26" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="1965.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">공통: 결과 대기 중 capture / 전사 / local stop은 계속된다. Request Controller가 최신 revision, 사용권, 근거와 base version을 검사한다.</text>
</g>
<g id="note27" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="2015.0" font-size="24" font-weight="400" text-anchor="start" fill="#263445">채택 뒤에는 전체 요청 해석과 admission을 거쳐 응답 / 업무로 연결한다. 일부 지칭 실패는 해당 범위를 질문하며 앞의 의미를 임의 확정하지 않는다.</text>
</g>
<g id="note28" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="2065.0" font-size="23" font-weight="400" text-anchor="start" fill="#758294">B 모델 왕복과 candidate 완료 통지는 메시지에 축약했다. 구조도에서 실제 호출과 반환을 표시한다. D 간격과 병행 정도는 성능 주장이 아니다.</text>
</g>
<g id="note29" paint-order="stroke" stroke="white" stroke-width="8" stroke-linejoin="round">
<text x="60" y="2120.0" font-size="23" font-weight="400" text-anchor="start" fill="#758294">실선: 요청 / 파랑 점선: 결과 / 빨강 점선: 정정과 무효화 / 회색 점선: 상태 게시 / 실행 trace가 아닌 같은 사건의 설계 예시</text>
</g>
</g></svg>

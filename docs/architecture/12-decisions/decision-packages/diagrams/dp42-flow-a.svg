<text id="note0-0" x="64" y="50" font-size="26" fill="#233247" text-anchor="start" font-weight="700">VIA / DP-42 / 구현을 가정한 상세 설계</text>
<text id="note1-0" x="3776" y="50" font-size="24" fill="#233247" text-anchor="end" font-weight="400">설계 제안 / 제품 구현과 측정 없음 / A/B 미선정</text>
<text id="note2-0" x="64" y="118" font-size="44" fill="#233247" text-anchor="start" font-weight="700">A. 같은 Q1 답변을 입력부터 실제 전달까지 추적</text>
<text id="note3-0" x="64" y="175" font-size="27" fill="#233247" text-anchor="start" font-weight="400">초기: T1 / X1의 Q1=OPEN v7, P1 실제 제시 확인. u2에는 Task ID가 없으며 읽기 근거를 본 뒤 의미를 채택한다.</text>
<text id="note4-0" x="192.0" y="397" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">01  u2 onset / 새 입력 → 보호 hold 요청</text>
<text id="note5-0" x="689.1428571428571" y="449" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">02  hold 요청 / 로컬 gate</text>
<text id="note6-0" x="689.1428571428571" y="501" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">03  HoldAck: 적용한 gate revision / 영향 범위 / 충돌</text>
<text id="note7-0" x="689.1428571428571" y="553" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">04  질문 / Task 후보 bounded 조회</text>
<text id="note8-0" x="689.1428571428571" y="605" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">05  Q1=OPEN v7 / T1 / X1 / source revision</text>
<text id="note9-0" x="689.1428571428571" y="657" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">06  P1 실제 제시 범위 조회</text>
<text id="note10-0" x="689.1428571428571" y="709" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">07  P1 → Q1 actual reference</text>
<text id="note11-0" x="689.1428571428571" y="761" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">08  원문 u2 + 현재 근거 / 필요한 추가 조회와 모델 호출</text>
<text id="note12-0" x="689.1428571428571" y="813" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">09  MeaningProposal: 상반기 답변 → Q1 / T1 (아직 미채택)</text>
<text id="note13-0" x="689.1428571428571" y="865" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">10  prepare_answer(K1, Q1 v7, input / permission revision)</text>
<text id="note14-0" x="689.1428571428571" y="917" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">11  TaskWriteSet: Q1 v8 + K1 PENDING + 선택적 hold 해제</text>
<text id="note15-0" x="30" y="972" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note16-0" x="689.1428571428571" y="969" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">12  A1: RequestWriteSet + TaskWriteSet / expected revisions 검사</text>
<text id="note17-0" x="689.1428571428571" y="1021" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">13  COMMITTED: R2 관계 + Q1 + K1 / 충돌이면 모두 미반영</text>
<text id="note18-0" x="1683.4285714285716" y="1073" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">14  claim(K1): 현재 gate / Task / 권한 조건 검사</text>
<text id="note19-0" x="30" y="1128" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note20-0" x="1683.4285714285716" y="1125" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">15  A2: PENDING → DISPATCHING 조건부 CAS</text>
<text id="note21-0" x="2180.5714285714284" y="1177" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">16  claim 성공 / 실패면 외부 send 없음</text>
<text id="note22-0" x="2677.714285714286" y="1229" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">17  send(K1, X1, Q1, answer=상반기) / transaction 밖</text>
<text id="note23-0" x="2677.714285714286" y="1281" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">18  외부 receipt / 수신 확인된 K1 / 단순 socket 성공과 구별</text>
<text id="note24-0" x="30" y="1336" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note25-0" x="2180.5714285714284" y="1333" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">19  I1: raw receipt / event inbox 내구 저장, 확인 응답은 저장 뒤</text>
<text id="note26-0" x="1683.4285714285716" y="1385" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">20  외부 사실 적용 요청 / 원본 event ID와 revision</text>
<text id="note27-0" x="30" y="1440" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note28-0" x="1683.4285714285716" y="1437" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">21  A3: EXTERNAL_ACCEPTED + 실행 관측 + 내구 반환 event</text>
<text id="note29-0" x="689.1428571428571" y="1489" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">22  확인된 외부 사실 / 내구 원본 참조</text>
<text id="note30-0" x="689.1428571428571" y="1541" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">23  현재성 검사 뒤 P2 게시 허용 / 확인된 사실만 구성</text>
<text id="note31-0" x="192.0" y="1593" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">24  release(P2, output epoch) → 현재 발화 상태 검사 뒤 실제 출력</text>
<text id="note32-0" x="192.0" y="1645" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">25  actual receipt(P2, Text / audible range)</text>
<text id="note33-0" x="30" y="1700" font-size="21" fill="#A65E2E" text-anchor="start" font-weight="400">▣</text>
<text id="note34-0" x="2180.5714285714284" y="1697" font-size="20" fill="#A65E2E" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">26  A4: 실제 전달 범위와 UNKNOWN 경계를 내구 원장에 기록</text>
<text id="note35-0" x="689.1428571428571" y="1749" font-size="20" fill="#233247" text-anchor="start" font-weight="400" paint-order="stroke" stroke="white" stroke-width="9" stroke-linejoin="round">27  P2 actual reference 반환 / Request의 실제 제시 관계 갱신</text>
<text id="note36-0" x="64" y="1848" font-size="27" fill="#233247" text-anchor="start" font-weight="700">확정 전 실패</text>
<text id="note37-0" x="64" y="1893" font-size="25" fill="#233247" text-anchor="start" font-weight="400">A1 충돌: 관련 변경 모두 미반영, 현재 원본 재조회.</text>
<text id="note37-1" x="64" y="1929.25" font-size="25" fill="#233247" text-anchor="start" font-weight="400">A2 CAS 실패: 외부 send 없이 현재 gate / Task 확인.</text>
<text id="note38-0" x="1370" y="1848" font-size="27" fill="#233247" text-anchor="start" font-weight="700">확정 뒤 응답 유실</text>
<text id="note39-0" x="1370" y="1893" font-size="25" fill="#233247" text-anchor="start" font-weight="400">같은 K1로 공동 확정 결과 조회.</text>
<text id="note39-1" x="1370" y="1929.25" font-size="25" fill="#233247" text-anchor="start" font-weight="400">새 업무 ID로 재실행하지 않음. inbox에서 미반영 사실 복구.</text>
<text id="note40-0" x="2640" y="1848" font-size="27" fill="#233247" text-anchor="start" font-weight="700">정정과 전송의 경합</text>
<text id="note41-0" x="2640" y="1893" font-size="25" fill="#233247" text-anchor="start" font-weight="400">hold가 CAS보다 먼저: K1 보류 후 새 K2로 교체.</text>
<text id="note41-1" x="2640" y="1929.25" font-size="25" fill="#233247" text-anchor="start" font-weight="400">CAS가 먼저: 외부 효력을 조회하고 지원되는 정정 / 취소.</text>
<text id="note42-0" x="64" y="2030" font-size="25" fill="#596A7C" text-anchor="start" font-weight="400">각 줄은 설명용 정상 실행 순서다. 입력 수신과 다른 Task는 계속된다. 모델 / 네트워크 / 실제 출력 대기는 local transaction 밖이다.</text>
<text id="note43-0" x="64" y="2073" font-size="25" fill="#A65E2E" text-anchor="start" font-weight="400">내부 접수 ACCEPTED ≠ 외부 EXTERNAL_ACCEPTED ≠ 사용자 실제 제시. 전송 timeout은 UNKNOWN이며 외부 확인 없이 새 start를 만들지 않는다.</text>
<text id="note44-0" x="64" y="2116" font-size="24" fill="#596A7C" text-anchor="start" font-weight="400">A: 관련 owner 변경만 공동 확정한다. 모델 / 외부 API / 물리 출력은 포함하지 않는다. 내부 비동기와 worker, 다른 Task의 처리를 계속 허용한다.</text>
</g></svg>

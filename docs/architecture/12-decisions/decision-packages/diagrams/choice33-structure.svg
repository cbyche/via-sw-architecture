<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-33  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">여러 업무의 대화 정확성을 위한 협력</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">중앙 해석과 업무별 대화 처리</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">보고서와 메일이 각각 질문 → “보고서는 PDF, 메일에는 그 결론” → 다른 업무의 참조 연결</text></g>
<g id="e7"><text x="64" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#195FBD">A  중앙이 대화 상태를 작성</text></g>
<g id="e9"><text x="94" y="371.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">같은 발화 + 보고서/메일의 질문과 실제 전달 기록</text></g>
<g id="e15" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="129" y="598.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">1  관련 질문/업무 근거 회수</text></g>
<g id="e17" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="714" y="818.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">2  전체 발화/맥락</text></g>
<g id="e19" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="859" y="1108.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">3  두 업무의 의미 제안</text></g>
<g id="e21" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="154" y="1028.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">4  공동 상태 갱신</text></g>
<g id="e24" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="129" y="1548.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">5  명령/질문 제안</text></g>
<g id="e25"><text x="854" y="1380.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">전이 작성자는 중앙 하나</text><text x="854" y="1407.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">Task별 cache/선택 갱신 가능</text><text x="854" y="1434.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">모든 Task를 직렬 실행하지 않음</text></g>
<g id="e26"><text x="94" y="1831.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">추론: Request Interpreter → Model Access → 같은 Omni → 의미 결과 반환</text></g>
<g id="e28"><text x="79" y="2148" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">유리: 업무 간 생략/교차 참조를 한 번에 해석</text><text x="79" y="2187" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">대가: 중앙이 모든 대화 전이 규칙을 관리</text><text x="79" y="2226" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">선택: 짧고 서로 얽힌 업무 대화</text></g>
<g id="e29"><text x="1312" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#087A53">B  업무별 처리자가 상태를 제안</text></g>
<g id="e31"><text x="1342" y="371.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">같은 발화 + 보고서/메일의 질문과 실제 전달 기록</text></g>
<g id="e39" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1737" y="538.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">1  원문/입력 버전</text></g>
<g id="e41" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1387" y="883.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">2  원문 / 3  교환한 참조</text></g>
<g id="e43" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1387" y="968.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">3  절/다음 상태/제공 또는 필요한 참조</text></g>
<g id="e45" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1387" y="1378.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">5  채택 통지 후 상태 반영</text></g>
<g id="e47" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1617" y="1438.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">이전 상태</text></g>
<g id="e49" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1972" y="883.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">2  원문 / 3  교환한 참조</text></g>
<g id="e51" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1972" y="968.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">3  절/다음 상태/제공 또는 필요한 참조</text></g>
<g id="e53" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1972" y="1378.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">5  채택 통지 후 상태 반영</text></g>
<g id="e55" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2202" y="1438.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">이전 상태</text></g>
<g id="e59" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1357" y="673.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">4  현재 검사 요청</text></g>
<g id="e61" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1662" y="673.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">허용/거절</text></g>
<g id="e63" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1962" y="673.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">5  상태/intent 원자 확정</text></g>
<g id="e65" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2292" y="673.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">저장 성공</text></g>
<g id="e66"><text x="1352" y="1680.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">3  보고서 참조는 Coordinator의 반환/전달 경로로 메일 actor에 제공</text></g>
<g id="e69" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1347" y="1788.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">자기 맥락으로 해석 요청</text></g>
<g id="e71" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1347" y="1948.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">자기 의미 결과</text></g>
<g id="e73" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2167" y="1788.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">자기 맥락으로 해석 요청</text></g>
<g id="e75" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2172" y="1948.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">자기 의미 결과</text></g>
<g id="e76"><text x="1352" y="2019.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">추론은 Model Access/공유 Omni. Coordinator는 actor의 다음 상태를 다시 작성하지 않음.</text></g>
<g id="e78"><text x="1327" y="2148" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">유리: 업무별 대화 규칙/사건 처리를 해당 actor가 소유</text><text x="1327" y="2187" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">대가: 참가 누락/제안 충돌/참조 왕복/모델 경합</text><text x="1327" y="2226" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">선택: 독립적으로 오래 이어지는 여러 업무</text></g>
<g id="e79"><text x="64" y="2292.0" text-anchor="start" font-size="22" font-weight="400" fill="#263445">공통 마무리: Request Controller 현재 검사 → Task Manager → Agent Gateway → Downstream Agent</text></g>
<g id="e80"><text x="64" y="2332.0" text-anchor="start" font-size="22" font-weight="400" fill="#263445">접수/결과 반환 → Response Manager → Interaction Manager의 실제 표시/음성. 미해결이면 실행 대신 질문.</text></g>
<g id="e81"><text x="64" y="2389.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">검정: 공통 / 파랑: A 고유 / 초록: B 고유. 실선: 요청/전달 / 점선: 결과. 네모: 이름 / 원통: 상태 / 육각형: 외부 의존.</text></g>
<g id="e82"><text x="64" y="2429.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">같은 이름의 반복 상자는 동일 Component. 비교 부분의 책임을 펼친 그림. 별도 process 표기가 없으면 논리 분해. 모델 가중치는 한 벌; 이익은 조건부 설계 가설, 미측정.</text></g>
</g></svg>

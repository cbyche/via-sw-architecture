<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-33  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">여러 업무의 대화 정확성을 위한 협력</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">중앙 해석과 업무별 대화 처리</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">공통 조건은 유지하고 각 안의 실제 생산/상태/실행 관계를 펼침. 배열이나 색 차이 자체는 구조 자격의 증거가 아님.</text></g>
<g id="e8"><text x="88" y="270.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">A</text></g>
<g id="e9"><text x="132" y="263.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">중앙이 전체 대화 해석</text></g>
<g id="e11"><text x="86" y="354.0" text-anchor="start" font-size="18" font-weight="700" fill="#263445">VIA SOFTWARE</text></g>
<g id="e12"><text x="1226" y="354.0" text-anchor="end" font-size="16" font-weight="400" fill="#5B697B">논리 책임 / 실제 process는 별도 표시</text></g>
<g id="e21" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="899" y="2088.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">추론 요청</text></g>
<g id="e24" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="444" y="918.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">관련 대화 공동 회수</text></g>
<g id="e26" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="714" y="1058.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">전체 발화 요청</text></g>
<g id="e28" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="819" y="1298.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">전체 의미/상태 제안</text></g>
<g id="e30" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="184" y="1453.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">중앙 상태 갱신</text></g>
<g id="e33"><text x="164" y="1900.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">같은 중앙 해석 결과로 업무 간 참조와 상태 변경을 구성.</text><text x="164" y="1927.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">Task별 cache가 있어도 독립 대화 실행자는 없음.</text></g>
<g id="e34"><text x="104" y="2350.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">확정 명령은 Task Manager → Agent Gateway → Agent. 외부 질문/결과와 실제 전달은 대화 owner로 복귀.</text><text x="104" y="2377.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">차이: 중앙의 공동 해석/갱신 ↔ 여러 상태 보유 실행자의 제안/조정/채택.</text></g>
<g id="e36"><text x="1336" y="270.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">B</text></g>
<g id="e37"><text x="1380" y="263.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">업무 대화 actor가 협력</text></g>
<g id="e39"><text x="1334" y="354.0" text-anchor="start" font-size="18" font-weight="700" fill="#263445">VIA SOFTWARE</text></g>
<g id="e40"><text x="2474" y="354.0" text-anchor="end" font-size="16" font-weight="400" fill="#5B697B">논리 책임 / 실제 process는 별도 표시</text></g>
<g id="e47" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1427" y="1328.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">채택된 전이 / 상태 조회</text></g>
<g id="e50" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1412" y="918.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">입력/참조 전달</text></g>
<g id="e55" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2027" y="1328.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">채택된 전이 / 상태 조회</text></g>
<g id="e58" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2012" y="918.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">입력/참조 전달</text></g>
<g id="e61" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1927" y="578.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">입력 / 현재 적용 허용</text></g>
<g id="e67" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2147" y="2088.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">추론 요청</text></g>
<g id="e75"><text x="1352" y="2078.0" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">actor 제안은 Coordinator로 반환. 참조 요청도 Coordinator 중개.</text><text x="1352" y="2102.3" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">현재 검사 후 채택 상태/명령을 local transaction으로 확정하고 통지.</text></g>
<g id="e76"><text x="1352" y="2350.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">확정 명령은 Task Manager → Agent Gateway → Agent. 외부 질문/결과와 실제 전달은 대화 owner로 복귀.</text><text x="1352" y="2377.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">차이: 중앙의 공동 해석/갱신 ↔ 여러 상태 보유 실행자의 제안/조정/채택.</text></g>
<g id="e78"><text x="64" y="2497.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">검정 = 공통 / 파랑 = A 고유 / 초록 = B 고유 / 색은 우위가 아님</text></g>
<g id="e79"><text x="2496" y="2496.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달 / 점선 → 반환/확인</text></g>
<g id="e80"><text x="64" y="2533.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">제목 상자 = Component / 내부 둥근 상자 = Module / 원통 = 저장 / 접힌 종이 = 자료 / 육각형 = 연동 대상</text></g>
<g id="e81"><text x="64" y="2569.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">실제 설계 차이와 전환 비용은 본문 §8~9. 이 그림은 구현/측정 또는 주요 DP 선정의 증거가 아니다.</text></g>
</g></svg>

<g id="e47" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="718" y="1066.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">확인된 외부 접수 상태 전달</text></g>
<g id="e49" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="183" y="1124.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">“상반기 조건을 전달했어요”</text></g>
<g id="e51" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="183" y="1182.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">실제 전달 기록 P2 → 대화 상태에 보관</text></g>
<g id="e52"><text x="64" y="1316.0" text-anchor="start" font-size="26" font-weight="400" fill="#5B697B">경쟁: Q1이 철회되거나 X1이 끝났으면 현재 검사에서 거절. 실패한 명령을 외부에 전달하지 않는다.</text></g>
<g id="e54"><text x="64" y="1383.0" text-anchor="start" font-size="28" font-weight="400" fill="#5B697B">검정: 공통  ·  파랑: A  ·  초록: B     실선: 요청·변경  /  점선 화살표: 반환·조회 결과</text></g>
<g id="e55"><text x="2496" y="1420.0" text-anchor="end" font-size="21" font-weight="400" fill="#5B697B">같은 의미 해석·자료·권한 조건 / 모델 호출과 Agent 연동 내부는 축약 / 선 간격은 소요시간이 아님</text></g>

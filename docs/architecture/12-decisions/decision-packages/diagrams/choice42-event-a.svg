<g id="e76"><text x="64" y="1312.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">DISPATCHING ≠ 외부 접수 / hold 요청과 업무 적용은 다른 시점 / cloud 모델·네트워크는 transaction 밖</text></g>

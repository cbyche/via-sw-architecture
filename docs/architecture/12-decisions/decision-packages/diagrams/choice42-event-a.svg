<g id="e27" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="718" y="486.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">Q1·T1·X1 현재 상태 조회</text></g>
<g id="e29" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="718" y="544.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">질문·업무 상태와 revision</text></g>
<g id="e31" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="718" y="602.0" text-anchor="start" font-size="24" font-weight="400" fill="#195FBD">해석 후 답변 연결·조건 제안</text></g>

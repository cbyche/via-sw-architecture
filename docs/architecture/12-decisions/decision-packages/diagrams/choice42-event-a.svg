<g id="e4"><text x="64" y="132.0" text-anchor="start" font-size="49" font-weight="700" fill="#263445">A  같은 답변의 확정과 실제 전달</text></g>
<g id="e5"><text x="64" y="182.0" text-anchor="start" font-size="28" font-weight="400" fill="#5B697B">E4 확대: C1에서 “응, 상반기로” → Q1 현재 상태 검사 → 로컬 확정 → 외부 접수 → 사용자에게 전달</text></g>
<g id="e8"><text x="1170" y="288.0" text-anchor="middle" font-size="25" font-weight="700" fill="#195FBD">VIA Core / 공동 확정·저장</text></g>
<g id="e10"><text x="165" y="354.0" text-anchor="middle" font-size="28" font-weight="700" fill="#263445">사용자 입출력</text></g>
<g id="e13"><text x="700" y="354.0" text-anchor="middle" font-size="28" font-weight="700" fill="#263445">대화 처리기</text></g>
<g id="e16"><text x="1170" y="354.0" text-anchor="middle" font-size="28" font-weight="700" fill="#263445">트랜잭션 관리자</text></g>
<g id="e19"><text x="1660" y="354.0" text-anchor="middle" font-size="28" font-weight="700" fill="#263445">업무 관리기</text></g>
<g id="e22"><text x="2340" y="354.0" text-anchor="middle" font-size="28" font-weight="700" fill="#263445">Downstream Agent</text></g>

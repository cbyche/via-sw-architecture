<g id="e35" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1188" y="718.0" text-anchor="start" font-size="24" font-weight="400" fill="#195FBD">검증한 질문·업무·명령 변경</text></g>
<g id="e37" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1188" y="776.0" text-anchor="start" font-size="24" font-weight="400" fill="#195FBD">관련 대화·업무 상태와 명령을 함께 저장</text></g>
<g id="e39" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="718" y="834.0" text-anchor="start" font-size="24" font-weight="400" fill="#195FBD">로컬 저장 결과 / 대화·업무 함께 반영</text></g>
<g id="e41" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1188" y="892.0" text-anchor="start" font-size="24" font-weight="400" fill="#195FBD">로컬 확정 성공 / 외부 접수와 별개</text></g>

<text x="40" y="1022.0" data-width="1830" font-size="22" font-weight="400">Legend: 직각 Component / 둥근 내부 Module / 원통 owner의 상태 / 육각 외부 의존성 / 점선 큰 배치 영역</text>
<text x="40" y="1058.0" data-width="1830" font-size="20" font-weight="400">모든 요소는 공통이므로 흰색·검정. Voice API Client·Semantic API Client는 adapter 역할명이며 독립 Component가 아니다.</text>

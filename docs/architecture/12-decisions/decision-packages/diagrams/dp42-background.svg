<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#FFFFFF"/>
<g font-family="Calibri, sans-serif">
<text id="dp42-background-1-text-0" x="60" y="73.6" font-size="40.0" text-anchor="start" font-weight="700" fill="#000000" data-width="1040">DP42. 요청이 끝나도 이어지는 보고서 업무</text>
<polyline id="dp42-background-2" points="52,104 1872,104" fill="none" stroke="#A6A6A6" stroke-width="1.5"/>
<polyline id="dp42-background-3" points="52,908 1868,908" fill="none" stroke="#A6A6A6" stroke-width="1.5"/>
<text id="dp42-background-4-text-0" x="52" y="970.4266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#C00000" data-width="180">설계 질문</text>
<text id="dp42-background-5-text-0" x="260" y="974.0266666666668" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1608">대화·요청·질문·업무·실행의 서로 다른 수명을</text>
<text id="dp42-background-5-text-1" x="260" y="1010.8266666666667" font-size="30.666666666666668" text-anchor="start" font-weight="700" fill="#000000" data-width="1608">어떻게 관리하고 연결할까?</text>
<text id="dp42-background-6-text-0" x="52" y="190.78666666666666" font-size="34.666666666666664" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">“보고서 만들어줘”를 전달한 뒤에도, 보고서 작성은 계속됩니다.</text>
<text id="dp42-background-7-text-0" x="52" y="253.97333333333333" font-size="29.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="1816">“어디까지 했어?”는 새 요청이고, 완료 후 “결론만 고쳐줘”는 같은 업무의 새 실행이 될 수 있습니다.</text>
<text id="dp42-background-8-text-0" x="277" y="346.9733333333333" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="386">“보고서 만들어줘”</text>
<text id="dp42-background-9-text-0" x="277" y="399.61333333333334" font-size="25.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="386">외부 접수 확인</text>
<text id="dp42-background-10-text-0" x="687" y="346.9733333333333" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="386">“어디까지 했어?”</text>
<text id="dp42-background-11-text-0" x="687" y="399.61333333333334" font-size="25.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="386">진행 상태로 답변</text>
<text id="dp42-background-12-text-0" x="1097" y="346.9733333333333" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="386">Voice 끄기</text>
<text id="dp42-background-13-text-0" x="1097" y="399.61333333333334" font-size="25.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="386">업무·대기 질문 유지</text>
<text id="dp42-background-14-text-0" x="1507" y="346.9733333333333" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="386">“결론만 고쳐줘”</text>
<text id="dp42-background-15-text-0" x="1507" y="399.61333333333334" font-size="25.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="386">최초 작성 완료 후</text>
<text id="dp42-background-16-text-0" x="52" y="476.9733333333333" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="230">대화</text>
<text id="dp42-background-17-text-0" x="52" y="549.9733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="230">개별 요청</text>
<text id="dp42-background-18-text-0" x="52" y="626.9733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="230">보고서 업무</text>
<text id="dp42-background-19-text-0" x="52" y="710.9733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="230">외부 실행</text>
<polyline id="dp42-background-20" points="340,465 1820,465" fill="none" stroke="#00889A" stroke-width="5"/>
<text id="dp42-background-21-text-0" x="867" y="460.61333333333334" font-size="25.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="800">Voice를 꺼도 기록과 연결은 유지</text>
<polyline id="dp42-background-22" points="340,538 550,538" fill="none" stroke="#00889A" stroke-width="7"/>
<polyline id="dp42-background-23" points="750,538 960,538" fill="none" stroke="#00889A" stroke-width="7"/>
<polyline id="dp42-background-24" points="1570,538 1790,538" fill="none" stroke="#00889A" stroke-width="7"/>
<text id="dp42-background-25-text-0" x="330" y="582.16" font-size="24.0" text-anchor="start" font-weight="400" fill="#000000" data-width="300">위임 처리 종료</text>
<text id="dp42-background-26-text-0" x="750" y="582.16" font-size="24.0" text-anchor="start" font-weight="400" fill="#000000" data-width="340">새 작성 실행 없음</text>
<polyline id="dp42-background-27" points="340,615 1820,615" fill="none" stroke="#00889A" stroke-width="7"/>
<text id="dp42-background-28-text-0" x="1310" y="667.6133333333332" font-size="25.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="500">같은 보고서 업무로 연결</text>
<polyline id="dp42-background-29" points="340,699 1400,699" fill="none" stroke="#00889A" stroke-width="7"/>
<polyline id="dp42-background-30" points="1565,699 1820,699" fill="none" stroke="#00889A" stroke-width="7"/>
<text id="dp42-background-31-text-0" x="340" y="745.6133333333332" font-size="25.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="310">최초 작성 실행</text>
<text id="dp42-background-32-text-0" x="1565" y="745.6133333333332" font-size="25.333333333333332" text-anchor="start" font-weight="400" fill="#000000" data-width="260">새 수정 실행</text>
<rect x="1060" y="750" width="460" height="74" fill="#F2F2F2" stroke="#A6A6A6" stroke-width="2"/>
<text id="dp42-background-33-text-0" x="1290.0" y="780.4133333333334" font-size="25.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="460">대기 질문 유지</text>
<text id="dp42-background-33-text-1" x="1290.0" y="810.8133333333334" font-size="25.333333333333332" text-anchor="middle" font-weight="400" fill="#000000" data-width="460">답변·만료로 종료</text>
<text id="dp42-background-34-text-0" x="52" y="877.9733333333334" font-size="29.333333333333332" text-anchor="start" font-weight="700" fill="#000000" data-width="1816">요청·Voice 종료를 업무 종료로 다루면, 연결을 잃거나 같은 작성을 다시 시작할 수 있습니다.</text>
</g></svg>

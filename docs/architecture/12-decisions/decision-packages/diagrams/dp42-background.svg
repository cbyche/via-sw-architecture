<text id="n45-0" data-width="620" x="1154" y="606.4" text-anchor="end" font-size="20" font-weight="400" fill="#5F6B77">Task / 목표, 상태와 결과의 추적</text>
<text id="n46-0" data-width="310" x="80" y="646.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">Task 생성 후 Delegation</text>
<text id="n47-0" data-width="310" x="80" y="685.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">Agent Execution 1</text>
<text id="n48-0" data-width="310" x="80" y="716.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">보고서 작성 시작</text>
<text id="n49-0" data-width="310" x="464" y="660.68" text-anchor="start" font-size="29" font-weight="700" fill="#087E8B">Task와 실행 계속</text>
<text id="n50-0" data-width="310" x="464" y="699.4" text-anchor="start" font-size="20" font-weight="400" fill="#18232E">상태 조회 / 새 실행 없음</text>
<text id="n51-0" data-width="310" x="848" y="646.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">작성 종료 후 수정 Delegation</text>
<text id="n52-0" data-width="310" x="848" y="684.24" text-anchor="start" font-size="22" font-weight="700" fill="#087E8B">Agent Execution 2 시작</text>
<text id="n53-0" data-width="310" x="848" y="716.4" text-anchor="start" font-size="20" font-weight="400" fill="#5F6B77">같은 Task의 결론 수정</text>
<rect id="n54" fill="#F5F6F8" stroke="#CDD6DE" stroke-width="1.7" x="64" y="746" width="1110" height="114"/>
<text id="n55-0" data-width="1068" x="84" y="775.16" text-anchor="start" font-size="23" font-weight="700" fill="#5F6B77">메일 초안 Task</text>
<text id="n56-0" data-width="310" x="80" y="815.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">Delegation / 초안 작성 시작</text>
<text id="n57-0" data-width="310" x="80" y="846.48" text-anchor="start" font-size="19" font-weight="400" fill="#5F6B77">Agent Execution</text>
<text id="n58-0" data-width="310" x="464" y="829.16" text-anchor="start" font-size="23" font-weight="400" fill="#18232E">초안 완료 / 결과 보관</text>
<text id="n59-0" data-width="310" x="848" y="829.16" text-anchor="start" font-size="23" font-weight="400" fill="#18232E">완료 상태와 결과 유지</text>

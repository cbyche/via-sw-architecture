<text id="n11-0" data-width="165" x="64" y="948.92" text-anchor="start" font-size="26" font-weight="700" fill="#B63732">설계 과제</text>
<text id="n12-0" data-width="1616" x="240" y="948.52" text-anchor="start" font-size="31" font-weight="700" fill="#18232E">Conversation과 Task 상태의 관리 책임 및 실행 경계 설계</text>
<text id="n13-0" data-width="1616" x="240" y="993.32" text-anchor="start" font-size="21" font-weight="400" fill="#5F6B77">Delegation / Downstream Agent에 작업 전달     Agent Execution / 개별 작업 실행</text>
<text id="n14-0" data-width="1260" x="64" y="1051.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">품질 관점: 기능 정확성 / 변경 용이성 / 복구성</text>
<text id="n15-0" data-width="480" x="1856" y="1051.56" text-anchor="end" font-size="18" font-weight="400" fill="#5F6B77">구조 후보 / 미선정 / 미측정</text>
<rect id="n16" fill="white" stroke="#CDD6DE" stroke-width="1.7" x="64" y="275" width="1110" height="273"/>
<rect id="n17" fill="#EAF0F8" stroke="none" stroke-width="1.7" x="64" y="275" width="1110" height="40"/>
<text id="n18-0" data-width="760" x="84" y="306.0" text-anchor="start" font-size="25" font-weight="700" fill="#18232E">Conversation / 입력과 Response 기록</text>
<text id="n19-0" data-width="290" x="1154" y="304.56" text-anchor="end" font-size="18" font-weight="400" fill="#5F6B77">User Turn / 한 번의 발화</text>
<text id="n20-0" data-width="310" x="80" y="346.24" text-anchor="start" font-size="22" font-weight="700" fill="#5F6B77">처음 발화</text>
<text id="n21-0" data-width="310" x="80" y="385.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">“이번 달 매출보고서</text>
<text id="n21-1" data-width="310" x="80" y="413.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">만들어주고, 내일 회의 안내</text>
<text id="n21-2" data-width="310" x="80" y="441.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">메일 초안도 만들어줘.”</text>
<text id="n22-0" data-width="310" x="80" y="467.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">Request 2개</text>
<text id="n23-0" data-width="310" x="464" y="346.24" text-anchor="start" font-size="22" font-weight="700" fill="#5F6B77">잠시 뒤 / 진행 확인</text>
<text id="n24-0" data-width="310" x="464" y="385.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">“보고서는 어디까지</text>
<text id="n24-1" data-width="310" x="464" y="413.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">됐어?”</text>
<text id="n25-0" data-width="310" x="464" y="467.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">Request 1개</text>
<text id="n26-0" data-width="310" x="848" y="346.24" text-anchor="start" font-size="22" font-weight="700" fill="#5F6B77">보고서 완료 후 / 수정</text>
<text id="n27-0" data-width="310" x="848" y="385.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">“결론 부분만 짧게</text>
<text id="n27-1" data-width="310" x="848" y="413.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">바꿔줘.”</text>
<text id="n28-0" data-width="310" x="848" y="467.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">Request 1개</text>

<text id="n66-0" data-width="596" x="1260" y="377.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">서로 다른 완료 시점</text>
<text id="n67-0" data-width="596" x="1260" y="418.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">외부 접수와 답변 완료, Task 목표 완료의 구분</text>
<text id="n68-0" data-width="596" x="1260" y="537.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">후속 Request와 실행 연결</text>
<text id="n69-0" data-width="596" x="1260" y="578.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">같은 Task의 상태 조회와 새 수정 실행 연결</text>
<text id="n70-0" data-width="596" x="1260" y="697.08" text-anchor="start" font-size="24" font-weight="700" fill="#18232E">관리 책임과 복구 범위</text>
<text id="n71-0" data-width="596" x="1260" y="738.16" text-anchor="start" font-size="23" font-weight="400" fill="#5F6B77">기록과 상태의 관리 경계 및 중단 후 복구</text>

<text id="n34-0" data-width="128" x="252" y="502.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">메일 초안</text>
<rect id="n35" fill="#EFF2F5" stroke="none" stroke-width="1.7" x="464" y="477" width="310" height="32"/>
<text id="n36-0" data-width="290" x="474" y="502.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">보고서 진행 확인</text>
<rect id="n37" fill="#EFF2F5" stroke="none" stroke-width="1.7" x="848" y="477" width="310" height="32"/>
<text id="n38-0" data-width="290" x="858" y="502.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">보고서 결론 수정</text>
<text id="n39-0" data-width="310" x="80" y="526.64" text-anchor="start" font-size="17" font-weight="400" fill="#5F6B77">Downstream Agent 접수 확인 후</text>
<text id="n39-1" data-width="310" x="80" y="548.64" text-anchor="start" font-size="17" font-weight="400" fill="#5F6B77">Request 처리 완료</text>
<text id="n40-0" data-width="310" x="464" y="526.64" text-anchor="start" font-size="17" font-weight="400" fill="#5F6B77">상태 답변 후</text>
<text id="n40-1" data-width="310" x="464" y="548.64" text-anchor="start" font-size="17" font-weight="400" fill="#5F6B77">Request 처리 완료</text>
<text id="n41-0" data-width="310" x="848" y="526.64" text-anchor="start" font-size="17" font-weight="400" fill="#5F6B77">Downstream Agent 수정 접수 후</text>
<text id="n41-1" data-width="310" x="848" y="548.64" text-anchor="start" font-size="17" font-weight="400" fill="#5F6B77">Request 처리 완료</text>

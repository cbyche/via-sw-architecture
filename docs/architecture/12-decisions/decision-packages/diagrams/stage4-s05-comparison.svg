<text x="863" y="600" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">① 원음으로 VoiceProposal 요청</text>
<text x="913" y="380" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">② VoiceProposal와 보류 handle 반환</text>
<text x="568" y="385" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">③ 정규 입력과 VoiceProposal 전달</text>
<text x="103" y="590" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">④a 직접 처리 불가 시 Core 호출</text>
<text x="503" y="590" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">④b semantic proposal 반환</text>
<text x="533" y="875" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">⑤ 현재성 확인 뒤 게시 허용</text>
<text x="833" y="900" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">⑥ 보류 generation release 또는 SpeechRender</text>
<text x="633" y="820" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">⑦ 음성 결과 반환</text>
<text x="533" y="1135" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">⑧ Text 게시와 Voice 재생</text>
<text x="1797" y="385" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">① 정규 입력 전달</text>
<text x="1382" y="590" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">② 모든 요청을 Core에 호출</text>
<text x="1767" y="590" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">③ semantic proposal 반환</text>
<text x="1797" y="875" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">④ 현재성 확인 뒤 게시 허용</text>
<text x="1382" y="1100" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">⑤ 승인 Text 즉시 게시</text>
<text x="2102" y="900" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">⑥ 승인 Text로 SpeechRender 요청</text>
<text x="1897" y="820" font-size="19" fill="#1458C0" stroke="white" stroke-width="7" paint-order="stroke">⑦ 음성 결과 반환</text>
<text x="1797" y="1135" font-size="19" fill="#171717" stroke="white" stroke-width="7" paint-order="stroke">⑧ 검사 뒤 Voice 재생</text>
<text x="48" y="58" font-size="38" font-weight="700" fill="#171717">S-05  |  응답을 어느 경로에서 만들고 사용자에게 전달하는가</text>
<text x="48" y="104" font-size="22" font-weight="400" fill="#171717">공통 Component는 같은 위치 / T는 좁은 S2S 직접 경로 보유 / A는 모든 응답을 Core에서 확정</text>
<text x="48" y="1414" font-size="18" font-weight="400" fill="#171717">VIA / Stage 4 / 구조 탐색, 미채택 대안 / 구현 및 측정 결과 아님</text>
<text x="72" y="215" font-size="28" font-weight="700" fill="#171717">T  실제 reviewed target</text>
<text x="1336" y="215" font-size="28" font-weight="700" fill="#171717">A  대안 구조</text>
<text x="48" y="1345" font-size="21" font-weight="400" fill="#171717">박스: Component, 서브시스템, 논리 실행체 또는 저장소 이름 / 번호 화살표: 동작과 순서 / 검정: 공통 / 파랑: 달라지는 구조</text>
<text x="88" y="1260" font-size="18" font-weight="400" fill="#1458C0">차이: current-Turn-only 요청은 S2S VoiceProposal을 좁은 직접 경로로 처리할 수 있다.</text>
<text x="88" y="1288" font-size="18" font-weight="400" fill="#1458C0">개인 자료, 화면, Task 또는 과거 대화가 필요하면 ④의 Core 경로로 들어간다.</text>
<text x="1352" y="1260" font-size="18" font-weight="400" fill="#1458C0">차이: VoiceProposal 직접 경로와 speculative S2S 생성을 제거한다.</text>
<text x="1352" y="1288" font-size="18" font-weight="400" fill="#1458C0">S2S 직접 기능은 미지원이며, 승인 Text와 SpeechRender로 음성 응답을 만든다.</text>
</g></svg>

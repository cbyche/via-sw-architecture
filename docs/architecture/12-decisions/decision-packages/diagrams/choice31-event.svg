<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-31  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">요청 이해의 정확성을 위한 의미 구성</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">요청별 생성과 지속 의미 작업공간</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">“작년 표는 보고서에, 메일은 초안만” → “오른쪽 표”로 보완 → 발송 금지는 유지</text></g>
<g id="e7"><text x="64" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#195FBD">A  매번 완성 의미를 생성</text></g>
<g id="e8"><text x="64" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e10"><text x="180" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interaction</text><text x="180" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Manager</text></g>
<g id="e13"><text x="418" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e16"><text x="656" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request</text><text x="656" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interpreter</text></g>
<g id="e19"><text x="894" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Model Access</text></g>
<g id="e22"><text x="1132" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Response Manager</text></g>
<g id="e24"><text x="74" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">1  “작년 표는 보고서에, 메일은 초안만”</text></g>
<g id="e26"><text x="74" y="701.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">관련 질문/Task/자료와 원문으로 전체 의미 요청</text></g>
<g id="e28"><text x="74" y="801.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">2  목표/대상/조건의 완성 의미 생성 요청</text></g>
<g id="e30"><text x="74" y="901.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">P1: 대상 미해결, send=false</text></g>
<g id="e32"><text x="74" y="1001.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">검증된 P1과 미해결 대상 반환</text></g>
<g id="e34"><text x="74" y="1101.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">3  “어느 표인가요?” 게시 요청</text></g>
<g id="e36"><text x="74" y="1201.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">질문 표시/음성 전달</text></g>
<g id="e38"><text x="74" y="1301.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">실제 게시 구간 반환</text></g>
<g id="e40"><text x="74" y="1401.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">실제 질문을 본 뒤 “오른쪽 표”</text></g>
<g id="e42"><text x="74" y="1501.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">질문 + 보완 + 이전 조건으로 재해석 요청</text></g>
<g id="e44"><text x="74" y="1601.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">새 완성안 P2: source=R@7, send=false</text></g>
<g id="e46"><text x="74" y="1701.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">4  자료가 바뀌면 현재 근거로 재검증/재해석</text></g>
<g id="e48"><text x="74" y="1801.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">현재 조건을 만족하는 의미 반환</text></g>
<g id="e50"><text x="74" y="1901.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">5  현재 검사 후 명령 채택; 발송 명령은 만들지 않음</text></g>
<g id="e52"><text x="74" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#195FBD">읽을 결론: 자유로운 새 의도를 전체 맥락에서 다시 구성</text></g>
<g id="e53"><text x="74" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 앞선 조건 누락을 검증해야 함; 관련 근거 재해석</text></g>
<g id="e54"><text x="1312" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#087A53">B  의미 상태에 변경을 적용</text></g>
<g id="e55"><text x="1312" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e57"><text x="1428" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e60"><text x="1666" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request</text><text x="1666" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interpreter</text></g>
<g id="e63"><text x="1904" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Meaning Workspace</text></g>
<g id="e66"><text x="2142" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Semantic</text><text x="2142" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Constraint Engine</text></g>
<g id="e69"><text x="2380" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Response Manager</text></g>
<g id="e71"><text x="1322" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">1  같은 원문/근거 + 현재 의미/질문 요약</text></g>
<g id="e73"><text x="1322" y="709.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">목표 추가, 표 후보 L/R, 메일 발송 금지 후보</text></g>
<g id="e75"><text x="1322" y="817.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">2  현재 후보/제약/근거 버전으로 관계 계산 요청</text></g>
<g id="e77"><text x="1322" y="925.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">표 대상 미해결; 발송 금지 유지</text></g>
<g id="e79"><text x="1322" y="1033.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">3  대상 필드 질문 게시 요청</text></g>
<g id="e81"><text x="1322" y="1141.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">Interaction Manager의 실제 게시 기록 반환</text></g>
<g id="e83"><text x="1322" y="1249.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">실제 질문을 본 뒤 같은 “오른쪽 표”</text></g>
<g id="e85"><text x="1322" y="1357.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">NARROW(q1, R@7, expected=12)</text></g>
<g id="e87"><text x="1322" y="1465.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">대상 후보만 제한; send=false는 변경하지 않음</text></g>
<g id="e89"><text x="1322" y="1573.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">관계 해 또는 충돌/미해결 반환</text></g>
<g id="e91"><text x="1322" y="1681.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">4  자료 변경: 의존 후보 무효화/재조회/재평가</text></g>
<g id="e93"><text x="1322" y="1789.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">현재 의미와 근거 버전 반환</text></g>
<g id="e95"><text x="1322" y="1897.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">5  현재 검사 후 명령 채택; 외부 승인과 의미 해는 별개</text></g>
<g id="e97"><text x="1322" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#087A53">읽을 결론: 명시한 조건을 유지하며 필요한 관계만 갱신</text></g>
<g id="e98"><text x="1322" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 변경 언어/의존성 설계; 표현 밖 뜻은 질문</text></g>
<g id="e99"><text x="64" y="2219.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">생략한 공통 연동: 추론은 Model Access의 한 벌 Omni; 업무 실행은 Task Manager/Agent Gateway가 Downstream Agent에 위임.</text></g>
<g id="e100"><text x="64" y="2259.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">실선 = 요청/전달, 점선 = 결과. 별도 언급 없는 참여자는 논리 책임. 시간 간격은 성능 수치가 아닌 사건 순서. 수작업 설계 추적, 미측정.</text></g>
</g></svg>

<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-31  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">요청 이해의 정확성을 위한 의미 구성</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">요청별 생성과 지속 의미 작업공간</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">같은 사건의 1~5단계 / 본문 §4와 대응 / 시간축은 측정 비율이 아님</text></g>
<g id="e7"><text x="64" y="261.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">공통 입력과 끝점은 유지한다. 각 칸은 사건 설명이며 Component 또는 process 배치를 뜻하지 않는다.</text></g>
<g id="e8"><text x="64" y="328.0" text-anchor="start" font-size="28" font-weight="700" fill="#195FBD">A  요청별 완성 의미 생성</text></g>
<g id="e11"><text x="92" y="420.0" text-anchor="start" font-size="27" font-weight="700" fill="#195FBD">1. 같은 복합 요청과 근거</text></g>
<g id="e12"><text x="92" y="481" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Interaction Manager → Request Controller: 원문 / Context</text><text x="92" y="513" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Manager와 Task Manager: 근거 반환</text></g>
<g id="e16"><text x="92" y="710.0" text-anchor="start" font-size="27" font-weight="700" fill="#195FBD">2. 의미 생산</text></g>
<g id="e17"><text x="92" y="771" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Interpreter → [요청] / ← [반환] Model Access: 전체 관계 생성</text><text x="92" y="803" text-anchor="start" font-size="23" font-weight="400" fill="#263445">후 검사</text></g>
<g id="e21"><text x="92" y="1000.0" text-anchor="start" font-size="27" font-weight="700" fill="#195FBD">3. 표 확인 질문과 “오른쪽 것” 답변</text></g>
<g id="e22"><text x="92" y="1061" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Response Manager: 질문 / 새 답변과 앞 대화로 완성 의미 재생성</text></g>
<g id="e26"><text x="92" y="1290.0" text-anchor="start" font-size="27" font-weight="700" fill="#195FBD">4. 자료와 Task 변경, 최종 검사</text></g>
<g id="e27"><text x="92" y="1351" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Controller: 현재 근거 재검증 / 필요한 해석 재실행</text></g>
<g id="e31"><text x="92" y="1580.0" text-anchor="start" font-size="27" font-weight="700" fill="#195FBD">5. 외부 인계와 사용자 반환</text></g>
<g id="e32"><text x="92" y="1641" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Task Manager → Agent Gateway → Agent: 확정 명령 / 실제 결과 반환</text></g>
<g id="e33"><text x="84" y="1892.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">같은 정상 사건의 흐름. 실패/철회/재시작은 본문 §6.</text><text x="84" y="1921.7" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">표시/생성 완료와 실제 청취, 접수와 업무 완료를 구별한다.</text><text x="84" y="1951.4" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">구조의 유리한 조건과 반증은 본문 §8~9에서 검토한다.</text></g>
<g id="e34"><text x="1312" y="328.0" text-anchor="start" font-size="28" font-weight="700" fill="#087A53">B  지속 의미 작업공간</text></g>
<g id="e37"><text x="1340" y="420.0" text-anchor="start" font-size="27" font-weight="700" fill="#087A53">1. 같은 복합 요청과 근거</text></g>
<g id="e38"><text x="1340" y="481" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Interpreter → Meaning Workspace: 의미 변경 후보 / 같은 자료와</text><text x="1340" y="513" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Task 사실</text></g>
<g id="e42"><text x="1340" y="710.0" text-anchor="start" font-size="27" font-weight="700" fill="#087A53">2. 의미 생산</text></g>
<g id="e43"><text x="1340" y="771" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Meaning Workspace → [요청] / ← [반환] Semantic Constraint</text><text x="1340" y="803" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Engine: 후보/제약에서 해 또는 미해결</text></g>
<g id="e47"><text x="1340" y="1000.0" text-anchor="start" font-size="27" font-weight="700" fill="#087A53">3. 표 확인 질문과 “오른쪽 것” 답변</text></g>
<g id="e48"><text x="1340" y="1061" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Meaning Workspace: 실제 게시 질문에 변경 후보 연결 / 제약 재평가</text></g>
<g id="e52"><text x="1340" y="1290.0" text-anchor="start" font-size="27" font-weight="700" fill="#087A53">4. 자료와 Task 변경, 최종 검사</text></g>
<g id="e53"><text x="1340" y="1351" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Meaning Workspace: 의존 후보 무효화와 재조회 / Request Controller 최종</text><text x="1340" y="1383" text-anchor="start" font-size="23" font-weight="400" fill="#263445">검사</text></g>
<g id="e57"><text x="1340" y="1580.0" text-anchor="start" font-size="27" font-weight="700" fill="#087A53">5. 외부 인계와 사용자 반환</text></g>
<g id="e58"><text x="1340" y="1641" text-anchor="start" font-size="23" font-weight="400" fill="#263445">동일. 의미 해의 생성과 실제 실행 접수/완료는 구별</text></g>
<g id="e59"><text x="1332" y="1892.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">같은 정상 사건의 흐름. 실패/철회/재시작은 본문 §6.</text><text x="1332" y="1921.7" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">표시/생성 완료와 실제 청취, 접수와 업무 완료를 구별한다.</text><text x="1332" y="1951.4" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">구조의 유리한 조건과 반증은 본문 §8~9에서 검토한다.</text></g>
<g id="e61"><text x="64" y="2157.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">검정 = 공통 / 파랑 = A 고유 / 초록 = B 고유 / 색은 우위가 아님</text></g>
<g id="e62"><text x="2496" y="2156.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달 / 점선 → 반환/확인</text></g>
<g id="e63"><text x="64" y="2193.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">제목 상자 = Component / 내부 둥근 상자 = Module / 원통 = 저장 / 접힌 종이 = 자료 / 육각형 = 연동 대상</text></g>
<g id="e64"><text x="64" y="2229.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">실제 소요 시간/성능을 표시하지 않는다. 요청과 반환의 송수신 책임은 각 단계와 본문 표에 명시한다.</text></g>
</g></svg>

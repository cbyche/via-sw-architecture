<rect x="1440" y="490" width="340" height="132" rx="16" fill="#FFF1E8" stroke="#EA580C" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="537.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Agent Execution</text><text x="1610.0" y="562.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">외부 실행 상태의 VIA projection</text><text x="1610.0" y="582.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Task 하나에 후속 실행 0..N</text></g>
<rect x="90" y="765" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="812.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">T1 · 개념을 설명해줘</text><text x="260.0" y="837.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">R1 직접 응답 · Task 없음</text><text x="260.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">전달된 답변은 후속 참조 가능</text></g>
<rect x="540" y="765" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="812.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">T2 · 그걸 파일로 만들어</text><text x="710.0" y="837.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">새 R2 → 새 Task A</text><text x="710.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Agent 실행 E1과 결과 v1 연결</text></g>
<rect x="990" y="765" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="812.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">T3 · 결론을 추가해줘</text><text x="1160.0" y="837.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">새 R3 → 기존 Task A</text><text x="1160.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">완료 실행이면 후속 E2 연결</text></g>
<rect x="1440" y="765" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="812.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">새 Conversation</text><text x="1610.0" y="837.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">기존 Task A는 계속 유지</text><text x="1610.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">원래 대화 + 명시적 참조로 접근</text></g>
<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="935" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Clarification 답변은 새 Turn이어도 원래 Request를 보완한다. 새 목표·새 결과물은 기존 결과를 참조하는 새 Task다.</text>
<text x="70" y="1010" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Request의 처리 종료, Task의 업무 완료, Execution 종료, Voice 연결 종료는 서로 다른 사건이다.</text>
<text x="70" y="1045" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Command / Event / Artifact는 Task·Execution·Request identity와 version으로 결합한다. Agent의 thread ID가 VIA identity를 대신하지 않는다.</text>

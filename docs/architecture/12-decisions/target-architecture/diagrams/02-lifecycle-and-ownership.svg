<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="537.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Voice Connection</text><text x="260.0" y="562.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Interaction Manager 소유 · 연결 session</text><text x="260.0" y="582.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">같은 대화에 여러 번 재연결 가능</text></g>
<rect x="540" y="490" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="537.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Pending Interaction</text><text x="710.0" y="562.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Controller 소유 · 질문 identity</text><text x="710.0" y="582.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">새 Turn의 답을 기존 Request에 결합</text></g>

<rect width="1900" height="1490" fill="#FFFFFF"/>
<text x="48" y="43" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="750" fill="#172033">공유 Omni — 의미 해석 중에도 듣고, 두 역할을 함께 진행</text>
<text x="48" y="70" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">PROPOSED · 행 A는 입력 보호 경로 · B는 모델 공유 관계 · C는 계산 교대 예시 · 수치형 기한은 아직 미확정</text>
<rect x="45" y="150" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="178" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">A · INPUT — 추론 결과를 기다리지 않고 수신·인식을 계속한다</text>
<rect x="45" y="435" width="1810" height="410" rx="18" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="63" y="463" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">B · SHARED MODEL — 별도 session / KV / 권한, 같은 가중치</text>
<rect x="45" y="875" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="903" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">C · ACCELERATOR — 전체 호출을 직렬 잠그지 않고 짧은 계산 단위로 교대한다</text>

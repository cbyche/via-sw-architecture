<g font-family="Inter, Arial, sans-serif"><text x="900.0" y="613.5" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Model Access scheduler</text><text x="900.0" y="638.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">VOICE 연산·KV 예약</text><text x="900.0" y="658.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">semantic 최소 진행량 + deadline</text><text x="900.0" y="678.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">긴 prefill / encoder 작업 상한</text><text x="900.0" y="698.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">취소·admission·bounded microbatch</text></g>
<rect x="1440" y="530" width="340" height="245" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="613.5" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Omni weights × 1</text><text x="1610.0" y="638.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Thinker 약 10B + 주변 모듈</text><text x="1610.0" y="658.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">두 역할의 Context는 합치지 않음</text><text x="1610.0" y="678.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">모델 장애는 두 역할에 동시 영향</text><text x="1610.0" y="698.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">ASR의 자원 비용은 별도</text></g>
<rect x="90" y="940" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="987.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Voice 계산</text><text x="260.0" y="1012.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">새 audio chunk encode / prefill</text><text x="260.0" y="1032.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">필요한 decode · 입력 기한 확인</text></g>
<rect x="540" y="940" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="987.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Semantic 계산</text><text x="710.0" y="1012.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">제한된 prefill chunk / decode</text><text x="710.0" y="1032.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">긴 요약이 장치를 독점하지 않음</text></g>
<rect x="990" y="940" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="987.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Voice 계산</text><text x="1160.0" y="1012.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">다음 음성 chunk 처리</text><text x="1160.0" y="1032.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">출력 중 새 발화면 generation 취소</text></g>
<rect x="1440" y="940" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="987.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Semantic / 여유 작업</text><text x="1610.0" y="1012.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">기아 방지 · 남은 deadline 확인</text><text x="1610.0" y="1032.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">background는 여유 자원만 사용</text></g>
<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="385" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">파랑 점선: InputStarted / hold는 ASR·Omni 완료를 기다리지 않는다. 같은 원음은 VOICE session에도 전달하며 ASR에는 의미 확정 권한이 없다.</text>
<text x="90" y="1110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">순서와 시간 비율은 고정하지 않는다. 동시 활성 session을 batch 또는 교대로 진행하며 실제 kernel 병렬성·즉시 선점을 가정하지 않는다.</text>
<text x="90" y="1190" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">계속 말하는 동안: ASR은 별도 예산으로 진행 · Omni Voice도 기한 내 진행 · semantic이 무한히 밀리지 않을 용량이 필요하다.</text>
<text x="90" y="1240" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#526178">포화 대응: background 중단 → 긴 신규 추론 제한 → 확인된 상태 UI 안내. 입력 유실·기한 초과는 기능 실패로 드러낸다.</text>
<text x="90" y="1290" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#526178">Capture / recognition / Omni Voice 세 단계의 진행을 구분한다. 원음과 근거를 누락시키거나 잘못된 이전 결과를 게시하지 않는다.</text>
<text x="90" y="1340" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#526178">추가 ASR · 이중 음성 처리 · 역할별 KV · 공유 장애 비용이 있다. 이 설계의 품질·latency 우세는 아직 검증되지 않았다.</text>
<text x="90" y="1410" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">색은 책임 구분이며 우선순위 점수가 아니다. ASR과 speech 역할은 다른 기능; 실시간 예약도 의미 확정·dispatch 권한을 주지 않는다.</text>

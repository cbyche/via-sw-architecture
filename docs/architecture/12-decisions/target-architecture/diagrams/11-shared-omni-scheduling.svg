<rect x="90" y="675" width="340" height="130" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="721.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">SEMANTIC session</text><text x="260.0" y="746.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">목표·referent·Task·handling 제안</text><text x="260.0" y="766.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">응답 구성 / 기억 요약은 별도 job</text></g>

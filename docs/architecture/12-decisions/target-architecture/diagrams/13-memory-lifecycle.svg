<rect x="540" y="1070" width="340" height="132" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="1117.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">최종 파일 rename</text><text x="710.0" y="1142.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">완성된 blob identity 확보</text><text x="710.0" y="1162.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">DB 참조 전 orphan일 수 있음</text></g>
<rect x="990" y="1070" width="340" height="132" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="1117.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">DB manifest commit</text><text x="1160.0" y="1142.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">owner · scope · expiry · digest</text><text x="1160.0" y="1162.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">이 시점부터 참조 가능</text></g>
<rect x="1440" y="1070" width="340" height="132" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="1117.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">복구 / 회수</text><text x="1610.0" y="1142.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">누락은 EVIDENCE_GAP</text><text x="1610.0" y="1162.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">orphan · cleanup intent 재처리</text></g>
<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="385" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">진행 중 업무·대기 질문·미전달 결과는 cache가 아니다. 단기·중기·장기는 의미 수명이며 RAM·파일·DB와 구분한다.</text>
<text x="90" y="670" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">부정·수치·권한·대상·업무 상태는 정확한 기록을 유지한다. source 삭제 뒤 파생 요약만 남겨 사실처럼 사용하지 않는다.</text>
<text x="90" y="955" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">재시작은 tombstone을 먼저 적용한다. 과거 대화나 KV에서 삭제한 기억을 자동 복원하지 않는다.</text>
<text x="90" y="1240" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">삭제는 반대로 DB tombstone과 cleanup intent를 먼저 기록한다. 참조가 있으나 파일이 없으면 정상 evidence로 읽지 않는다.</text>
<text x="90" y="1335" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">기본값: raw는 RAM · 요청 evidence cache 24시간 · 내용 없는 진단 로그 7일 · 대화/Task와 허용 기억은 명시 삭제.</text>
<text x="90" y="1380" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#526178">용량 상한을 넘기면 정리·재조회·입력 범위 안내로 처리한다. 활성 원본을 몰래 버리거나 무한히 저장하지 않는다.</text>
<text x="90" y="1460" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">보관 설정은 변경 가능하며 QA target이 아니다. 주요 설계 계약: memory-and-context-lifecycle.md</text>
<rect x="48" y="92" width="172" height="25" rx="8" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.5"/>

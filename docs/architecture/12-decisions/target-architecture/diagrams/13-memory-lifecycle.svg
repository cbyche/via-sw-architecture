<rect x="1440" y="785" width="340" height="132" rx="16" fill="#FDECEC" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">파일 정리 · 확인</text><text x="1610.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">PURGE_PENDING → 확인 상태</text><text x="1610.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">외부 복사본 삭제를 약속하지 않음</text></g>
<rect x="90" y="1070" width="340" height="132" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>

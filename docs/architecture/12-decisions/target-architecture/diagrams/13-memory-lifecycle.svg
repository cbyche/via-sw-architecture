<rect x="90" y="785" width="340" height="132" rx="16" fill="#FDECEC" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">삭제 대상 확정</text><text x="260.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Request Controller → Context Manager</text><text x="260.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">대화 삭제와 기억 삭제 구분</text></g>

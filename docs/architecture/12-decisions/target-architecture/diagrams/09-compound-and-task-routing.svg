<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1130" viewBox="0 0 1900 1130" role="img" aria-labelledby="title desc">
<title id="title">복합 요청 — 사용자가 말한 관계만 실행으로 연결</title>
<desc id="desc">PROPOSED · “자료를 요약한 뒤 그 요약을 김대리에게 보내고, 발표자료는 계속 만들어”</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
<marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0891B2"/></marker>
<marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7C3AED"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EA580C"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect width="1900" height="1130" fill="#FFFFFF"/>
<text x="48" y="43" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="750" fill="#172033">복합 요청 — 사용자가 말한 관계만 실행으로 연결</text>
<text x="48" y="70" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">PROPOSED · “자료를 요약한 뒤 그 요약을 김대리에게 보내고, 발표자료는 계속 만들어”</text>
<rect x="45" y="150" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="178" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">A · DATA DEPENDENCY — Controller의 Request Graph가 해제 조건을 소유</text>
<rect x="45" y="435" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="463" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">B · INDEPENDENT TASK — 위 요청의 대기·실패가 별도 업무를 막지 않는다</text>
<rect x="45" y="720" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="748" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">C · CONDITIONAL — “3시가 비었으면 일정을 만들고, 아니면 알려줘”</text>
<polyline points="430,281.0 540,281.0" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
<polyline points="880,281.0 990,281.0" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
<polyline points="1330,281.0 1440,281.0" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-purple)"/>
<polyline points="430,566.0 540,566.0" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<polyline points="880,566.0 990,566.0" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<polyline points="1330,566.0 1440,566.0" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<polyline points="430,851.0 540,851.0" fill="none" stroke="#D97706" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<polyline points="880,851.0 990,851.0" fill="none" stroke="#D97706" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<polyline points="1330,851.0 1440,851.0" fill="none" stroke="#D97706" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
<rect x="90" y="215" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="262.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">R1 · 자료 요약</text><text x="260.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">범위가 명확하면 VIA 직접 처리</text><text x="260.0" y="307.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">조사·업무 분석이면 Agent 위임</text></g>
<rect x="540" y="215" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="262.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">결과 version 고정</text><text x="710.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">실제 summary ID·내용 version</text><text x="710.0" y="307.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">실패 / 미완료이면 R2를 보류</text></g>
<rect x="990" y="215" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="262.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">R2 · 전송 준비</text><text x="1160.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">수신자·허용 Context·최신 권한</text><text x="1160.0" y="307.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">입력 결과 version으로 재검증</text></g>
<rect x="1440" y="215" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="262.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Task + Agent Command</text><text x="1610.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">해제 key로 중복 dispatch 방지</text><text x="1610.0" y="307.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">실제 발송·도구 계획은 Agent 책임</text></g>
<rect x="90" y="500" width="340" height="132" rx="16" fill="#E9F9F3" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">R3 · 발표자료 계속</text><text x="260.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">기존 Task B와 Execution 연결</text><text x="260.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">새 목표로 잘못 분리하지 않음</text></g>
<rect x="540" y="500" width="340" height="132" rx="16" fill="#E9F9F3" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">업무 상태 확인</text><text x="710.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">이미 실행 중이면 불필요한 재시작 없음</text><text x="710.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">필요한 제어만 해당 Agent에 전달</text></g>
<rect x="990" y="500" width="340" height="132" rx="16" fill="#E9F9F3" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">별도 진행·결과</text><text x="1160.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">다른 Agent 또는 같은 Agent여도</text><text x="1160.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Task·Execution identity로 구분</text></g>
<rect x="1440" y="500" width="340" height="132" rx="16" fill="#E9F9F3" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">원래 대화로 통지</text><text x="1610.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Task B 결과임을 명시</text><text x="1610.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">전체 요청의 부분 완료를 구분</text></g>
<rect x="90" y="785" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">조건 근거 확보</text><text x="260.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">일정의 source revision·조회 시각</text><text x="260.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">업무 분석 조건이면 Agent가 판단</text></g>
<rect x="540" y="785" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">참 / 거짓 / 불명</text><text x="710.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">불명을 거짓으로 간주하지 않음</text><text x="710.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">모호하면 추가 근거·질문</text></g>
<rect x="990" y="785" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">선택한 분기만 해제</text><text x="1160.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">생성은 Agent / 충돌 안내는 VIA</text><text x="1160.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">dependency version·조건 사실 기록</text></g>
<rect x="1440" y="785" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">실행 전 재확인</text><text x="1610.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Agent가 외부 precondition 검증</text><text x="1610.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">일정 변경 경쟁 시 보류·재검증</text></g>
<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="385" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">후속 node의 목표는 미리 이해할 수 있어도 실제 결과가 생기기 전에 결과 의존 command를 확정·전송하지 않는다.</text>
<text x="90" y="670" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Task 질문에 “응”이라고 답해도 질문 ID·Request·Execution·revision을 유일하게 결합할 수 없으면 재확인한다.</text>
<text x="90" y="955" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">VIA는 명시된 조건·순서·결과 의존을 보존한다. 업무 내부 계획이나 Tool 단위 workflow를 새로 만들지 않는다.</text>
<text x="90" y="1040" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Capability 불충족·접수 불명 상태에서 다른 Agent로 조용히 재위임하지 않는다. 기존 실행 확인과 사용자 목표·권한을 다시 맞춘다.</text>
<rect x="48" y="92" width="172" height="25" rx="8" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="134.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563EB">입력·응답</text>
<rect x="233" y="92" width="172" height="25" rx="8" fill="#F3ECFF" stroke="#7C3AED" stroke-width="1.5"/>
<text x="319.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#7C3AED">의미·요청</text>
<rect x="418" y="92" width="172" height="25" rx="8" fill="#E6F8FB" stroke="#0891B2" stroke-width="1.5"/>
<text x="504.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#0891B2">Context·근거</text>
<rect x="603" y="92" width="172" height="25" rx="8" fill="#FFF8E1" stroke="#D97706" stroke-width="1.5"/>
<text x="689.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#D97706">정책·판정</text>
<rect x="788" y="92" width="172" height="25" rx="8" fill="#E9F9F3" stroke="#059669" stroke-width="1.5"/>
<text x="874.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#059669">업무·상태</text>
<rect x="973" y="92" width="172" height="25" rx="8" fill="#FFF1E8" stroke="#EA580C" stroke-width="1.5"/>
<text x="1059.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#EA580C">명령·Agent</text>
<rect x="1158" y="92" width="172" height="25" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
<text x="1244.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569">저장·의존성</text>
<rect x="1343" y="92" width="172" height="25" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1.5"/>
<text x="1429.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#DC2626">중단·실패·불확실</text>
<text x="1862" y="1110" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94A3B8">Editable source: 09-compound-and-task-routing.drawio</text>
</svg>

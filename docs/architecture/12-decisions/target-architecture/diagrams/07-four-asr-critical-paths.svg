<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="385" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">QA-19는 frozen QA-11/12 field의 중복 없는 micro-average. 추가 Task binding·continuity 검사는 별도 회귀 의미를 유지한다.</text>
<text x="90" y="670" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">입력 중 사전 준비는 종료 후 중복 합산하지 않는다. Barge-in QA-04는 별도 회귀이며 QA-09 평균에 넣지 않는다.</text>
<text x="90" y="955" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Adapter가 있어도 canonical 계약 자체가 달라지면 여러 owner가 바뀔 수 있다. 그림의 박스 개수는 점수가 아니다.</text>
<text x="90" y="1240" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">확인 불가를 성공으로 세지 않는다. Safety·evidence qualification과 QA-41 memory 진단은 별도로 보존한다.</text>
<text x="90" y="1340" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">이후 Decision Package에서는 네 축의 applicability와 trade-off를 각각 보고한다. 한 축으로 미리 후보를 제거하거나 가중 합산하지 않는다.</text>

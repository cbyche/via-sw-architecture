<rect x="1440" y="715" width="340" height="132" rx="16" fill="#FDECEC" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="762.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">미확정 범위 보존</text><text x="1610.0" y="787.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">후보·시각 오차가 해소되지 않으면</text><text x="1610.0" y="807.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">추가 조회 / clarification / 보류</text></g>
<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="930" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">발화 시작 전부터 유지된 선택도 유효 구간으로 참조한다. 관련 구간은 pin하고, 보관 한도 초과·capture gap은 명시한다.</text>
<text x="90" y="972" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Timeline은 Interaction Manager, source 후보·조회 receipt는 Context Manager, 최종 referent와 dependency read set은 Request Controller가 소유한다.</text>
<text x="90" y="1012" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">늦은 근거로 commit을 덮어쓰지 않는다. 전송 전이면 재검증하고, 전송 뒤면 실행 상태를 확인한 정정으로 처리한다.</text>
<text x="90" y="1052" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">수집은 OS/UI 사건 + 제한된 sampling · 발화 구간 pin · partial token마다 capture·Context 조회·semantic 호출하지 않음</text>

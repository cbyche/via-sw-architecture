<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="262.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Response Manager</text><text x="1610.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">publication 기록 후 handle release</text><text x="1610.0" y="307.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">IM에서만 실제 표시·재생</text></g>
<rect x="90" y="500" width="340" height="132" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">게시할 사실·질문</text><text x="260.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Controller가 identity·scope admission</text><text x="260.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Task event는 새 발화 없이 도착</text></g>
<rect x="540" y="500" width="340" height="132" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">필요한 응답 구성</text><text x="710.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Response Manager → Model Access</text><text x="710.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">template / Omni 해석·음성 역할</text></g>
<rect x="990" y="500" width="340" height="132" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Publication outbox</text><text x="1160.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">내용·source·version·출력 세대</text><text x="1160.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">확정 payload와 생성 내용 검사</text></g>
<rect x="1440" y="500" width="340" height="132" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Interaction Manager</text><text x="1610.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">상세 Text 표시 · Voice는 차례 대기</text><text x="1610.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">채널별 실제 전달 receipt 반환</text></g>
<rect x="90" y="785" width="340" height="132" rx="16" fill="#FDECEC" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">새 발화 감지</text><text x="260.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">acoustic onset과 감지 시각 구분</text><text x="260.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Interaction Manager의 local event</text></g>
<rect x="540" y="785" width="340" height="132" rx="16" fill="#FDECEC" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">즉시 재생 중단</text><text x="710.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">output epoch 증가·buffer 폐기</text><text x="710.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">늦은 audio·이전 release 거절</text></g>
<rect x="990" y="785" width="340" height="132" rx="16" fill="#FDECEC" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">중단 사실 전달</text><text x="1160.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Response에 실제 audible 범위</text><text x="1160.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Controller에 새 입력·hold event</text></g>
<rect x="1440" y="785" width="340" height="132" rx="16" fill="#FDECEC" stroke="#DC2626" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">새 요청 해석</text><text x="1610.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">정정 / 새 질문 / 업무 취소 구분</text><text x="1610.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">재개 의도가 불명확할 때만 확인</text></g>
<rect x="90" y="1070" width="340" height="132" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="1117.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Agent 결과 확인</text><text x="260.0" y="1142.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Task·Controller가 상태·결과 연결</text><text x="260.0" y="1162.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">실패·완료·입력 필요를 보존</text></g>
<rect x="540" y="1070" width="340" height="132" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="1117.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">상세 Text 게시</text><text x="710.0" y="1142.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">결과·실패 항목·근거·파일 링크</text><text x="710.0" y="1162.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Voice 생성·대기를 기다리지 않음</text></g>
<rect x="990" y="1070" width="340" height="132" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="1117.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Response 발화 대기열</text><text x="1160.0" y="1142.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">사용자 발화 중 모든 음성 알림 보류</text><text x="1160.0" y="1162.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">종료 뒤 새 입력과 충돌 여부 확인</text></g>
<rect x="1440" y="1070" width="340" height="132" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="1117.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">짧은 Voice 요약</text><text x="1610.0" y="1142.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">IM이 재생 직전 차례·epoch 검사</text><text x="1610.0" y="1162.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">중요한 실패·불확실성 생략 금지</text></g>
<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="385" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">단순 첫 질문도 허용한다. 과거 대화 지칭·자료·Task 해석은 Core 책임이며 S2S에 Context 탐색·업무 planning을 붙이지 않는다.</text>
<text x="90" y="670" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">상세 Text와 Voice 요약은 같은 문자열이 아니다. 대상·상태·중요한 실패는 일치시키고 Voice 요약문과 audio를 연결한다.</text>
<text x="90" y="955" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Core 장애·포화 중에도 로컬 stop은 유지한다. 재시작 후 확인되지 않은 음성 구간은 UNKNOWN이며 자동으로 재생하지 않는다.</text>
<text x="90" y="1240" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">새 입력의 관계·제어를 먼저 반영하고 현재 답변 → 중요 결과 → 일반 진행 순서로 전달한다. 다시 말하면 즉시 멈춘다.</text>
<text x="90" y="1340" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Text 표시와 Voice 요약의 실제 전달을 따로 기록한다. “방금 말한 것”은 상세 Text 전체가 아닌 실제 들려준 내용에서 찾는다.</text>
<rect x="48" y="92" width="172" height="25" rx="8" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.5"/>

<rect width="1900" height="1150" fill="#FFFFFF"/>
<text x="48" y="43" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="750" fill="#172033">응답 생성·게시·중단 — 한 요청에는 하나의 출력 소유권</text>
<text x="48" y="70" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">PROPOSED · 박스는 실행 단계 · 같은 Component가 여러 경로에 다시 등장해도 복제본이 아니다</text>
<rect x="45" y="150" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="178" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">A · S2S 직접 응답 — 생성과 게시 허가를 분리</text>
<rect x="45" y="435" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="463" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">B · CORE / AGENT 응답 — 확인된 사실과 질문을 같은 출력 계약으로 전달</text>
<rect x="45" y="720" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="748" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">C · BARGE-IN — 의미 해석과 Agent 취소를 기다리지 않는 로컬 경로</text>

<title id="title">응답 생성·게시·중단 — 한 요청에는 하나의 출력 소유권</title>
<desc id="desc">PROPOSED · 박스는 실행 단계 · 화면 상세와 Voice 요약은 같은 사실에서 별도로 구성한다</desc>

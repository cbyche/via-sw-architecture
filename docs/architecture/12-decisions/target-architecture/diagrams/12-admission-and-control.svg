<rect x="90" y="215" width="340" height="132" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="262.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">현재 Voice 질문</text><text x="260.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">원음 + final 전사만 제공</text><text x="260.0" y="307.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">대화 · 화면 · Task 이력 없음</text></g>
<rect x="540" y="215" width="340" height="132" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="262.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Omni VoiceProposal</text><text x="710.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">일반 개념 / 안정된 일반 설명</text><text x="710.0" y="307.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">dependency flags + text / audio</text></g>
<rect x="990" y="215" width="340" height="132" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="262.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Request Controller 허용 검사</text><text x="1160.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">전사 · 질문 focus · revision 검사</text><text x="1160.0" y="307.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">DIRECT_VOICE owner를 한 번 확정</text></g>
<rect x="1440" y="215" width="340" height="132" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="252.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">응답 전달</text><text x="1610.0" y="277.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Response Manager → Interaction Manager</text><text x="1610.0" y="297.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">내구 publication + output epoch</text><text x="1610.0" y="317.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">승인 단위만 표시 · 재생</text></g>
<rect x="90" y="500" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">직접 경로 미허용</text><text x="260.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">speculative audio 폐기</text><text x="260.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">입력과 수집 근거는 유지</text></g>
<rect x="540" y="500" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">같은 Request → CORE</text><text x="710.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">새 Request로 복제하지 않음</text><text x="710.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">이전 route / generation 차단</text></g>
<rect x="990" y="500" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="537.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">의미 해석·근거 보완</text><text x="1160.0" y="562.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Request Interpreter + Context Manager</text><text x="1160.0" y="582.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">총 2회 안에서 해석 · 보완</text><text x="1160.0" y="602.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">형식 repair도 같은 예산 사용</text></g>
<rect x="1440" y="500" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Request Controller 확정</text><text x="1610.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">직접 응답 / 질문 / Agent 위임</text><text x="1610.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">불충분한 근거는 commit하지 않음</text></g>
<rect x="90" y="785" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="822.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">새 발화 시작</text><text x="260.0" y="847.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Interaction Manager의 local stop</text><text x="260.0" y="867.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">output epoch 증가</text><text x="260.0" y="887.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Request Controller에 InputStarted / hold</text></g>
<rect x="540" y="785" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">State Store transaction</text><text x="710.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">hold · admission · command epoch</text><text x="710.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">PENDING → DISPATCHING CAS</text></g>
<rect x="990" y="785" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">전송 전 / 전송 후</text><text x="1160.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">hold 선행: 미전송 유지</text><text x="1160.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">전송 선행: 상태 조회 · 제어</text></g>
<rect x="1440" y="785" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">새 입력의 의미 반영</text><text x="1610.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">정정 대상만 supersede / cancel</text><text x="1610.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">무관한 Task는 계속 유지</text></g>
<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="385" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Confidence 하나로 허용하지 않는다. 모델의 분류 오류는 남는 위험이며 같은 모델의 자기 판단은 독립 검증이 아니다.</text>
<text x="90" y="670" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Core 인계는 S2S agent runtime을 추가하는 경로가 아니다. 사용자 입력을 다시 받거나 답변을 두 번 게시하지 않는다.</text>
<text x="90" y="955" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">물리적인 발화 시작과 host hold 기록은 같은 시각이 아니다. 이미 나간 Action을 막았거나 되돌렸다고 주장하지 않는다.</text>
<text x="90" y="1050" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" fill="#172033">짧은 “응”은 실제 제시한 질문의 ID · Task · Execution · revision에 유일하게 연결될 때만 적용한다.</text>
<text x="90" y="1095" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="500" fill="#526178">여러 질문이 경쟁하면 질문 대상을 확인한다. 침묵 · 오래된 승인 · 다른 대화의 답은 실행 허가가 아니다.</text>
<text x="90" y="1160" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">주요 설계 완성안 · 판정 정확도와 실제 runtime 성능은 미측정 · 자세한 상태 전이는 control-and-lifecycle.md</text>

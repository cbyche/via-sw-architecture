<rect width="1900" height="1240" fill="#FFFFFF"/>
<text x="48" y="43" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="750" fill="#172033">판단과 제어 — 좁은 직접 응답, 한 번의 경로 확정</text>
<text x="48" y="70" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">PROPOSED · 행은 서로 다른 조건의 실행 흐름 · route owner와 revision을 Request Controller가 확정 · 모델은 제안만 반환</text>
<rect x="45" y="150" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="178" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">A · DIRECT — 현재 질문만으로 답할 수 있고 모든 host 조건을 통과한 경우</text>
<rect x="45" y="435" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="463" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">B · CORE — 제외 조건 · unknown · 불일치 · 시간 초과 중 하나라도 있는 경우</text>
<rect x="45" y="720" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="748" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">C · 정정 / 취소 — 같은 대화의 미전송 업무와 실제 전송 경계를 구분</text>
<polyline points="430,281.0 540,281.0" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<polyline points="880,281.0 990,281.0" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-blue)"/>

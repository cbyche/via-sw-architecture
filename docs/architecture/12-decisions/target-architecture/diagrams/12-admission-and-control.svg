<title id="title">판단과 제어 — 좁은 직접 응답, 한 번의 경로 확정</title>
<desc id="desc">PROPOSED · 행은 서로 다른 조건의 실행 흐름 · route owner와 revision을 Request Controller가 확정 · 모델은 제안만 반환</desc>

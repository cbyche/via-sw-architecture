<rect width="1900" height="1130" fill="#FFFFFF"/>
<text x="48" y="43" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="750" fill="#172033">내구 경계 — 명령·결과·알림 사이의 유실을 닫는다</text>
<text x="48" y="70" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">REVIEWED BASELINE · 각 행은 다른 transaction / 전달 경로 · 네트워크와 물리적 재생은 DB transaction 밖</text>
<rect x="45" y="150" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="178" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">A · COMMAND — Request Controller의 admission → Task Manager의 intent → Agent Gateway 전송</text>
<rect x="45" y="435" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="463" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">B · EVENT — Agent source → Agent Gateway inbox → Task state → Conversation에 전달</text>
<rect x="45" y="720" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="748" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">C · PUBLICATION — durable intent와 실제 사용자 전달은 다른 사실</text>

<rect x="788" y="92" width="172" height="25" rx="8" fill="#E9F9F3" stroke="#059669" stroke-width="1.5"/>
<text x="874.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#059669">업무·상태</text>
<rect x="973" y="92" width="172" height="25" rx="8" fill="#FFF1E8" stroke="#EA580C" stroke-width="1.5"/>
<text x="1059.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#EA580C">명령·Agent</text>
<rect x="1158" y="92" width="172" height="25" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1.5"/>
<text x="1244.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#475569">저장·의존성</text>
<rect x="1343" y="92" width="172" height="25" rx="8" fill="#FDECEC" stroke="#DC2626" stroke-width="1.5"/>
<text x="1429.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#DC2626">중단·실패·불확실</text>
<text x="1862" y="1120" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="11" fill="#94A3B8">Editable source: 10-context-policy-and-memory.drawio</text>

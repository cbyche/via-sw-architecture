<rect width="1900" height="1140" fill="#FFFFFF"/>
<text x="48" y="43" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="750" fill="#172033">Context의 사용 수명 — 읽기·제공·기억을 각각 통제</text>
<text x="48" y="70" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">PROPOSED · Policy Manager가 권한 의미를 소유하고 실제 사용 port가 현재 revision을 강제한다</text>
<rect x="45" y="150" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="178" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">A · CONTEXT READ — 읽을 수 있는 정보와 외부에 보낼 수 있는 정보는 다르다</text>
<rect x="45" y="435" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="463" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">B · REVOCATION — “그 정보는 더 이상 쓰지 마”</text>
<rect x="45" y="720" width="1810" height="260" rx="18" fill="#F8FAFC" stroke="#D5DDE9" stroke-width="1.5"/>
<text x="63" y="748" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="750" fill="#526178">C · USER MEMORY — 지속 선호를 대화 원문과 구분</text>
<polyline points="430,281.0 540,281.0" fill="none" stroke="#0891B2" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>

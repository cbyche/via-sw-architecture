<polyline points="1330,851.0 1440,851.0" fill="none" stroke="#059669" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)"/>
<rect x="90" y="215" width="340" height="132" rx="16" fill="#E6F8FB" stroke="#0891B2" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="262.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Controller 요청</text><text x="260.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">source·범위·목적·consumer 지정</text><text x="260.0" y="307.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">현재 policy / consent 확인</text></g>
<rect x="540" y="215" width="340" height="132" rx="16" fill="#E6F8FB" stroke="#0891B2" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="262.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Context Manager</text><text x="710.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">허용 envelope 안에서 bounded read</text><text x="710.0" y="307.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">source revision·receipt·후보 coverage</text></g>
<rect x="990" y="215" width="340" height="132" rx="16" fill="#E6F8FB" stroke="#0891B2" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="262.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Consumer view</text><text x="1160.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">필요한 근거·출처만 구성</text><text x="1160.0" y="307.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Conversation·Task는 owner read port</text></g>
<rect x="1440" y="215" width="340" height="132" rx="16" fill="#E6F8FB" stroke="#0891B2" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="262.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">실제 제공 직전 gate</text><text x="1610.0" y="287.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Model Access / Agent Gateway</text><text x="1610.0" y="307.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">recipient·scope·policy revision 검사</text></g>
<rect x="90" y="500" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Policy revision 변경</text><text x="260.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">새로운 사용·제공부터 차단</text><text x="260.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">관련 request·consumer dependency 식별</text></g>
<rect x="540" y="500" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Cache·session 무효화</text><text x="710.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Context view·모델 history 재사용 중단</text><text x="710.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">진행 중 생성 취소 / 결과 폐기</text></g>
<rect x="990" y="500" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">미전송·미게시 보류</text><text x="1160.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">dispatch·release gate에서 재검사</text><text x="1160.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">오래된 admission으로 재개 금지</text></g>
<rect x="1440" y="500" width="340" height="132" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="547.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">이미 제공된 정보</text><text x="1610.0" y="572.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">회수·외부 삭제 가능 범위 확인</text><text x="1610.0" y="592.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">지원되지 않는 회수를 성공으로 말하지 않음</text></g>
<rect x="90" y="785" width="340" height="132" rx="16" fill="#E9F9F3" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="260.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">명시적 기억 요청</text><text x="260.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">확인 / 등록 / 수정 / 삭제</text><text x="260.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">현재 요청의 지시가 저장 선호보다 우선</text></g>
<rect x="540" y="785" width="340" height="132" rx="16" fill="#E9F9F3" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="710.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Context owner 전이</text><text x="710.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">memory ID·version·삭제 tombstone</text><text x="710.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">허용 범위 안에서 내구 기록</text></g>
<rect x="990" y="785" width="340" height="132" rx="16" fill="#E9F9F3" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">파생 view 갱신</text><text x="1160.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">cache·prompt·session·대기 생성 무효화</text><text x="1160.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">삭제된 선호를 history로 되살리지 않음</text></g>
<rect x="1440" y="785" width="340" height="132" rx="16" fill="#E9F9F3" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="832.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">결과와 한계 안내</text><text x="1610.0" y="857.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">실제 적용·확인 범위를 Text로 기록</text><text x="1610.0" y="877.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">외부 제공 이력·보관 정책은 별도 관리</text></g>
<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="385" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Cache hit도 새 사용이다. Source identity·revision·권한 범위가 맞지 않으면 재사용하지 않고 재조회 또는 동의를 요청한다.</text>
<text x="90" y="670" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">사용자가 일반 질문을 할 때마다 승인하지 않는다. 현재 허용 범위가 충분하면 진행하고 필요한 새로운 범위만 확인한다.</text>
<text x="90" y="955" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Memory 삭제는 원래 대화 전체 삭제와 같은 명령이 아니다. 보관기간·백업·외부 provider 삭제 보장은 제품 정책으로 별도 확정한다.</text>
<text x="90" y="1050" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">Consent와 Agent Action Approval은 별도 계약이다. VIA는 질문·답을 정확히 중계하며 실제 업무 Action의 권한 강제는 Agent 책임이다.</text>
<rect x="48" y="92" width="172" height="25" rx="8" fill="#EAF2FF" stroke="#2563EB" stroke-width="1.5"/>
<text x="134.0" y="109" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2563EB">입력·응답</text>

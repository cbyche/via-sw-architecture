<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="740" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">기본 정책: input revision당 semantic 총 2회 — refinement·형식 repair·원음 재확인도 포함. 추가 조회는 한 묶음이다.</text>
<text x="90" y="875" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">정정 / 관련 source 변경 → 이전 proposal·admission 무효화 → 영향 field 재검증. 재시도는 전체 deadline 안에서만 허용.</text>
<text x="90" y="920" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Clarification·실패 안내는 미확정 정보를 보존한 publication admission으로 게시한다. 업무 dispatch에는 Semantic Commit이 필요하다.</text>

<rect x="990" y="915" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1160.0" y="962.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Request Controller</text><text x="1160.0" y="987.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">조회 결과 수신 · 현재 revision 확인</text><text x="1160.0" y="1007.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">유효한 근거·남은 예산으로 재해석 요청</text></g>
<rect x="1440" y="915" width="340" height="132" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1610.0" y="962.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Request Interpreter · 호출 2</text><text x="1610.0" y="987.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">추가 근거를 반영한 수정 제안</text><text x="1610.0" y="1007.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">의미 판단 결과를 반환 · 직접 확정 없음</text></g>
<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="395" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">입력 시점 근거는 Interaction Manager가 제공하고, 대화·Task·자료 근거는 Context Manager가 owner read port로 모은다.</text>
<text x="90" y="720" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">추가 조회가 필요하고 예산이 남은 경우에만 ③으로 진행한다. Request Interpreter의 제안 자체는 실행 허가가 아니다.</text>
<text x="90" y="1080" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">호출 2 이후에는 추가 semantic 호출 없이 ②에서 확정 / clarification / 확인 불가로 분기한다. 새 사용자 입력은 새 revision이다.</text>
<text x="90" y="1200" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">input revision당 semantic 총 2회: 최초 해석·refinement·형식 repair·원음 재확인·stale 재해석을 모두 합산한다.</text>
<text x="90" y="1235" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">정정·관련 source 변경 시 이전 proposal·admission을 무효화한다. revision / budget 검사 실패 시 오래된 근거로 호출·확정하지 않는다.</text>
<text x="90" y="1270" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Clarification·실패 안내도 publication admission 후 게시한다. 업무 dispatch에는 Semantic Commit이 필요하며 조회는 실행 허가가 아니다.</text>

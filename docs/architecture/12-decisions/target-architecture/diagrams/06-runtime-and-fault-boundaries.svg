<rect width="1900" height="1470" fill="#FFFFFF"/>
<text x="48" y="43" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="750" fill="#172033">배치와 장애 경계 — 입력은 독립, Omni 가중치는 한 곳에</text>
<text x="48" y="70" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">PROPOSED · 공유 on-device Omni 주안 · process 색은 책임 · 모델 내부는 의존성 · 자원 수치는 미검증</text>

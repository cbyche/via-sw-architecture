<rect x="1420" y="480" width="390" height="155" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1615.0" y="538.5" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Semantic LLM × 1</text><text x="1615.0" y="563.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">모든 요청·요약이 같은 모델 공유</text><text x="1615.0" y="583.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">동시 처리·선점은 provider 기능</text></g>
<rect x="90" y="745" width="250" height="155" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="215.0" y="793.5" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">UI Process</text><text x="215.0" y="818.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Chat·Task view·화면 capture</text><text x="215.0" y="838.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">IM: Text·evidence buffer</text><text x="215.0" y="858.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Core와 bounded IPC</text></g>
<rect x="380" y="745" width="250" height="155" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="505.0" y="793.5" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Durable Store</text><text x="505.0" y="818.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">owner별 transaction</text><text x="505.0" y="838.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Core 종료 후에도 보존</text><text x="505.0" y="858.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">별도 DB process는 선택</text></g>
<rect x="835" y="745" width="460" height="155" rx="16" fill="#FFF1E8" stroke="#EA580C" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1065.0" y="793.5" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Connector Workers</text><text x="1065.0" y="818.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">위험한 native·blocking 연동만 격리</text><text x="1065.0" y="838.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Context / Agent adapter별 restart</text><text x="1065.0" y="858.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Task별 process를 만들지 않음</text></g>
<rect x="1420" y="745" width="390" height="155" rx="16" fill="#FFF1E8" stroke="#EA580C" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1615.0" y="803.5" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Sources / Agents</text><text x="1615.0" y="828.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">VIA Context는 bounded read</text><text x="1615.0" y="848.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">실제 업무 실행은 Agent 책임</text></g>
<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="957" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Supervisor: process 재시작·health·backoff만 담당한다. Request·Task 의미 상태나 성공 여부를 결정하지 않는다.</text>
<text x="90" y="994" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Core 장애: 새 admission 중단 · Voice lease 만료 시 재생 중단 · UI는 마지막 확인 상태와 연결 문제 표시.</text>
<text x="90" y="1120" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#172033">Model Access는 하나의 논리 계약이다. S2S adapter는 Voice, semantic adapter는 Core에 배치하며 모델을 복제하지 않는다.</text>
<text x="90" y="1162" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Voice stop은 Core 응답을 기다리지 않는다. Task 취소는 Core의 내구 접수·Agent 확인이 필요하며 Core 장애 중 성공 접수를 약속하지 않는다.</text>

<g font-family="Inter, Arial, sans-serif"><text x="290.0" y="288.5" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Voice Process</text><text x="290.0" y="313.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">IM: capture · playback · local stop</text><text x="290.0" y="333.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">AEC · 활동 감지 · 짧은 buffer</text><text x="290.0" y="353.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Model Access client · weights 없음</text></g>
<rect x="650" y="235" width="500" height="165" rx="16" fill="#E6F8FB" stroke="#0891B2" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="900.0" y="288.5" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Speech Input Worker</text><text x="900.0" y="313.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Streaming ASR × 1 · 전용 입력 근거</text><text x="900.0" y="333.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">CPU 예산 · bounded queue · 시간/revision</text><text x="900.0" y="353.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Omni 장애·semantic 완료를 기다리지 않음</text></g>
<rect x="1340" y="235" width="450" height="165" rx="16" fill="#FFF8E1" stroke="#D97706" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1565.0" y="288.5" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">입력 보호 조건</text><text x="1565.0" y="313.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Capture + ASR 인식 + Omni Voice 진행</text><text x="1565.0" y="333.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">녹음만 쌓아 두는 것은 정상 동시 처리 아님</text><text x="1565.0" y="353.5" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">별도 process ≠ 물리 자원 완전 격리</text></g>
<rect x="90" y="560" width="400" height="190" rx="16" fill="#F3ECFF" stroke="#7C3AED" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="290.0" y="616.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Core Process</text><text x="290.0" y="641.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Controller · Interpreter · Context · Task</text><text x="290.0" y="661.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Response · Policy · Gateway 상태 권위</text><text x="290.0" y="681.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">IM timeline · Model Access client</text><text x="290.0" y="701.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">semantic 가중치를 별도 적재하지 않음</text></g>
<rect x="650" y="530" width="500" height="250" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="900.0" y="606.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Shared Inference Service</text><text x="900.0" y="631.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Model Access server · Omni adapter</text><text x="900.0" y="651.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">단일 scheduler / weights owner</text><text x="900.0" y="671.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">VOICE · SEMANTIC 별도 session/KV</text><text x="900.0" y="691.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Voice 예약 + semantic 최소 진행량</text><text x="900.0" y="711.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">chunked prefill · deadline · cancel</text></g>
<rect x="1340" y="530" width="450" height="250" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1565.0" y="616.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Omni Model × 1</text><text x="1565.0" y="641.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Thinker 약 10B + encoder / speech 모듈</text><text x="1565.0" y="661.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">같은 PC · 모듈별 한 번 적재</text><text x="1565.0" y="681.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">두 역할이 같은 weights를 사용</text><text x="1565.0" y="701.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">가중치 공유 ≠ 같은 Context / 권한</text></g>
<rect x="90" y="945" width="400" height="150" rx="16" fill="#EAF2FF" stroke="#2563EB" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="290.0" y="991.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">UI Process</text><text x="290.0" y="1016.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Text · 화면 evidence</text><text x="290.0" y="1036.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Core 연결 문제 표시</text><text x="290.0" y="1056.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">명시적 local stop</text></g>
<rect x="650" y="945" width="500" height="150" rx="16" fill="#F1F5F9" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="900.0" y="991.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Durable Store</text><text x="900.0" y="1016.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">local embedded DB · evidence manifest</text><text x="900.0" y="1036.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Core 종료 후에도 데이터 보존</text><text x="900.0" y="1056.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">모델 KV는 authoritative state 아님</text></g>
<rect x="1340" y="945" width="450" height="150" rx="16" fill="#FFF1E8" stroke="#EA580C" stroke-width="2" filter="url(#shadow)"/>
<g font-family="Inter, Arial, sans-serif"><text x="1565.0" y="991.0" text-anchor="middle" font-size="19" font-weight="700" fill="#172033">Connector Workers</text><text x="1565.0" y="1016.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">위험한 native·blocking 연동 격리</text><text x="1565.0" y="1036.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">Context Source / Agent와 통신</text><text x="1565.0" y="1056.0" text-anchor="middle" font-size="15" font-weight="500" fill="#526178">외부 업무는 Downstream Agent</text></g>
<text x="1580" y="110" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#526178">→ 관계·전달  ·  점선 = 보조 관계</text>
<text x="90" y="1150" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#172033">Omni service 장애: 두 추론 역할은 함께 중단. Capture · ASR · local stop · Agent event 수신은 유지; UI에서 처리 불가 안내.</text>
<text x="90" y="1190" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">Core 장애: 새 admission 중단 · Voice lease 만료 시 playback 정지 · Task 취소는 내구 접수 전까지 성공으로 표시하지 않음.</text>
<text x="90" y="1230" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">ASR 장애: bounded 입력 보존 후 재연결 · gap 명시 · 불완전 근거로 위임 금지. Supervisor는 상태 의미를 결정하지 않음.</text>
<text x="90" y="1270" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#526178">CPU / accelerator / KV / 메모리 대역폭 / 열 예산을 함께 확인한다. 제품 장비에서의 적합성은 아직 미측정이다.</text>
<text x="90" y="1400" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#172033">선은 process 간 계약이다. UI → Voice 왼쪽 경로는 명시적 local stop이며 Core나 추론 서비스 응답을 기다리지 않는다.</text>

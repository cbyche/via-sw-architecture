<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIA 필요성 5안 비교</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#111;font-family:Calibri,Arial,sans-serif}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #d4dbe4;padding:18px 3vw;z-index:2;display:flex;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:24px;margin:0}nav{display:flex;gap:10px}a{color:#082759}nav a{padding:8px 14px;background:#edf2f7;border-radius:5px;text-decoration:none}main{max-width:1800px;margin:24px auto;padding:0 3vw;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px}section{scroll-margin-top:100px}h2{font-size:20px;margin:0 0 12px}img{display:block;width:100%;height:auto}.preview{border:1px solid #d4dbe4;padding:0;background:white;width:100%;cursor:zoom-in;box-shadow:0 6px 25px #0827590b}dialog{border:0;padding:0;background:white;max-width:96vw;max-height:96vh}dialog::backdrop{background:#07172edc}dialog img{max-height:92vh;object-fit:contain}#close{position:fixed;right:3vw;top:2vh;background:white;border:1px solid #ddd;padding:10px 16px;font-size:16px;cursor:pointer}footer{padding:20px 3vw 40px;color:#4a5563}@media(max-width:1000px){main{grid-template-columns:1fr}header{position:relative}dialog{max-width:100vw}}
</style></head><body><header><h1>과제 필요성 · 5안 비교</h1><nav><a href="#option-1">1안</a><a href="#option-2">2안</a><a href="#option-3">3안</a><a href="#option-4">4안</a><a href="#option-5">5안</a></nav><a href="../VIA-necessity-options_v12.pptx">5장 PPTX</a><span>v11 기준 · 그림을 누르면 확대</span></header><main><section id="option-1"><h2>1안 · 3열 장면형</h2><button class="preview" aria-label="1안 확대" data-src="option-01.png"><img src="option-01.png" alt="3열 장면형" loading="lazy"></button></section><section id="option-2"><h2>2안 · PC 중심 통합형</h2><button class="preview" aria-label="2안 확대" data-src="option-02.png"><img src="option-02.png" alt="PC 중심 통합형" loading="lazy"></button></section><section id="option-3"><h2>3안 · 가로 3단형</h2><button class="preview" aria-label="3안 확대" data-src="option-03.png"><img src="option-03.png" alt="가로 3단형" loading="lazy"></button></section><section id="option-4"><h2>4안 · 확대 장면형</h2><button class="preview" aria-label="4안 확대" data-src="option-04.png"><img src="option-04.png" alt="확대 장면형" loading="lazy"></button></section><section id="option-5"><h2>5안 · 정보 레이어형</h2><button class="preview" aria-label="5안 확대" data-src="option-05.png"><img src="option-05.png" alt="정보 레이어형" loading="lazy"></button></section></main><footer>선택용 비교본. v11 통합본 유지. 그림은 설명용 생성 일러스트.</footer><dialog id="zoom"><button id="close">닫기 ✕</button><img id="large" alt="확대 미리보기"></dialog><script>const d=document.querySelector('#zoom');document.querySelectorAll('.preview').forEach(b=>b.onclick=()=>{document.querySelector('#large').src=b.dataset.src;d.showModal()});document.querySelector('#close').onclick=()=>d.close();d.onclick=e=>{if(e.target===d)d.close()};</script></body></html>

<g id="challenge"><rect x="48" y="1170" width="2464" height="170" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="1198" font-size="20" font-weight="700" fill="#171717">Architecture Challenge</text><text x="64" y="1234" font-size="20" fill="#171717">SpeechEvidence를 독립 recognizer에서 생산할 것인가, 동일 Omni의 native stream에 입력 근거까지 맡길 것인가?</text></g>

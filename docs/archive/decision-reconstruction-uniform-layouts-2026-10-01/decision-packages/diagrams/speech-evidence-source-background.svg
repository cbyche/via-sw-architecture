<g id="e02"><rect x="1410" y="380" width="490" height="130" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="1426" y="408" font-size="20" font-weight="700" fill="#171717">전사 늦게 도착</text><text x="1426" y="444" font-size="20" fill="#171717">최종 revision / 대체 구간</text><text x="1426" y="469" font-size="20" fill="#171717">도착 시각 ≠ 발화 시각</text></g>

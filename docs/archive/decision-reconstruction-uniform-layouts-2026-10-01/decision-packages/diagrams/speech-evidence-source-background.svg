<g id="pressure0"><rect x="48" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="953" font-size="20" font-weight="700" fill="#171717">독립성의 가치와 비용</text><text x="64" y="989" font-size="20" fill="#171717">semantic과 별도로 입력 근거가 진행한다.</text><text x="64" y="1014" font-size="20" fill="#171717">별도 weights·CPU·worker가 필요하다.</text><text x="64" y="1039" font-size="20" fill="#171717">중복 인식과 전사 충돌을 관리한다.</text></g>
<g id="pressure1"><rect x="884" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="900" y="953" font-size="20" font-weight="700" fill="#171717">통합의 가치와 비용</text><text x="900" y="989" font-size="20" fill="#171717">중복 dependency를 줄일 수 있다.</text><text x="900" y="1014" font-size="20" fill="#171717">native 시간·revision 계약이 필요하다.</text><text x="900" y="1039" font-size="20" fill="#171717">같은 오류·자원·장애에 함께 노출된다.</text></g>

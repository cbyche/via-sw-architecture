<g id="scenario"><rect x="48" y="142" width="2464" height="104" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="170" font-size="20" font-weight="700" fill="#171717">사용자 상황</text><text x="64" y="206" font-size="20" fill="#171717">이전 요청을 해석하는 동안 사용자가 그래프에서 표로 포인터를 옮기며 “이거, 아니 저걸 넣어줘”라고 말한다.</text></g>

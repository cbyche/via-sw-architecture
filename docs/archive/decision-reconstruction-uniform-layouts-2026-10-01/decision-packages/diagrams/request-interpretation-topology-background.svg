<g id="pressure0"><rect x="48" y="925" width="792" height="205" rx="8" fill="#FFFFFF" stroke="#171717" stroke-width="2.5"/><text x="64" y="953" font-size="20" font-weight="700" fill="#171717">결합 판단의 이점</text><text x="64" y="989" font-size="20" fill="#171717">관련 의미를 함께 조정할 수 있다.</text><text x="64" y="1014" font-size="20" fill="#171717">큰 입력·출력과 결합 오류를 감수한다.</text><text x="64" y="1039" font-size="20" fill="#171717">한 번의 호출이 무오류를 뜻하지 않는다.</text></g>

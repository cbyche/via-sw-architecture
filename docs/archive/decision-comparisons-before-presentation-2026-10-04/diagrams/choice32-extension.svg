<text x="825.0" y="1547.5" text-anchor="middle" font-size="22" font-weight="700" fill="#263445">참조 해석 Module</text><text x="825.0" y="1575.0" text-anchor="middle" font-size="22" font-weight="700" fill="#263445">자료 읽기 / 재확인 필요 반환</text>
</g>
<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-32  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">화면 지칭의 두 경로를 결합하는 최소 확장</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">주요 구조 DP 자격을 철회한 이유</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">공통 대상 참조와 resolver를 사용하는 설계 반례 / 새 주요 대안 또는 구현 결과가 아님</text></g>
<g id="e10"><text x="86" y="514.0" text-anchor="start" font-size="18" font-weight="700" fill="#263445">VIA SOFTWARE</text></g>
<g id="e11"><text x="2474" y="514.0" text-anchor="end" font-size="16" font-weight="400" fill="#5B697B">Context 획득/참조 부분만 확대</text></g>
<g id="e20"><text x="120" y="458.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">관측 수집은 Interaction Manager 경유</text></g>
<g id="e26" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="185" y="948.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">관측 참조 생성</text></g>
<g id="e28" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1010" y="948.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">가능하면 객체 참조 보강</text></g>
<g id="e30" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="490" y="1348.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">같은 표현을 두 경로에서 사용</text></g>
<g id="e38" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1810" y="958.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">의미 요청 / 대상 반환</text></g>
<g id="e41" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1790" y="1388.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">Task Manager 경유: 확정 인계</text></g>
<g id="e43"><text x="110" y="1894.0" text-anchor="start" font-size="24" font-weight="400" fill="#5B697B">객체 API가 없는 영역은 관측 참조 유지. 객체가 있어도 시점/유효성 확인은 필요.</text><text x="110" y="1926.4" text-anchor="start" font-size="24" font-weight="400" fill="#5B697B">추론은 기존 Model Access/공유 Omni를 사용. 외부 업무는 같은 Downstream Agent가 실행.</text><text x="110" y="1958.8" text-anchor="start" font-size="24" font-weight="400" fill="#5B697B">제공자와 resolver의 개발량은 남지만, 대화/Task 원본과 확정 구조를 유지하며 점진 도입 가능.</text></g>
<g id="e45"><text x="64" y="2147.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">검정 = 공통 / 파랑 = A 고유 / 초록 = B 고유 / 색은 우위가 아님</text></g>
<g id="e46"><text x="2496" y="2146.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달 / 점선 → 반환/확인</text></g>
<g id="e47"><text x="64" y="2183.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">제목 상자 = Component / 내부 둥근 상자 = Module / 원통 = 저장 / 접힌 종이 = 자료 / 육각형 = 연동 대상</text></g>
<g id="e48"><text x="64" y="2219.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">파랑 = 관측 경로 / 초록 = 객체 확장 / 검정 = 공통. 새 Component를 늘려야만 얻는 성질이 아니다.</text></g>
</g></svg>

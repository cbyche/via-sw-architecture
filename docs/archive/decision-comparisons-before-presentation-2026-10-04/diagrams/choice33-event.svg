<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-33  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">여러 업무의 대화 정확성을 위한 협력</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">중앙 해석과 업무별 대화 처리</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">같은 사건의 1~5단계 / 본문 §4와 대응 / 시간축은 측정 비율이 아님</text></g>
<g id="e7"><text x="64" y="261.0" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">공통 입력과 끝점은 유지한다. 각 칸은 사건 설명이며 Component 또는 process 배치를 뜻하지 않는다.</text></g>
<g id="e8"><text x="64" y="328.0" text-anchor="start" font-size="28" font-weight="700" fill="#195FBD">A  중앙이 전체 대화 해석</text></g>
<g id="e11"><text x="92" y="420.0" text-anchor="start" font-size="27" font-weight="700" fill="#195FBD">1. 두 업무 질문과 실제 게시</text></g>
<g id="e12"><text x="92" y="481" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Task Manager → Request Controller: 질문 / 실제 게시 기록</text></g>
<g id="e16"><text x="92" y="710.0" text-anchor="start" font-size="27" font-weight="700" fill="#195FBD">2. 복합 후속 발화 해석</text></g>
<g id="e17"><text x="92" y="771" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Interpreter → [요청] / ← [반환] Model Access: 관련 업무 공동</text><text x="92" y="803" text-anchor="start" font-size="23" font-weight="400" fill="#263445">해석</text></g>
<g id="e21"><text x="92" y="1000.0" text-anchor="start" font-size="27" font-weight="700" fill="#195FBD">3. 관계와 상태 변경 제안</text></g>
<g id="e22"><text x="92" y="1061" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Interpreter → Request Controller: 전체 관계</text></g>
<g id="e26"><text x="92" y="1290.0" text-anchor="start" font-size="27" font-weight="700" fill="#195FBD">4. 현재 조건 검사 후 적용</text></g>
<g id="e27"><text x="92" y="1351" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Controller: 중앙 상태와 명령 intent 확정</text></g>
<g id="e31"><text x="92" y="1580.0" text-anchor="start" font-size="27" font-weight="700" fill="#195FBD">5. 외부 적용과 사용자 반환</text></g>
<g id="e32"><text x="92" y="1641" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Task Manager → [요청] / ← [반환] Agent Gateway → [요청] / ← [반환]</text><text x="92" y="1673" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Agent / 실제 상태 전달</text></g>
<g id="e33"><text x="84" y="1892.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">같은 정상 사건의 흐름. 실패/철회/재시작은 본문 §6.</text><text x="84" y="1921.7" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">표시/생성 완료와 실제 청취, 접수와 업무 완료를 구별한다.</text><text x="84" y="1951.4" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">구조의 유리한 조건과 반증은 본문 §8~9에서 검토한다.</text></g>
<g id="e34"><text x="1312" y="328.0" text-anchor="start" font-size="28" font-weight="700" fill="#087A53">B  업무 대화 actor가 협력</text></g>
<g id="e37"><text x="1340" y="420.0" text-anchor="start" font-size="27" font-weight="700" fill="#087A53">1. 두 업무 질문과 실제 게시</text></g>
<g id="e38"><text x="1340" y="481" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Task Dialogue Runtime → 각 actor: 같은 질문/실제 게시 사건</text></g>
<g id="e42"><text x="1340" y="710.0" text-anchor="start" font-size="27" font-weight="700" fill="#087A53">2. 복합 후속 발화 해석</text></g>
<g id="e43"><text x="1340" y="771" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Dialogue Coordinator → actor → [요청] / ← [반환] Request</text><text x="1340" y="803" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Interpreter: 로컬 의미 제안</text></g>
<g id="e47"><text x="1340" y="1000.0" text-anchor="start" font-size="27" font-weight="700" fill="#087A53">3. 관계와 상태 변경 제안</text></g>
<g id="e48"><text x="1340" y="1061" text-anchor="start" font-size="23" font-weight="400" fill="#263445">actor → [요청] / ← [반환] Dialogue Coordinator: 담당 절, 결론 참조</text><text x="1340" y="1093" text-anchor="start" font-size="23" font-weight="400" fill="#263445">요청/반환과 재제안</text></g>
<g id="e52"><text x="1340" y="1290.0" text-anchor="start" font-size="27" font-weight="700" fill="#087A53">4. 현재 조건 검사 후 적용</text></g>
<g id="e53"><text x="1340" y="1351" text-anchor="start" font-size="23" font-weight="400" fill="#263445">같은 guard, Dialogue Coordinator: actor 예상 버전과 채택 변경 확정</text></g>
<g id="e57"><text x="1340" y="1580.0" text-anchor="start" font-size="27" font-weight="700" fill="#087A53">5. 외부 적용과 사용자 반환</text></g>
<g id="e58"><text x="1340" y="1641" text-anchor="start" font-size="23" font-weight="400" fill="#263445">동일. actor에는 적용 완료 및 실제 전달 사건 반환</text></g>
<g id="e59"><text x="1332" y="1892.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">같은 정상 사건의 흐름. 실패/철회/재시작은 본문 §6.</text><text x="1332" y="1921.7" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">표시/생성 완료와 실제 청취, 접수와 업무 완료를 구별한다.</text><text x="1332" y="1951.4" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">구조의 유리한 조건과 반증은 본문 §8~9에서 검토한다.</text></g>
<g id="e61"><text x="64" y="2157.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">검정 = 공통 / 파랑 = A 고유 / 초록 = B 고유 / 색은 우위가 아님</text></g>
<g id="e62"><text x="2496" y="2156.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달 / 점선 → 반환/확인</text></g>
<g id="e63"><text x="64" y="2193.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">제목 상자 = Component / 내부 둥근 상자 = Module / 원통 = 저장 / 접힌 종이 = 자료 / 육각형 = 연동 대상</text></g>
<g id="e64"><text x="64" y="2229.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">실제 소요 시간/성능을 표시하지 않는다. 요청과 반환의 송수신 책임은 각 단계와 본문 표에 명시한다.</text></g>
</g></svg>

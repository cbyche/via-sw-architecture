<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-31  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">요청 이해의 정확성을 위한 의미 구성</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">요청별 생성과 지속 의미 작업공간</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">실제 자료를 사용한 설계 추적 / 본문 §4.1 / 모델 실행 또는 정확도 측정 결과가 아님</text></g>
<g id="e7"><text x="64" y="278.0" text-anchor="start" font-size="28" font-weight="700" fill="#195FBD">A  요청별 완성 의미 생성</text></g>
<g id="e10"><text x="92" y="391.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">1. u1: 작년 표 / 메일은 초안만</text></g>
<g id="e11"><text x="92" y="453" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Interpreter가 완성 P1 생성: source=L/R, year=2025,</text><text x="92" y="486" text-anchor="start" font-size="23" font-weight="400" fill="#263445">send=false. Request Controller가 질문 q1 게시 요청.</text></g>
<g id="e15"><text x="92" y="696.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">2. u2: “오른쪽 것”</text></g>
<g id="e16"><text x="92" y="758" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Interpreter가 P1/질문/원문으로 전체 P2 재생성: source=R@7,</text><text x="92" y="791" text-anchor="start" font-size="23" font-weight="400" fill="#263445">year=2025, send=false. 기존 조건과 비교 검사.</text></g>
<g id="e20"><text x="92" y="1001.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">3. u3: “표는 올해 것, 메일은 그대로”</text></g>
<g id="e21"><text x="92" y="1063" text-anchor="start" font-size="23" font-weight="400" fill="#263445">같은 재조회에서 올해 표 S@8 확인. Request Interpreter가 P3 생성: source=S@8,</text><text x="92" y="1096" text-anchor="start" font-size="23" font-weight="400" fill="#263445">year=2026, send=false. 조건 검증.</text></g>
<g id="e25"><text x="92" y="1306.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">4. 새로 선택한 S@8 삭제</text></g>
<g id="e26"><text x="92" y="1368" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Context Manager의 근거 확인에서 삭제 발견. Request Controller가 해당 제안 보류,</text><text x="92" y="1401" text-anchor="start" font-size="23" font-weight="400" fill="#263445">새 대상 해석/질문 요청.</text></g>
<g id="e30"><text x="92" y="1611.0" text-anchor="start" font-size="26" font-weight="700" fill="#195FBD">5. q1의 옛 답변이 늦게 도착</text></g>
<g id="e31"><text x="92" y="1673" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Controller가 현재 질문/입력 버전 확인. 옛 답으로 새 대상을 확정하지 않음.</text></g>
<g id="e32"><text x="84" y="1945.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">A도 기존 조건을 검사할 수 있음. B의 이익은 올바른 변경만 적용하는 경로.</text><text x="84" y="1972.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">잘못된 변경 해석은 B도 실패. 외부 실행 승인/동의는 같은 별도 검사.</text></g>
<g id="e33"><text x="1312" y="278.0" text-anchor="start" font-size="28" font-weight="700" fill="#087A53">B  지속 의미 작업공간</text></g>
<g id="e36"><text x="1340" y="391.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">1. u1: 작년 표 / 메일은 초안만</text></g>
<g id="e37"><text x="1340" y="453" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Meaning Workspace: c1=year 2025, c2=send false, source=L/R.</text><text x="1340" y="486" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Semantic Constraint Engine이 미해결 source를 반환, q1 게시.</text></g>
<g id="e41"><text x="1340" y="696.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">2. u2: “오른쪽 것”</text></g>
<g id="e42"><text x="1340" y="758" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Interpreter: NARROW(q1,{R@7}) 제안. Meaning Workspace가</text><text x="1340" y="791" text-anchor="start" font-size="23" font-weight="400" fill="#263445">q1 버전 검사 후 source만 변경. c1/c2 유지.</text></g>
<g id="e46"><text x="1340" y="1001.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">3. u3: “표는 올해 것, 메일은 그대로”</text></g>
<g id="e47"><text x="1340" y="1063" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Request Interpreter: REPLACE(c1,2025→2026). Meaning</text><text x="1340" y="1096" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Workspace가 같은 재조회로 S@8 후보 평가. c2는 변경 대상이 아님.</text></g>
<g id="e51"><text x="1340" y="1306.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">4. 새로 선택한 S@8 삭제</text></g>
<g id="e52"><text x="1340" y="1368" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Context Manager가 무효 근거 반환. Meaning Workspace가 S@8의 의존 후보 제거.</text><text x="1340" y="1401" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Engine 재평가. 메일 조건 c2 유지.</text></g>
<g id="e56"><text x="1340" y="1611.0" text-anchor="start" font-size="26" font-weight="700" fill="#087A53">5. q1의 옛 답변이 늦게 도착</text></g>
<g id="e57"><text x="1340" y="1673" text-anchor="start" font-size="23" font-weight="400" fill="#263445">Meaning Workspace가 expected 버전과 q1 수명 검사. 옛 변경 적용 거절. 현재 질문에</text><text x="1340" y="1706" text-anchor="start" font-size="23" font-weight="400" fill="#263445">다시 연결.</text></g>
<g id="e58"><text x="1332" y="1945.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">A도 기존 조건을 검사할 수 있음. B의 이익은 올바른 변경만 적용하는 경로.</text><text x="1332" y="1972.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">잘못된 변경 해석은 B도 실패. 외부 실행 승인/동의는 같은 별도 검사.</text></g>
<g id="e60"><text x="64" y="2157.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">검정 = 공통 / 파랑 = A 고유 / 초록 = B 고유 / 색은 우위가 아님</text></g>
<g id="e61"><text x="2496" y="2156.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달 / 점선 → 반환/확인</text></g>
<g id="e62"><text x="64" y="2193.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">제목 상자 = Component / 내부 둥근 상자 = Module / 원통 = 저장 / 접힌 종이 = 자료 / 육각형 = 연동 대상</text></g>
<g id="e63"><text x="64" y="2229.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">예시의 입력/근거는 양안에 동일. 실제 사용 빈도, 정확도와 시간 이익은 미측정.</text></g>
</g></svg>

<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-35  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">대화와 업무의 복구 정확성을 위한 기록</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">현재 상태와 사건 이력</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">공통 조건은 유지하고 각 안의 실제 생산/상태/실행 관계를 펼침. 배열이나 색 차이 자체는 구조 자격의 증거가 아님.</text></g>
<g id="e8"><text x="88" y="270.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">A</text></g>
<g id="e9"><text x="132" y="263.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">현재 상태가 원본</text></g>
<g id="e11"><text x="86" y="354.0" text-anchor="start" font-size="18" font-weight="700" fill="#263445">VIA SOFTWARE</text></g>
<g id="e12"><text x="1226" y="354.0" text-anchor="end" font-size="16" font-weight="400" fill="#5B697B">논리 책임 / 실제 process는 별도 표시</text></g>
<g id="e20" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="164" y="573.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">새 상태와 전송 intent</text></g>
<g id="e22" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="399" y="1048.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">원자 갱신</text></g>
<g id="e24" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="744" y="1018.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">같은 transaction</text></g>
<g id="e26" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="399" y="1428.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">현재 값을 그대로 복원</text></g>
<g id="e29"><text x="764" y="1612.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">감사 log와 backup은 추가 가능.</text><text x="764" y="1641.7" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">현재 상태를 매번 사건에서</text><text x="764" y="1671.4" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">다시 만들 필요는 없음.</text></g>
<g id="e30"><text x="104" y="2089.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">Agent Gateway ↔ Downstream Agent: 전송 / 실제 접수 조회.</text><text x="104" y="2114.65" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">현재 불명 접수는 양안 모두 외부 조회. replay는 외부 명령을 실행하지 않음.</text></g>
<g id="e31"><text x="104" y="2350.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">차이: 현재 원본 직접 갱신/읽기 ↔ 사건 원본과 파생 view의 생산/재생.</text><text x="104" y="2377.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">B의 역전환은 더 쉬울 수 있다. 그 사실을 전환 비용 판단에 포함한다.</text></g>
<g id="e33"><text x="1336" y="270.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">B</text></g>
<g id="e34"><text x="1380" y="263.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">확정 사건이 원본</text></g>
<g id="e36"><text x="1334" y="354.0" text-anchor="start" font-size="18" font-weight="700" fill="#263445">VIA SOFTWARE</text></g>
<g id="e37"><text x="2474" y="354.0" text-anchor="end" font-size="16" font-weight="400" fill="#5B697B">논리 책임 / 실제 process는 별도 표시</text></g>
<g id="e48" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1412" y="573.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">새 상태 값 대신 의미 전이</text></g>
<g id="e50" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1647" y="988.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">사건 append</text></g>
<g id="e52" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1867" y="1088.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">순서 있는 사건</text></g>
<g id="e54" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2032" y="1308.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">결정적 전이로 상태 생성</text></g>
<g id="e56" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1412" y="1308.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">재시작 시 후속 사건</text></g>
<g id="e58" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1412" y="1618.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">검증된 시작점</text></g>
<g id="e60" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1852" y="1358.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">같은 전이 함수</text></g>
<g id="e62" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2002" y="1613.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">검증 후 주기적 보관</text></g>
<g id="e65"><text x="1352" y="2089.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">Agent Gateway ↔ Downstream Agent: 전송 / 실제 접수 조회.</text><text x="1352" y="2114.65" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">현재 불명 접수는 양안 모두 외부 조회. replay는 외부 명령을 실행하지 않음.</text></g>
<g id="e66"><text x="1352" y="2350.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">차이: 현재 원본 직접 갱신/읽기 ↔ 사건 원본과 파생 view의 생산/재생.</text><text x="1352" y="2377.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">B의 역전환은 더 쉬울 수 있다. 그 사실을 전환 비용 판단에 포함한다.</text></g>
<g id="e68"><text x="64" y="2497.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">검정 = 공통 / 파랑 = A 고유 / 초록 = B 고유 / 색은 우위가 아님</text></g>
<g id="e69"><text x="2496" y="2496.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달 / 점선 → 반환/확인</text></g>
<g id="e70"><text x="64" y="2533.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">제목 상자 = Component / 내부 둥근 상자 = Module / 원통 = 저장 / 접힌 종이 = 자료 / 육각형 = 연동 대상</text></g>
<g id="e71"><text x="64" y="2569.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">실제 설계 차이와 전환 비용은 본문 §8~9. 이 그림은 구현/측정 또는 주요 DP 선정의 증거가 아니다.</text></g>
</g></svg>

<g id="e25" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="470" y="504.0" text-anchor="start" font-size="24" font-weight="400" fill="#195FBD">2  PDF + 결론 참조</text><text x="470" y="536.4" text-anchor="start" font-size="24" font-weight="400" fill="#195FBD">두 요청의 관계</text></g>
<g id="e28" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="140" y="699.0" text-anchor="start" font-size="24" font-weight="400" fill="#195FBD">관련 기록 조회</text></g>
<g id="e30" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="140" y="736.0" text-anchor="start" font-size="24" font-weight="400" fill="#195FBD">조건/질문 반환</text></g>
<g id="e31"><text x="175" y="875.0" text-anchor="start" font-size="25" font-weight="400" fill="#5B697B">기록 소유: Request Controller</text></g>
<g id="e32"><text x="108" y="912" text-anchor="start" font-size="26" font-weight="400" fill="#195FBD">정정: 메일 조건만 바꾼 의미 제안</text><text x="108" y="946" text-anchor="start" font-size="26" font-weight="400" fill="#195FBD">Task별 검색 / 조건 보존 / 부분 수정 가능</text></g>
<g id="e33"><text x="115" y="985.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">아래 채택도 같은 Request Controller</text></g>
<g id="e38" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="968" y="512.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">1  원문/보고서 근거</text></g>
<g id="e40" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1325" y="504.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">1  원문/메일 근거</text><text x="1325" y="536.4" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">3  보고서의 결론 참조</text></g>
<g id="e42" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="968" y="573.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">2  PDF / 결론 참조</text></g>
<g id="e44" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1320" y="573.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">2  필요 참조 / 메일 제안</text></g>
<g id="e51" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="985" y="690.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">Task 수명 동안 각 담당이 조건/질문 보존</text></g>
<g id="e52" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="985" y="731.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">4  채택 후 저장 ↕ 이전 조건/질문 읽기</text></g>
<g id="e55" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="967" y="873.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">Task 없음 / 생성 전 / 교차 관계</text></g>
<g id="e57"><text x="972" y="987.0" text-anchor="start" font-size="24" font-weight="400" fill="#087A53">정정: 메일 담당이 내용 교체 / PDF 조건 유지</text></g>
<g id="e62" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1780" y="512.0" text-anchor="start" font-size="24" font-weight="400" fill="#7446A4">1  원문/자료 후보</text></g>
<g id="e64" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2140" y="512.0" text-anchor="start" font-size="24" font-weight="400" fill="#7446A4">1  원문/Task 후보</text></g>
<g id="e66" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1780" y="573.0" text-anchor="start" font-size="24" font-weight="400" fill="#7446A4">2  결론의 대상/범위</text></g>
<g id="e68" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2140" y="573.0" text-anchor="start" font-size="24" font-weight="400" fill="#7446A4">2  보고서/메일 연결</text></g>
<g id="e71" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1790" y="712.0" text-anchor="start" font-size="24" font-weight="400" fill="#7446A4">3  원문 + 대상/업무 제안</text></g>
<g id="e73" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1780" y="850.0" text-anchor="start" font-size="24" font-weight="400" fill="#7446A4">4  PDF / 결론→메일 의존 / 교체 범위</text></g>
<g id="e77"><text x="1790" y="889.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">조정자가 기록/조회, 의미 값은 생산자만 변경</text></g>
<g id="e78"><text x="1790" y="989.0" text-anchor="start" font-size="24" font-weight="400" fill="#7446A4">정정: 표 대상 + 메일 연결 + 교체 관계를 결합</text></g>
<g id="e83" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="165" y="1020.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">각 안의 의미 제안 → 현재 입력/근거/질문/권한 검사 → 채택 또는 관련 담당 재판단/사용자 확인</text></g>
<g id="e84"><text x="115" y="1129.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">채택: State Store에 의미/상태/명령 의도 저장 → 담당 통지.   미채택 제안은 실행·게시 금지.   Task 사실의 원본은 Task Manager.</text></g>
<g id="e85"><text x="115" y="1164.0" text-anchor="start" font-size="24" font-weight="400" fill="#263445">위임: Task Manager → Agent Gateway ↔ 외부 Downstream Agent   |   직접 답변/질문: Response Manager ↔ Interaction Manager</text></g>
<g id="e87"><text x="64" y="1233" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">강점 후보: 교차 맥락 이해 / 짧은 처리 경로</text><text x="64" y="1269" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">대가: 맥락 누락·혼입 / 통합 판단 부담</text><text x="64" y="1305" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">V-01~03: 전체 관계   V-04~06: 조정 절약</text></g>
<g id="e88"><text x="888" y="1233" text-anchor="start" font-size="25" font-weight="400" fill="#087A53">강점 후보: 긴 Task의 조건·질문 이어가기</text><text x="888" y="1269" text-anchor="start" font-size="25" font-weight="400" fill="#087A53">대가: 참가 누락 / 참조 왕복 / 지속 상태</text><text x="888" y="1305" text-anchor="start" font-size="25" font-weight="400" fill="#087A53">V-01~03: 지역 연속성   V-08: Task 규칙</text></g>
<g id="e89"><text x="1712" y="1233" text-anchor="start" font-size="25" font-weight="400" fill="#7446A4">강점 후보: 기능별 집중 판단 / 오류 구분</text><text x="1712" y="1269" text-anchor="start" font-size="25" font-weight="400" fill="#7446A4">대가: 부분 판단 불일치 / 추가 추론·결합</text><text x="1712" y="1305" text-anchor="start" font-size="25" font-weight="400" fill="#7446A4">V-01~03: 전문화   V-08/09: 변경·분석</text></g>
<g id="e90"><text x="64" y="1350.0" text-anchor="start" font-size="25" font-weight="700" fill="#263445">모든 판단자: Model Access ↔ 공유 on-device Omni 1벌. 역할별 Context/KV와 호출 비용은 별도. 입력 수신·ASR은 계속.</text></g>
<g id="e91"><text x="64" y="1393.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">네모 = Component 이름 / 원통 = 상태 이름. 색 = A/B/C 구분, 우열 아님. 실선 = 요청/전달, 점선 화살표 = 반환. 논리 분해이며 process 분리가 아님.</text></g>
<g id="e92"><text x="64" y="1427.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">B: Task는 외부에 위임한 사용자 목표. 앱별 담당 아님. C: 충돌은 원 생산자가 재판단. 같은 Omni의 역할 분리가 정확성 향상을 보장하지 않음.</text></g>
</g></svg>

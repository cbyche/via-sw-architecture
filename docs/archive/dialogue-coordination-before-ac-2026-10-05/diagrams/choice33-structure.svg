<g id="e2"><text x="64" y="49.0" text-anchor="start" font-size="24" font-weight="700" fill="#5B697B">VIA / 33 / 판단 책임의 분해</text></g>
<g id="e3"><text x="2496" y="49.0" text-anchor="end" font-size="24" font-weight="400" fill="#5B697B">설계 탐색 / 미선정 / 미측정</text></g>
<g id="e4"><text x="64" y="116.0" text-anchor="start" font-size="43" font-weight="700" fill="#263445">사용자 의도를 정확히 이해하려면, 판단 책임을 어떻게 나눌까?</text></g>
<g id="e5"><text x="64" y="169.0" text-anchor="start" font-size="30" font-weight="700" fill="#263445">같은 입력  “보고서는 PDF로 하고, 메일에는 그 보고서의 결론을 넣어줘.”</text></g>
<g id="e6"><text x="64" y="212.0" text-anchor="start" font-size="28" font-weight="400" fill="#263445">다음 정정  “메일에는 결론 대신 표만 넣어줘.”   →   세 안 모두 PDF 유지, 메일의 내용 조건만 교체</text></g>
<g id="e7"><text x="64" y="256.0" text-anchor="start" font-size="25" font-weight="400" fill="#5B697B">공통 근거: Interaction Manager의 발화/화면 + Context Manager의 관련 자료 + Task Manager의 확인된 질문/결과</text></g>
<g id="e9"><text x="64" y="330.0" text-anchor="start" font-size="35" font-weight="700" fill="#195FBD">A  통합 판단</text></g>
<g id="e10"><text x="64" y="371.0" text-anchor="start" font-size="25" font-weight="400" fill="#195FBD">관련 맥락을 모아 한 주체가 의미를 생산</text></g>
<g id="e11"><text x="888" y="330.0" text-anchor="start" font-size="35" font-weight="700" fill="#087A53">B  Task별 지속 판단</text></g>
<g id="e12"><text x="888" y="371.0" text-anchor="start" font-size="25" font-weight="400" fill="#087A53">공통 대화 + 생성된 Task마다 판단 담당</text></g>
<g id="e13"><text x="1712" y="330.0" text-anchor="start" font-size="35" font-weight="700" fill="#7446A4">C  기능별 전문 판단</text></g>
<g id="e14"><text x="1712" y="371.0" text-anchor="start" font-size="25" font-weight="400" fill="#7446A4">대상 / 업무 연결 / 관계를 나누어 생산</text></g>
<g id="e17"><text x="110" y="397.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">코드 조정</text></g>
<g id="e18"><text x="940" y="397.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">코드 조정</text></g>
<g id="e19"><text x="1770" y="397.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">코드 조정</text></g>

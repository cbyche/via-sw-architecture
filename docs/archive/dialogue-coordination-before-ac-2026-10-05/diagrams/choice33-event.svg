<g id="e2"><text x="64" y="49.0" text-anchor="start" font-size="24" font-weight="700" fill="#5B697B">VIA / 33 / 판단 책임의 분해</text></g>
<g id="e3"><text x="2496" y="49.0" text-anchor="end" font-size="24" font-weight="400" fill="#5B697B">설계 탐색 / 미선정 / 미측정</text></g>
<g id="e4"><text x="64" y="116.0" text-anchor="start" font-size="43" font-weight="700" fill="#263445">같은 입력과 정정, 세 구조에서 누가 어떤 의미를 만드는가?</text></g>
<g id="e5"><text x="64" y="171.0" text-anchor="start" font-size="26" font-weight="400" fill="#263445">공통 사례: 보고서 Task R / 메일 Task M / 확인된 보고서 v4. 결론이 아직 없으면 의존 대기하며 내용을 만들지 않는다.</text></g>
<g id="e6"><text x="64" y="246.0" text-anchor="start" font-size="31" font-weight="700" fill="#195FBD">A  같은 사건의 생산 책임</text></g>
<g id="e8"><text x="190" y="316" text-anchor="middle" font-size="25" font-weight="700" fill="#195FBD">Request</text><text x="190" y="347" text-anchor="middle" font-size="25" font-weight="700" fill="#195FBD">Controller</text></g>
<g id="e11"><text x="446" y="316" text-anchor="middle" font-size="25" font-weight="700" fill="#195FBD">통합 요청</text><text x="446" y="347" text-anchor="middle" font-size="25" font-weight="700" fill="#195FBD">판단자</text></g>
<g id="e14"><text x="702" y="316" text-anchor="middle" font-size="25" font-weight="700" fill="#195FBD">State</text><text x="702" y="347" text-anchor="middle" font-size="25" font-weight="700" fill="#195FBD">Store</text></g>
<g id="e16"><text x="70" y="422.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">1  원문 + R/M 조건·질문·자료 근거</text></g>
<g id="e18"><text x="70" y="531.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">PDF / M에 R@4 결론 / 의존 관계</text></g>
<g id="e20"><text x="70" y="640.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">2  현재 검사 후 의미·변경·명령 의도 저장</text></g>
<g id="e22"><text x="70" y="749.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">채택 결과 → 공통 인계/게시</text></g>
<g id="e24"><text x="70" y="858.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">3  “메일에는 결론 대신 표만” + 이전 조건</text></g>
<g id="e26"><text x="70" y="967.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">M 내용만 표로 교체 / R PDF 유지</text></g>
<g id="e28"><text x="70" y="1076.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">4  옛 미전송 의도 무효화 / 새 변경 채택</text></g>
<g id="e30"><text x="70" y="1185.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">5  새 근거 충돌: 의존한 의미만 재판단</text></g>
<g id="e32"><text x="70" y="1294.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">새 제안 또는 필요한 확인 질문</text></g>
<g id="e34"><text x="70" y="1403.0" text-anchor="start" font-size="27" font-weight="400" fill="#195FBD">6  모호한 “그거”: 후보 유지 / 확인</text></g>
<g id="e36"><text x="888" y="246.0" text-anchor="start" font-size="31" font-weight="700" fill="#087A53">B  같은 사건의 생산 책임</text></g>
<g id="e38"><text x="1014" y="316" text-anchor="middle" font-size="25" font-weight="700" fill="#087A53">Dialogue</text><text x="1014" y="347" text-anchor="middle" font-size="25" font-weight="700" fill="#087A53">Coordinator</text></g>
<g id="e41"><text x="1270" y="316" text-anchor="middle" font-size="25" font-weight="700" fill="#087A53">보고서</text><text x="1270" y="347" text-anchor="middle" font-size="25" font-weight="700" fill="#087A53">대화 처리자</text></g>
<g id="e44"><text x="1526" y="316" text-anchor="middle" font-size="25" font-weight="700" fill="#087A53">메일</text><text x="1526" y="347" text-anchor="middle" font-size="25" font-weight="700" fill="#087A53">대화 처리자</text></g>
<g id="e46"><text x="894" y="422.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">1  원문/버전 + 보고서 맥락</text></g>
<g id="e48"><text x="894" y="531.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">같은 원문/버전 + 메일 맥락</text></g>
<g id="e50"><text x="894" y="640.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">2  PDF 변경 / 확인된 R@4 결론 참조</text></g>
<g id="e52"><text x="894" y="749.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">메일 변경 / 필요한 결론 참조</text></g>
<g id="e54"><text x="894" y="858.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">3  참조 전달 → 메일 담당의 재제안</text></g>
<g id="e56"><text x="894" y="967.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">4  공통 검사/저장 → 각 담당에 채택 통지</text></g>
<g id="e58"><text x="894" y="1076.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">5  같은 정정 → 표 참조로 내용 교체</text></g>
<g id="e60"><text x="894" y="1185.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">필요한 표 조회 / R PDF는 유지</text></g>
<g id="e62"><text x="894" y="1294.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">6  새 결과/질문 → 지역 제안과 변경 통지</text></g>
<g id="e64"><text x="894" y="1403.0" text-anchor="start" font-size="27" font-weight="400" fill="#087A53">“그거” 경쟁: 참가 확대/관계 재판단/확인</text></g>
<g id="e66"><text x="1712" y="246.0" text-anchor="start" font-size="31" font-weight="700" fill="#7446A4">C  같은 사건의 생산 책임</text></g>
<g id="e68"><text x="1800" y="314" text-anchor="middle" font-size="27" font-weight="700" fill="#7446A4">Semantic</text><text x="1800" y="345" text-anchor="middle" font-size="27" font-weight="700" fill="#7446A4">Coordinator</text></g>
<g id="e71"><text x="1984" y="314" text-anchor="middle" font-size="27" font-weight="700" fill="#7446A4">대상 해석</text><text x="1984" y="345" text-anchor="middle" font-size="27" font-weight="700" fill="#7446A4">담당</text></g>
<g id="e74"><text x="2168" y="314" text-anchor="middle" font-size="27" font-weight="700" fill="#7446A4">업무 연결</text><text x="2168" y="345" text-anchor="middle" font-size="27" font-weight="700" fill="#7446A4">담당</text></g>
<g id="e77"><text x="2352" y="314" text-anchor="middle" font-size="27" font-weight="700" fill="#7446A4">관계 해석</text><text x="2352" y="345" text-anchor="middle" font-size="27" font-weight="700" fill="#7446A4">담당</text></g>
<g id="e79"><text x="1718" y="422.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">1  원문 + 자료/화면 근거</text></g>
<g id="e81"><text x="1718" y="504.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">원문 + Task 후보/조건</text></g>
<g id="e83"><text x="1718" y="586.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">2  결론의 대상/범위 제안</text></g>
<g id="e85"><text x="1718" y="668.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">R/M 연결의 별도 제안</text></g>
<g id="e87"><text x="1718" y="750.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">3  원문 + 두 제안 + 이전 조건</text></g>
<g id="e89"><text x="1718" y="832.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">R PDF / 결론→M 의존 관계</text></g>
<g id="e91"><text x="1718" y="914.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">4  제안 참조를 결합 / 공통 검사·저장</text></g>
<g id="e93"><text x="1718" y="996.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">5  같은 정정 → 표 대상 확인</text></g>
<g id="e95"><text x="1718" y="1078.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">표 참조 / 기존 M 연결은 유효하면 재사용</text></g>
<g id="e97"><text x="1718" y="1160.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">유효 부분 제안 + 교체할 내용 조건</text></g>
<g id="e99"><text x="1718" y="1242.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">결론 의존 제거 / 표 의존 / PDF 유지</text></g>
<g id="e101"><text x="1718" y="1324.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">6  근거 충돌 → 해당 생산자의 재판단</text></g>
<g id="e103"><text x="1718" y="1406.0" text-anchor="start" font-size="27" font-weight="400" fill="#7446A4">미해결 관계는 질문 / 중앙의 임의 덮기 금지</text></g>
<g id="e105"><text x="64" y="1600.0" text-anchor="start" font-size="30" font-weight="700" fill="#263445">공통 예외</text></g>
<g id="e106"><text x="64" y="1645" text-anchor="start" font-size="25" font-weight="400" fill="#263445">새 입력: 이전 미전송 요청을 보류. 취소/정정의 대상과 영향을 확인한 뒤 유효한 변경만 채택한다.</text><text x="64" y="1687" text-anchor="start" font-size="25" font-weight="400" fill="#263445">전송 후: 실제 Agent 접수/실행을 확인한다. 지역 채택이나 재시작만으로 취소 완료·외부 rollback을 주장하지 않는다.</text><text x="64" y="1729" text-anchor="start" font-size="25" font-weight="400" fill="#263445">철회: 관련 근거, 부분 제안, Task 담당 맥락과 모델 세션의 신규 사용을 차단한다. 이미 제공한 정보는 소급 회수하지 않는다.</text><text x="64" y="1771" text-anchor="start" font-size="25" font-weight="400" fill="#263445">실패/재시작: 내구 채택 상태·질문·전달 기록과 외부 사실을 복원. 미채택 제안은 재검증/재계산하고 중복 실행하지 않는다.</text><text x="64" y="1813" text-anchor="start" font-size="25" font-weight="400" fill="#263445">B의 Task 없는 직접 대화와 생성 전 요청은 Common Dialogue Interpreter가 담당. Task 상태는 Task Manager가 원본.</text><text x="64" y="1855" text-anchor="start" font-size="25" font-weight="400" fill="#263445">모든 의미 판단은 Model Access를 통해 같은 Omni를 공유한다. 번호는 각 열의 실행 설명이며 고정 호출 횟수가 아니다.</text></g>
<g id="e107"><text x="64" y="1923.0" text-anchor="start" font-size="27" font-weight="400" fill="#5B697B">실선: 요청/변경   점선 화살표: 반환   /   보충 사건도. 발표용 메인 비교는 choice33-structure.svg</text></g>
</g></svg>

<text x="40" y="50.0" data-width="2470" font-size="35" font-weight="700" text-anchor="start">발화·화면·사용자 행동의 관측 타임라인 — 원본 소유와 정상 읽기 계약</text>
<text x="40" y="92.0" data-width="2470" font-size="24" font-weight="400" text-anchor="start">04-40 적용 / 로컬 VIA·로컬 VAD·클라우드 모델 / 검토 초안·DP 번호 미선정·구현/측정 없음</text>
<text x="55" y="150.0" data-width="1170" font-size="30" font-weight="700" text-anchor="start">A 중앙 공통 기록형</text>
<text x="55" y="192.0" data-width="1170" font-size="24" font-weight="400" text-anchor="start">원본 소유 인수 → 공통 원장 읽기</text>
<text x="55" y="231.0" data-width="1170" font-size="21" font-weight="400" text-anchor="start">같은 사건: “이 표와” + S1/P1 → scroll/창 전환 → “저 표를 비교해줘” + S2/P2</text>
<text x="105" y="905.0" data-width="670" font-size="20" font-weight="400" text-anchor="start">4 원본 인수·coverage → 원장 조회 / 참조·gap 반환</text>
<text x="80" y="410.0" data-width="340" font-size="20" font-weight="400" text-anchor="start">2 VAD 경계</text>
<text x="80" y="436.0" data-width="340" font-size="20" font-weight="400" text-anchor="start">onset / 종료 후보·확정</text>
<text x="445" y="660.0" data-width="370" font-size="18" font-weight="400" text-anchor="start">1 audio / 실제 sample·전송 대응</text>
<text x="895" y="394.0" data-width="315" font-size="19" font-weight="400" text-anchor="start">cloud audio / 전사</text>
<text x="895" y="418.7" data-width="315" font-size="19" font-weight="400" text-anchor="start">item ↔ 로컬 input 대응</text>
<text x="445" y="699.0" data-width="390" font-size="18" font-weight="400" text-anchor="start">3 전사 revision / item·sample 대응</text>
<text x="80" y="1005.0" data-width="335" font-size="20" font-weight="400" text-anchor="start">5 확정 입력 + 당시 근거 참조</text>
<text x="80" y="1031.0" data-width="335" font-size="20" font-weight="400" text-anchor="start">revision·시각 오차·gap</text>
<text x="450" y="1005.0" data-width="350" font-size="20" font-weight="400" text-anchor="start">6 해석 job / 의미 제안</text>
<text x="450" y="1031.0" data-width="350" font-size="20" font-weight="400" text-anchor="start">코드 채택은 Request Controller</text>
<text x="905" y="973.0" data-width="300" font-size="20" font-weight="400" text-anchor="start">C-INTERPRET</text>
<text x="905" y="999.0" data-width="300" font-size="20" font-weight="400" text-anchor="start">관련 화면·행동 + 전사</text>
<text x="905" y="1025.0" data-width="300" font-size="20" font-weight="400" text-anchor="start">최종 지칭은 의미 제안</text>
<text x="905" y="1089.0" data-width="300" font-size="19" font-weight="400" text-anchor="start">provider session은 임시</text>
<text x="905" y="1113.7" data-width="300" font-size="19" font-weight="400" text-anchor="start">로컬 관측의 유일 원본 아님</text>
<text x="80" y="1181.0" data-width="730" font-size="21" font-weight="400" text-anchor="start">A: 인수 후 생산자 종료에도 남은 원본 조회 가능</text>
<text x="80" y="1208.3" data-width="730" font-size="21" font-weight="400" text-anchor="start">대가: 공통 인수/원장 계약·보관 부담</text>
<text x="80" y="1235.6" data-width="730" font-size="21" font-weight="400" text-anchor="start">양안: 유한 보존 / timing 미제공이면 unknown·확인</text>
<text x="80" y="1262.9" data-width="730" font-size="21" font-weight="400" text-anchor="start">원본 생존은 실제 process·내구성 조건에 따름</text>
<text x="1335" y="150.0" data-width="1170" font-size="30" font-weight="700" text-anchor="start">B 생산자별 기록 조합형</text>
<text x="1335" y="192.0" data-width="1170" font-size="24" font-weight="400" text-anchor="start">각 source가 원본 유지 → 유효 참조/coverage 조합</text>
<text x="1335" y="231.0" data-width="1170" font-size="21" font-weight="400" text-anchor="start">같은 사건: “이 표와” + S1/P1 → scroll/창 전환 → “저 표를 비교해줘” + S2/P2</text>
<text x="1385" y="905.0" data-width="670" font-size="20" font-weight="400" text-anchor="start">4 source별 조회·유효 참조·coverage → receipt 조합</text>
<text x="1360" y="410.0" data-width="340" font-size="20" font-weight="400" text-anchor="start">2 VAD 경계</text>
<text x="1360" y="436.0" data-width="340" font-size="20" font-weight="400" text-anchor="start">onset / 종료 후보·확정</text>
<text x="1725" y="660.0" data-width="370" font-size="18" font-weight="400" text-anchor="start">1 audio / 실제 sample·전송 대응</text>
<text x="2175" y="394.0" data-width="315" font-size="19" font-weight="400" text-anchor="start">cloud audio / 전사</text>
<text x="2175" y="418.7" data-width="315" font-size="19" font-weight="400" text-anchor="start">item ↔ 로컬 input 대응</text>
<text x="1725" y="699.0" data-width="390" font-size="18" font-weight="400" text-anchor="start">3 전사 revision / item·sample 대응</text>
<text x="1360" y="1005.0" data-width="335" font-size="20" font-weight="400" text-anchor="start">5 확정 입력 + 당시 근거 참조</text>
<text x="1360" y="1031.0" data-width="335" font-size="20" font-weight="400" text-anchor="start">revision·시각 오차·gap</text>
<text x="1730" y="1005.0" data-width="350" font-size="20" font-weight="400" text-anchor="start">6 해석 job / 의미 제안</text>
<text x="1730" y="1031.0" data-width="350" font-size="20" font-weight="400" text-anchor="start">코드 채택은 Request Controller</text>
<text x="2185" y="973.0" data-width="300" font-size="20" font-weight="400" text-anchor="start">C-INTERPRET</text>
<text x="2185" y="999.0" data-width="300" font-size="20" font-weight="400" text-anchor="start">관련 화면·행동 + 전사</text>
<text x="2185" y="1025.0" data-width="300" font-size="20" font-weight="400" text-anchor="start">최종 지칭은 의미 제안</text>
<text x="2185" y="1089.0" data-width="300" font-size="19" font-weight="400" text-anchor="start">provider session은 임시</text>
<text x="2185" y="1113.7" data-width="300" font-size="19" font-weight="400" text-anchor="start">로컬 관측의 유일 원본 아님</text>

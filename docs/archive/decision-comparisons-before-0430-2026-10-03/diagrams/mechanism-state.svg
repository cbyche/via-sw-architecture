<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">대화와 업무 관계의 복구를 위한 저장 구조</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">현재 상태와 확정 이력</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">질문 답변과 command를 확정하는 범위를 확대했다. 같은 local transaction과 외부 확인 조건을 유지한다.</text></g>
<g id="e8"><text x="88" y="271.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">T</text></g>
<g id="e9"><text x="132" y="264.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">현재 owner 기록이 원본</text></g>
<g id="e10"><text x="132" y="294.0" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">현재 상태와 미완료 원장에서 재개</text></g>
<g id="e12"><text x="86" y="374.0" text-anchor="start" font-size="18" font-weight="700" fill="#263445">VIA SOFTWARE</text></g>
<g id="e13"><text x="1226" y="374.0" text-anchor="end" font-size="16" font-weight="400" fill="#5B697B">초점: 비교하는 내부 처리 구조</text></g>
<g id="e24" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="119" y="638.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">2 변경 전달 → State Store / 3 확정 결과 → 각 owner</text></g>
<g id="e30" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="616" y="838.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">3 갱신</text></g>
<g id="e32" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="674" y="1098.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">복구 읽기</text></g>
<g id="e34" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="789" y="1131.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">3 전송 의도도 함께 확정</text></g>
<g id="e35"><text x="120" y="1501.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">1 시작: Request Controller가 해석된 질문 답변을 Task Manager에 전달해 의미 검증.</text><text x="120" y="1526.65" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">4 확정 뒤 Agent Gateway가 외부 Agent에 전송. 5 ACK/상태를 Task Manager에 반환.</text><text x="120" y="1552.3" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">6 결과는 Response Manager → Interaction Manager로 전달, 실제 receipt 반환.</text><text x="120" y="1577.95" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">재시작: owner 관계와 현재 policy 확인 → Agent 상태 조회 → 유효 범위만 개방.</text><text x="120" y="1603.6" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">재생은 이미 확정된 전이를 적용한다. 모델 재추론, Agent 재실행과 음성 재생을 하지 않는다.</text><text x="120" y="1629.25" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">그림에서 State Store 내부 원통은 모두 내구 저장이다.</text></g>
<g id="e37"><text x="1336" y="271.0" text-anchor="middle" font-size="27" font-weight="700" fill="white">A</text></g>
<g id="e38"><text x="1380" y="264.0" text-anchor="start" font-size="28" font-weight="700" fill="#263445">확정 domain 이력이 원본</text></g>
<g id="e39"><text x="1380" y="294.0" text-anchor="start" font-size="18" font-weight="400" fill="#5B697B">의미 전이 → 상태 생성; current view는 재구성 가능</text></g>
<g id="e41"><text x="1334" y="374.0" text-anchor="start" font-size="18" font-weight="700" fill="#263445">VIA SOFTWARE</text></g>
<g id="e42"><text x="2474" y="374.0" text-anchor="end" font-size="16" font-weight="400" fill="#5B697B">초점: 비교하는 내부 처리 구조</text></g>

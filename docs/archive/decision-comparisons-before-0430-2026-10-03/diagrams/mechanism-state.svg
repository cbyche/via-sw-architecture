<g id="e61" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1860" y="838.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">3 이력 기록</text></g>
<g id="e64" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1840" y="1016.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">3 상태 생성</text></g>
<g id="e67" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1427" y="1128.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">재생</text></g>
<g id="e69" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2037" y="1131.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">3 전송 의도도 함께 확정</text></g>
<g id="e70"><text x="1368" y="1501.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">1 시작: Request Controller가 해석된 질문 답변을 Task Manager에 전달해 의미 검증.</text><text x="1368" y="1526.65" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">4 확정 뒤 Agent Gateway가 외부 Agent에 전송. 5 ACK/상태를 Task Manager에 반환.</text><text x="1368" y="1552.3" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">6 결과는 Response Manager → Interaction Manager로 전달, 실제 receipt 반환.</text><text x="1368" y="1577.95" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">재시작: owner 관계와 현재 policy 확인 → Agent 상태 조회 → 유효 범위만 개방.</text><text x="1368" y="1603.6" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">재생은 이미 확정된 전이를 적용한다. 모델 재추론, Agent 재실행과 음성 재생을 하지 않는다.</text><text x="1368" y="1629.25" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">그림에서 State Store 내부 원통은 모두 내구 저장이다.</text></g>
<g id="e72"><text x="64" y="1731.0" text-anchor="start" font-size="19" font-weight="700" fill="#263445">색:  검정 = 공통     파랑 = T 전용     초록 = A/B 전용</text></g>
<g id="e73"><text x="2496" y="1730.0" text-anchor="end" font-size="18" font-weight="400" fill="#5B697B">실선 → 요청/전달     점선 → 결과/복원</text></g>
<g id="e74"><text x="64" y="1767.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">모양:  제목 칸이 있는 박스 = Component   |   내부 둥근 박스 = Module   |   원통 = 저장소   |   접힌 종이 = 자료   |   육각형 = 연동 대상/모델</text></g>
<g id="e75"><text x="64" y="1807.0" text-anchor="start" font-size="17" font-weight="400" fill="#5B697B">초점: 저장 권위와 정상 write/복구 경로. 원본 journal 손상이나 잘못된 의미 판단까지 복구한다고 주장하지 않는다.</text></g>
<g id="e76"><text x="2496" y="1807.0" text-anchor="end" font-size="17" font-weight="400" fill="#5B697B">탐색안 / 미채택 / 미측정</text></g>
</g></svg>

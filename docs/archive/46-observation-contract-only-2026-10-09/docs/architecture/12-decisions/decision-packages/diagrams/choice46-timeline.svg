<rect x="37" y="18" width="2476" height="48.1" fill="white"/>
<text x="40" y="55.0" data-width="2470" font-size="37" font-weight="700" text-anchor="start">46  발화 시각과 관측 시각, 전사 도착과 근거 준비를 구별하기</text>
<rect x="37" y="78" width="2476" height="29.900000000000002" fill="white"/>
<text x="40" y="101.0" data-width="2470" font-size="23" font-weight="400" text-anchor="start">같은 u46 / 모든 시각은 설명용 local monotonic 예시이며 성능 목표나 측정값이 아님 / 단어 timing은 provider capability 미확인</text>
<rect x="37" y="138" width="581" height="33.800000000000004" fill="white"/>
<text x="40" y="164.0" data-width="575" font-size="26" font-weight="700" text-anchor="start">로컬 발화 / acoustic 구간</text>
<rect x="647" y="138" width="581" height="33.800000000000004" fill="white"/>
<text x="650" y="164.0" data-width="575" font-size="26" font-weight="700" text-anchor="start">당시 화면 / 행동</text>
<rect x="1257" y="138" width="581" height="33.800000000000004" fill="white"/>
<text x="1260" y="164.0" data-width="575" font-size="26" font-weight="700" text-anchor="start">클라우드 전사 도착</text>
<rect x="1867" y="138" width="581" height="33.800000000000004" fill="white"/>
<text x="1870" y="164.0" data-width="575" font-size="26" font-weight="700" text-anchor="start">코드가 보존하는 의미 전 상태</text>
<rect x="442" y="785" width="666" height="24.7" fill="white"/>
<text x="445" y="804.0" data-width="660" font-size="19" font-weight="400" text-anchor="start">capture/time/sample 대응은 코드 / 단어와 대상의 의미는 별도</text>
<rect x="1902" y="803" width="611" height="52.0" fill="white"/>
<text x="1905" y="823.0" data-width="605" font-size="20" font-weight="400" text-anchor="start">Input + Evidence Record / u46@r1 / W46</text>
<text x="1905" y="849.0" data-width="605" font-size="20" font-weight="400" text-anchor="start">원문/후보refs/gap / 아직 R46/T46의 정답이 아님</text>
<rect x="72" y="825" width="1746" height="26.0" fill="white"/>
<text x="75" y="845.0" data-width="1740" font-size="20" font-weight="400" text-anchor="start">공통 원본: acoustic span ↔ local sample ↔ capture interval + 오차. 수신 순서나 VAD만으로 단어 시각을 만들지 않음.</text>
<rect x="37" y="906" width="1206" height="35.1" fill="white"/>
<text x="40" y="933.0" data-width="1200" font-size="27" font-weight="700" text-anchor="start">A  E4: 필요한 원본에서 이번 Bundle 구성</text>
<rect x="1317" y="906" width="1206" height="35.1" fill="white"/>
<text x="1320" y="933.0" data-width="1200" font-size="27" font-weight="700" text-anchor="start">B  E4: 유효 게시 record가 Context 읽기의 준비 조건</text>
<rect x="77" y="1127" width="756" height="52.0" fill="white"/>
<text x="80" y="1147.0" data-width="750" font-size="20" font-weight="400" text-anchor="start">같은 P20 / Task-result / 명시 User Memory를 owner read</text>
<text x="80" y="1173.0" data-width="750" font-size="20" font-weight="400" text-anchor="start">E5 재사용: 유효 cache/부분 갱신. 현재 정정 의미는 재판단.</text>
<rect x="1367" y="1135" width="876" height="49.4" fill="white"/>
<text x="1370" y="1154.0" data-width="870" font-size="19" font-weight="400" text-anchor="start">NOT_COVERED → 필요 범위 생산/검사/게시 → 재조회 → 같은 현재 해석</text>
<text x="1370" y="1178.7" data-width="870" font-size="19" font-weight="400" text-anchor="start">E5 유효 record 재사용 / E6 dependency 차단/재생산 / 원본 우회는 B+.</text>
<rect x="42" y="1240" width="2476" height="28.6" fill="white"/>
<text x="45" y="1262.0" data-width="2470" font-size="22" font-weight="400" text-anchor="start">E7 취소: capture 지속, 옛 의미 job과 미전송 처리 차단. E9 장애/E11 재시작: 원본이 없는 파생 view는 복원 불가.</text>
<rect x="42" y="1285" width="2476" height="28.6" fill="white"/>
<text x="45" y="1307.0" data-width="2470" font-size="22" font-weight="400" text-anchor="start">E10 만료/철회: 원본/cache/파생 record와 미사용 job의 이용 gate 차단과 cleanup. 짧은 화면 view를 장기 기억에 자동 복제하지 않음.</text>
<rect x="42" y="1360" width="2476" height="28.6" fill="white"/>
<text x="45" y="1382.0" data-width="2470" font-size="22" font-weight="400" text-anchor="start">그림은 관측과 Context 공급 확대. 입력 확정/Context 준비/현재 의미 채택/실제 전송은 다른 경계. A/B 품질 우위는 미검증.</text>
</g></svg>

<text x="1545.0" y="241.2" data-width="546" font-size="21" font-weight="400" text-anchor="middle">t=101.2  provisional r0</text>
<text x="1545.0" y="268.5" data-width="546" font-size="21" font-weight="400" text-anchor="middle">수신 시각은 E1 발화 시각이 아님</text>
<path d="M1870,205H2422L2440,223V290H1870Z M2422,205V223H2440" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="2155.0" y="241.2" data-width="546" font-size="21" font-weight="400" text-anchor="middle">W46 / input ID / clock epoch</text>
<text x="2155.0" y="268.5" data-width="546" font-size="21" font-weight="400" text-anchor="middle">S1/P1 원본 refs와 capture interval</text>
<path d="M40,347H592L610,365V432H40Z M592,347V365H610" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="325.0" y="383.2" data-width="546" font-size="21" font-weight="400" text-anchor="middle">E2  t=100.8~101.5</text>
<text x="325.0" y="410.5" data-width="546" font-size="21" font-weight="400" text-anchor="middle">“저 표를 아까 설명한 기준으로…”</text>
<path d="M650,347H1202L1220,365V432H650Z M1202,347V365H1220" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="935.0" y="383.2" data-width="546" font-size="21" font-weight="400" text-anchor="middle">S2 / P2  t=100.8~101.6</text>
<text x="935.0" y="410.5" data-width="546" font-size="21" font-weight="400" text-anchor="middle">scroll / window B / viewport v2</text>
<path d="M1260,347H1812L1830,365V432H1260Z M1812,347V365H1830" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="1545.0" y="383.2" data-width="546" font-size="21" font-weight="400" text-anchor="middle">t=102.1  final r1 + item mapping</text>
<text x="1545.0" y="410.5" data-width="546" font-size="21" font-weight="400" text-anchor="middle">span 가능 여부/오차는 별도 정보</text>
<path d="M1870,347H2422L2440,365V432H1870Z M2422,347V365H2440" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="2155.0" y="383.2" data-width="546" font-size="21" font-weight="400" text-anchor="middle">S2/P2 및 source seq / watermark</text>
<text x="2155.0" y="410.5" data-width="546" font-size="21" font-weight="400" text-anchor="middle">누락은 gap / 같은 좌표 ≠ 같은 표</text>
<path d="M40,489H592L610,507V574H40Z M592,489V507H610" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="325.0" y="525.2" data-width="546" font-size="21" font-weight="400" text-anchor="middle">E3  t=101.7  로컬 VAD 종료</text>
<text x="325.0" y="552.5" data-width="546" font-size="21" font-weight="400" text-anchor="middle">provider final 완료와 다른 경계</text>
<path d="M650,489H1202L1220,507V574H650Z M1202,489V507H1220" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="935.0" y="525.2" data-width="546" font-size="21" font-weight="400" text-anchor="middle">E6  늦은 capture 또는 전사 r2</text>
<text x="935.0" y="552.5" data-width="546" font-size="21" font-weight="400" text-anchor="middle">이전 job 취소 / 새 input revision</text>
<path d="M1260,489H1812L1830,507V574H1260Z M1812,489V507H1830" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="1545.0" y="525.2" data-width="546" font-size="21" font-weight="400" text-anchor="middle">timing 없으면 span=unknown</text>
<text x="1545.0" y="552.5" data-width="546" font-size="21" font-weight="400" text-anchor="middle">최신 화면으로 E1/E2를 대체하지 않음</text>
<path d="M1870,489H2422L2440,507V574H1870Z M2422,489V507H2440" fill="#FFFFFF" stroke="#222222" stroke-width="1.6"/>
<text x="2155.0" y="525.2" data-width="546" font-size="21" font-weight="400" text-anchor="middle">E8  누락/오차로 불명확한 지칭</text>
<text x="2155.0" y="552.5" data-width="546" font-size="21" font-weight="400" text-anchor="middle">다른 근거 / 재지칭 / 확인 필요</text>

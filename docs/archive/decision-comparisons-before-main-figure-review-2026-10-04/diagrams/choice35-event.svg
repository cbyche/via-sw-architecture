<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-35  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">대화와 업무의 복구 정확성을 위한 기록</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">현재 상태와 사건 이력</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">질문 답변을 확정 → Agent에 전송 → 접수 확인 전에 VIA 종료 → 중복 없이 이어가기</text></g>
<g id="e7"><text x="64" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#195FBD">A  현재 값을 원본으로 저장</text></g>
<g id="e8"><text x="64" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e10"><text x="180" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e13"><text x="418" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">State Store</text></g>
<g id="e16"><text x="656" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Agent Gateway</text></g>
<g id="e19"><text x="894" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Downstream Agent</text></g>
<g id="e22"><text x="1132" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Response Manager</text></g>
<g id="e24"><text x="74" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">1  질문 q7의 답변/Task/권한 버전 확인</text></g>
<g id="e26"><text x="74" y="712.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">2  q7 종료 + 답변 + command c9 intent 원자 저장</text></g>
<g id="e28"><text x="74" y="823.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">현재 record 확정 반환</text></g>
<g id="e30"><text x="74" y="934.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">3  현재 권한 재검사 후 c9 전송</text></g>
<g id="e32"><text x="74" y="1045.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">접수 확인을 받기 전에 VIA 종료</text></g>
<g id="e34"><text x="74" y="1156.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">4  재시작: 현재 record/미완료 원장 직접 읽기</text></g>
<g id="e36"><text x="74" y="1267.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">5  c9 접수 여부 확인 요청</text></g>
<g id="e38"><text x="74" y="1378.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">command key로 상태 조회; 무조건 재전송 금지</text></g>
<g id="e40"><text x="74" y="1489.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">접수/미접수/불명 상태 반환</text></g>
<g id="e42"><text x="74" y="1600.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">확인된 상태만 사용자에게 게시</text></g>
<g id="e44"><text x="74" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#195FBD">읽을 결론: 현재 record를 직접 읽어 단순하게 복구</text></g>
<g id="e45"><text x="74" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 새 조회/원인 분석은 보존된 기록에 제한</text></g>
<g id="e46"><text x="1312" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#087A53">B  사건을 원본으로 상태 계산</text></g>
<g id="e47"><text x="1312" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e49"><text x="1428" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e52"><text x="1666" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">State Store</text></g>
<g id="e55"><text x="1904" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Agent Gateway</text></g>
<g id="e58"><text x="2142" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Downstream Agent</text></g>
<g id="e61"><text x="2380" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Response Manager</text></g>
<g id="e63"><text x="1322" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">1  같은 q7 답변/Task/권한 버전 확인</text></g>
<g id="e65"><text x="1322" y="712.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">2  답변 확정/전송 준비 사건 + c9 intent</text></g>
<g id="e67"><text x="1322" y="823.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">journal + projection + 위치/intent 원자 확정</text></g>
<g id="e69"><text x="1322" y="934.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">내구 확정 결과 반환</text></g>
<g id="e71"><text x="1322" y="1045.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">3  같은 현재 검사 뒤 c9 전송</text></g>
<g id="e73"><text x="1322" y="1156.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">접수 확인 전 같은 종료; 없던 ACK는 만들지 않음</text></g>
<g id="e75"><text x="1322" y="1267.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">4  유효 checkpoint + tail → reducer 재생</text></g>
<g id="e77"><text x="1322" y="1378.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">복원 상태/사건 위치 반환; replay 자체는 전송 안 함</text></g>
<g id="e79"><text x="1322" y="1489.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">5  c9 접수 여부 확인 요청</text></g>
<g id="e81"><text x="1322" y="1600.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">같은 command key로 외부 상태 조회</text></g>
<g id="e83"><text x="1322" y="1711.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">접수/미접수/불명 상태 반환</text></g>
<g id="e85"><text x="1322" y="1822.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">확인된 상태만 사용자에게 게시</text></g>
<g id="e87"><text x="1322" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#087A53">읽을 결론: 같은 사건으로 상태 재구성과 원인 추적</text></g>
<g id="e88"><text x="1322" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 사건 schema/삭제/재생/검증 부담</text></g>
<g id="e89"><text x="64" y="2219.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">생략한 공통 연동: 추론은 Model Access의 한 벌 Omni; 업무 실행은 Task Manager/Agent Gateway가 Downstream Agent에 위임.</text></g>
<g id="e90"><text x="64" y="2259.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">실선 = 요청/전달, 점선 = 결과. 별도 언급 없는 참여자는 논리 책임. 시간 간격은 성능 수치가 아닌 사건 순서. 수작업 설계 추적, 미측정.</text></g>
</g></svg>

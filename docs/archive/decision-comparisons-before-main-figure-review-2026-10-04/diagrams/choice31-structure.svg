<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-31  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">요청 이해의 정확성을 위한 의미 구성</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">요청별 생성과 지속 의미 작업공간</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">“작년 표는 보고서에, 메일은 초안만” → “오른쪽 표”로 보완 → 발송 금지는 유지</text></g>
<g id="e7"><text x="64" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#195FBD">A  매번 완성 의미를 생성</text></g>
<g id="e9"><text x="94" y="371.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">같은 새 발화, 이전 질문, 허용된 자료와 Task 사실</text></g>
<g id="e14" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="124" y="598.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">1  원문 + 관련 대화/자료/조건</text></g>
<g id="e16" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="154" y="1038.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">2  목표/대상/금지 조건의 완성안</text></g>
<g id="e18" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="149" y="1318.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">불일치: 근거를 모아 재해석</text></g>
<g id="e22" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="879" y="928.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">추론 입력</text></g>
<g id="e24" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1079" y="973.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">결과</text></g>
<g id="e26" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="724" y="878.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">모델 입력</text></g>
<g id="e28" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="724" y="923.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">모델 결과</text></g>
<g id="e31" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="129" y="1478.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">3  검증한 의미 또는 확인할 질문</text></g>
<g id="e32"><text x="864" y="1241.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">의미 원본: 채택한 완성안</text><text x="864" y="1269.35" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">보완/정정 때 새 완성안 생산</text><text x="864" y="1297.7" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">검증/부분 재시도도 가능</text></g>
<g id="e34"><text x="79" y="2148" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">유리: 자유로운 새 의도를 전체 맥락에서 다시 구성</text><text x="79" y="2187" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">대가: 앞선 조건 누락을 검증해야 함; 관련 근거 재해석</text><text x="79" y="2226" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">선택: 짧거나 표현 범위가 넓은 대화</text></g>
<g id="e35"><text x="1312" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#087A53">B  의미 상태에 변경을 적용</text></g>
<g id="e37"><text x="1342" y="371.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">같은 새 발화, 이전 질문, 허용된 자료와 Task 사실</text></g>
<g id="e42" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2127" y="758.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">추론 입력</text></g>
<g id="e44" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2327" y="803.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">결과</text></g>
<g id="e46" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1972" y="643.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">모델 입력</text></g>
<g id="e48" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1972" y="688.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">모델 결과</text></g>
<g id="e50" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1382" y="583.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">1  원문 + 현재 의미/질문 요약</text></g>
<g id="e56" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1377" y="863.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">2  목표 추가 / 후보 제한 / 조건 교체</text></g>
<g id="e58" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1402" y="1248.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">채택한 조건 유지; 변경만 적용</text></g>
<g id="e60" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1722" y="1308.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">이전 버전</text></g>
<g id="e62" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1967" y="1088.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">3  후보/제약</text></g>
<g id="e64" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1962" y="1203.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">가능 관계/미해결</text></g>
<g id="e67" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1377" y="1558.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">4  현재 의미 또는 미해결 질문</text></g>
<g id="e71" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2117" y="1563.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">자료 변경/현재 근거</text></g>
<g id="e73" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2112" y="1848.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">Task 변경/현재 사실</text></g>
<g id="e74"><text x="1342" y="1831.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">채택 의미는 State Store에 저장; 질문은 Response Manager가 게시</text></g>
<g id="e76"><text x="1327" y="2148" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">유리: 명시한 조건을 유지하며 필요한 관계만 갱신</text><text x="1327" y="2187" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">대가: 변경 언어/의존성 설계; 표현 밖 뜻은 질문</text><text x="1327" y="2226" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">선택: 여러 번 보완하고 조건을 이어가는 대화</text></g>
<g id="e77"><text x="64" y="2292.0" text-anchor="start" font-size="22" font-weight="400" fill="#263445">공통 마무리: Request Controller 현재 검사 → Task Manager → Agent Gateway → Downstream Agent</text></g>
<g id="e78"><text x="64" y="2332.0" text-anchor="start" font-size="22" font-weight="400" fill="#263445">접수/결과 반환 → Response Manager → Interaction Manager의 실제 표시/음성. 미해결이면 실행 대신 질문.</text></g>
<g id="e79"><text x="64" y="2389.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">검정: 공통 / 파랑: A 고유 / 초록: B 고유. 실선: 요청/전달 / 점선: 결과. 네모: 이름 / 원통: 상태 / 육각형: 외부 의존.</text></g>
<g id="e80"><text x="64" y="2429.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">같은 이름의 반복 상자는 동일 Component. 비교 부분의 책임을 펼친 그림. 별도 process 표기가 없으면 논리 분해. 모델 가중치는 한 벌; 이익은 조건부 설계 가설, 미측정.</text></g>
</g></svg>

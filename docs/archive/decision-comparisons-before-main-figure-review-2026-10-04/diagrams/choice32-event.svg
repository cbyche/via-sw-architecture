<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-32  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">화면 지칭의 정확성을 위한 대상 결합</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">통합 해석과 분리 생산 후 결합</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">화면 7을 가리키며 “이 표와” → 스크롤 → 화면 8의 “저 표를 비교” → 첫 대상만 정정</text></g>
<g id="e7"><text x="64" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#195FBD">A  말과 화면을 함께 해석</text></g>
<g id="e8"><text x="64" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e10"><text x="180" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interaction</text><text x="180" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Manager</text></g>
<g id="e13"><text x="418" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Context Manager</text></g>
<g id="e16"><text x="656" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Joint</text><text x="656" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Grounding Interpreter</text></g>
<g id="e19"><text x="894" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Model Access</text></g>
<g id="e22"><text x="1132" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e24"><text x="74" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">1  첫 지시: 화면 7, 포인터 p1, 시점 t1</text></g>
<g id="e26"><text x="74" y="712.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">2  스크롤 뒤 둘째 지시: 화면 8, p2, t2</text></g>
<g id="e28"><text x="74" y="823.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">같은 원문/관측 묶음; Request Controller가 해석 요청</text></g>
<g id="e30"><text x="74" y="934.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">3  말 + 화면 + 포인터/시점의 공동 해석</text></g>
<g id="e32"><text x="74" y="1045.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">완성 대응 d1=L@7, d2=R@8 제안</text></g>
<g id="e34"><text x="74" y="1156.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">관측 ID/창/시점 검증; 모호하면 재해석/질문</text></g>
<g id="e36"><text x="74" y="1267.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">검증된 두 대상과 비교 관계 반환</text></g>
<g id="e38"><text x="74" y="1378.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">4  “첫 표는 왼쪽 말고 오른쪽”</text></g>
<g id="e40"><text x="74" y="1489.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">해당 관측과 정정 원문으로 대응 재해석</text></g>
<g id="e42"><text x="74" y="1600.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">새 첫 참조 + 유지할 둘째 참조 반환</text></g>
<g id="e44"><text x="74" y="1711.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">5  입력/자료/권한 현재 검사 후 인계</text></g>
<g id="e46"><text x="74" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#195FBD">읽을 결론: 복잡한 시각 표현과 말의 맥락을 함께 활용</text></g>
<g id="e47"><text x="74" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 시간/대상 오결합 가능; 관련 장면 재해석</text></g>
<g id="e48"><text x="1312" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#087A53">B  두 근거를 생산한 뒤 결합</text></g>
<g id="e49"><text x="1312" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e51"><text x="1428" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Grounding</text><text x="1428" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Coordinator</text></g>
<g id="e54"><text x="1666" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Scene</text><text x="1666" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Candidate Producer</text></g>
<g id="e57"><text x="1904" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Deictic</text><text x="1904" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Anchor Producer</text></g>
<g id="e60"><text x="2142" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Grounding</text><text x="2142" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Join Engine</text></g>
<g id="e63"><text x="2380" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e65"><text x="1322" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">1  화면 7/p1/t1 기록을 Context Manager에서 수신</text></g>
<g id="e67"><text x="1322" y="709.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">2  화면 8/p2/t2 및 최종 발화와 같은 범위로 고정</text></g>
<g id="e69"><text x="1322" y="817.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">화면/포인터/시점 → 후보 생성 요청</text></g>
<g id="e71"><text x="1322" y="925.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">발화/시점/이전 참조 → 지시 조건 생성 요청</text></g>
<g id="e73"><text x="1322" y="1033.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">3  L@7, R@8 등의 영역/종류/시점 후보</text></g>
<g id="e75"><text x="1322" y="1141.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">d1:t1의 표, d2:t2의 표, 관계=비교</text></g>
<g id="e77"><text x="1322" y="1249.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">호환되는 두 버전 확인 후 조건 결합 요청</text></g>
<g id="e79"><text x="1322" y="1357.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">d1=L@7, d2=R@8 또는 미해결</text></g>
<g id="e81"><text x="1322" y="1465.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">4  첫 표 정정: 언어 조건 수정 요청</text></g>
<g id="e83"><text x="1322" y="1573.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">수정한 첫 지시 조건 + 새 버전 반환</text></g>
<g id="e85"><text x="1322" y="1681.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">화면 후보가 충분하면 재사용; 없으면 재생산</text></g>
<g id="e87"><text x="1322" y="1789.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">새 결합 결과와 사용한 두 근거 버전 반환</text></g>
<g id="e89"><text x="1322" y="1897.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">5  새 결합 결과/버전 반환 → 현재 검사 후 인계</text></g>
<g id="e91"><text x="1322" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#087A53">읽을 결론: 시간/위치 결합 근거와 정정 범위를 명시</text></g>
<g id="e92"><text x="1322" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 두 생산의 누락/지연; 표현 밖 영역은 재지칭</text></g>
<g id="e93"><text x="64" y="2219.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">생략한 공통 연동: 추론은 Model Access의 한 벌 Omni; 업무 실행은 Task Manager/Agent Gateway가 Downstream Agent에 위임.</text></g>
<g id="e94"><text x="64" y="2259.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">실선 = 요청/전달, 점선 = 결과. 별도 언급 없는 참여자는 논리 책임. 시간 간격은 성능 수치가 아닌 사건 순서. 수작업 설계 추적, 미측정.</text></g>
</g></svg>

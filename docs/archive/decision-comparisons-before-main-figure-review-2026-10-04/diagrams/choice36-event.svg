<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-36  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">허용된 자료만 처리하기 위한 권한 배치</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">공유 처리와 제한 처리</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">허용된 보고서를 요약하는 처리 코드에 결함 → 무관한 파일 접근을 어디에서 막는가?</text></g>
<g id="e7"><text x="64" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#195FBD">A  공유 권한 안의 정책 검사</text></g>
<g id="e8"><text x="64" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e10"><text x="180" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e13"><text x="418" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Context Manager</text></g>
<g id="e16"><text x="656" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request</text><text x="656" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interpreter</text></g>
<g id="e19"><text x="894" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">자료 접근 Adapter</text></g>
<g id="e22"><text x="1132" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Policy Manager</text></g>
<g id="e24"><text x="74" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">1  이번 보고서의 목적/자료 범위 확인</text></g>
<g id="e26"><text x="74" y="712.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">허용 범위/현재 버전 반환</text></g>
<g id="e28"><text x="74" y="823.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">2  허용된 자료 조립 요청</text></g>
<g id="e30"><text x="74" y="934.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">3  같은 process 권한으로 실제 읽기</text></g>
<g id="e32"><text x="74" y="1045.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">내용/버전 반환</text></g>
<g id="e34"><text x="74" y="1156.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">4  조립된 자료; Model Access로 추론 요청/반환</text></g>
<g id="e36"><text x="74" y="1267.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">5  의미 제안; 현재 검사 후 외부 경로 허용</text></g>
<g id="e38"><text x="74" y="1378.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">위협: 결함 코드가 정책 호출을 건너뛴다면</text></g>
<g id="e40"><text x="74" y="1489.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">process 자격으로 무관한 자료에 접근할 수 있는 위험</text></g>
<g id="e42"><text x="74" y="1600.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">철회: 협력 코드/자료/cache/출력까지 차단 필요</text></g>
<g id="e44"><text x="74" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#195FBD">읽을 결론: 직접 호출/공유 자료로 복사와 IPC를 줄임</text></g>
<g id="e45"><text x="74" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 처리 코드 결함이 넓은 process 권한에 도달</text></g>
<g id="e46"><text x="1312" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#087A53">B  권한 없는 처리와 Broker</text></g>
<g id="e47"><text x="1312" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e49"><text x="1428" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e52"><text x="1666" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request</text><text x="1666" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interpreter</text></g>
<g id="e55"><text x="1904" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Context Manager</text></g>
<g id="e58"><text x="2142" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Data Access Broker</text></g>
<g id="e61"><text x="2380" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Policy Manager</text></g>
<g id="e63"><text x="1322" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">1  같은 목적/자료 범위 확인</text></g>
<g id="e65"><text x="1322" y="709.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">현재 허용 범위 반환; Broker handle 준비</text></g>
<g id="e67"><text x="1322" y="817.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">2  제한 process에 입력 + 범위 handle</text></g>
<g id="e69"><text x="1322" y="925.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">3  필요한 자료 요청; ambient 권한 없음</text></g>
<g id="e71"><text x="1322" y="1033.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">IPC: handle + 실제 읽을 범위</text></g>
<g id="e73"><text x="1322" y="1141.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">현재 허용/철회 확인</text></g>
<g id="e75"><text x="1322" y="1249.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">허용된 내용만 반환</text></g>
<g id="e77"><text x="1322" y="1357.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">4  추론도 Broker → Model Access → 같은 Omni</text></g>
<g id="e79"><text x="1322" y="1465.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">모델 결과와 사용한 자료 근거 반환</text></g>
<g id="e81"><text x="1322" y="1573.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">5  의미 제안; 신뢰 Core가 현재 검사</text></g>
<g id="e83"><text x="1322" y="1681.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">위협: 직접 파일/네트워크/DB 접근은 OS 경계에서 차단</text></g>
<g id="e85"><text x="1322" y="1789.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">철회: handle 무효화, 미완료 호출/늦은 결과 차단</text></g>
<g id="e87"><text x="1322" y="1897.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">Broker 자체 침해는 잔여 위험; 만능 보안은 아님</text></g>
<g id="e89"><text x="1322" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#087A53">읽을 결론: 처리 코드가 잘못돼도 직접 자료 접근 차단</text></g>
<g id="e90"><text x="1322" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: IPC/복사/handle 수명; Broker는 여전히 신뢰</text></g>
<g id="e91"><text x="64" y="2219.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">생략한 공통 연동: 추론은 Model Access의 한 벌 Omni; 업무 실행은 Task Manager/Agent Gateway가 Downstream Agent에 위임.</text></g>
<g id="e92"><text x="64" y="2259.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">실선 = 요청/전달, 점선 = 결과. 별도 언급 없는 참여자는 논리 책임. 시간 간격은 성능 수치가 아닌 사건 순서. 수작업 설계 추적, 미측정.</text></g>
</g></svg>

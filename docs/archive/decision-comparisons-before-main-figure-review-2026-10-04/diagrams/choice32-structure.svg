<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-32  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">화면 지칭의 정확성을 위한 대상 결합</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">통합 해석과 분리 생산 후 결합</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">화면 7을 가리키며 “이 표와” → 스크롤 → 화면 8의 “저 표를 비교” → 첫 대상만 정정</text></g>
<g id="e7"><text x="64" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#195FBD">A  말과 화면을 함께 해석</text></g>
<g id="e9"><text x="94" y="371.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">Interaction Manager가 기록한 화면/포인터/발화 시점</text></g>
<g id="e14" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="139" y="593.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">1  원문 + 화면 7/8 + 포인터/시점</text></g>
<g id="e18" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="879" y="988.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">추론 입력</text></g>
<g id="e20" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1079" y="1033.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">결과</text></g>
<g id="e22" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="724" y="903.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">모델 입력</text></g>
<g id="e24" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="724" y="948.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">모델 결과</text></g>
<g id="e26" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="159" y="1128.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">2  d1=L@7, d2=R@8 완성 대응</text></g>
<g id="e29" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="124" y="1578.0" text-anchor="start" font-size="18" font-weight="400" fill="#195FBD">3  근거 검사 후 대응 관계 반환</text></g>
<g id="e30"><text x="864" y="1301.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">지칭 관계는 모델이 생성</text><text x="864" y="1329.35" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">틀린 ID/시점은 코드로 검사</text><text x="864" y="1357.7" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">정정: 관련 장면 다시 해석</text></g>
<g id="e32"><text x="79" y="2148" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">유리: 복잡한 시각 표현과 말의 맥락을 함께 활용</text><text x="79" y="2187" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">대가: 시간/대상 오결합 가능; 관련 장면 재해석</text><text x="79" y="2226" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">선택: 낯선 화면과 자유로운 표현이 중요할 때</text></g>
<g id="e33"><text x="1312" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#087A53">B  두 근거를 생산한 뒤 결합</text></g>
<g id="e35"><text x="1342" y="371.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">Interaction Manager가 기록한 화면/포인터/발화 시점</text></g>
<g id="e42" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1377" y="573.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">1  같은 범위의 근거와 수정 버전</text></g>
<g id="e44" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1357" y="848.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">2  화면/포인터/시점</text></g>
<g id="e46" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1982" y="848.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">2  발화/시점/이전 참조</text></g>
<g id="e48" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1362" y="1158.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">3  Coordinator 경유: 화면 후보</text></g>
<g id="e50" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2112" y="1253.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">3  Coordinator 경유: 지시 조건</text></g>
<g id="e52" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1637" y="1528.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">4  Coordinator 경유: 결합 결과/버전</text><text x="1637" y="1552.3" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">없음/복수/표현 밖 → 해당 지시 질문</text></g>
<g id="e54" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1347" y="1298.0" text-anchor="start" font-size="18" font-weight="400" fill="#087A53">미해결: 질문 또는 필요한 근거 재생산</text></g>
<g id="e58" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1607" y="943.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">추론 요청</text></g>
<g id="e60" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1362" y="928.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">후보 결과</text></g>
<g id="e62" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2097" y="943.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">추론 요청</text></g>
<g id="e64" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="2277" y="928.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">조건 결과</text></g>
<g id="e66" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1862" y="1028.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">추론</text></g>
<g id="e68" paint-order="stroke" stroke="white" stroke-width="7" stroke-linejoin="round"><text x="1917" y="1068.0" text-anchor="start" font-size="18" font-weight="400" fill="#263445">결과</text></g>
<g id="e69"><text x="1342" y="1870.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">Coordinator가 두 결과의 버전 확인; Join Engine은 조건 결합만 수행</text><text x="1342" y="1897.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">원본 언어/시각 해석을 Join Engine으로 옮기거나 모델을 복제하지 않음</text></g>
<g id="e71"><text x="1327" y="2148" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">유리: 시간/위치 결합 근거와 정정 범위를 명시</text><text x="1327" y="2187" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">대가: 두 생산의 누락/지연; 표현 밖 영역은 재지칭</text><text x="1327" y="2226" text-anchor="start" font-size="23" font-weight="400" fill="#5B697B">선택: 순차 지칭과 반복 정정이 많을 때</text></g>
<g id="e72"><text x="64" y="2292.0" text-anchor="start" font-size="22" font-weight="400" fill="#263445">공통 마무리: Request Controller 현재 검사 → Task Manager → Agent Gateway → Downstream Agent</text></g>
<g id="e73"><text x="64" y="2332.0" text-anchor="start" font-size="22" font-weight="400" fill="#263445">접수/결과 반환 → Response Manager → Interaction Manager의 실제 표시/음성. 미해결이면 실행 대신 질문.</text></g>
<g id="e74"><text x="64" y="2389.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">검정: 공통 / 파랑: A 고유 / 초록: B 고유. 실선: 요청/전달 / 점선: 결과. 네모: 이름 / 원통: 상태 / 육각형: 외부 의존.</text></g>
<g id="e75"><text x="64" y="2429.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">같은 이름의 반복 상자는 동일 Component. 비교 부분의 책임을 펼친 그림. 별도 process 표기가 없으면 논리 분해. 모델 가중치는 한 벌; 이익은 조건부 설계 가설, 미측정.</text></g>
</g></svg>

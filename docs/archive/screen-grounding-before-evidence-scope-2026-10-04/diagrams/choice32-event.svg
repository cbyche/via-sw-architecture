<g id="e2"><text x="64" y="60.0" text-anchor="start" font-size="18" font-weight="700" fill="#5B697B">VIA  /  ARCHITECTURE REVIEW</text></g>
<g id="e3"><text x="2496" y="60.0" text-anchor="end" font-size="18" font-weight="700" fill="#5B697B">04-32  /  STAGE 04</text></g>
<g id="e4"><text x="64" y="109" text-anchor="start" font-size="34" font-weight="700" fill="#263445">화면 지칭의 정확성을 위한 대상 결합</text><text x="64" y="153" text-anchor="start" font-size="34" font-weight="700" fill="#263445">요청 시 관측 해석과 관측 시 화면 상태 구성</text></g>
<g id="e5"><text x="64" y="188.0" text-anchor="start" font-size="22" font-weight="400" fill="#5B697B">화면 7을 가리키며 “이 표와” → 스크롤 → 화면 8의 “저 표를 비교” → 첫 대상만 정정</text></g>
<g id="e7"><text x="64" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#195FBD">A  요청 → 원본 관측 해석</text></g>
<g id="e8"><text x="64" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e10"><text x="180" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Interaction</text><text x="180" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Manager</text></g>
<g id="e13"><text x="418" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Context Manager</text></g>
<g id="e16"><text x="656" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Observation</text><text x="656" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Grounding Interpreter</text></g>
<g id="e19"><text x="894" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Model Access</text></g>
<g id="e22"><text x="1132" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e24"><text x="74" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">1  화면 7/p1/t1 원본 저장</text></g>
<g id="e26"><text x="74" y="712.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">2  화면 8/p2/t2 원본 저장</text></g>
<g id="e28"><text x="74" y="823.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">원문/지시 시점으로 해석 요청</text></g>
<g id="e30"><text x="74" y="934.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">해당 원본 관측 조회</text></g>
<g id="e32"><text x="74" y="1045.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">화면/포인터/시점 반환</text></g>
<g id="e34"><text x="74" y="1156.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">3  말과 원본 화면 공동 해석</text></g>
<g id="e36"><text x="74" y="1267.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">L@7/R@8 후보 반환</text></g>
<g id="e38"><text x="74" y="1378.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">ID/시간 검증한 참조 또는 미해결</text></g>
<g id="e40"><text x="74" y="1489.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">4  첫 표 정정: 원본 재해석 또는 검증된 patch</text></g>
<g id="e42"><text x="74" y="1600.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">수정한 첫 참조와 유지할 둘째 참조</text></g>
<g id="e44"><text x="74" y="1711.0" text-anchor="start" font-size="21" font-weight="400" fill="#195FBD">5  현재 검사 후 인계. 과거 좌표를 현재 대상으로 대체하지 않음</text></g>
<g id="e46"><text x="74" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#195FBD">읽을 결론: 복잡한 시각 표현과 말의 맥락을 함께 활용</text></g>
<g id="e47"><text x="74" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 시간/대상 오결합 가능; 관련 장면 재해석</text></g>
<g id="e48"><text x="1312" y="315.0" text-anchor="start" font-size="30" font-weight="700" fill="#087A53">B  관측 → 상태 생산 / 요청 → 조회</text></g>
<g id="e49"><text x="1312" y="365.0" text-anchor="start" font-size="20" font-weight="400" fill="#5B697B">위에서 아래로 읽기. 가로 화살표의 시작/끝이 실제 송신자/수신자.</text></g>
<g id="e51"><text x="1428" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Context Manager</text></g>
<g id="e54"><text x="1666" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Scene</text><text x="1666" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">State Service</text></g>
<g id="e57"><text x="1904" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Scene</text><text x="1904" y="463" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Query Interpreter</text></g>
<g id="e60"><text x="2142" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Model Access</text></g>
<g id="e63"><text x="2380" y="435" text-anchor="middle" font-size="20" font-weight="700" fill="#263445">Request Controller</text></g>
<g id="e65"><text x="1322" y="601.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">1  화면 7 관측 사건; 개별 요청 밖에서 상태 생산 시작</text></g>
<g id="e67"><text x="1322" y="709.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">화면 대상/관계 해석 요청</text></g>
<g id="e69"><text x="1322" y="817.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">후보/관계 반환 → coverage/버전 발행</text></g>
<g id="e71"><text x="1322" y="925.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">2  화면 8 관측 사건; 같은 생산 경로로 상태 발행</text></g>
<g id="e73"><text x="1322" y="1033.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">원문/시점으로 지칭 요청</text></g>
<g id="e75"><text x="1322" y="1141.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">언어 조회 조건 생성 요청; 원본 픽셀 사용 안 함</text></g>
<g id="e77"><text x="1322" y="1249.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">지시 시점/종류/관계 조건 반환</text></g>
<g id="e79"><text x="1322" y="1357.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">3  상태 7/8의 해당 조건 조회</text></g>
<g id="e81"><text x="1322" y="1465.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">참조/근거 또는 미해결. 미발행 구간은 대기/재구성</text></g>
<g id="e83"><text x="1322" y="1573.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">4  첫 표 정정</text></g>
<g id="e85"><text x="1322" y="1681.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">같은 관측 버전의 오른쪽 후보 재조회</text></g>
<g id="e87"><text x="1322" y="1789.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">수정한 참조 또는 coverage 부족 반환</text></g>
<g id="e89"><text x="1322" y="1897.0" text-anchor="start" font-size="21" font-weight="400" fill="#087A53">5  현재 검사할 대상/버전 반환 → 인계</text></g>
<g id="e91"><text x="1322" y="2092.0" text-anchor="start" font-size="22" font-weight="700" fill="#087A53">읽을 결론: 발행한 화면 상태를 여러 요청이 재조회</text></g>
<g id="e92"><text x="1322" y="2136.0" text-anchor="start" font-size="21" font-weight="400" fill="#5B697B">대가: 미사용 화면 처리/상태 누락/오류 전파/표현 손실</text></g>
<g id="e93"><text x="64" y="2219.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">생략한 공통 연동: 추론은 Model Access의 한 벌 Omni; 업무 실행은 Task Manager/Agent Gateway가 Downstream Agent에 위임.</text></g>
<g id="e94"><text x="64" y="2259.0" text-anchor="start" font-size="19" font-weight="400" fill="#5B697B">실선 = 요청/전달, 점선 = 결과. 별도 언급 없는 참여자는 논리 책임. 시간 간격은 성능 수치가 아닌 사건 순서. 수작업 설계 추적, 미측정.</text></g>
</g></svg>

<text id="n35-0" data-width="206" x="792" y="1006.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">최대 전체 메모리 ↓</text>
<text id="n36-0" data-width="838" x="1445" y="228.76" text-anchor="middle" font-size="28" font-weight="700" fill="#18232E">B 반응형 Dataflow 실행</text>
<text id="n37-0" data-width="836" x="1028" y="770.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 사건의 직접 활성화로 p95 반응 지연 0.62 s (응답 신속성 ↑)</text>
<text id="n38-0" data-width="836" x="1028" y="801.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 동일 schema 안의 단계 조합 변경, 평균 2.5개 (변경 용이성 ↑)</text>
<text id="n39-0" data-width="836" x="1028" y="855.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 다수 window와 buffer로 전체 메모리 13.8 GB (메모리 효율성 ↓)</text>

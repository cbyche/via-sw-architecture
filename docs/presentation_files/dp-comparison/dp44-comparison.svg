<text id="n20-0" data-width="838" x="575" y="228.76" text-anchor="middle" font-size="28" font-weight="700" fill="#18232E">A 중앙 비동기 Orchestration</text>
<text id="n21-0" data-width="836" x="158" y="770.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 집중된 실행 상태로 전체 메모리 13.3 GB (메모리 효율성 ↑)</text>
<text id="n22-0" data-width="836" x="158" y="855.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 반환 회수와 재배정으로 p95 반응 지연 0.85 s (응답 신속성 ↓)</text>
<text id="n23-0" data-width="836" x="158" y="886.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 교차 사건의 중앙 전이 변경, 평균 4.0개 (변경 용이성 ↓)</text>
<text id="n24-0" data-width="335" x="158" y="939.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">V-04 응답 신속성</text>

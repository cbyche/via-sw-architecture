<text id="n20-0" data-width="838" x="575" y="228.76" text-anchor="middle" font-size="28" font-weight="700" fill="#18232E">A 원본 서비스 조합</text>
<text id="n21-0" data-width="836" x="158" y="770.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 필요한 요청 중심의 처리로 전체 메모리 13.2 GB (메모리 효율성 ↑)</text>
<text id="n22-0" data-width="836" x="158" y="855.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 반복 교차 결합의 관계 누락으로 정확 처리율 90% (기능 정확성 ↓)</text>
<text id="n23-0" data-width="836" x="158" y="886.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 여러 원본 조회와 결합으로 완료시간 7.0 s (요청 완료 신속성 ↓)</text>
<text id="n24-0" data-width="335" x="158" y="939.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">V-01 기능 정확성</text>
<text id="n25-0" data-width="112" x="515" y="942.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">●●○</text>
<text id="n26-0" data-width="140" x="643" y="941.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">90%</text>
<text id="n27-0" data-width="206" x="792" y="938.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">정확 처리율 ↑</text>
<text id="n28-0" data-width="335" x="158" y="973.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">V-05 요청 완료 신속성</text>
<text id="n29-0" data-width="112" x="515" y="976.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">●●○</text>
<text id="n30-0" data-width="140" x="643" y="975.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">7.0 s</text>
<text id="n31-0" data-width="206" x="792" y="972.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">p95 VIA 완료시간 ↓</text>
<text id="n32-0" data-width="335" x="158" y="1007.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">V-06 메모리 효율성</text>
<text id="n33-0" data-width="112" x="515" y="1010.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">●●●</text>
<text id="n34-0" data-width="140" x="643" y="1009.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">13.2 GB</text>
<text id="n35-0" data-width="206" x="792" y="1006.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">최대 전체 메모리 ↓</text>
<text id="n36-0" data-width="838" x="1445" y="228.76" text-anchor="middle" font-size="28" font-weight="700" fill="#18232E">B 공통 파생 기억의 생산과 조회</text>
<text id="n37-0" data-width="836" x="1028" y="770.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 검증된 과거 관계 재사용으로 정확 처리율 94% (기능 정확성 ↑)</text>
<text id="n38-0" data-width="836" x="1028" y="801.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 원본별 교차 결합 축소로 완료시간 4.5 s (요청 완료 신속성 ↑)</text>
<text id="n39-0" data-width="836" x="1028" y="855.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 관계 생산 session과 KV로 전체 메모리 14.0 GB (메모리 효율성 ↓)</text>
<text id="n40-0" data-width="335" x="1028" y="939.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">V-01 기능 정확성</text>
<text id="n41-0" data-width="112" x="1385" y="942.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">●●●</text>
<text id="n42-0" data-width="140" x="1513" y="941.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">94%</text>
<text id="n43-0" data-width="206" x="1662" y="938.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">정확 처리율 ↑</text>
<text id="n44-0" data-width="335" x="1028" y="973.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">V-05 요청 완료 신속성</text>
<text id="n45-0" data-width="112" x="1385" y="976.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">●●●</text>
<text id="n46-0" data-width="140" x="1513" y="975.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">4.5 s</text>
<text id="n47-0" data-width="206" x="1662" y="972.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">p95 VIA 완료시간 ↓</text>
<text id="n48-0" data-width="335" x="1028" y="1007.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">V-06 메모리 효율성</text>
<text id="n49-0" data-width="112" x="1385" y="1010.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">●●○</text>
<text id="n50-0" data-width="140" x="1513" y="1009.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">14.0 GB</text>
<text id="n51-0" data-width="206" x="1662" y="1006.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">최대 전체 메모리 ↓</text>
<text id="n52-0" data-width="1520" x="40" y="1066.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">비교 예시 조건: 게시 범위 안 과거 관계의 반복 재사용 / A의 index와 cache도 허용</text>

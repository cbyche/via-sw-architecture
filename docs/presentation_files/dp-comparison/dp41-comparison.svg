<text id="n20-0" data-width="838" x="575" y="228.76" text-anchor="middle" font-size="28" font-weight="700" fill="#18232E">A 모델 중심 ReAct 해석</text>
<text id="n21-0" data-width="836" x="158" y="770.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 열린 관계 표현의 지원 확대, 지원율 100% (기능 완전성 ↑)</text>
<text id="n22-0" data-width="836" x="158" y="801.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 새 관계의 코드 변경 축소, 평균 2.0개 (변경 용이성 ↑)</text>
<text id="n23-0" data-width="836" x="158" y="855.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 반복 조회와 모델 재판단으로 완료시간 6.0 s (요청 완료 신속성 ↓)</text>
<text id="n24-0" data-width="335" x="158" y="939.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">V-03 기능 완전성</text>
<text id="n25-0" data-width="112" x="515" y="942.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">●●●</text>
<text id="n26-0" data-width="140" x="643" y="941.16" text-anchor="start" font-size="23" font-weight="700" fill="#18232E">100%</text>
<text id="n27-0" data-width="206" x="792" y="938.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">기능 지원 달성률 ↑</text>
<text id="n28-0" data-width="335" x="158" y="973.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">V-05 요청 완료 신속성</text>
<text id="n29-0" data-width="112" x="515" y="976.0" text-anchor="start" font-size="25" font-weight="400" fill="#18232E">●●○</text>

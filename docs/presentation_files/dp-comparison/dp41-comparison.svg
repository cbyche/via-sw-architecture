<text id="n36-0" data-width="838" x="1445" y="228.76" text-anchor="middle" font-size="28" font-weight="700" fill="#18232E">B 모델 틀 생성과 코드 중심 의미 완성</text>
<text id="n37-0" data-width="836" x="1028" y="770.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 지원 관계의 코드 결합으로 완료시간 4.5 s (요청 완료 신속성 ↑)</text>
<text id="n38-0" data-width="836" x="1028" y="855.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 유한 표현 체계 밖 관계의 지원 제한, 지원율 87.2% (기능 완전성 ↓)</text>
<text id="n39-0" data-width="836" x="1028" y="886.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 새 관계의 틀과 결합 규칙 확장, 평균 4.0개 (변경 용이성 ↓)</text>
<text id="n40-0" data-width="335" x="1028" y="939.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">V-03 기능 완전성</text>

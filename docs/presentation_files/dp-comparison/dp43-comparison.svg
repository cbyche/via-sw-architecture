<text id="n35-0" data-width="206" x="792" y="1006.56" text-anchor="start" font-size="18" font-weight="400" fill="#5F6B77">평균 변경 요소 수 ↓</text>
<text id="n36-0" data-width="838" x="1445" y="228.76" text-anchor="middle" font-size="28" font-weight="700" fill="#18232E">C 기능별 의미 생산과 코드 조정</text>
<text id="n37-0" data-width="836" x="1028" y="770.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 특정 기능의 생산 책임 분리로 변경 평균 2.0개 (변경 용이성 ↑)</text>
<text id="n38-0" data-width="836" x="1028" y="855.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 부분 의미 불일치와 오류 전파로 정확 처리율 91% (기능 정확성 ↓)</text>
<text id="n39-0" data-width="836" x="1028" y="886.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 제안 교환과 재판단으로 완료시간 7.2 s (요청 완료 신속성 ↓)</text>
<text id="n40-0" data-width="335" x="1028" y="939.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">V-01 기능 정확성</text>

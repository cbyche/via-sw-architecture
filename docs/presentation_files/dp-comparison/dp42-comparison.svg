<text id="n20-0" data-width="838" x="575" y="228.76" text-anchor="middle" font-size="28" font-weight="700" fill="#18232E">A 모듈형 통합 VIA Core</text>
<text id="n21-0" data-width="836" x="158" y="770.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 관련 상태의 공동 확정으로 완료시간 3.2 s (요청 완료 신속성 ↑)</text>
<text id="n22-0" data-width="836" x="158" y="801.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 추가 서비스 heap 축소로 전체 메모리 13.2 GB (메모리 효율성 ↑)</text>
<text id="n23-0" data-width="836" x="158" y="855.32" text-anchor="start" font-size="21" font-weight="400" fill="#18232E">▪ 공동 저장과 복구 경로의 변경 전파, 평균 4.0개 (변경 용이성 ↓)</text>

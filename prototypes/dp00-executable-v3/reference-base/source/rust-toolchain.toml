[toolchain]
# Pinned deliberately rather than tracking stable, so a new clippy lint lands in
# a version-bump PR instead of turning an unrelated CI run red.
#
# 1.94.0 matches ARGO's pin. VIA needs only 1.89 (edition 2024 + `File::lock`),
# but the optional `argo-bridge` feature path-deps ARGO crates that require
# 1.94 — and a matching pin turns a future MSRV mismatch into a non-event.
# See docs/adr/0001-placement.md.
channel = "1.94.0"
components = ["rustfmt", "clippy"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

[workspace]
resolver = "2"
members = ["contracts", "fixture", "runtime", "worker", "host", "bench", "reference-agent"]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53.1", features = ["full"] }

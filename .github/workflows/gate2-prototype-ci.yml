name: gate2-prototype-ci

on:
  push:
    branches: [architecture-rebaseline-20260918]
    paths:
      - 'prototype/gate2/**'
      - 'benchmark/rebaseline/gate2/**'
      - 'benchmark/rebaseline/readiness/**'
      - 'scripts/gate2/**'
      - '.github/workflows/gate2-prototype-ci.yml'
  workflow_dispatch:

concurrency:
  group: gate2-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install frozen Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          cd prototype/gate2
          rustup override set 1.98.1
      - name: Normalize formatting in CI worktree
        working-directory: prototype/gate2
        run: cargo fmt --all
      - name: Clippy
        working-directory: prototype/gate2
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Unit tests
        working-directory: prototype/gate2
        run: cargo test --locked --workspace
      - name: Structural smoke
        working-directory: prototype/gate2
        run: |
          cargo build --locked -p gate2-worker -p gate2-host -p gate2-bench
          cargo run --locked -q -p gate2-bench -- smoke
          cargo run --locked -q -p gate2-bench -- exec-smoke --worker target/debug/gate2-worker
          cargo run --locked -q -p gate2-bench -- exec-abort-smoke --worker target/debug/gate2-worker
          cargo run --locked -q -p gate2-bench -- exec-blast-smoke --host target/debug/gate2-host --worker target/debug/gate2-worker
          cargo run --locked -q -p gate2-bench -- s2s-smoke --trace fixtures/s2s-delay-smoke.json
          cargo run --locked -q -p gate2-bench -- w04-load-smoke
          cargo run --locked -q -p gate2-bench -- w09-whole-restart-smoke
          cargo run --locked -q -p gate2-bench -- w09-whole-process-smoke
          cargo run --locked -q -p gate2-bench -- w09-integration-fatal-smoke --host target/debug/gate2-host --worker target/debug/gate2-worker
          cargo run --locked -q -p gate2-bench -- w10-containment --spec ../../benchmark/rebaseline/gate2/w10-containment-cells.json --host target/debug/gate2-host --worker target/debug/gate2-worker --profile smoke
      - name: Gate2 catalog static check
        run: |
          python3 benchmark/rebaseline/gate2/catalog_check.py --output /tmp/gate2-review
          python3 -m unittest discover -s benchmark/rebaseline/gate2 -p 'test_*.py' -v
      - name: Python pre-measurement checks
        run: |
          python3 -m py_compile benchmark/rebaseline/gate2/*.py benchmark/rebaseline/readiness/*.py
          python3 -m unittest discover -s benchmark/rebaseline/readiness -p 'test_*.py' -v
          python3 benchmark/rebaseline/readiness/canonical_adapter.py --check
          python3 benchmark/rebaseline/readiness/freeze.py --out /tmp/gate2-freeze-review
          python3 - <<'PY'
          import json
          from pathlib import Path
          freeze=json.loads(Path('/tmp/gate2-freeze-review/source-manifest.json').read_text())
          assert freeze['cargo_lock_present'] is True
          assert freeze['comparative_measurement_approved'] is False
          assert freeze['scores'] is None
          PY
          python3 benchmark/rebaseline/build_assets.py
          python3 benchmark/rebaseline/gate2/terminal_outcome_audit.py --root .
          python3 benchmark/rebaseline/gate2/change_analysis.py --output /tmp/w07-w08-change-analysis
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('/tmp/w07-w08-change-analysis/w07-w08-validation-summary.json').read_text())
          assert summary['raw_rows']==192
          assert summary['pair_candidates']==8 and summary['unique_configurations']==5
          assert summary['W-07']=='NOT_COMPUTED_PRE_MEASUREMENT_FREEZE'
          assert summary['W-08']=='NOT_COMPUTED_PRE_MEASUREMENT_FREEZE'
          assert summary['scores'] is None and summary['winner'] is None
          assert summary['candidate_execution']=='NOT_RUN'
          PY
          python3 benchmark/rebaseline/gate2/w04_foreground_contract.py --contract benchmark/rebaseline/gate2/w01-foreground-strata.json --validate-only
          python3 benchmark/rebaseline/gate2/w01_observation_adapter.py --contract benchmark/rebaseline/gate2/w01-foreground-strata.json --trace benchmark/rebaseline/gate2/w01-observation-smoke.json --output /tmp/w01-observation-smoke.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          sample=json.loads(Path('/tmp/w01-observation-smoke.json').read_text())
          assert sample['candidate_observed_latency_ns']==1_000_000
          assert sample['representative_metric_eligible'] is False
          assert sample['representative_metric_value_ns'] is None
          assert sample['score'] is None and sample['p95'] is None
          assert sample['evidence']=='RAW_ENDPOINT_OBSERVATION_HEADLESS'
          PY
          python3 benchmark/rebaseline/gate2/make_trial_order.py --output /tmp/trial-order.json
          python3 benchmark/rebaseline/gate2/ir_model_runner.py --output /tmp/ir-dry-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          order=json.loads(Path('/tmp/trial-order.json').read_text())
          assert order['warmup'].count('A')==10 and order['warmup'].count('B')==10
          assert order['scored'].count('A')==100 and order['scored'].count('B')==100
          ir=json.loads(Path('/tmp/ir-dry-run.json').read_text())
          assert ir['status']=='DRY_RUN_MODEL_NOT_CALLED' and ir['scoring']=='NOT_RUN'
          PY

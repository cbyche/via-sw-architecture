name: architecture-ci

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/architecture/**'
      - 'docs/adr/**'
      - 'benchmark/architecture/**'
      - 'prototypes/candidates/**'
      - 'results/architecture-evaluation/current/**'
      - 'scripts/architecture/**'
      - '.github/workflows/architecture-ci.yml'
  workflow_dispatch:

concurrency:
  group: architecture-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check active terminology and links
        run: |
          python3 scripts/architecture/check_active_terminology.py
          python3 scripts/architecture/check_active_markdown_links.py
          python3 scripts/architecture/check_qa_catalog.py
      - name: Check target architecture diagram pairs and routing
        run: python3 scripts/architecture/generate_target_architecture_diagrams.py --check
      - name: Check decision package diagram pairs and routing
        run: python3 scripts/architecture/generate_decision_package_diagrams.py --check
      - name: Check Stage 4 structure comparison diagram pairs and routing
        run: python3 scripts/architecture/generate_stage4_structure_diagrams.py --check
      - name: Check mechanism family comparison diagram pairs and routing
        run: python3 scripts/architecture/generate_mechanism_family_diagrams.py --check
      - name: Check functional comparison diagram pairs and routing
        run: python3 scripts/architecture/generate_functional_choice_diagrams.py --check
      - name: Check six reconstructed comparisons and walkthroughs
        run: python3 scripts/architecture/generate_six_comparison_diagrams.py --check
